ay=\"block\">\u003cmrow>\u003cmi>y\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsup>\u003cmi>x\u003c/mi>\u003cmi>r\u003c/mi>\u003c/msup>\u003cmo>:\u003c/mo>\u003cmtext>  \u003c/mtext>\u003cmsup>\u003cmi>r\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>+\u003c/mo>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>a\u003c/mi>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmi>r\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>b\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003c/math>\u003c/span>","idea":"In a Cauchy–Euler equation each term keeps the degree of \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsup>\u003cmi>x\u003c/mi>\u003cmi>r\u003c/mi>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span>, so powers of \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> replace exponentials. The change \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>x\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsup>\u003cmi>e\u003c/mi>\u003cmi>s\u003c/mi>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span> turns it into a constant-coefficient equation in \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>s\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>ln\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>, which is why repeated roots bring \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>ln\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> and complex roots bring \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>cos\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>β\u003c/mi>\u003cmi>ln\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/math>\u003c/span>. Reduction of order builds a second solution from one known solution of any linear second-order equation. Solutions live on an interval where the leading coefficient is not zero.","requires":["damped-oscillator"],"labs":[{"course":"map2302","title":"Cauchy–Euler equations","href":"https://flux-study.pages.dev/map2302/#/map2302/u2/cauchy-euler","notes":"https://flux-study.pages.dev/map2302/#/map2302/u2/cauchy-euler?n=s12","note":"Distinct, repeated and complex indicial roots, and a second solution by reduction of order."}],"problems":["map2302:u2.cauchy-euler","map2302:u2.reduction"],"candidate":null,"sources":[{"title":"Lebl, Notes on Diffy Qs, §2.1 Second order linear ODEs","url":"https://www.jirka.org/diffyqs/","why":"Existence for variable coefficients, reduction of order and Euler equations.","level":"Course level"},{"title":"MIT 18.03SC, Modes and the characteristic equation","url":"https://ocw.mit.edu/courses/18-03sc-differential-equations-fall-2011/pages/unit-ii-second-order-constant-coefficient-linear-equations/modes-and-the-characteristic-equation/","why":"The constant-coefficient case a Cauchy–Euler equation reduces to.","level":"Course level"}]},{"id":"center-of-mass","title":"Center of mass","subject":"mechanics","courses":["phy2048"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>𝐫\u003c/mi>\u003cmtext>cm\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmo>∑\u003c/mo>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>𝐫\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmo>∑\u003c/mo>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmi>M\u003c/mi>\u003c/mfrac>\u003cmo>∫\u003c/mo>\u003cmi>𝐫\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>m\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>M\u003c/mi>\u003cmsub>\u003cmi>𝐚\u003c/mi>\u003cmtext>cm\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmo>∑\u003c/mo>\u003cmsub>\u003cmi>𝐅\u003c/mi>\u003cmtext>ext\u003c/mtext>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span>","idea":"The centre of mass is the mass-weighted average position. Internal forces cancel in pairs, so it moves as if all the mass were there and only outside forces acted. A shell that bursts in flight keeps its centre of mass on the original parabola.","requires":["impulse-momentum","definite-integral"],"labs":[{"course":"phy2048","title":"Center of mass","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u5/center-of-mass","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u5/center-of-mass?n=s6","note":"The weighted average of masses, and a burst that leaves the centre of mass on its parabola."}],"problems":["phy2048:ch9.cm","phy2048:ch9.concept-cm"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 1, §9.6 Center of mass","url":"https://openstax.org/books/university-physics-volume-1/pages/9-6-center-of-mass","why":"Point masses, then rods and plates by integration.","level":"Intro"},{"title":"MIT 8.01SC, 17.1 Definition of the center of mass","url":"https://ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/pages/week-5-momentum-and-impulse/17-1-definition-of-the-center-of-mass/","why":"The definition and why internal forces drop out.","level":"Course level"}]},{"id":"centroids","title":"Centroids and area moments of inertia","subject":"mechanics","courses":["statics"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmover accent=\"true\">\u003cmi>x\u003c/mi>\u003cmo>ˉ\u003c/mo>\u003c/mover>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmo>∑\u003c/mo>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmsub>\u003cmover accent=\"true\">\u003cmi>x\u003c/mi>\u003cmo>ˉ\u003c/mo>\u003c/mover>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmo>∑\u003c/mo>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmi>x\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmo>∑\u003c/mo>\u003cmrow>\u003cmo fence=\"true\">(\u003c/mo>\u003cmsub>\u003cmover accent=\"true\">\u003cmi>I\u003c/mi>\u003cmo>ˉ\u003c/mo>\u003c/mover>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmsubsup>\u003cmi>d\u003c/mi>\u003cmi>i\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msubsup>\u003cmo fence=\"true\">)\u003c/mo>\u003c/mrow>\u003c/mrow>\u003c/math>\u003c/span>","idea":"The centroid is an area's balance point. For a shape built from rectangles, triangles and circles, weight each part's centroid by its area; a hole is a part with negative area. The area moment of inertia measures how far the area sits from an axis and sets a beam's stiffness. Pappus's theorems turn a centroid's travel into a surface area or a volume.","requires":["double-integrals"],"labs":[{"course":"statics","title":"Sections","href":"https://flux-study.pages.dev/statics/#/statics/u4/sections","notes":"https://flux-study.pages.dev/statics/#/statics/u4/sections?n=s4","note":"L, T and I sections and a plate with a hole, by the composite-part table."},{"course":"statics","title":"Pappus","href":"https://flux-study.pages.dev/statics/#/statics/u4/pappus","notes":null,"note":"A torus and a sphere from Pappus: the surface and the volume use different centroids."}],"problems":["statics:ch9.centroid-composite","statics:ch10.moi-composite","statics:ch10.parallel-axis","statics:ch9.plate-hole","statics:ch10.ibeam","statics:r4.area-mass","statics:ch9.pappus"],"candidate":null,"sources":[{"title":"Engineering Statics: Open and Interactive (Baker and Haynes)","url":"https://engineeringstatics.org/","why":"Centroids and area moments by composite parts, with interactive figures.","level":"Course level"},{"title":"OpenStax Calculus Vol. 3, §5.6 Calculating centers of mass and moments of inertia","url":"https://openstax.org/books/calculus-volume-3/pages/5-6-calculating-centers-of-mass-and-moments-of-inertia","why":"The integrals behind the composite-part tables.","level":"Course level"}]},{"id":"ceramics-glasses","title":"Ceramics and glasses","subject":"matsci","courses":["ema3010"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>η\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>η\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmi>exp\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmtext> ⁣\u003c/mtext>\u003cmrow>\u003cmo fence=\"true\">(\u003c/mo>\u003cmfrac>\u003cmi>Q\u003c/mi>\u003cmrow>\u003cmi>R\u003c/mi>\u003cmi>T\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo fence=\"true\">)\u003c/mo>\u003c/mrow>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Ceramics are held by ionic and covalent bonds, which are strong and directional, so they melt hot and resist wear but have almost no dislocation motion and break brittle. A glass is a solid with no long-range order: cooled fast enough, a melt stiffens before its atoms can line up. Its viscosity climbs steeply as it cools, and the glass transition is where it stops flowing on any human timescale. Network formers such as silica build the glass; modifiers such as soda break bonds to make it workable.","requires":["atomic-bonding","crystal-structures"],"labs":[],"problems":[],"candidate":"Cool a melt at different rates and plot its volume against temperature, crystal against glass. It corrects the idea that old window glass is a liquid still flowing.","sources":[{"title":"MIT 3.091, Recitation 19: Glasses and cooling curves","url":"https://ocw.mit.edu/courses/3-091-introduction-to-solid-state-chemistry-fall-2018/resources/mit3_091f18_rec19/","why":"Volume against temperature for crystal and glass, and the cooling-rate effect.","level":"Course level"},{"title":"MIT 3.091, Recitation 20: Glass formers","url":"https://ocw.mit.edu/courses/3-091-introduction-to-solid-state-chemistry-fall-2018/resources/mit3_091f18_rec20/","why":"Network formers and modifiers, and what makes a melt form a glass.","level":"Course level"}]},{"id":"chain-rule","title":"Multivariable chain rule","subject":"calculus","courses":["mac2313"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmfrac>\u003cmi>d\u003c/mi>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmi>f\u003c/mi>\u003cmo fence=\"false\" stretchy=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>t\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>t\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo fence=\"false\" stretchy=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmi>f\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmfrac>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>x\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo>+\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmi>f\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmi>y\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmfrac>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>y\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmi mathvariant=\"normal\">∇\u003c/mi>\u003cmi>f\u003c/mi>\u003cmo>⋅\u003c/mo>\u003cmsup>\u003cmi mathvariant=\"bold-italic\">γ\u003c/mi>\u003cmo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′\u003c/mo>\u003c/msup>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>t\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Walk along a path across a surface. Your height changes because \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> changes and because \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>y\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> changes, and the two effects add. Written as a dot product, the rate is the gradient dotted with your velocity. That one line is where the directional derivative comes from.","requires":["partial-derivatives","parametric-curves"],"labs":[{"course":"mac2313","title":"Chain","href":"https://flux-study.pages.dev/mac2313/#/mac2313/ch2/chain","notes":null,"note":"A curve on the floor lifted onto a surface: \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>g\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>f\u003c/mi>\u003cmo>∘\u003c/mo>\u003cmi>γ\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> and its slope."}],"problems":["mac2313:ch2.chain.gprime","mac2313:ch2.chain.parab","mac2313:ch2.chain.polarhs","mac2313:ch2.chain.polarht","mac2313:ch2.chain.dot","mac2313:ch2.chain.version"],"candidate":null,"sources":[{"title":"OpenStax Calculus Vol. 3, §4.5 The chain rule","url":"https://openstax.org/books/calculus-volume-3/pages/4-5-the-chain-rule","why":"Tree diagrams that keep track of every path from f down to t.","level":"Intro"},{"title":"MIT 18.02SC, Part B: Chain rule, gradient and directional derivatives","url":"https://ocw.mit.edu/courses/18-02sc-multivariable-calculus-fall-2010/pages/2.-partial-derivatives/part-b-chain-rule-gradient-and-directional-derivatives/","why":"Teaches the chain rule and the gradient together, as they belong.","level":"Course level"}]},{"id":"combustion","title":"Combustion and flame temperature","subject":"thermo","courses":["eml3101"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">C\u003c/mi>\u003cmsub>\u003cmi mathvariant=\"normal\">H\u003c/mi>\u003cmn>4\u003c/mn>\u003c/msub>\u003c/mrow>\u003cmo>+\u003c/mo>\u003cmn>2\u003c/mn>\u003cmtext> \u003c/mtext>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsub>\u003cmi mathvariant=\"normal\">O\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmn>3.76\u003c/mn>\u003cmtext> \u003c/mtext>\u003cmsub>\u003cmi mathvariant=\"normal\">N\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>→\u003c/mo>\u003cmrow>\u003cmi mathvariant=\"normal\">C\u003c/mi>\u003cmsub>\u003cmi mathvariant=\"normal\">O\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mrow>\u003cmo>+\u003c/mo>\u003cmn>2\u003c/mn>\u003cmtext> \u003c/mtext>\u003cmrow>\u003cmsub>\u003cmi mathvariant=\"normal\">H\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmi mathvariant=\"normal\">O\u003c/mi>\u003c/mrow>\u003cmo>+\u003c/mo>\u003cmn>7.52\u003c/mn>\u003cmtext> \u003c/mtext>\u003cmsub>\u003cmi mathvariant=\"normal\">N\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmunder>\u003cmo>∑\u003c/mo>\u003cmtext>P\u003c/mtext>\u003c/munder>\u003cmsub>\u003cmi>N\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmsub>\u003cmrow>\u003cmo fence=\"true\">(\u003c/mo>\u003cmsubsup>\u003cmover accent=\"true\">\u003cmi>h\u003c/mi>\u003cmo>ˉ\u003c/mo>\u003c/mover>\u003cmi>f\u003c/mi>\u003cmo>∘\u003c/mo>\u003c/msubsup>\u003cmo>+\u003c/mo>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmover accent=\"true\">\u003cmi>h\u003c/mi>\u003cmo>ˉ\u003c/mo>\u003c/mover>\u003cmo fence=\"true\">)\u003c/mo>\u003c/mrow>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmunder>\u003cmo>∑\u003c/mo>\u003cmtext>R\u003c/mtext>\u003c/munder>\u003cmsub>\u003cmi>N\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmsub>\u003cmrow>\u003cmo fence=\"true\">(\u003c/mo>\u003cmsubsup>\u003cmover accent=\"true\">\u003cmi>h\u003c/mi>\u003cmo>ˉ\u003c/mo>\u003c/mover>\u003cmi>f\u003c/mi>\u003cmo>∘\u003c/mo>\u003c/msubsup>\u003cmo>+\u003c/mo>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmover accent=\"true\">\u003cmi>h\u003c/mi>\u003cmo>ˉ\u003c/mo>\u003c/mover>\u003cmo fence=\"true\">)\u003c/mo>\u003c/mrow>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Burning a fuel rearranges atoms, so the balance starts by counting them: the stoichiometric air is just enough oxygen to burn everything, and the nitrogen comes along. Each compound carries an enthalpy of formation, the energy stored in its bonds, measured from the elements. The first law for a burner says heat out equals the enthalpy of the reactants minus that of the products. With no heat loss, the products heat up until their enthalpy matches the reactants': the adiabatic flame temperature. Excess air dilutes the products, so the flame runs cooler.","requires":["gas-mixtures","energy-cv"],"labs":[],"problems":[],"candidate":"Burn methane with air or pure oxygen across the mixture ratio and plot the flame temperature. It corrects the idea that more air makes a hotter flame: the flame peaks near stoichiometric, and extra air or nitrogen only soaks up heat.","sources":[{"title":"MIT 16.050, calendar: Introduction to thermochemistry","url":"https://ocw.mit.edu/courses/16-050-thermal-energy-fall-2002/pages/calendar/","why":"Three lectures on the energy of reactions, from fuel to flame.","level":"Course level"},{"title":"Cleynen, Engineering Thermodynamics","url":"https://thermodynamicsbook.com/","why":"Steady-flow energy balances, which the reacting balance extends.","level":"Course level"},{"title":"Wikipedia, Adiabatic flame temperature","url":"https://en.wikipedia.org/wiki/Adiabatic_flame_temperature","why":"Typical flame temperatures and why they peak near stoichiometric.","level":"Intro"}]},{"id":"compressible-flow","title":"Compressible flow in nozzles","subject":"thermo","courses":["eml3101"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>c\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsqrt>\u003cmrow>\u003cmi>k\u003c/mi>\u003cmi>R\u003c/mi>\u003cmi>T\u003c/mi>\u003c/mrow>\u003c/msqrt>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmfrac>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmi>T\u003c/mi>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>+\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>k\u003c/mi>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/mfrac>\u003cmtext> \u003c/mtext>\u003cmsup>\u003cmtext>Ma\u003c/mtext>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmfrac>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>A\u003c/mi>\u003c/mrow>\u003cmi>A\u003c/mi>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmo fence=\"true\">(\u003c/mo>\u003cmsup>\u003cmtext>Ma\u003c/mtext>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo fence=\"true\">)\u003c/mo>\u003c/mrow>\u003cmfrac>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>V\u003c/mi>\u003c/mrow>\u003cmi>V\u003c/mi>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"When a gas moves at a good fraction of the speed of sound its density changes, and Bernoulli no longer holds. The steady-flow energy equation gives stagnation properties: the temperature and pressure the gas would reach if brought to rest without loss. Combine mass, energy and an isentropic path, and a duct behaves oddly: below Mach 1 a narrowing speeds the gas up, above Mach 1 a widening does. So a nozzle must converge and then diverge to make supersonic flow. Once the throat reaches Mach 1 the nozzle is choked, and lowering the back pressure further adds no mass flow.","requires":["energy-cv","entropy","mass-cv"],"labs":[],"problems":[],"candidate":"A converging-diverging nozzle with a back-pressure slider and the Mach number drawn along it. It corrects the idea that lowering the back pressure always pulls more gas through: once the throat is sonic the mass flow stays fixed.","sources":[{"title":"NASA Glenn, Beginner’s guide to aeronautics: Isentropic flow","url":"https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/isentropic-flow/","why":"The isentropic relations with Mach number, from the people who test nozzles.","level":"Intro"},{"title":"Wikipedia, Choked flow","url":"https://en.wikipedia.org/wiki/Choked_flow","why":"Why the mass flow stops rising once the throat is sonic.","level":"Course level"},{"title":"Cleynen, Fluid Dynamics for Engineers","url":"https://fluidmech.ninja/","why":"A free text with a chapter on compressible flow in ducts.","level":"Course level"}]},{"id":"conditional-probability","title":"Conditional probability and Bayes’ theorem","subject":"stats","courses":["sta3032"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>P\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>A\u003c/mi>\u003cmo>∣\u003c/mo>\u003cmi>B\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>P\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>B\u003c/mi>\u003cmo>∣\u003c/mo>\u003cmi>A\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmi>P\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>A\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003cmrow>\u003cmi>P\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>B\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Knowing that \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>B\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> happened shrinks the world to \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>B\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>, and \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>P\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>A\u003c/mi>\u003cmo>∣\u003c/mo>\u003cmi>B\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/math>\u003c/span> is \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>'s share of it. Bayes' theorem turns a test's accuracy into what a positive result means. For a rare condition, most positives are false even with a good test, because the healthy group is so much larger. An area model or a tree makes that plain.","requires":[],"labs":[{"course":"sta3032","title":"Conditional probability","href":"https://flux-study.pages.dev/sta3032/#/sta3032/mid/explore/cond","notes":null,"note":"A screening test as an area model and a tree: rare conditions make most positives false."}],"problems":[],"candidate":null,"sources":[{"title":"MIT 18.05, Reading 3: Conditional probability, Bayes’ theorem","url":"https://ocw.mit.edu/courses/18-05-introduction-to-probability-and-statistics-spring-2014/resources/mit18_05s14_reading3/","why":"Trees and Bayes with the base-rate example worked.","level":"Course level"},{"title":"OpenStax Introductory Statistics 2e, §3.5 Tree and Venn diagrams","url":"https://openstax.org/books/introductory-statistics-2e/pages/3-5-tree-and-venn-diagrams","why":"Conditional probability read off trees.","level":"Intro"}]},{"id":"conductors","title":"Conductors in equilibrium","subject":"em","courses":["phy2049"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>𝐄\u003c/mi>\u003cmtext>inside\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>0\u003c/mn>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmtext>surface\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>σ\u003c/mi>\u003cmsub>\u003cmi>ε\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003c/mfrac>\u003cmtext> (normal)\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Free charge in a conductor moves until it feels no force, so the field inside is zero once things settle. Gauss's law then puts all excess charge on the surface, and the field just outside points straight out with size \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>σ\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmsub>\u003cmi>ε\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span>. A closed metal shell hides its inside from outside fields. That is a Faraday cage.","requires":["gauss-law"],"labs":[{"course":"phy2049","title":"Conductors","href":"https://flux-study.pages.dev/phy2049/#/phy2049/e2/conductors","notes":"https://flux-study.pages.dev/phy2049/#/phy2049/e2/conductors?n=s13","note":"Surface charge \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>σ\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> on spheres and cages, coloured by sign, with image charges."}],"problems":["phy2049:e2.36b.shell-sigma","phy2049:e2.36c.cavity","phy2049:e2.36c.concentric","phy2049:e2.37.where-charge-goes","phy2049:e2.37.field-inside","phy2049:e2.37.empty-cavity","phy2049:e2.37.surface-field","phy2049:e2.37.cube-induced","phy2049:e2.37.nested","phy2049:e2.37.lightning-cloud","phy2049:e2.37.lightning-car","phy2049:e3.39.sphere-V"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 2, §6.4 Conductors in electrostatic equilibrium","url":"https://openstax.org/books/university-physics-volume-2/pages/6-4-conductors-in-electrostatic-equilibrium","why":"Each property argued from Gauss’s law, including cavities.","level":"Intro"},{"title":"Feynman Lectures Vol. II, Ch. 5: Application of Gauss’ law","url":"https://www.feynmanlectures.caltech.edu/II_05.html","why":"Why a closed conductor shields its inside, said more carefully than most texts.","level":"Deeper"}]},{"id":"confidence-intervals","title":"Confidence intervals","subject":"stats","courses":["sta3032","egn3203"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmover accent=\"true\">\u003cmi>x\u003c/mi>\u003cmo>ˉ\u003c/mo>\u003c/mover>\u003cmo>±\u003c/mo>\u003cmsub>\u003cmi>t\u003c/mi>\u003cmrow>\u003cmi>α\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmn>2\u003c/mn>\u003cmo separator=\"true\">,\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmi>n\u003c/mi>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmtext> \u003c/mtext>\u003cmfrac>\u003cmi>s\u003c/mi>\u003cmsqrt>\u003cmi>n\u003c/mi>\u003c/msqrt>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A confidence interval is a method that catches the true value a stated share of the time. A 95% interval does not have a 95% chance of holding \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>μ\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> once it is drawn; it either does or it does not. Over many samples, 95% of the intervals would. Wider intervals buy more confidence; larger samples buy narrower ones.","requires":["sampling-distributions"],"labs":[{"course":"sta3032","title":"Confidence interval coverage","href":"https://flux-study.pages.dev/sta3032/#/sta3032/final/explore/ci","notes":null,"note":"A hundred intervals from a hundred samples, and the long-run share that catch μ."}],"problems":[],"candidate":null,"sources":[{"title":"MIT 18.05, Reading 22: Confidence intervals for normal data","url":"https://ocw.mit.edu/courses/18-05-introduction-to-probability-and-statistics-spring-2014/resources/mit18_05s14_reading22/","why":"z and t intervals and what the confidence level means.","level":"Course level"},{"title":"OpenStax Introductory Statistics 2e, §8.1 A single population mean using the normal distribution","url":"https://openstax.org/books/introductory-statistics-2e/pages/8-1-a-single-population-mean-using-the-normal-distribution","why":"Building an interval and choosing a sample size.","level":"Intro"}]},{"id":"continuity","title":"Continuity equation","subject":"fluids","courses":["eml3015"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmfrac>\u003cmrow>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmi>ρ\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo>+\u003c/mo>\u003cmi mathvariant=\"normal\">∇\u003c/mi>\u003cmo>⋅\u003c/mo>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>ρ\u003c/mi>\u003cmi>𝐯\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Shrink the control volume to a point with the divergence theorem, and the mass balance becomes a differential equation. For an incompressible fluid it reduces to \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi mathvariant=\"normal\">∇\u003c/mi>\u003cmo>⋅\u003c/mo>\u003cmi>𝐯\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003c/math>\u003c/span>: the flow has no sources. Charge conservation has the same form, with charge density and current density.","requires":["mass-cv","divergence-theorem"],"labs":[],"problems":[],"candidate":"A 2D flow with a small control volume you drag. Net outflow is zero for incompressible flow, and nonzero where density changes.","sources":[{"title":"MIT 2.06, Lecture 8 notes: Differential forms, mass conservation","url":"https://ocw.mit.edu/courses/2-06-fluid-dynamics-spring-2013/resources/mit2_06s13_notes_vo/","why":"Derives the equation from the control volume, as above.","level":"Deeper"},{"title":"OpenStax Calculus Vol. 3, §6.8 The divergence theorem","url":"https://openstax.org/books/calculus-volume-3/pages/6-8-the-divergence-theorem","why":"The math step, if it has faded since Calculus III.","level":"Course level"}]},{"id":"continuous-charge","title":"Field of a continuous charge","subject":"em","courses":["phy2049"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>𝐄\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmrow>\u003cmn>4\u003c/mn>\u003cmi>π\u003c/mi>\u003cmsub>\u003cmi>ε\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003cmo>∫\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>q\u003c/mi>\u003c/mrow>\u003cmsup>\u003cmi>r\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mfrac>\u003cmtext> \u003c/mtext>\u003cmover accent=\"true\">\u003cmi>𝐫\u003c/mi>\u003cmo>^\u003c/mo>\u003c/mover>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>d\u003c/mi>\u003cmi>q\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>λ\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>l\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmi>σ\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>A\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmi>ρ\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>V\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Cut a charged rod, ring or disk into tiny pieces \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>q\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>, treat each as a point charge, and add their fields with an integral. Symmetry first: on an axis, the sideways parts from opposite pieces cancel, so only one component needs integrating. Writing \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>q\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> with the right density turns the sum into an ordinary integral.","requires":["electric-field"],"labs":[{"course":"phy2049","title":"Integrals","href":"https://flux-study.pages.dev/phy2049/#/phy2049/e2/integral","notes":"https://flux-study.pages.dev/phy2049/#/phy2049/e2/integral?n=s6","note":"Plays the Riemann sum along the charge and compares it with the closed form."}],"problems":["phy2049:e2.36b.line-charge-total","phy2049:e2.36b.line-length","phy2049:e2.36b.disk-radius","phy2049:e2.36b.volume-charge","phy2049:e2.36b.rod-bisector","phy2049:e2.36b.ring-axis","phy2049:e2.36b.rod-axis","phy2049:e2.36b.semicircle","phy2049:e2.36b.disk-axis","phy2049:e3.39.ring-V","phy2049:e3.39.rod-V","phy2049:e3.39.rod-axis-V","phy2049:e3.39.arc-center-V","phy2049:e3.39.disk-V"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 2, §5.5 Calculating electric fields of charge distributions","url":"https://openstax.org/books/university-physics-volume-2/pages/5-5-calculating-electric-fields-of-charge-distributions","why":"Line, ring and disk worked through with the symmetry argument shown.","level":"Course level"},{"title":"MIT 8.02, Problem-solving guide: Continuous charge distributions","url":"https://ocw.mit.edu/courses/8-02-physics-ii-electricity-and-magnetism-spring-2007/resources/solving02/","why":"A fixed recipe for setting up dq and r, then solved cases to check against.","level":"Course level"}]},{"id":"convection","title":"Convection and the Nusselt number","subject":"heat","courses":["eml4140"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsup>\u003cmi>q\u003c/mi>\u003cmrow>\u003cmo mathvariant=\"normal\">′\u003c/mo>\u003cmo mathvariant=\"normal\">′\u003c/mo>\u003c/mrow>\u003c/msup>\u003cmo>=\u003c/mo>\u003cmi>h\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmi>s\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmi mathvariant=\"normal\">∞\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmtext>Nu\u003c/mtext>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>h\u003c/mi>\u003cmi>L\u003c/mi>\u003c/mrow>\u003cmsub>\u003cmi>k\u003c/mi>\u003cmi>f\u003c/mi>\u003c/msub>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmover accent=\"true\">\u003cmtext>Nu\u003c/mtext>\u003cmo stretchy=\"true\">‾\u003c/mo>\u003c/mover>\u003cmi>L\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>0.664\u003c/mn>\u003cmtext> \u003c/mtext>\u003cmsubsup>\u003cmtext>Re\u003c/mtext>\u003cmi>L\u003c/mi>\u003cmrow>\u003cmn>1\u003c/mn>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmn>2\u003c/mn>\u003c/mrow>\u003c/msubsup>\u003cmtext> \u003c/mtext>\u003cmsup>\u003cmtext>Pr\u003c/mtext>\u003cmrow>\u003cmn>1\u003c/mn>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmn>3\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmtext> (laminar plate)\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/span>","idea":"At the wall the fluid does not move, so heat leaves by conduction through the fluid there. The coefficient \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>h\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> is that wall conduction divided by the temperature difference. It depends on how thin the thermal layer is, so it depends on the flow. The Nusselt number is \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>h\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> made dimensionless: how much the flow raises heat transfer above pure conduction across \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>L\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. Dimensional analysis says Nu depends on Re and Pr, and the correlations give that dependence for plates, cylinders and spheres. The Reynolds analogy ties it to wall friction: \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmtext>St\u003c/mtext>\u003cmtext> \u003c/mtext>\u003cmsup>\u003cmtext>Pr\u003c/mtext>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmn>3\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>c\u003c/mi>\u003cmi>f\u003c/mi>\u003c/msub>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmn>2\u003c/mn>\u003c/mrow>\u003c/math>\u003c/span>.","requires":["thermal-boundary-layer","boundary-layer"],"labs":[],"problems":[],"candidate":"Plot the local \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>h\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> along a heated plate in air and water. It corrects the idea that \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>h\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> is a property of the fluid: it is largest at the leading edge, falls along the plate, and jumps where the layer turns turbulent.","sources":[{"title":"Lienhard, A Heat Transfer Textbook","url":"https://ahtt.mit.edu","why":"Chapters 6 and 7 define \\(h\\) and Nu and give the external-flow correlations.","level":"Course level"},{"title":"MIT 2.51, calendar: Laminar boundary layers, integral methods (sessions 12 and 13)","url":"https://ocw.mit.edu/courses/2-51-intermediate-heat-and-mass-transfer-fall-2008/pages/calendar/","why":"Where the course derives the plate result two ways.","level":"Deeper"},{"title":"OpenStax University Physics Vol. 2, §1.6 Mechanisms of heat transfer","url":"https://openstax.org/books/university-physics-volume-2/pages/1-6-mechanisms-of-heat-transfer","why":"Convection as the first course meets it, before \\(h\\) is explained.","level":"Intro"}]},{"id":"convolution","title":"Convolution","subject":"diffeq","courses":["map2302"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>y\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>t\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmsubsup>\u003cmo>∫\u003c/mo>\u003cmn>0\u003c/mn>\u003cmi>t\u003c/mi>\u003c/msubsup>\u003cmi>w\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>t\u003c/mi>\u003cmo>−\u003c/mo>\u003cmi>τ\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmi>f\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>τ\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>τ\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi mathvariant=\"script\">L\u003c/mi>\u003cmo stretchy=\"false\">{\u003c/mo>\u003cmi>w\u003c/mi>\u003cmo>∗\u003c/mo>\u003cmi>f\u003c/mi>\u003cmo stretchy=\"false\">}\u003c/mo>\u003cmo>=\u003c/mo>\u003cmi>W\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>s\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmi>F\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>s\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A linear system at rest answers any input by adding up its impulse response, shifted to each moment of the input and weighted by it. So the output now carries a weighted memory of the input's past, and keeps responding after the input stops. In the Laplace domain convolution becomes a plain product.","requires":["laplace-transform"],"labs":[{"course":"map2302","title":"Convolution memory","href":"https://flux-study.pages.dev/map2302/#/map2302/u3/convolution","notes":"https://flux-study.pages.dev/map2302/#/map2302/u3/convolution?n=s6","note":"An RC circuit keeps responding after a pulse ends, sample by weighted sample."}],"problems":["map2302:u3.rc-history"],"candidate":null,"sources":[{"title":"Lebl, Notes on Diffy Qs, §6.3 Convolution","url":"https://www.jirka.org/diffyqs/html/convolution_section.html","why":"Convolution and its transform, with worked circuits.","level":"Course level"},{"title":"MIT 18.03SC, Convolution","url":"https://ocw.mit.edu/courses/18-03sc-differential-equations-fall-2011/pages/unit-iii-fourier-series-and-laplace-transform/convolution/","why":"The weighted-history picture on video, with problems.","level":"Course level"}]},{"id":"corrosion","title":"Corrosion","subject":"matsci","courses":["ema3010"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmtext>cell\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmtext>cathode\u003c/mtext>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmtext>anode\u003c/mtext>\u003c/msub>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmi>G\u003c/mi>\u003cmo>=\u003c/mo>\u003cmo>−\u003c/mo>\u003cmi>n\u003c/mi>\u003cmi>F\u003c/mi>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmtext>cell\u003c/mtext>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Most metals are refined from oxides and drift back toward them. Corrosion is an electrochemical cell: the anode metal gives up electrons and dissolves, and oxygen or hydrogen takes them at the cathode. Two metals in contact form a galvanic couple, and a small anode beside a large cathode corrodes fast. Protection works by breaking the cell: coatings, a sacrificial zinc anode, or a thin passive oxide like the chromium oxide on stainless steel.","requires":["atomic-bonding","electric-potential"],"labs":[],"problems":[],"candidate":"Couple two metals and change their area ratio and the electrolyte. It corrects the idea that painting the anode helps: a small exposed anode beside a large cathode corrodes faster.","sources":[{"title":"OpenStax Chemistry 2e, §17.6 Corrosion","url":"https://openstax.org/books/chemistry-2e/pages/17-6-corrosion","why":"Rusting as a cell, with cathodic protection and galvanizing.","level":"Intro"},{"title":"Galvanic series (Wikipedia)","url":"https://en.wikipedia.org/wiki/Galvanic_series","why":"Which metal corrodes when two are joined in seawater.","level":"Intro"}]},{"id":"couette-poiseuille","title":"Couette and Poiseuille flow","subject":"fluids","courses":["eml3015"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>u\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>r\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmi>p\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmn>4\u003c/mn>\u003cmi>μ\u003c/mi>\u003cmi>L\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmrow>\u003cmo fence=\"true\">(\u003c/mo>\u003cmsup>\u003cmi>R\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>−\u003c/mo>\u003cmsup>\u003cmi>r\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo fence=\"true\">)\u003c/mo>\u003c/mrow>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>Q\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>π\u003c/mi>\u003cmsup>\u003cmi>R\u003c/mi>\u003cmn>4\u003c/mn>\u003c/msup>\u003c/mrow>\u003cmrow>\u003cmn>8\u003c/mn>\u003cmi>μ\u003c/mi>\u003cmi>L\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmtext> \u003c/mtext>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmi>p\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"In a long straight channel the flow is the same at every station, so the Navier–Stokes equations shrink to one ordinary differential equation across the gap. A moving wall drags fluid along in a straight-line profile: Couette flow, the oil film in a journal bearing. A pressure drop pushes fluid through a pipe in a parabola: Poiseuille flow. Integrate the parabola and the flow rate goes as \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsup>\u003cmi>R\u003c/mi>\u003cmn>4\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span>, so a small change in radius makes a large change in flow.","requires":["navier-stokes"],"labs":[],"problems":[],"candidate":"Push oil through a tube with a slider for the radius and the pressure drop held fixed. It corrects the idea that doubling the radius doubles or quadruples the flow: it grows sixteenfold.","sources":[{"title":"MIT 2.06, calendar: Lectures 10 and 11, Navier–Stokes examples","url":"https://ocw.mit.edu/courses/2-06-fluid-dynamics-spring-2013/pages/calendar/","why":"Bearings and laminar pipe flow are the course’s first exact solutions.","level":"Course level"},{"title":"OpenStax University Physics Vol. 1, §14.7 Viscosity and turbulence","url":"https://openstax.org/books/university-physics-volume-1/pages/14-7-viscosity-and-turbulence","why":"Poiseuille’s law and the fourth-power dependence on radius, with blood-flow examples.","level":"Intro"}]},{"id":"coulombs-law","title":"Coulomb’s law","subject":"em","courses":["phy2049"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>𝐅\u003c/mi>\u003cmn>12\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmrow>\u003cmn>4\u003c/mn>\u003cmi>π\u003c/mi>\u003cmsub>\u003cmi>ε\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003cmtext> \u003c/mtext>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>q\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmsub>\u003cmi>q\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mrow>\u003cmsup>\u003cmi>r\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mfrac>\u003cmtext> \u003c/mtext>\u003cmsub>\u003cmover accent=\"true\">\u003cmi>𝐫\u003c/mi>\u003cmo>^\u003c/mo>\u003c/mover>\u003cmn>12\u003c/mn>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Two point charges push or pull along the line between them, with a force that falls as \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmn>1\u003c/mn>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmsup>\u003cmi>r\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span>. Like signs repel and unlike signs attract. With more than two charges, each pair acts as if the others were not there, and the forces add as vectors. A charge sits in equilibrium where those vectors cancel.","requires":["electric-charge","vectors"],"labs":[{"course":"phy2049","title":"Force","href":"https://flux-study.pages.dev/phy2049/#/phy2049/e1/force","notes":"https://flux-study.pages.dev/phy2049/#/phy2049/e1/force?n=s8","note":"Select a charge to read \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsub>\u003cmi>𝐅\u003c/mi>\u003cmtext>net\u003c/mtext>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span>, the vector sum of every pair."}],"problems":["phy2049:e1.34.electron-count","phy2049:e1.34.touching-spheres","phy2049:e1.34.induction","phy2049:e1.34.polarization","phy2049:e1.35.coulomb-pair","phy2049:e1.35.distance","phy2049:e1.35.three-inline","phy2049:e1.35.equilibrium-point","phy2049:e1.35.right-triangle","phy2049:e1.35.hydrogen","phy2049:e1.35.hanging-spheres","phy2049:e1.35.scaling"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 2, §5.3 Coulomb’s law","url":"https://openstax.org/books/university-physics-volume-2/pages/5-3-coulombs-law","why":"Superposition worked in components, the step most errors come from.","level":"Intro"},{"title":"PhET: Coulomb’s law","url":"https://phet.colorado.edu/en/simulations/coulombs-law","why":"Change the charges and the gap and read the force; the inverse square shows quickly.","level":"Intro"}]},{"id":"creep","title":"Creep","subject":"matsci","courses":["ema3010"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmover accent=\"true\">\u003cmi>ε\u003c/mi>\u003cmo>˙\u003c/mo>\u003c/mover>\u003cmi>s\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmi>A\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmsup>\u003cmi>σ\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msup>\u003cmi>exp\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmtext> ⁣\u003c/mtext>\u003cmrow>\u003cmo fence=\"true\">(\u003c/mo>\u003cmo>−\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmi>c\u003c/mi>\u003c/msub>\u003cmrow>\u003cmi>R\u003c/mi>\u003cmi>T\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo fence=\"true\">)\u003c/mo>\u003c/mrow>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Above roughly 0.4 of its absolute melting temperature, a loaded metal keeps stretching under constant stress. Atoms diffuse fast enough to let dislocations climb past obstacles, so strain builds at a steady rate and then speeds toward rupture. The rate rises with a power of stress and with temperature in the Arrhenius form, often with the same activation energy as self-diffusion. That is why turbine blades are single crystals of nickel alloys, and why lead pipes sag at room temperature.","requires":["diffusion","dislocations"],"labs":[],"problems":[],"candidate":"Hold a turbine blade at constant load and raise the temperature, plotting strain against time. It corrects the idea that a load below yield causes no permanent strain.","sources":[{"title":"DoITPoMS, Creep deformation of metals (University of Cambridge)","url":"https://www.doitpoms.ac.uk/tlplib/creep/index.php","why":"The creep curve, its mechanisms and its temperature dependence.","level":"Course level"},{"title":"Creep (deformation) (Wikipedia)","url":"https://en.wikipedia.org/wiki/Creep_(deformation)","why":"Stages of creep and the power-law form, with examples.","level":"Intro"}]},{"id":"crystal-structures","title":"Crystal structures and packing","subject":"matsci","courses":["ema3010"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtext>APF\u003c/mtext>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>N\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmfrac>\u003cmn>4\u003c/mn>\u003cmn>3\u003c/mn>\u003c/mfrac>\u003c/mstyle>\u003cmi>π\u003c/mi>\u003cmsup>\u003cmi>R\u003c/mi>\u003cmn>3\u003c/mn>\u003c/msup>\u003c/mrow>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>cell\u003c/mtext>\u003c/msub>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>ρ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>N\u003c/mi>\u003cmi>A\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>cell\u003c/mtext>\u003c/msub>\u003cmsub>\u003cmi>N\u003c/mi>\u003cmi>A\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>a\u003c/mi>\u003cmtext>FCC\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>2\u003c/mn>\u003cmsqrt>\u003cmn>2\u003c/mn>\u003c/msqrt>\u003cmtext> \u003c/mtext>\u003cmi>R\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmtext>  \u003c/mtext>\u003cmsub>\u003cmi>a\u003c/mi>\u003cmtext>BCC\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>4\u003c/mn>\u003cmi>R\u003c/mi>\u003c/mrow>\u003cmsqrt>\u003cmn>3\u003c/mn>\u003c/msqrt>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Most metals pack their atoms as spheres in a repeating cell. Where the atoms touch fixes the cell size: along a face diagonal in FCC, along the body diagonal in BCC. Counting the atoms in one cell then gives the packing fraction and the density. FCC and HCP fill 74% of space and BCC only 68%, and the close-packed planes they contain are where slip happens later.","requires":["atomic-bonding"],"labs":[],"problems":[],"candidate":"Shrink and grow the atoms in FCC, BCC and HCP cells until they touch, and read the packing fraction. It corrects the idea that every metal packs as tightly as it can.","sources":[{"title":"OpenStax Chemistry 2e, §10.6 Lattice structures in crystalline solids","url":"https://openstax.org/books/chemistry-2e/pages/10-6-lattice-structures-in-crystalline-solids","why":"Unit cells, coordination numbers and density from the cell.","level":"Intro"},{"title":"MIT 3.091, Recitation 13: Bravais lattices and crystal packing","url":"https://ocw.mit.edu/courses/3-091-introduction-to-solid-state-chemistry-fall-2018/resources/mit3_091f18_rec13/","why":"Lattices and packing worked the way the course sets them.","level":"Course level"}]},{"id":"current-resistance","title":"Current and resistance","subject":"circuits","courses":["phy2049","eel3111"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>q\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>R\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>ρ\u003c/mi>\u003cmi>L\u003c/mi>\u003c/mrow>\u003cmi>A\u003c/mi>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>V\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>I\u003c/mi>\u003cmi>R\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Current is charge per second through a cross-section. Inside a wire the field pushes electrons, collisions slow them, and the result is a small steady drift. Resistance grows with length and shrinks with area, and resistivity rises with temperature for metals. Ohm's law, \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>V\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>I\u003c/mi>\u003cmi>R\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>, says the current is proportional to the voltage. Many devices do not obey it.","requires":["electric-potential"],"labs":[{"course":"phy2049","title":"Ohm","href":"https://flux-study.pages.dev/phy2049/#/phy2049/e3/ohm","notes":"https://flux-study.pages.dev/phy2049/#/phy2049/e3/ohm?n=s11","note":"A wire you heat: R rises, I falls, and the drift is drawn."}],"problems":["phy2049:e3.41.wire-R","phy2049:e3.41.temperature","phy2049:e3.41.drift","phy2049:e3.41.charge-flow","phy2049:e3.41.stretch","phy2049:e3.41.ohm-basics","phy2049:e3.42.hot-wire"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 2, §9.3 Resistivity and resistance","url":"https://openstax.org/books/university-physics-volume-2/pages/9-3-resistivity-and-resistance","why":"Geometry and temperature, with tables of resistivities.","level":"Intro"},{"title":"PhET: Ohm’s law","url":"https://phet.colorado.edu/en/simulations/ohms-law","why":"Vary V and R and watch I respond, before any algebra.","level":"Intro"}]},{"id":"curved-path-forces","title":"Force in curved motion","subject":"mechanics","courses":["egn3321","phy2048"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmo>∑\u003c/mo>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmi>m\u003c/mi>\u003cmfrac>\u003cmsup>\u003cmi>v\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmi>ρ\u003c/mi>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmtext>design\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsqrt>\u003cmrow>\u003cmi>g\u003c/mi>\u003cmi>ρ\u003c/mi>\u003cmi>tan\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>θ\u003c/mi>\u003c/mrow>\u003c/msqrt>\u003c/mrow>\u003c/math>\u003c/span>","idea":"To follow a curve, something must push toward its centre. On a banked road it is part of the normal force, with friction making up any difference, so one speed needs no friction at all. In a vertical loop the needed force changes around the loop, and at the top gravity alone may be enough. Write Newton's law in the same components as the curve.","requires":["newtons-second-law","curvilinear-motion"],"labs":[{"course":"egn3321","title":"Curve","href":"https://flux-study.pages.dev/egn3321/#/egn3321/u2/curve","notes":"https://flux-study.pages.dev/egn3321/#/egn3321/u2/curve?n=s6","note":"A banked curve and a vertical loop, with the forces that hold each path."},{"course":"egn3321","title":"Highway","href":"https://flux-study.pages.dev/egn3321/#/egn3321/u2/highway","notes":"https://flux-study.pages.dev/egn3321/#/egn3321/u2/highway?n=s10","note":"A highway curve designed to its posted speed, superelevation and friction."},{"course":"phy2048","title":"Banked curve","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u3/banked-curve","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u3/banked-curve?n=s10","note":"A banked road: one speed needs no friction, and friction widens it into a band."}],"problems":["egn3321:u2.13.bank","egn3321:u2.13.loop","egn3321:u2.13.crest","egn3321:u2.13.highway","phy2048:ch6.flat","phy2048:ch6.banked","phy2048:ch6.slowbank","phy2048:ch6.concept-curve"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 1, §6.3 Centripetal force","url":"https://openstax.org/books/university-physics-volume-1/pages/6-3-centripetal-force","why":"Banked curves with and without friction, worked in full.","level":"Intro"},{"title":"MIT 8.01SC, 11.1 Newton’s second law and circular motion","url":"https://ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/pages/week-3-circular-motion/11-1-newtons-2nd-law-and-circular-motion/","why":"The radial equation set up with care about signs.","level":"Course level"}]},{"id":"curvilinear-motion","title":"Curvilinear motion","subject":"mechanics","courses":["egn3321","phy2048"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>𝐚\u003c/mi>\u003cmo>=\u003c/mo>\u003cmover accent=\"true\">\u003cmi>v\u003c/mi>\u003cmo>˙\u003c/mo>\u003c/mover>\u003cmtext> \u003c/mtext>\u003cmsub>\u003cmover accent=\"true\">\u003cmi>𝐮\u003c/mi>\u003cmo>^\u003c/mo>\u003c/mover>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmfrac>\u003cmsup>\u003cmi>v\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmi>ρ\u003c/mi>\u003c/mfrac>\u003cmtext> \u003c/mtext>\u003cmsub>\u003cmover accent=\"true\">\u003cmi>𝐮\u003c/mi>\u003cmo>^\u003c/mo>\u003c/mover>\u003cmi>n\u003c/mi>\u003c/msub>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>𝐚\u003c/mi>\u003cmo>=\u003c/mo>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmover accent=\"true\">\u003cmi>r\u003c/mi>\u003cmo>¨\u003c/mo>\u003c/mover>\u003cmo>−\u003c/mo>\u003cmi>r\u003c/mi>\u003cmsup>\u003cmover accent=\"true\">\u003cmi>θ\u003c/mi>\u003cmo>˙\u003c/mo>\u003c/mover>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmsub>\u003cmover accent=\"true\">\u003cmi>𝐮\u003c/mi>\u003cmo>^\u003c/mo>\u003c/mover>\u003cmi>r\u003c/mi>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>r\u003c/mi>\u003cmover accent=\"true\">\u003cmi>θ\u003c/mi>\u003cmo>¨\u003c/mo>\u003c/mover>\u003cmo>+\u003c/mo>\u003cmn>2\u003c/mn>\u003cmover accent=\"true\">\u003cmi>r\u003c/mi>\u003cmo>˙\u003c/mo>\u003c/mover>\u003cmover accent=\"true\">\u003cmi>θ\u003c/mi>\u003cmo>˙\u003c/mo>\u003c/mover>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmsub>\u003cmover accent=\"true\">\u003cmi>𝐮\u003c/mi>\u003cmo>^\u003c/mo>\u003c/mover>\u003cmi>θ\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span>","idea":"On a curved path, split the acceleration along and across the path. The tangential part changes the speed; the normal part, \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsup>\u003cmi>v\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>ρ\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>, turns the velocity toward the centre of curvature. For something swinging about a point, polar components are easier, and they carry the extra \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmn>2\u003c/mn>\u003cmover accent=\"true\">\u003cmi>r\u003c/mi>\u003cmo>˙\u003c/mo>\u003c/mover>\u003cmover accent=\"true\">\u003cmi>θ\u003c/mi>\u003cmo>˙\u003c/mo>\u003c/mover>\u003c/mrow>\u003c/math>\u003c/span> term. A projectile is the simplest case: constant acceleration in \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> and \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>y\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> separately.","requires":["particle-kinematics","parametric-curves","polar-coordinates"],"labs":[{"course":"egn3321","title":"Path","href":"https://flux-study.pages.dev/egn3321/#/egn3321/u1/path-nt","notes":"https://flux-study.pages.dev/egn3321/#/egn3321/u1/path-nt?n=s5","note":"Tangential and normal components on a curved path, with \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>ρ\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> at each point."},{"course":"egn3321","title":"Polar","href":"https://flux-study.pages.dev/egn3321/#/egn3321/u1/polar","notes":"https://flux-study.pages.dev/egn3321/#/egn3321/u1/polar?n=s6","note":"Radial and transverse components for an arm swinging and extending."},{"course":"phy2048","title":"Projectile","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u2/projectile","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u2/projectile?n=s3","note":"Projectiles from level ground and from a height, with complementary angles compared."},{"course":"phy2048","title":"Circular motion","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u2/circular-motion","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u2/circular-motion?n=s6","note":"Steady motion on a circle still accelerates, toward the centre, at \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsup>\u003cmi>v\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>."}],"problems":["egn3321:u1.12.path","egn3321:u1.12.nt-direction","egn3321:u1.12.polar","egn3321:u1.12.radar","egn3321:u1.12.polar-dir","egn3321:u1.12.polar-sym","egn3321:u2.13.polar-eom","phy2048:ch4.level","phy2048:ch4.golf","phy2048:ch4.height","phy2048:ch4.slope","phy2048:ch4.concept-top","phy2048:ch4.concept-range","phy2048:ch4.circle","phy2048:ch4.turn","phy2048:ch4.total","phy2048:ch4.concept-accel","phy2048:ch4.concept-circle"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 1, §4.3 Projectile motion","url":"https://openstax.org/books/university-physics-volume-1/pages/4-3-projectile-motion","why":"Independent x and y motion, worked for range and height.","level":"Intro"},{"title":"MIT 8.01SC, 8.1 Polar coordinates","url":"https://ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/pages/week-3-circular-motion/8-1-polar-coordinates/","why":"Why the polar unit vectors turn, which is where the extra terms come from.","level":"Course level"}]},{"id":"cylindrical-spherical","title":"Cylindrical and spherical coordinates","subject":"calculus","courses":["mac2313"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>V\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>r\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>r\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>θ\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>z\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>d\u003c/mi>\u003cmi>V\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsup>\u003cmi>ρ\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmi>sin\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>φ\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>ρ\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>φ\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>θ\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Match the coordinates to the shape. Cylindrical coordinates add a height to polar; spherical ones use a distance and two angles. Each volume element carries its own factor: \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> for cylinders, \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsup>\u003cmi>ρ\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmi>sin\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>φ\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> for spheres, because a cell near the equator is larger than one near a pole.","requires":["triple-integrals","polar-integrals"],"labs":[{"course":"mac2313","title":"Cylindrical","href":"https://flux-study.pages.dev/mac2313/#/mac2313/ch5/cyl","notes":null,"note":"One wedge: \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmi>V\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>r\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmi>r\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmi>θ\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmi>z\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>."},{"course":"mac2313","title":"Spherical","href":"https://flux-study.pages.dev/mac2313/#/mac2313/ch5/sph","notes":null,"note":"An equator cell beside a pole cell, to see \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsup>\u003cmi>ρ\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmi>sin\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>φ\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>."}],"problems":["mac2313:ch5.cyl.vol","mac2313:ch5.cyl.jac","mac2313:ch5.cyl.z","mac2313:ch5.sph.vol","mac2313:ch5.sph.jac","mac2313:ch5.sph.phi","mac2313:ch5.sph.odd","mac2313:ch5.sph.bowl"],"candidate":null,"sources":[{"title":"OpenStax Calculus Vol. 3, §5.5 Triple integrals in cylindrical and spherical coordinates","url":"https://openstax.org/books/calculus-volume-3/pages/5-5-triple-integrals-in-cylindrical-and-spherical-coordinates","why":"Both volume elements derived, then used on cones and balls.","level":"Intro"},{"title":"MIT 18.02SC, Part A: Triple integrals","url":"https://ocw.mit.edu/courses/18-02sc-multivariable-calculus-fall-2010/pages/4.-triple-integrals-and-surface-integrals-in-3-space/part-a-triple-integrals/","why":"Spherical and cylindrical integrals with full solutions.","level":"Course level"}]},{"id":"damped-oscillator","title":"Damped oscillators","subject":"diffeq","courses":["map2302"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>m\u003c/mi>\u003cmover accent=\"true\">\u003cmi>x\u003c/mi>\u003cmo>¨\u003c/mo>\u003c/mover>\u003cmo>+\u003c/mo>\u003cmi>c\u003c/mi>\u003cmover accent=\"true\">\u003cmi>x\u003c/mi>\u003cmo>˙\u003c/mo>\u003c/mover>\u003cmo>+\u003c/mo>\u003cmi>k\u003c/mi>\u003cmi>x\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>0\u003c/mn>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>ζ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>c\u003c/mi>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmsqrt>\u003cmrow>\u003cmi>m\u003c/mi>\u003cmi>k\u003c/mi>\u003c/mrow>\u003c/msqrt>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A mass on a spring with friction obeys a second-order linear equation, solved by exponentials whose rates are the roots of \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>m\u003c/mi>\u003cmsup>\u003cmi>r\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>+\u003c/mo>\u003cmi>c\u003c/mi>\u003cmi>r\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>k\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003c/math>\u003c/span>. Complex roots ring down, real roots creep back, and a repeated root is the boundary, critical damping. More damping does not always return faster. A series RLC circuit is the same equation in charge.","requires":["first-order-odes","simple-harmonic-motion"],"labs":[{"course":"map2302","title":"Free oscillator","href":"https://flux-study.pages.dev/map2302/#/map2302/u2/oscillator","notes":"https://flux-study.pages.dev/map2302/#/map2302/u2/oscillator?n=s1","note":"One release with small, critical and heavy damping."},{"course":"map2302","title":"Series RLC","href":"https://flux-study.pages.dev/map2302/#/map2302/u2/rlc","notes":"https://flux-study.pages.dev/map2302/#/map2302/u2/rlc?n=s9","note":"A series RLC circuit: charge and current as two states of one equation."}],"problems":["map2302:u2.natural-frequency","map2302:u2.initial-amplitude","map2302:u2.underdamped","map2302:u2.critical","map2302:u2.real-roots","map2302:u2.critical-crossing","map2302:u2.rlc-state"],"candidate":null,"sources":[{"title":"Lebl, Notes on Diffy Qs, §2.4 Mechanical vibrations","url":"https://www.jirka.org/diffyqs/html/sec_mv.html","why":"The three damping cases and the RLC analogue.","level":"Course level"},{"title":"MIT 18.03SC, Damped harmonic oscillators","url":"https://ocw.mit.edu/courses/18-03sc-differential-equations-fall-2011/pages/unit-ii-second-order-constant-coefficient-linear-equations/damped-harmonic-oscillators/","why":"Underdamped, critical and overdamped on video, with problems.","level":"Course level"}]},{"id":"definite-integral","title":"The definite integral","subject":"calculus","courses":["mac2311","mac2313"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsubsup>\u003cmo>∫\u003c/mo>\u003cmi>a\u003c/mi>\u003cmi>b\u003c/mi>\u003c/msubsup>\u003cmi>f\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>x\u003c/mi>\u003cmo>=\u003c/mo>\u003cmunder>\u003cmrow>\u003cmi>lim\u003c/mi>\u003cmo>⁡\u003c/mo>\u003c/mrow>\u003cmrow>\u003cmi>n\u003c/mi>\u003cmo>→\u003c/mo>\u003cmi mathvariant=\"normal\">∞\u003c/mi>\u003c/mrow>\u003c/munder>\u003cmunderover>\u003cmo>∑\u003c/mo>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cmi>n\u003c/mi>\u003c/munderover>\u003cmi>f\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsubsup>\u003cmi>x\u003c/mi>\u003cmi>i\u003c/mi>\u003cmo>∗\u003c/mo>\u003c/msubsup>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Cut an interval into thin strips, multiply each strip's width by a height of the function, and add. As the strips narrow, the sum settles on one number, the integral. Area is the first reading, but any quantity built up piece by piece is an integral: distance from speed, charge from density, work from force.","requires":[],"labs":[{"course":"mac2311","title":"Riemann","href":"https://flux-study.pages.dev/mac2311/#/mac2311/c3/riemann","notes":"https://flux-study.pages.dev/mac2311/#/mac2311/c3/riemann?n=s1","note":"Change n and the sample point; the rectangles close in on the area."},{"course":"mac2313","title":"Riemann","href":"https://flux-study.pages.dev/mac2313/#/mac2313/ch1/riemann1","notes":null,"note":"Rectangles under a graph, added one term at a time."}],"problems":["mac2311:c3.riemann","mac2311:c3.area","mac2311:c3.work","mac2311:c3.weighted","mac2313:ch1.riemann.ftc","mac2313:ch1.riemann.mid","mac2313:ch1.riemann.line","mac2313:ch1.riemann.length","mac2313:ch1.riemann.semi","mac2313:ch1.riemann.sample"],"candidate":null,"sources":[{"title":"OpenStax Calculus Vol. 1, §5.2 The definite integral","url":"https://openstax.org/books/calculus-volume-1/pages/5-2-the-definite-integral","why":"Riemann sums to the limit, with signed area explained.","level":"Intro"},{"title":"MIT 18.01SC, Part A: Definition of the definite integral and first fundamental theorem","url":"https://ocw.mit.edu/courses/18-01sc-single-variable-calculus-fall-2010/pages/unit-3-the-definite-integral-and-its-applications/part-a-definition-of-the-definite-integral-and-first-fundamental-theorem/","why":"The sum, the limit and the fundamental theorem in one sequence.","level":"Course level"}]},{"id":"dependent-sources","title":"Dependent sources","subject":"circuits","courses":["eel3111"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>v\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>μ\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmi>x\u003c/mi>\u003c/msub>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>i\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>g\u003c/mi>\u003cmi>m\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmi>x\u003c/mi>\u003c/msub>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>v\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>r\u003c/mi>\u003cmi>m\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>i\u003c/mi>\u003cmi>x\u003c/mi>\u003c/msub>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>i\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>β\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmsub>\u003cmi>i\u003c/mi>\u003cmi>x\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A dependent source sets its voltage or current from a voltage or current elsewhere in the circuit. It is how a transistor or an amplifier is drawn in a linear model: a small controlling signal sets a large output. In node or mesh analysis it adds one more equation tying its value to the controlling variable. Its controlling variable must be written with the right direction, or the gain changes sign. Unlike an independent source, it is never switched off in superposition or when finding a Thévenin resistance.","requires":["nodal-analysis"],"labs":[],"problems":[],"candidate":"A circuit with a voltage-controlled source whose gain you sweep, the node voltages updating. It corrects the idea that a dependent source can be zeroed like any other source: zero it and the circuit you analyse is no longer the one you built.","sources":[{"title":"MIT 6.002, calendar: Lecture 8, dependent sources and amplification","url":"https://ocw.mit.edu/courses/6-002-circuits-and-electronics-spring-2007/pages/calendar/","why":"The course meets dependent sources as the model of an amplifier.","level":"Course level"},{"title":"Kuphaldt, Lessons in Electric Circuits, Vol. III: Semiconductors","url":"https://www.allaboutcircuits.com/textbook/semiconductors/","why":"Transistor amplifiers, the devices that dependent sources stand in for.","level":"Intro"}]},{"id":"derivative","title":"The derivative","subject":"calculus","courses":["mac2311","mac2313"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsup>\u003cmi>f\u003c/mi>\u003cmo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′\u003c/mo>\u003c/msup>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmunder>\u003cmrow>\u003cmi>lim\u003c/mi>\u003cmo>⁡\u003c/mo>\u003c/mrow>\u003cmrow>\u003cmi>h\u003c/mi>\u003cmo>→\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003c/munder>\u003cmfrac>\u003cmrow>\u003cmi>f\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>h\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>−\u003c/mo>\u003cmi>f\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003cmi>h\u003c/mi>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"The slope of a secant line through two points on a graph becomes the slope of the tangent as the points close in. That limit is the derivative: the instantaneous rate of change. A function can be continuous and still have no derivative at a corner, where the slopes from the two sides disagree.","requires":["limits"],"labs":[{"course":"mac2311","title":"Secant","href":"https://flux-study.pages.dev/mac2311/#/mac2311/c1/secant","notes":"https://flux-study.pages.dev/mac2311/#/mac2311/c1/secant?n=s6","note":"Slide two points together: the secant turns into the tangent, on curves and a falling height."},{"course":"mac2313","title":"Limits","href":"https://flux-study.pages.dev/mac2313/#/mac2313/ch1/limits","notes":null,"note":"Slide \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span> and \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>h\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> and watch the secant turn into the tangent."}],"problems":["mac2311:c1.tangent-origin","mac2311:c1.falling","mac2311:c1.secants","mac2313:ch1.limits.quad","mac2313:ch1.limits.hole","mac2313:ch1.limits.abs","mac2313:ch1.limits.cube","mac2313:ch1.limits.squeeze"],"candidate":null,"sources":[{"title":"OpenStax Calculus Vol. 1, §3.1 Defining the derivative","url":"https://openstax.org/books/calculus-volume-1/pages/3-1-defining-the-derivative","why":"Secant to tangent, with the limit computed for several functions.","level":"Intro"},{"title":"MIT 18.01SC, Part A: Definition and basic rules","url":"https://ocw.mit.edu/courses/18-01sc-single-variable-calculus-fall-2010/pages/1.-differentiation/part-a-definition-and-basic-rules/","why":"Short lectures and checked problems on the definition itself.","level":"Course level"}]},{"id":"descriptive-statistics","title":"Describing data","subject":"stats","courses":["sta3032"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmover accent=\"true\">\u003cmi>x\u003c/mi>\u003cmo>ˉ\u003c/mo>\u003c/mover>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmi>n\u003c/mi>\u003c/mfrac>\u003cmo>∑\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsup>\u003cmi>s\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmrow>\u003cmi>n\u003c/mi>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/mfrac>\u003cmo>∑\u003c/mo>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmover accent=\"true\">\u003cmi>x\u003c/mi>\u003cmo>ˉ\u003c/mo>\u003c/mover>\u003cmsup>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmtext>IQR\u003c/mtext>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmn>3\u003c/mn>\u003c/msub>\u003cmo>−\u
