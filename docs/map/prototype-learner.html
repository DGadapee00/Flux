<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
</head>
<body>
<title>Flux learner home</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" />
<style>
/*
 * Layout: one home that knows the learner. A sticky bar with three places (Today, Map, Satellite),
 * then one view at a time. The hub's approved look: paper or near-black ground, condensed display
 * type, a serif for reading, mono for meta. Lane colours come from map/subjects.js at runtime.
 */
:root {
  --bg: #f6f5f2;
  --panel: #ffffff;
  --sunk: #eeece7;
  --line: #dcd8d2;
  --fg: #1d1c1a;
  --muted: #5d5853;
  --dim: #6f6963;
  --accent: #1a7590;
  --due: #a85400;
  --ok: #2e7d4f;
  --display: 'IBM Plex Sans Condensed', 'Arial Narrow', system-ui, sans-serif;
  --body: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #0b0c0e; --panel: #131418; --sunk: #0f1013; --line: #2a2c31; --fg: #ece6e2; --muted: #aaa39e;
    --dim: #8f8983; --accent: #58c4dd; --due: #f0a63a; --ok: #7cc98f; color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --bg: #0b0c0e; --panel: #131418; --sunk: #0f1013; --line: #2a2c31; --fg: #ece6e2; --muted: #aaa39e;
  --dim: #8f8983; --accent: #58c4dd; --due: #f0a63a; --ok: #7cc98f; color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.55; overflow-x: hidden; }
body::before { content: ''; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: inherit; text-decoration-color: var(--dim); text-underline-offset: 3px; }
a:hover { text-decoration-color: currentColor; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
button, input, select { font: inherit; color: inherit; }
math { font-size: 1.05em; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; line-height: 1.15; text-wrap: balance; margin: 0; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page { max-width: 1180px; margin: 0 auto; }
.meta { font-family: var(--mono); font-size: 12px; letter-spacing: 0.04em; color: var(--dim); }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
.muted { color: var(--muted); }

/* Bar */
.proto { background: var(--sunk); border-bottom: 1px solid var(--line); }
.proto .page { display: flex; flex-wrap: wrap; gap: 4px 16px; padding-block: 6px; }
header.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
header.bar .page { display: flex; align-items: center; gap: 8px 20px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: 0.06em; text-decoration: none; }
nav.places { display: flex; gap: 4px; }
nav.places a { font-family: var(--display); font-weight: 600; font-size: 16px; text-decoration: none; padding: 6px 12px; border-radius: 999px; color: var(--muted); }
nav.places a[aria-current='page'] { background: var(--fg); color: var(--bg); }
.who { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.who select, .who label.toggle { font-family: var(--mono); font-size: 12px; }
.who select { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; max-width: 220px; }
label.toggle { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; }
.notice { font-family: var(--mono); font-size: 12px; color: var(--due); }

main { padding-block: 28px 64px; }

/* Shared pieces */
.btn { display: inline-flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 600; font-size: 15px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--fg); background: var(--fg); color: var(--bg); text-decoration: none; cursor: pointer; }
.btn.quiet { background: transparent; color: var(--fg); border-color: var(--line); }
.btn:hover { filter: brightness(1.1); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.03em; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
.pill.mastered { border-color: var(--ok); color: var(--ok); }
.pill.learning { border-color: var(--accent); color: var(--accent); }
.pill.ready { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.pill.locked { color: var(--dim); border-style: dashed; }
.pill.due { border-color: var(--due); color: var(--due); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.bar-track { height: 6px; border-radius: 3px; background: var(--sunk); border: 1px solid var(--line); overflow: hidden; }
.bar-fill { height: 100%; background: var(--ok); }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.section-head h2 { font-size: 22px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; min-width: 0; }

/* Today */
.today-hero { display: grid; gap: 10px; margin-bottom: 28px; max-width: 820px; }
.today-hero h1 { font-size: clamp(30px, 5vw, 46px); font-weight: 600; }
.today-hero p { margin: 0; font-size: 18px; color: var(--muted); max-width: 65ch; }
.today-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.today-main, .today-side { display: grid; gap: 24px; min-width: 0; }
.step { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 0 14px; }
.step-n { font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1; color: var(--dim); padding-top: 2px; }
.queue { display: grid; gap: 2px; margin: 14px 0; }
.queue-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.queue-row input[type='checkbox'] { width: 18px; height: 18px; margin: 0; accent-color: var(--ok); }
.queue-row label { cursor: pointer; }
.sets { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; margin-top: 14px; }
.set-card { display: grid; gap: 6px; align-content: start; text-decoration: none; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line); border-left: 4px solid var(--lane); background: var(--panel); min-width: 0; }
.set-card:hover { border-color: var(--lane); }
.set-card .chain { font-family: var(--display); font-weight: 600; font-size: 18px; line-height: 1.3; }
.set-card .go { font-family: var(--display); font-weight: 600; font-size: 14px; color: var(--lane); margin-top: 4px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.recall { display: grid; gap: 12px; border-top: 4px solid var(--lane, var(--line)); margin-bottom: 16px; }
.recall .eq { margin: 0; }
.reveal { display: grid; gap: 12px; padding-top: 4px; }
.rate { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rate .meta { margin-right: 4px; }
.rail a.s-now span.seg { background: var(--fg); border-color: var(--fg); }
.rail a.s-now { color: var(--fg); }
.queue-row a { text-decoration: none; }
.queue-row .why { font-size: 14px; color: var(--muted); }
.next-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 14px; }
.next-card { display: grid; gap: 8px; align-content: start; text-decoration: none; padding: 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); border-top: 4px solid var(--lane); min-width: 0; }
.next-card:hover { border-color: var(--lane); }
.next-card h3 { font-size: 19px; }
.next-card ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; font-size: 14px; color: var(--muted); }
.exam-list { display: grid; gap: 6px; margin: 12px 0 0; padding: 0; list-style: none; }
.exam-list li { display: flex; align-items: center; gap: 8px; justify-content: space-between; font-size: 15px; }
.exam-list a { text-decoration: none; min-width: 0; }
.course-rows { display: grid; gap: 14px; margin: 0; padding: 0; list-style: none; }
.course-rows li { display: grid; gap: 4px; }
.course-rows .row { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; }
.sat-mini { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin: 12px 0; }
.sat-mini span { height: 8px; border-radius: 2px; background: var(--sunk); border: 1px solid var(--line); }
.sat-mini span.done { background: var(--ok); border-color: var(--ok); }
.sat-mini span.check { background: var(--fg); border-color: var(--fg); }

/* Tiles: one per concept. The fill is the state, the colour is the lane. */
.tile { --lane: var(--fg); position: relative; display: inline-flex; align-items: center; min-height: 30px; padding: 4px 10px; border-radius: 6px; font-family: var(--display); font-weight: 500; font-size: 14px; line-height: 1.2; text-decoration: none; border: 1px solid var(--lane); background: var(--panel); color: var(--fg); }
.tile.mastered { background: var(--lane); color: var(--bg); }
.tile.assumed { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--lane) 30%, var(--panel)) 0 5px, var(--panel) 5px 9px); }
.tile.learning { background: linear-gradient(90deg, color-mix(in srgb, var(--lane) 45%, var(--panel)) var(--m, 30%), var(--panel) var(--m, 30%)); }
.tile.ready { border-width: 2px; padding: 3px 9px; box-shadow: 0 0 0 3px color-mix(in srgb, var(--lane) 22%, transparent); font-weight: 600; }
.tile.locked { border: 1px dashed var(--line); color: var(--dim); background: transparent; }
.tile .due-dot { position: absolute; top: -4px; right: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--due); border: 2px solid var(--bg); }
.author .tile.gap { outline: 2px dashed var(--due); outline-offset: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin: 12px 0 20px; }
.legend span.item { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.legend .tile { min-height: 20px; padding: 0 10px; font-size: 11px; pointer-events: none; }

/* Map */
.map-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.lenses { display: flex; flex-wrap: wrap; gap: 6px; }
.lenses button { font-family: var(--display); font-weight: 600; font-size: 14px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
.lenses button[aria-pressed='true'] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.lane { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); }
.lane-name { font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--lane); padding-top: 6px; }
.lane-name small { display: block; color: var(--dim); letter-spacing: 0; text-transform: none; }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; }
.units { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.unit { display: grid; gap: 10px; align-content: start; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
.unit h3 { font-size: 16px; }
.unit .tiles { flex-direction: column; align-items: stretch; }

/* Concept */
.crumbs { display: flex; gap: 8px; align-items: center; font-family: var(--mono); font-size: 12px; color: var(--dim); margin-bottom: 18px; }
.concept { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.concept h1 { font-size: clamp(32px, 5vw, 48px); }
.concept .head { display: grid; gap: 10px; margin-bottom: 18px; }
.concept .tags { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.eq { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; overflow-x: auto; font-size: 20px; margin-bottom: 16px; }
.idea { font-size: 18px; max-width: 62ch; margin: 0 0 22px; }
.rel { display: grid; gap: 8px; margin-bottom: 18px; }
.rel .tiles { gap: 8px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.steps li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 4px 12px; padding: 14px 0; border-top: 1px solid var(--line); }
.steps li:first-child { border-top: 0; padding-top: 4px; }
.steps .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 14px; border: 1.5px solid var(--line); color: var(--dim); }
.steps .done .n { background: var(--ok); border-color: var(--ok); color: var(--bg); }
.steps .now .n { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.steps h3 { font-size: 17px; }
.steps p { margin: 2px 0 8px; font-size: 15px; color: var(--muted); }
.steps .actions { display: flex; flex-wrap: wrap; gap: 8px; }
.sources { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.sources li { font-size: 15px; }
.sources .why { color: var(--muted); font-size: 14px; }
.gapnote { border: 1px dashed var(--due); border-radius: 12px; padding: 14px; font-size: 15px; }

/* Satellite */
.sat-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: end; margin-bottom: 20px; }
.sat-head h1 { font-size: clamp(32px, 5vw, 48px); }
.rail { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; margin-bottom: 24px; }
.rail a { display: grid; gap: 6px; text-decoration: none; font-family: var(--mono); font-size: 11px; color: var(--muted); min-width: 0; }
.rail a span.seg { height: 6px; border-radius: 3px; background: var(--sunk); border: 1px solid var(--line); }
.rail a.done span.seg { background: var(--ok); border-color: var(--ok); }
.rail a.check span.seg { background: var(--fg); border-color: var(--fg); }
.rail a.learn span.seg { background: color-mix(in srgb, var(--accent) 40%, var(--sunk)); border-color: var(--accent); }
.rail a .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.subsys { display: grid; gap: 14px; }
.sub { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 0 16px; padding: 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
.sub.waits { background: transparent; }
.sub .num { font-family: var(--display); font-weight: 700; font-size: 30px; color: var(--dim); line-height: 1; }
.sub.done .num { color: var(--ok); }
.sub .top { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; margin-bottom: 6px; }
.sub h2 { font-size: 22px; }
.sub p { margin: 4px 0; }
.sub .tiles { margin: 10px 0; }
.task { display: grid; gap: 12px; margin-top: 12px; padding: 14px; border-radius: 10px; background: var(--sunk); border: 1px solid var(--line); }
.task .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.task label { display: grid; gap: 4px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.task input { font-family: var(--mono); font-size: 15px; padding: 7px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); width: 100%; font-variant-numeric: tabular-nums; }
.result { font-family: var(--mono); font-size: 13px; line-height: 1.6; font-variant-numeric: tabular-nums; }
.result .pass { color: var(--ok); }
.result .fail { color: var(--due); }
.result table { border-collapse: collapse; width: 100%; }
.result td, .result th { text-align: left; padding: 3px 8px 3px 0; border-bottom: 1px solid var(--line); }
.table-wrap { overflow-x: auto; }

@media (max-width: 860px) {
  .today-grid, .concept { grid-template-columns: minmax(0, 1fr); }
  .lane { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .lane-name { padding-top: 0; }
  .sat-head { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 520px) {
  .who { margin-left: 0; width: 100%; }
  .who select { flex: 1; max-width: none; }
  .rail a .lbl { display: none; }
  .sub { grid-template-columns: minmax(0, 1fr); }
  .sub .num { font-size: 20px; margin-bottom: 6px; }
  .step { grid-template-columns: minmax(0, 1fr); }
  .step-n { font-size: 20px; margin-bottom: 4px; }
}
@media (prefers-reduced-motion: no-preference) {
  .tile, .next-card, .btn { transition: border-color 120ms, box-shadow 120ms, filter 120ms; }
}
</style>

modynamics","status":"next term","app":"https://flux-study.pages.dev/eml3100/"},{"id":"map2302","code":"MAP 2302","title":"Differential Equations","status":"later","app":"https://flux-study.pages.dev/map2302/"},{"id":"egn3321","code":"EGN 3321","title":"Dynamics","status":"next term","app":"https://flux-study.pages.dev/egn3321/"},{"id":"egn3331","code":"EGN 3331","title":"Mechanics of Materials","status":"next term","app":"https://flux-study.pages.dev/egn3331/"},{"id":"eml3101","code":"EML 3101","title":"Thermodynamics II","status":"later","app":null},{"id":"eml3015","code":"EML 3015","title":"Fluids","status":"later","app":null},{"id":"eml4140","code":"EML 4140","title":"Heat Transfer","status":"later","app":null},{"id":"eel3111","code":"EEL 3111","title":"Circuit Analysis I","status":"later","app":null},{"id":"egn3203","code":"EGN 3203","title":"Modern Computation Methods","status":"later","app":null},{"id":"bench","code":"BENCH","title":"Electronics on the bench","status":"project","app":"https://flux-study.pages.dev/bench/"}],"concepts":[{"id":"ac-circuits","title":"AC circuits and resonance","subject":"circuits","courses":["phy2049","eel3111"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>Z\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsqrt>\u003cmrow>\u003cmsup>\u003cmi>R\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>+\u003c/mo>\u003cmsup>\u003cmrow>\u003cmo fence=\"true\">(\u003c/mo>\u003cmi>ω\u003c/mi>\u003cmi>L\u003c/mi>\u003cmo>−\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmrow>\u003cmi>ω\u003c/mi>\u003cmi>C\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo fence=\"true\">)\u003c/mo>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/msqrt>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>ω\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmsqrt>\u003cmrow>\u003cmi>L\u003c/mi>\u003cmi>C\u003c/mi>\u003c/mrow>\u003c/msqrt>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Drive a circuit with a sine wave and each part responds at the same frequency but with its own phase. A resistor's voltage is in step with the current, an inductor's leads it and a capacitor's lags it. Draw them as rotating arrows, phasors, and they add like vectors. At \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsub>\u003cmi>ω\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span> the inductor and capacitor cancel, the impedance drops to \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>R\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>, and the current peaks.","requires":["rc-circuits","inductance","forced-resonance"],"labs":[{"course":"phy2049","title":"AC","href":"https://flux-study.pages.dev/phy2049/#/phy2049/e5/ac","notes":"https://flux-study.pages.dev/phy2049/#/phy2049/e5/ac?n=s13","note":"Series RLC below, at and above resonance, with the phasor diagram beside the circuit."}],"problems":["phy2049:e5.52.reactance-C","phy2049:e5.52.reactance-L","phy2049:e5.52.rlc","phy2049:e5.52.resonance","phy2049:e5.52.lead-lag"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 2, §15.3 RLC series circuits with AC","url":"https://openstax.org/books/university-physics-volume-2/pages/15-3-rlc-series-circuits-with-ac","why":"Phasor diagrams built one element at a time.","level":"Intro"},{"title":"MIT 8.02, Problem-solving guide: Driven LRC circuits","url":"https://ocw.mit.edu/courses/8-02-physics-ii-electricity-and-magnetism-spring-2007/resources/solving09/","why":"Impedance, phase and resonance with checked numbers.","level":"Course level"}]},{"id":"ac-power","title":"AC power and power factor","subject":"circuits","courses":["eel3111"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>P\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>rms\u003c/mtext>\u003c/msub>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmtext>rms\u003c/mtext>\u003c/msub>\u003cmi>cos\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>θ\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>Q\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>rms\u003c/mtext>\u003c/msub>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmtext>rms\u003c/mtext>\u003c/msub>\u003cmi>sin\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>θ\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>𝐒\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>𝐕\u003c/mi>\u003cmtext>rms\u003c/mtext>\u003c/msub>\u003cmsubsup>\u003cmi>𝐈\u003c/mi>\u003cmtext>rms\u003c/mtext>\u003cmo lspace=\"0em\" rspace=\"0em\">∗\u003c/mo>\u003c/msubsup>\u003cmo>=\u003c/mo>\u003cmi>P\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>j\u003c/mi>\u003cmi>Q\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"When current lags or leads the voltage, part of each cycle sends energy back to the source. The average power that does work is \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>rms\u003c/mtext>\u003c/msub>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmtext>rms\u003c/mtext>\u003c/msub>\u003cmi>cos\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>θ\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>; the rest sloshes in and out of inductors and capacitors as reactive power. The power factor \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>cos\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>θ\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> is the share that does work. A motor's low power factor means the wires carry more current, and lose more \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsup>\u003cmi>I\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmi>R\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>, than the work needs. A capacitor in parallel supplies the motor's reactive power locally and raises the factor toward 1.","requires":["impedance-analysis","electric-power"],"labs":[],"problems":[],"candidate":"A motor load with a slider for its power factor and a correcting capacitor, the line current shown. It corrects the idea that volts times amps is the power used: at a low power factor the wires carry far more current than the work needs.","sources":[{"title":"OpenStax University Physics Vol. 2, §15.4 Power in an AC circuit","url":"https://openstax.org/books/university-physics-volume-2/pages/15-4-power-in-an-ac-circuit","why":"Average power and the power factor at a first-course level.","level":"Intro"},{"title":"Kuphaldt, Lessons in Electric Circuits, Vol. II: AC","url":"https://www.allaboutcircuits.com/textbook/alternating-current/","why":"Its power factor chapter covers true, reactive and apparent power, and correction.","level":"Intro"}]},{"id":"amperes-law","title":"Ampère’s law","subject":"em","courses":["phy2049"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmo>∮\u003c/mo>\u003cmi>𝐁\u003c/mi>\u003cmo>⋅\u003c/mo>\u003cmi>d\u003c/mi>\u003cmi>𝐥\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>μ\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmtext>enc\u003c/mtext>\u003c/msub>\u003cmspace width=\"1em\"/>\u003cmtext>(steady currents)\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Go around any closed loop adding up \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>𝐁\u003c/mi>\u003cmo>⋅\u003c/mo>\u003cmi>d\u003c/mi>\u003cmi>𝐥\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>, and the total is \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsub>\u003cmi>μ\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span> times the current threading the loop. Current outside adds nothing. Like Gauss's law, it holds for any loop but is only useful with symmetry: pick a loop where \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>B\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> is constant along it. Then a long wire gives \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>B\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>μ\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmi>I\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmn>2\u003c/mn>\u003cmi>π\u003c/mi>\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>, and a long solenoid gives \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>B\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>μ\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmi>n\u003c/mi>\u003cmi>I\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> inside. This form holds for steady currents. When the electric field changes, Maxwell's displacement term \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsub>\u003cmi>μ\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmsub>\u003cmi>ε\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmsub>\u003cmi mathvariant=\"normal\">Φ\u003c/mi>\u003cmi>E\u003c/mi>\u003c/msub>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>d\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> joins the current, and that term is what lets an electromagnetic wave travel.","requires":["biot-savart","line-integrals"],"labs":[{"course":"phy2049","title":"Ampère","href":"https://flux-study.pages.dev/phy2049/#/phy2049/e4/ampere","notes":"https://flux-study.pages.dev/phy2049/#/phy2049/e4/ampere?n=s14","note":"Loops around one wire, two wires and a thick wire, with \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>𝐁\u003c/mi>\u003cmo>⋅\u003c/mo>\u003cmi>d\u003c/mi>\u003cmi>𝐥\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> per piece."},{"course":"phy2049","title":"MRI","href":"https://flux-study.pages.dev/phy2049/#/phy2049/e4/mri","notes":null,"note":"An MRI magnet as a long solenoid, \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>B\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>μ\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmi>n\u003c/mi>\u003cmi>I\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>, checked against the sum of its turns."}],"problems":["phy2049:e4.47.thick-wire","phy2049:e4.47.two-wires-B","phy2049:e4.47.two-wires-outside","phy2049:e4.47.ampere-enclosed","phy2049:e4.47.toroid","phy2049:e4.47.nonuniform-J","phy2049:e4.47.mri"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 2, §12.5 Ampère’s law","url":"https://openstax.org/books/university-physics-volume-2/pages/12-5-amperes-law","why":"Inside and outside a thick wire, the case the lab draws.","level":"Intro"},{"title":"MIT 8.02, Problem-solving guide: Ampère’s law","url":"https://ocw.mit.edu/courses/8-02-physics-ii-electricity-and-magnetism-spring-2007/resources/solving05/","why":"How to choose the Amperian loop, then solved cases.","level":"Course level"}]},{"id":"angular-momentum","title":"Angular momentum and impulse","subject":"mechanics","courses":["egn3321","phy2048"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>𝐇\u003c/mi>\u003cmi>G\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmi>G\u003c/mi>\u003c/msub>\u003cmtext> \u003c/mtext>\u003cmi mathvariant=\"bold-italic\">ω\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>𝐇\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmo>∫\u003c/mo>\u003cmo>∑\u003c/mo>\u003cmi>𝐌\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>t\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>𝐇\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Angular momentum is to turning what momentum is to moving. Angular impulse changes it, and with no outside moment about a point it stays fixed: pull mass inward and the spin speeds up. In an off-centre impact, take moments about the contact point and the unknown contact force drops out. That is how a bat's sweet spot is found.","requires":["impulse-momentum","rigid-kinetics"],"labs":[{"course":"egn3321","title":"Spin","href":"https://flux-study.pages.dev/egn3321/#/egn3321/u8/spin","notes":"https://flux-study.pages.dev/egn3321/#/egn3321/u8/spin?n=s3","note":"A spinning body pulling its mass in: angular momentum kept, spin rate up."},{"course":"egn3321","title":"Strike","href":"https://flux-study.pages.dev/egn3321/#/egn3321/u8/strike","notes":"https://flux-study.pages.dev/egn3321/#/egn3321/u8/strike?n=s4","note":"An eccentric impact on a rigid body, with moments about the contact."},{"course":"egn3321","title":"Bat","href":"https://flux-study.pages.dev/egn3321/#/egn3321/u8/bat","notes":"https://flux-study.pages.dev/egn3321/#/egn3321/u8/bat?n=s5","note":"A baseball bat’s sweet spot, where the hands feel no sting."},{"course":"phy2048","title":"Angular momentum of a particle","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u7/particle-l","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u7/particle-l?n=s4","note":"A particle’s angular momentum depends on the origin, and stays fixed on a straight line."},{"course":"phy2048","title":"Spinning stool","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u7/spinner","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u7/spinner?n=s5","note":"A spinning stool: pull the weights in and spin faster."},{"course":"phy2048","title":"Gyroscope","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u7/gyro","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u7/gyro?n=s7","note":"A gyroscope precessing slower as it spins faster."}],"problems":["egn3321:u8.19.spin","egn3321:u8.19.spin-ask","egn3321:u8.19.ballistic-bar","egn3321:u8.19.strike","egn3321:u8.19.percussion","egn3321:u8.19.free-bar","egn3321:u8.19.impact-ask","egn3321:u8.19.embed-sym","egn3321:u8.19.bat","egn3321:u8.19.sweet-ask","phy2048:ch11.meteor","phy2048:ch11.concept-origin","phy2048:ch11.arm","phy2048:ch11.fly","phy2048:ch11.tuck","phy2048:ch11.concept-conserve","phy2048:ch11.concept-energy","phy2048:ch11.precess"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 1, §11.3 Conservation of angular momentum","url":"https://openstax.org/books/university-physics-volume-1/pages/11-3-conservation-of-angular-momentum","why":"Skaters, stars and collisions, all one rule.","level":"Intro"},{"title":"MIT 2.003SC, Angular momentum and motion of rotating rigid bodies","url":"https://ocw.mit.edu/courses/2-003sc-engineering-dynamics-fall-2011/pages/angular-momentum-and-motion-of-rotating-rigid-bodies/","why":"The rigid-body form, with the inertia tensor where it matters.","level":"Deeper"}]},{"id":"arc-length","title":"Arc length and surface area","subject":"calculus","courses":["mac2311"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>L\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsubsup>\u003cmo>∫\u003c/mo>\u003cmi>a\u003c/mi>\u003cmi>b\u003c/mi>\u003c/msubsup>\u003cmsqrt>\u003cmrow>\u003cmn>1\u003c/mn>\u003cmo>+\u003c/mo>\u003cmsup>\u003cmi>f\u003c/mi>\u003cmo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′\u003c/mo>\u003c/msup>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmsup>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/msqrt>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A short piece of curve is nearly straight, with length \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsqrt>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmsup>\u003cmi>x\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>+\u003c/mo>\u003cmi>d\u003c/mi>\u003cmsup>\u003cmi>y\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/msqrt>\u003c/mrow>\u003c/math>\u003c/span>. Adding the pieces gives the arc length, which is always at least the chord. Inscribed polygons fall short and close in as the pieces shrink. A surface of revolution adds each piece's circumference times its length.","requires":["fundamental-theorem"],"labs":[{"course":"mac2311","title":"Arc length","href":"https://flux-study.pages.dev/mac2311/#/mac2311/c4/arc","notes":"https://flux-study.pages.dev/mac2311/#/mac2311/c4/arc?n=s5","note":"Move the end of a curve: its length stays above the chord unless the curve is a line."},{"course":"mac2311","title":"Bridge cable","href":"https://flux-study.pages.dev/mac2311/#/mac2311/c4/bridge","notes":null,"note":"A suspension cable: doubling the sag does not double the length, and polygons fall short."}],"problems":[],"candidate":null,"sources":[{"title":"OpenStax Calculus Vol. 1, §6.4 Arc length of a curve and surface area","url":"https://openstax.org/books/calculus-volume-1/pages/6-4-arc-length-of-a-curve-and-surface-area","why":"The formula from the Pythagorean theorem on one small piece.","level":"Intro"},{"title":"MIT 18.01SC, Part B: Partial fractions, integration by parts, arc length, and surface area","url":"https://ocw.mit.edu/courses/18-01sc-single-variable-calculus-fall-2010/pages/unit-4-techniques-of-integration/part-b-partial-fractions-integration-by-parts-arc-length-and-surface-area/","why":"Arc length and surface area with full solutions.","level":"Course level"}]},{"id":"atomic-bonding","title":"Atomic bonding and the bond-energy curve","subject":"matsci","courses":["ema3010"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>U\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>r\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmo>−\u003c/mo>\u003cmfrac>\u003cmi>A\u003c/mi>\u003cmsup>\u003cmi>r\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msup>\u003c/mfrac>\u003cmo>+\u003c/mo>\u003cmfrac>\u003cmi>B\u003c/mi>\u003cmsup>\u003cmi>r\u003c/mi>\u003cmi>m\u003c/mi>\u003c/msup>\u003c/mfrac>\u003cmtext> \u003c/mtext>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>m\u003c/mi>\u003cmo>&gt;\u003c/mo>\u003cmi>n\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>F\u003c/mi>\u003cmo>=\u003c/mo>\u003cmo>−\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>U\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>E\u003c/mi>\u003cmo>∝\u003c/mo>\u003cmsub>\u003cmrow>\u003cmfrac>\u003cmrow>\u003cmsup>\u003cmi>d\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmi>U\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmsup>\u003cmi>r\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/mfrac>\u003cmo fence=\"true\">∣\u003c/mo>\u003c/mrow>\u003cmsub>\u003cmi>r\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Two atoms attract at long range and repel when their electron clouds overlap, so their energy has a well. The bottom of the well is the bond length, where the force is zero. The well's depth is the energy to pull the atoms apart, which is why strong bonds melt hot. Its curvature at the bottom is the spring constant of the bond, which is why stiffness follows curvature, not depth. Ionic, covalent and metallic bonds make deep wells; the weak secondary bonds between molecules make shallow ones.","requires":["coulombs-law","energy-conservation"],"labs":[],"problems":[],"candidate":"Drag two atoms along their energy curve and change its depth and curvature apart. It corrects the idea that a deeper well makes a stiffer solid: stiffness follows the curvature.","sources":[{"title":"OpenStax Chemistry 2e, §7.5 Strengths of ionic and covalent bonds","url":"https://openstax.org/books/chemistry-2e/pages/7-5-strengths-of-ionic-and-covalent-bonds","why":"Bond energies and lattice energy, with the numbers that set melting points.","level":"Intro"},{"title":"MIT 3.091, Recitation 11: Molecular orbital theory and intermolecular forces","url":"https://ocw.mit.edu/courses/3-091-introduction-to-solid-state-chemistry-fall-2018/resources/mit3_091f18_rec11/","why":"Primary bonds against the secondary forces that hold molecules and polymer chains together.","level":"Course level"}]},{"id":"axial-deformation","title":"Axial deformation and indeterminate bars","subject":"materials","courses":["egn3331"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>δ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmo>∑\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>N\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>L\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>σ\u003c/mi>\u003cmtext>thermal\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmi>E\u003c/mi>\u003cmi>α\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmi>T\u003c/mi>\u003cmtext> (fully restrained)\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A bar stretches by \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>N\u003c/mi>\u003cmi>L\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>A\u003c/mi>\u003cmi>E\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> piece by piece, so its internal-force diagram, not the end load alone, sets how far it moves. When supports outnumber the equilibrium equations, the bar is indeterminate, and compatibility supplies the missing equation: the parts must fit together. Held between walls, the stiffer side takes more load, and a heated rail builds stress \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>E\u003c/mi>\u003cmi>α\u003c/mi>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmi>T\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> whatever its length.","requires":["stress-strain","stress-on-a-section"],"labs":[{"course":"egn3331","title":"Axial bar","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u3/axial","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u3/axial?n=s1","note":"Stepped and tapered bars: the displacement as a running sum of NL/AE."},{"course":"egn3331","title":"Indeterminate bar","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u3/indeterminate","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u3/indeterminate?n=s4","note":"A bar between two walls shares a load in proportion to stiffness."},{"course":"egn3331","title":"Welded rail","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u3/rail","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u3/rail?n=s6","note":"A welded rail stressed by heat, and a joint gap that must close first."},{"course":"egn3331","title":"Hoist bridle","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u3/bridle","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u3/bridle?n=s3","note":"A hoist bridle as a truss joint: the hook moves where every leg’s stretch agrees."}],"problems":["egn3331:u3.4.uniform","egn3331:u3.4.stepped","egn3331:u3.4.taper","egn3331:u3.4.walls","egn3331:u3.4.short-side","egn3331:u3.4.thermal","egn3331:u3.4.gap","egn3331:u3.4.rail-english","egn3331:u3.4.sign","egn3331:u3.4.length","egn3331:u3.4.joint","egn3331:u3.4.three-bar"],"candidate":null,"sources":[{"title":"MIT 2.001, Lecture 7: Force-deformation relationships and static indeterminacy","url":"https://ocw.mit.edu/courses/2-001-mechanics-materials-i-fall-2006/resources/lec7/","why":"Compatibility as the third ingredient beside equilibrium and material law.","level":"Course level"},{"title":"MIT 2.001, Lecture 14: Stress-strain-temperature relationships and thin-walled pressure vessels","url":"https://ocw.mit.edu/courses/2-001-mechanics-materials-i-fall-2006/resources/lec14/","why":"Thermal strain added to the force-deformation relation.","level":"Course level"}]},{"id":"beam-deflection","title":"Beam deflection","subject":"materials","courses":["egn3331"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>E\u003c/mi>\u003cmi>I\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmfrac>\u003cmrow>\u003cmsup>\u003cmi>d\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmi>v\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmsup>\u003cmi>x\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmi>M\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Curvature is moment over stiffness, so integrating the moment twice gives the beam's shape, with the supports fixing the constants. The beam is lowest where its slope is zero, which is not where the moment peaks under an off-centre load. Deflections from separate loads add. A redundant support is found from compatibility: it must hold the beam at zero deflection there.","requires":["bending-stress","definite-integral"],"labs":[{"course":"egn3331","title":"Elastic curve","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u8/curve","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u8/curve?n=s1","note":"The elastic curve from integrating the moment, and where the beam is lowest."},{"course":"egn3331","title":"Propped cantilever","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u8/propped","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u8/propped?n=s6","note":"A propped cantilever: the prop is set by compatibility."},{"course":"egn3331","title":"Pine shelf","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u8/shelf","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u8/shelf?n=s8","note":"A pine shelf sagging over a long span, and the bracket that fixes it."},{"course":"egn3331","title":"Car on a bridge","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u8/crossing","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u8/crossing?n=s4","note":"A car on two stringers: deflections add, and fixed ends cut the sag."}],"problems":["egn3331:u8.12.tip","egn3331:u8.12.uniform","egn3331:u8.12.offset","egn3331:u8.12.allow","egn3331:u8.12.where","egn3331:u8.12.stiff","egn3331:u8.12.two-loads","egn3331:u8.12.superpose","egn3331:u8.12.can-add","egn3331:u8.12.prop","egn3331:u8.12.held","egn3331:u8.12.prop-point","egn3331:u8.12.shelf","egn3331:u8.12.fixed"],"candidate":null,"sources":[{"title":"MIT 2.001, Lecture 20: Beam deflection","url":"https://ocw.mit.edu/courses/2-001-mechanics-materials-i-fall-2006/resources/lec20/","why":"Integrating the moment-curvature equation with boundary conditions.","level":"Course level"},{"title":"MIT 2.001, Lecture 21: Symmetry, superposition, and statically indeterminate beams","url":"https://ocw.mit.edu/courses/2-001-mechanics-materials-i-fall-2006/resources/lec21/","why":"Superposition and redundant supports.","level":"Course level"}]},{"id":"bending-stress","title":"Bending stress","subject":"materials","courses":["egn3331"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>σ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmo>−\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>M\u003c/mi>\u003cmi>y\u003c/mi>\u003c/mrow>\u003cmi>I\u003c/mi>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmi>ρ\u003c/mi>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>M\u003c/mi>\u003cmrow>\u003cmi>E\u003c/mi>\u003cmi>I\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A bent beam's fibres stretch on one side and shorten on the other, in proportion to their distance from the neutral axis, which passes through the centroid. Stress follows the same line, \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>M\u003c/mi>\u003cmi>y\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>I\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. A deeper section has a much larger \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>I\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>, so a deeper beam carries the same moment at much lower stress. Two materials bolted together share the moment by stiffness, and a beam turned off its principal axes bends sideways too.","requires":["internal-loads","centroids","stress-strain"],"labs":[{"course":"egn3331","title":"Bending stress","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u6/flexure","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u6/flexure?n=s5","note":"Bending stress on rectangles and T sections, with the neutral axis at the centroid."},{"course":"egn3331","title":"Floor joist","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u6/joist","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u6/joist?n=s7","note":"A floor joist on its dressed size: stress grows with the span squared."},{"course":"egn3331","title":"Flitch beam","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u6/flitch","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u6/flitch?n=s9","note":"A steel plate between two 2×10s takes most of the moment."},{"course":"egn3331","title":"Roof purlin","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u6/purlin","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u6/purlin?n=s8","note":"A roof purlin off its principal axes bends sideways too."},{"course":"egn3331","title":"Band-saw blade","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u6/bandsaw","notes":null,"note":"A band-saw blade bent round its wheels: curvature fixes the stress."}],"problems":["egn3331:u6.6.rect","egn3331:u6.6.tee","egn3331:u6.6.fiber","egn3331:u6.6.axis","egn3331:u6.6.bandsaw","egn3331:u6.6.tilted","egn3331:u6.6.composite","egn3331:u6.6.joist"],"candidate":null,"sources":[{"title":"MIT 2.001, Lecture 18: Pure bending","url":"https://ocw.mit.edu/courses/2-001-mechanics-materials-i-fall-2006/resources/lec18/","why":"Plane sections, the neutral axis and the flexure formula.","level":"Course level"},{"title":"MIT 2.001, Lecture 19: Moment-curvature relationship","url":"https://ocw.mit.edu/courses/2-001-mechanics-materials-i-fall-2006/resources/lec19/","why":"Curvature from moment, the start of deflection.","level":"Course level"}]},{"id":"bernoulli","title":"Bernoulli’s equation","subject":"fluids","courses":["phy2048","eml3015"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>p\u003c/mi>\u003cmo>+\u003c/mo>\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmn>2\u003c/mn>\u003c/mfrac>\u003c/mstyle>\u003cmi>ρ\u003c/mi>\u003cmsup>\u003cmi>v\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>+\u003c/mo>\u003cmi>ρ\u003c/mi>\u003cmi>g\u003c/mi>\u003cmi>h\u003c/mi>\u003cmo>=\u003c/mo>\u003cmtext>const\u003c/mtext>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span>","idea":"For steady flow of an incompressible fluid without friction, energy per unit volume is conserved along a streamline. Where a pipe narrows, continuity speeds the flow and Bernoulli lowers the pressure. A tank drains at Torricelli's \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsqrt>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>g\u003c/mi>\u003cmi>h\u003c/mi>\u003c/mrow>\u003c/msqrt>\u003c/mrow>\u003c/math>\u003c/span>. Real fluids have viscosity, and fast flow turns turbulent, so these are the ideal limits.","requires":["pressure","energy-conservation","mass-cv"],"labs":[{"course":"phy2048","title":"Bernoulli","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u10/bernoulli","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u10/bernoulli?n=s5","note":"A narrowing pipe and a draining tank: speed up, pressure down, Torricelli’s law."},{"course":"phy2048","title":"Fire hose","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u10/fire-hose","notes":null,"note":"The pressure a fire hose needs to reach a nozzle and throw water up."}],"problems":["phy2048:ch14.nozzle","phy2048:ch14.hose-p","phy2048:ch14.tank","phy2048:ch14.concept-narrow","phy2048:ch14.fire"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 1, §14.6 Bernoulli’s equation","url":"https://openstax.org/books/university-physics-volume-1/pages/14-6-bernoullis-equation","why":"The equation from the work-energy theorem on a fluid parcel.","level":"Intro"},{"title":"MIT 2.06, Lecture 5 notes: Control volume formulation","url":"https://ocw.mit.edu/courses/2-06-fluid-dynamics-spring-2013/resources/mit2_06s13_notes_lens/","why":"Where Bernoulli sits in the general control-volume picture.","level":"Deeper"}]},{"id":"biot-savart","title":"Biot–Savart law","subject":"em","courses":["phy2049"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>𝐁\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>μ\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmrow>\u003cmn>4\u003c/mn>\u003cmi>π\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmtext> \u003c/mtext>\u003cmfrac>\u003cmrow>\u003cmi>I\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>𝐥\u003c/mi>\u003cmo>×\u003c/mo>\u003cmover accent=\"true\">\u003cmi>𝐫\u003c/mi>\u003cmo>^\u003c/mo>\u003c/mover>\u003c/mrow>\u003cmsup>\u003cmi>r\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Current makes magnetic field. Each short piece of wire adds a bit of field that circles the wire, falling as \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmn>1\u003c/mn>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmsup>\u003cmi>r\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span>, and the whole field is the integral over the circuit. It is the same add-up-the-pieces method as a continuous charge, with a cross product in place of a plain direction. Two parallel currents attract because each sits in the other's field.","requires":["magnetic-force","continuous-charge"],"labs":[{"course":"phy2049","title":"Biot–Savart","href":"https://flux-study.pages.dev/phy2049/#/phy2049/e4/biot","notes":"https://flux-study.pages.dev/phy2049/#/phy2049/e4/biot?n=s12","note":"Wires, loops, arcs and solenoids, each with its field at P from the integral."},{"course":"phy2049","title":"Mag force","href":"https://flux-study.pages.dev/phy2049/#/phy2049/e4/magforce","notes":"https://flux-study.pages.dev/phy2049/#/phy2049/e4/magforce?n=s13","note":"Two parallel wires, each in the field of the other."},{"course":"phy2049","title":"Railgun","href":"https://flux-study.pages.dev/phy2049/#/phy2049/e4/railgun","notes":null,"note":"A railgun: the rails make the field, and the armature carries the current across it."}],"problems":["phy2049:e4.45.magnets","phy2049:e4.45.sources-materials","phy2049:e4.47.long-wire","phy2049:e4.47.rhr-wire","phy2049:e4.47.loop","phy2049:e4.47.solenoid","phy2049:e4.47.field-pictures","phy2049:e4.47.wire-and-loop","phy2049:e4.47.solenoid-core","phy2049:e4.47.half-loop","phy2049:e4.47.wire-setup","phy2049:e4.47.square-loop","phy2049:e4.47.quarter-loop","phy2049:e4.47.hairpin","phy2049:e4.47.sector","phy2049:e4.47.loop-cancels-wire","phy2049:e4.47.two-semicircles","phy2049:e4.46.force-mag","phy2049:e4.46.rhr","phy2049:e4.46.circle","phy2049:e4.46.selector","phy2049:e4.46.wire-force","phy2049:e4.46.spectrometer","phy2049:e4.46.torque","phy2049:e4.46.what-B-does","phy2049:e4.46.page-rhr","phy2049:e4.46.track-sign","phy2049:e4.46.force-direction","phy2049:e4.46.qvB-solve","phy2049:e4.46.charge-from-orbit","phy2049:e4.46.coil-sides","phy2049:e4.46.spectrometer-mass","phy2049:e4.46.undeflected","phy2049:e4.47.parallel-wires","phy2049:e4.46.orbit-solve","phy2049:e4.47.railgun"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 2, §12.1 The Biot–Savart law","url":"https://openstax.org/books/university-physics-volume-2/pages/12-1-the-biot-savart-law","why":"The law, then a straight segment and a loop worked through.","level":"Intro"},{"title":"OpenStax University Physics Vol. 2, §12.3 Magnetic force between two parallel currents","url":"https://openstax.org/books/university-physics-volume-2/pages/12-3-magnetic-force-between-two-parallel-currents","why":"Field from one wire, force on the other, and the old definition of the ampere.","level":"Intro"}]},{"id":"boiling-condensation","title":"Boiling and condensation","subject":"heat","courses":["eml4140"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsup>\u003cmi>q\u003c/mi>\u003cmrow>\u003cmo mathvariant=\"normal\">′\u003c/mo>\u003cmo mathvariant=\"normal\">′\u003c/mo>\u003c/mrow>\u003c/msup>\u003cmo>=\u003c/mo>\u003cmi>h\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmi>s\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmtext>sat\u003c/mtext>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmover accent=\"true\">\u003cmi>h\u003c/mi>\u003cmo stretchy=\"true\">‾\u003c/mo>\u003c/mover>\u003cmtext>film\u003c/mtext>\u003c/msub>\u003cmo>∝\u003c/mo>\u003cmsup>\u003cmrow>\u003cmo fence=\"true\">[\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>g\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmsub>\u003cmi>ρ\u003c/mi>\u003cmi>l\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsub>\u003cmi>ρ\u003c/mi>\u003cmi>l\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>ρ\u003c/mi>\u003cmi>v\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmrow>\u003cmi>f\u003c/mi>\u003cmi>g\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmtext> \u003c/mtext>\u003cmsubsup>\u003cmi>k\u003c/mi>\u003cmi>l\u003c/mi>\u003cmn>3\u003c/mn>\u003c/msubsup>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmi>μ\u003c/mi>\u003cmi>l\u003c/mi>\u003c/msub>\u003cmtext> \u003c/mtext>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmtext>sat\u003c/mtext>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmi>s\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmi>L\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo fence=\"true\">]\u003c/mo>\u003c/mrow>\u003cmrow>\u003cmn>1\u003c/mn>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmn>4\u003c/mn>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span>","idea":"When a fluid changes phase at a surface, the latent heat carries far more energy than warming does, so \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>h\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> can be hundreds of times larger. A film of condensate on a cold wall is the main resistance, and Nusselt's analysis treats it as a thin falling layer. In boiling, bubbles stir the liquid at the wall and the heat flux climbs steeply with wall superheat. At a critical flux a vapour blanket forms, the flux drops, and an electrically heated wire can melt.","requires":["convection","phases"],"labs":[],"problems":[],"candidate":"Walk up the boiling curve of water by raising the wall temperature. It corrects the idea that a hotter wall always boils faster: past the critical flux a vapour film insulates it and the flux falls.","sources":[{"title":"Lienhard, A Heat Transfer Textbook","url":"https://ahtt.mit.edu","why":"Chapter 9 covers film condensation, the boiling curve and the burnout flux.","level":"Course level"},{"title":"MIT 2.51, calendar: Condensation (session 18)","url":"https://ocw.mit.edu/courses/2-51-intermediate-heat-and-mass-transfer-fall-2008/pages/calendar/","why":"The course’s session on phase change at a wall.","level":"Deeper"}]},{"id":"boundary-layer","title":"Boundary layers","subject":"fluids","courses":["eml3015"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmfrac>\u003cmi>δ\u003c/mi>\u003cmi>x\u003c/mi>\u003c/mfrac>\u003cmo>≈\u003c/mo>\u003cmfrac>\u003cmn>5.0\u003c/mn>\u003cmsqrt>\u003cmsub>\u003cmtext>Re\u003c/mtext>\u003cmi>x\u003c/mi>\u003c/msub>\u003c/msqrt>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>c\u003c/mi>\u003cmi>f\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmn>0.664\u003c/mn>\u003cmsqrt>\u003cmsub>\u003cmtext>Re\u003c/mtext>\u003cmi>x\u003c/mi>\u003c/msub>\u003c/msqrt>\u003c/mfrac>\u003cmtext> (laminar)\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/span>","idea":"At high Reynolds number, viscosity matters only in a thin layer next to a surface, where the no-slip condition drags the flow to rest. Outside it the flow is close to inviscid. Momentum diffuses out from the wall over a distance of about \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsqrt>\u003cmrow>\u003cmi>ν\u003c/mi>\u003cmi>x\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>V\u003c/mi>\u003c/mrow>\u003c/msqrt>\u003c/mrow>\u003c/math>\u003c/span>, so the layer thickens as the square root of distance. Wall friction falls along the plate as the layer thickens. Downstream the layer turns turbulent and grows faster; against a rising pressure it can separate.","requires":["navier-stokes","dimensional-analysis"],"labs":[],"problems":[],"candidate":"Draw velocity profiles along a flat plate with a slider for the free-stream speed. It corrects the idea that the layer grows in step with distance: a laminar layer grows as \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsqrt>\u003cmi>x\u003c/mi>\u003c/msqrt>\u003c/mrow>\u003c/math>\u003c/span>, and faster flow makes it thinner.","sources":[{"title":"Lienhard, A Heat Transfer Textbook","url":"https://ahtt.mit.edu","why":"Chapter 6 builds the velocity boundary layer before the thermal one, with the Blasius result.","level":"Course level"},{"title":"Cleynen, Fluid Dynamics for Engineers","url":"https://fluidmech.ninja/","why":"Laminar and turbulent layers on a plate, transition and separation.","level":"Course level"}]},{"id":"boundary-work","title":"Boundary work","subject":"thermo","courses":["eml3100"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi>b\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsubsup>\u003cmo>∫\u003c/mo>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/msubsup>\u003cmi>p\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>V\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>p\u003c/mi>\u003cmsup>\u003cmi>V\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msup>\u003cmo>=\u003c/mo>\u003cmtext>const (polytropic)\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A gas that pushes a piston out does work equal to the area under its path on a \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>p\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>–\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>V\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> diagram. The same two end states can be joined by different paths, and each gives a different work. That is why work is not a property. A polytropic path, \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>p\u003c/mi>\u003cmsup>\u003cmi>V\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span> constant, covers constant pressure, constant temperature and adiabatic cases with one exponent.","requires":["pressure","definite-integral"],"labs":[{"course":"eml3100","title":"Boundary work","href":"https://flux-study.pages.dev/eml3100/#/eml3100/u2/piston","notes":"https://flux-study.pages.dev/eml3100/#/eml3100/u2/piston?n=s2","note":"A piston path drawn on a \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>p\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>–\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>V\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> diagram, with the work as the area under it."}],"problems":["eml3100:u2.4.work-isobaric","eml3100:u2.4.work-isothermal","eml3100:u2.4.work-polytropic","eml3100:u2.4.steam-piston","eml3100:u2.4.sign","eml3100:u2.4.exponent"],"candidate":null,"sources":[{"title":"Yan, Introduction to Engineering Thermodynamics, §4.3 Work","url":"https://pressbooks.bccampus.ca/thermo1/","why":"The course’s own book: boundary and polytropic work.","level":"Course level"},{"title":"OpenStax University Physics Vol. 2, §3.4 Thermodynamic processes","url":"https://openstax.org/books/university-physics-volume-2/pages/3-4-thermodynamic-processes","why":"Isobaric, isothermal and adiabatic paths on one diagram.","level":"Intro"}]},{"id":"brayton-cycle","title":"The Brayton cycle","subject":"thermo","courses":["eml3100","eml3101"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>η\u003c/mi>\u003cmtext>Brayton\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>−\u003c/mo>\u003cmsubsup>\u003cmi>r\u003c/mi>\u003cmi>p\u003c/mi>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>k\u003c/mi>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>k\u003c/mi>\u003c/mrow>\u003c/msubsup>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A gas turbine compresses air, burns fuel at constant pressure, expands the hot gas through a turbine and exhausts it. With cold-air assumptions its efficiency depends only on the pressure ratio. It rises as the ratio rises, but stays below the Carnot limit between the coldest and hottest temperatures in the cycle.","requires":["carnot-limit","energy-cv"],"labs":[{"course":"eml3100","title":"Carnot and Brayton","href":"https://flux-study.pages.dev/eml3100/#/eml3100/u4/carnot","notes":"https://flux-study.pages.dev/eml3100/#/eml3100/u4/carnot?n=s5","note":"Brayton efficiency against pressure ratio, under the Carnot curve."}],"problems":["eml3100:u4.6.carnot","eml3100:u4.6.heat-pump","eml3100:u4.6.brayton","eml3100:u4.6.cycle","eml3100:u4.6.english","eml3100:u4.6.device","eml3100:u4.6.which-cop"],"candidate":null,"sources":[{"title":"Cleynen, Engineering Thermodynamics","url":"https://thermodynamicsbook.com/","why":"Gas-turbine cycles with worked examples, past where Yan stops.","level":"Course level"},{"title":"MIT 16.050 Thermal Energy, calendar: Gas power and propulsion cycles","url":"https://ocw.mit.edu/courses/16-050-thermal-energy-fall-2002/pages/calendar/","why":"Brayton and its jet-engine variants, from an aerospace course.","level":"Deeper"}]},{"id":"breadboard-circuits","title":"Breadboards and circuit diagrams","subject":"circuits","courses":["bench"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtext>one strip\u003c/mtext>\u003cmo>=\u003c/mo>\u003cmtext>one node\u003c/mtext>\u003cmo>:\u003c/mo>\u003cmspace width=\"1em\"/>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>hole\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>strip\u003c/mtext>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A breadboard hides metal strips under its holes, and every hole on one strip is the same node. Building from a schematic means giving each node its own strip. A part with both legs on one strip is shorted out; a stray jumper across a part bypasses it; a power rail split in the middle leaves its far half dead.","requires":["current-resistance"],"labs":[{"course":"bench","title":"Breadboard","href":"https://flux-study.pages.dev/bench/#/bench/u1/breadboard","notes":"https://flux-study.pages.dev/bench/#/bench/u1/breadboard?n=s1","note":"Holes coloured by their strip’s voltage: right placement, a turned part, a stray jumper and a split rail."}],"problems":["bench:u1.series","bench:u1.jumper","bench:u1.concept-strips"],"candidate":null,"sources":[{"title":"Kuphaldt, Lessons in Electric Circuits","url":"https://www.ibiblio.org/kuphaldt/electricCircuits/","why":"The free text the Bench course cites; its early chapters build circuits from parts.","level":"Intro"},{"title":"OpenStax University Physics Vol. 2, §10.2 Resistors in series and parallel","url":"https://openstax.org/books/university-physics-volume-2/pages/10-2-resistors-in-series-and-parallel","why":"Series and parallel, the two layouts a breadboard makes easy to get wrong.","level":"Intro"}]},{"id":"buckling","title":"Buckling of columns","subject":"materials","courses":["egn3331"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>P\u003c/mi>\u003cmtext>cr\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsup>\u003cmi>π\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmi>E\u003c/mi>\u003cmi>I\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>K\u003c/mi>\u003cmi>L\u003c/mi>\u003cmsup>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>σ\u003c/mi>\u003cmtext>max\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>P\u003c/mi>\u003cmi>A\u003c/mi>\u003c/mfrac>\u003cmrow>\u003cmo fence=\"true\">[\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>+\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>e\u003c/mi>\u003cmi>c\u003c/mi>\u003c/mrow>\u003cmsup>\u003cmi>r\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mfrac>\u003cmi>sec\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmrow>\u003cmo fence=\"true\">(\u003c/mo>\u003cmfrac>\u003cmi>L\u003c/mi>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmsqrt>\u003cmfrac>\u003cmi>P\u003c/mi>\u003cmrow>\u003cmi>E\u003c/mi>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/msqrt>\u003cmo fence=\"true\">)\u003c/mo>\u003c/mrow>\u003cmo fence=\"true\">]\u003c/mo>\u003c/mrow>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A slender column under compression can bow sideways at a load far below its crushing strength. Euler's load falls with the square of the effective length and follows the weak axis. Once that load would push the stress past yield, yielding governs instead. Real columns fail sooner still: a load off the axis bends them from the start, which the secant formula measures.","requires":["beam-deflection"],"labs":[{"course":"egn3331","title":"Buckling","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u11/buckling","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u11/buckling?n=s1","note":"Euler’s load against effective length, the weak axis and yield."},{"course":"egn3331","title":"Steel column","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u11/column","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u11/column?n=s3","note":"A listed basement column checked at its Euler load and its allowable."},{"course":"egn3331","title":"Real columns","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u11/posts","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u11/posts?n=s4","note":"Deck posts loaded off centre: the secant formula and the tangent modulus."}],"problems":["egn3331:u11.13.euler","egn3331:u11.13.ends","egn3331:u11.13.weak","egn3331:u11.13.transition","egn3331:u11.13.length","egn3331:u11.13.axis","egn3331:u11.13.support","egn3331:u11.13.secant","egn3331:u11.13.column","egn3331:u11.13.tangent"],"candidate":null,"sources":[{"title":"Euler’s critical load (Wikipedia)","url":"https://en.wikipedia.org/wiki/Euler%27s_critical_load","why":"The derivation and the effective-length factors in one place.","level":"Course level"},{"title":"MIT 2.001, Lecture 20: Beam deflection","url":"https://ocw.mit.edu/courses/2-001-mechanics-materials-i-fall-2006/resources/lec20/","why":"The elastic-curve equation that buckling solves as an eigenvalue problem.","level":"Course level"}]},{"id":"buoyancy","title":"Buoyancy","subject":"fluids","courses":["phy2048","eml3015"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmi>B\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>ρ\u003c/mi>\u003cmtext>fluid\u003c/mtext>\u003c/msub>\u003cmtext> \u003c/mtext>\u003cmi>g\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>sub\u003c/mtext>\u003c/msub>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmfrac>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>sub\u003c/mtext>\u003c/msub>\u003cmi>V\u003c/mi>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>ρ\u003c/mi>\u003cmtext>body\u003c/mtext>\u003c/msub>\u003cmsub>\u003cmi>ρ\u003c/mi>\u003cmtext>fluid\u003c/mtext>\u003c/msub>\u003c/mfrac>\u003cmtext> (floating)\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Pressure rises with depth, so a submerged body is pushed up harder from below than down from above. The net push equals the weight of the fluid it displaces. A floating body sinks until it displaces its own weight, so the fraction under water is the ratio of the densities.","requires":["pressure"],"labs":[{"course":"phy2048","title":"Buoyancy","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u10/buoyancy","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u10/buoyancy?n=s4","note":"The buoyant force as displaced weight, and how deep a floating body sits."}],"problems":["phy2048:ch14.woman","phy2048:ch14.apparent","phy2048:ch14.concept-float"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 1, §14.4 Archimedes’ principle and buoyancy","url":"https://openstax.org/books/university-physics-volume-1/pages/14-4-archimedes-principle-and-buoyancy","why":"Archimedes from pressure differences, then floating and density.","level":"Intro"},{"title":"PhET: Buoyancy","url":"https://phet.colorado.edu/en/simulations/buoyancy","why":"Change the block and fluid densities and watch the waterline.","level":"Intro"}]},{"id":"capacitance","title":"Capacitance","subject":"em","courses":["phy2049","eel3111"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>C\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>Q\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmi>V\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>C\u003c/mi>\u003cmtext>plates\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>ε\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmi>A\u003c/mi>\u003c/mrow>\u003cmi>d\u003c/mi>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>U\u003c/mi>\u003cmo>=\u003c/mo>\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmn>2\u003c/mn>\u003c/mfrac>\u003c/mstyle>\u003cmi>C\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmsup>\u003cmi>V\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Two conductors holding equal and opposite charge make a capacitor. The charge it holds per volt depends only on its shape: for parallel plates, more area and a smaller gap give more. Charging it stores energy in the field between the plates, \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmn>2\u003c/mn>\u003c/mfrac>\u003c/mstyle>\u003cmsub>\u003cmi>ε\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmsup>\u003cmi>E\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span> per unit volume.","requires":["electric-potential","gauss-law"],"labs":[{"course":"phy2049","title":"Capacitor","href":"https://flux-study.pages.dev/phy2049/#/phy2049/e3/capacitor","notes":"https://flux-study.pages.dev/phy2049/#/phy2049/e3/capacitor?n=s8","note":"Plates you resize and space, with a battery connected or the capacitor isolated."}],"problems":["phy2049:e3.40.parallel-plate","phy2049:e3.40.dielectric-battery","phy2049:e3.40.C-dielectric","phy2049:e3.40.dielectric-isolated","phy2049:e3.40.combo","phy2049:e3.40.energy","phy2049:e3.40.C-for-energy","phy2049:e3.40.scaling","phy2049:e3.40.basics"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 2, §8.1 Capacitors and capacitance","url":"https://openstax.org/books/university-physics-volume-2/pages/8-1-capacitors-and-capacitance","why":"Parallel plate, spherical and cylindrical capacitors, each from Gauss’s law.","level":"Intro"},{"title":"MIT 8.02, Problem-solving guide: Capacitors","url":"https://ocw.mit.edu/courses/8-02-physics-ii-electricity-and-magnetism-spring-2007/resources/solving04/","why":"The four-step method: field, potential difference, then C, then energy.","level":"Course level"}]},{"id":"carnot-limit","title":"The second law and the Carnot limit","subject":"thermo","courses":["eml3100","eml3101"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>η\u003c/mi>\u003cmtext>max\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>−\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmi>L\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmi>H\u003c/mi>\u003c/msub>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmo>∮\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>δ\u003c/mi>\u003cmi>Q\u003c/mi>\u003c/mrow>\u003cmi>T\u003c/mi>\u003c/mfrac>\u003cmo>≤\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003c/math>\u003c/span>","idea":"No engine working between two temperatures beats a reversible one, and every reversible one does exactly as well. Its efficiency depends only on the two temperatures, in kelvin. A claim above the limit is impossible; at the limit, reversible; below it, real. Real air conditioners sit far below theirs.","requires":["heat-engines"],"labs":[{"course":"eml3100","title":"Carnot and Brayton","href":"https://flux-study.pages.dev/eml3100/#/eml3100/u4/carnot","notes":"https://flux-study.pages.dev/eml3100/#/eml3100/u4/carnot?n=s3","note":"The Carnot limit in kelvin, and what a ratio in Celsius gets wrong."},{"course":"eml3100","title":"Possible or not","href":"https://flux-study.pages.dev/eml3100/#/eml3100/u4/claims","notes":"https://flux-study.pages.dev/eml3100/#/eml3100/u4/claims?n=s4","note":"Reversible, irreversible or impossible, by the Clausius sum and by the Carnot limit."},{"course":"eml3100","title":"Air conditioner","href":"https://flux-study.pages.dev/eml3100/#/eml3100/u4/ac","notes":"https://flux-study.pages.dev/eml3100/#/eml3100/u4/ac?n=s6","note":"A real air conditioner’s COP far below the Carnot COP between indoors and out."}],"problems":["eml3100:u4.6.carnot","eml3100:u4.6.heat-pump","eml3100:u4.6.brayton","eml3100:u4.6.cycle","eml3100:u4.6.english","eml3100:u4.6.device","eml3100:u4.6.which-cop","eml3100:u4.6.engine","eml3100:u4.6.fridge","eml3100:u4.6.verdict"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 2, §4.5 The Carnot cycle","url":"https://openstax.org/books/university-physics-volume-2/pages/4-5-the-carnot-cycle","why":"The cycle step by step, and why its efficiency is the limit.","level":"Intro"},{"title":"Yan, Introduction to Engineering Thermodynamics, Ch. 6 Entropy and the second law","url":"https://pressbooks.bccampus.ca/thermo1/","why":"The course’s own book: Kelvin–Planck, Clausius and the Carnot principles.","level":"Course level"}]},{"id":"cauchy-euler","title":"Cauchy–Euler equations and reduction of order","subject":"diffeq","courses":["map2302"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" displ
