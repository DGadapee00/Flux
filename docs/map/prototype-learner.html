loses in\" precise: any tolerance on the output can be met by a tight enough input. A \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmn>0\u003c/mn>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmn>0\u003c/mn>\u003c/mrow>\u003c/math>\u003c/span> form needs algebra or L'Hôpital's rule before the limit shows.","requires":[],"labs":[{"course":"mac2311","title":"Limits","href":"https://flux-study.pages.dev/mac2311/#/mac2311/c1/limits","notes":"https://flux-study.pages.dev/mac2311/#/mac2311/c1/limits?n=s2","note":"Slide \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>a\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> and \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>h\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> and watch both sides close in, with an \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>ε\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> band."}],"problems":[],"candidate":null,"sources":[{"title":"OpenStax Calculus Vol. 1, §2.2 The limit of a function","url":"https://openstax.org/books/calculus-volume-1/pages/2-2-the-limit-of-a-function","why":"One-sided limits and the cases where a limit does not exist.","level":"Intro"},{"title":"MIT 18.01SC, Part A: Definition and basic rules","url":"https://ocw.mit.edu/courses/18-01sc-single-variable-calculus-fall-2010/pages/1.-differentiation/part-a-definition-and-basic-rules/","why":"Limits and continuity as the course sets them up for derivatives.","level":"Course level"}]},{"id":"line-integrals","title":"Line integrals and work","subject":"calculus","courses":["mac2313"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmo>∫\u003c/mo>\u003cmi>C\u003c/mi>\u003c/msub>\u003cmi>𝐅\u003c/mi>\u003cmo>⋅\u003c/mo>\u003cmi>d\u003c/mi>\u003cmi>𝐫\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsubsup>\u003cmo>∫\u003c/mo>\u003cmi>a\u003c/mi>\u003cmi>b\u003c/mi>\u003c/msubsup>\u003cmi>𝐅\u003c/mi>\u003cmo fence=\"false\" stretchy=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">(\u003c/mo>\u003cmi mathvariant=\"bold-italic\">γ\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>t\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo fence=\"false\" stretchy=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">)\u003c/mo>\u003cmo>⋅\u003c/mo>\u003cmsup>\u003cmi mathvariant=\"bold-italic\">γ\u003c/mi>\u003cmo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′\u003c/mo>\u003c/msup>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>t\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Add up the part of a field along a path as you travel it. For a force, that is the work done. Parametrize the path and the line integral becomes an ordinary integral in \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. When the field is a gradient, \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>𝐅\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi mathvariant=\"normal\">∇\u003c/mi>\u003cmi>f\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>, the answer depends only on the endpoints, which is why potential energy and voltage make sense.","requires":["vector-fields","parametric-curves"],"labs":[],"problems":[],"candidate":"A field and a path you drag: the work integral adds up piece by piece, and for a gradient field two paths between the same points give the same total.","sources":[{"title":"OpenStax Calculus Vol. 3, §6.2 Line integrals","url":"https://openstax.org/books/calculus-volume-3/pages/6-2-line-integrals","why":"Scalar and vector line integrals, then work and flux along a curve.","level":"Intro"},{"title":"MIT 18.02SC, Part B: Vector fields and line integrals","url":"https://ocw.mit.edu/courses/18-02sc-multivariable-calculus-fall-2010/pages/3.-double-integrals-and-line-integrals-in-the-plane/part-b-vector-fields-and-line-integrals/","why":"Work, gradient fields and path independence with checked problems.","level":"Course level"}]},{"id":"linear-regression","title":"Least-squares regression","subject":"stats","courses":["sta3032","egn3203"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmover accent=\"true\">\u003cmi>y\u003c/mi>\u003cmo>^\u003c/mo>\u003c/mover>\u003cmo>=\u003c/mo>\u003cmi>a\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>b\u003c/mi>\u003cmi>x\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>b\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmo>∑\u003c/mo>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmover accent=\"true\">\u003cmi>x\u003c/mi>\u003cmo>ˉ\u003c/mo>\u003c/mover>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmover accent=\"true\">\u003cmi>y\u003c/mi>\u003cmo>ˉ\u003c/mo>\u003c/mover>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003cmrow>\u003cmo>∑\u003c/mo>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmover accent=\"true\">\u003cmi>x\u003c/mi>\u003cmo>ˉ\u003c/mo>\u003c/mover>\u003cmsup>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsup>\u003cmi>R\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>=\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>−\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>S\u003c/mi>\u003cmsub>\u003cmi>S\u003c/mi>\u003cmtext>res\u003c/mtext>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmi>S\u003c/mi>\u003cmsub>\u003cmi>S\u003c/mi>\u003cmtext>tot\u003c/mtext>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"The least-squares line makes the sum of squared vertical misses as small as it can be; setting its partial derivatives to zero gives the slope and intercept. \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsup>\u003cmi>R\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span> is the share of the spread in \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>y\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> the line explains. Not every unusual point matters equally: one far out in \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> can swing the line, while one in the middle barely moves it. A curve in the residual plot means a line is the wrong model.","requires":["descriptive-statistics","partial-derivatives","orthogonality-projection"],"labs":[{"course":"sta3032","title":"Regression","href":"https://flux-study.pages.dev/sta3032/#/sta3032/final/explore/reg","notes":null,"note":"Drag points and watch the line, residuals and R²; a point far out in x swings it."}],"problems":[],"candidate":null,"sources":[{"title":"MIT 18.05, Reading 25: Linear regression","url":"https://ocw.mit.edu/courses/18-05-introduction-to-probability-and-statistics-spring-2014/resources/mit18_05s14_reading25/","why":"Least squares derived, with the probabilistic model behind it.","level":"Course level"},{"title":"OpenStax Introductory Statistics 2e, §12.3 The regression equation","url":"https://openstax.org/books/introductory-statistics-2e/pages/12-3-the-regression-equation","why":"Slope, intercept and R² computed by hand.","level":"Intro"}]},{"id":"linear-systems","title":"Linear systems and phase portraits","subject":"diffeq","courses":["map2302"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmover accent=\"true\">\u003cmi>𝐱\u003c/mi>\u003cmo>˙\u003c/mo>\u003c/mover>\u003cmo>=\u003c/mo>\u003cmi>A\u003c/mi>\u003cmi>𝐱\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>𝐱\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>t\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmsup>\u003cmi>e\u003c/mi>\u003cmrow>\u003cmi>A\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/msup>\u003cmsub>\u003cmi>𝐱\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmo>∑\u003c/mo>\u003cmsub>\u003cmi>c\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmsup>\u003cmi>e\u003c/mi>\u003cmrow>\u003cmsub>\u003cmi>λ\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/msup>\u003cmsub>\u003cmi>𝐯\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Any linear equation can be written as a first-order system for a state vector. The eigenvalues of \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> set the rates and the eigenvectors the directions, and together they sort the phase portrait: node, saddle, spiral or centre. A repeated eigenvalue may have only one eigenvector, and then the matrix exponential still gives the answer.","requires":["damped-oscillator","eigenvalues"],"labs":[{"course":"map2302","title":"Linear phase portrait","href":"https://flux-study.pages.dev/map2302/#/map2302/u4/phase-portrait","notes":"https://flux-study.pages.dev/map2302/#/map2302/u4/phase-portrait?n=s4","note":"Linear phase portraits, including repeated roots with one eigenline or many."}],"problems":["map2302:u4.matrix-ivp","map2302:u4.jordan","map2302:u4.saddle-rate"],"candidate":null,"sources":[{"title":"Lebl, Notes on Diffy Qs, §3.5 Two-dimensional systems and their vector fields","url":"https://www.jirka.org/diffyqs/html/sec_twodimaut.html","why":"Every portrait type, from the eigenvalues.","level":"Course level"},{"title":"MIT 18.03SC, Matrix methods: eigenvalues and normal modes","url":"https://ocw.mit.edu/courses/18-03sc-differential-equations-fall-2011/pages/unit-iv-first-order-systems/matrix-methods-eigenvalues-and-normal-modes/","why":"Eigenvalue methods with recitations and problems.","level":"Course level"}]},{"id":"linearization","title":"Equilibria and linearization","subject":"diffeq","courses":["map2302"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmover accent=\"true\">\u003cmi>𝐱\u003c/mi>\u003cmo>˙\u003c/mo>\u003c/mover>\u003cmo>=\u003c/mo>\u003cmi>𝐅\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>𝐱\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"1em\"/>\u003cmi>𝐅\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsup>\u003cmi>𝐱\u003c/mi>\u003cmo>∗\u003c/mo>\u003c/msup>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmn>𝟎\u003c/mn>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>J\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmrow>\u003cmo fence=\"true\">[\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003cmo fence=\"true\">]\u003c/mo>\u003c/mrow>\u003cmsup>\u003cmi>𝐱\u003c/mi>\u003cmo>∗\u003c/mo>\u003c/msup>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Near an equilibrium a nonlinear system looks like its linear part, the Jacobian. When the linear portrait is a node, saddle or spiral, the nonlinear one matches it nearby. A linear centre decides nothing: the nonlinear terms can make it attract or repel. Predator and prey models are the classic case.","requires":["linear-systems","phase-line","partial-derivatives"],"labs":[{"course":"map2302","title":"Linearization limits","href":"https://flux-study.pages.dev/map2302/#/map2302/u4/linearize","notes":"https://flux-study.pages.dev/map2302/#/map2302/u4/linearize?n=s6","note":"The same linear centre with nonlinear attraction and repulsion, and a predator-prey system."}],"problems":["map2302:u4.cubic-radius"],"candidate":null,"sources":[{"title":"Lebl, Notes on Diffy Qs, §8.1 Linearization, critical points, and equilibria","url":"https://www.jirka.org/diffyqs/html/linearization_section.html","why":"The Jacobian test and where it fails.","level":"Course level"},{"title":"MIT 18.03SC, Nonlinear systems","url":"https://ocw.mit.edu/courses/18-03sc-differential-equations-fall-2011/pages/unit-iv-first-order-systems/nonlinear-systems/","why":"Critical points and linearization on video, with problems.","level":"Course level"}]},{"id":"lu-conditioning","title":"LU factorization and conditioning","subject":"numerics","courses":["egn3203"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>P\u003c/mi>\u003cmi>A\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>L\u003c/mi>\u003cmi>U\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>κ\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>A\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmi mathvariant=\"normal\">∥\u003c/mi>\u003cmi>A\u003c/mi>\u003cmi mathvariant=\"normal\">∥\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi mathvariant=\"normal\">∥\u003c/mi>\u003cmsup>\u003cmi>A\u003c/mi>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmi mathvariant=\"normal\">∥\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmfrac>\u003cmrow>\u003cmi mathvariant=\"normal\">∥\u003c/mi>\u003cmi>δ\u003c/mi>\u003cmi>𝐱\u003c/mi>\u003cmi mathvariant=\"normal\">∥\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi mathvariant=\"normal\">∥\u003c/mi>\u003cmi>𝐱\u003c/mi>\u003cmi mathvariant=\"normal\">∥\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo>≤\u003c/mo>\u003cmi>κ\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>A\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmfrac>\u003cmrow>\u003cmi mathvariant=\"normal\">∥\u003c/mi>\u003cmi>δ\u003c/mi>\u003cmi>𝐛\u003c/mi>\u003cmi mathvariant=\"normal\">∥\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi mathvariant=\"normal\">∥\u003c/mi>\u003cmi>𝐛\u003c/mi>\u003cmi mathvariant=\"normal\">∥\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Elimination, recorded, factors \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> into a lower and an upper triangle. Do it once, at a cost of about \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmfrac>\u003cmn>2\u003c/mn>\u003cmn>3\u003c/mn>\u003c/mfrac>\u003c/mstyle>\u003cmsup>\u003cmi>n\u003c/mi>\u003cmn>3\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span>, and each new right-hand side costs only two triangular solves, about \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmn>2\u003c/mn>\u003cmsup>\u003cmi>n\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span>. Row swaps, partial pivoting, keep the multipliers small so round-off does not grow. Even a perfect algorithm cannot beat the problem's own sensitivity: the condition number \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>κ\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> bounds how much a small change in the data can move the answer. With \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>κ\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> near \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmi>k\u003c/mi>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span>, expect to lose about \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>k\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> of the 16 digits.","requires":["determinant-inverse","floating-point"],"labs":[],"problems":[],"candidate":"Two nearly parallel lines whose crossing you solve for, with a slider that nudges one right-hand side. It corrects the idea that a tiny residual means an accurate answer: the solution can move far while the residual stays near zero.","sources":[{"title":"MIT 2.086, calendar: Linear algebra 2, parts 1 to 4","url":"https://ocw.mit.edu/courses/2-086-numerical-computation-for-mechanical-engineers-spring-2013/pages/calendar/","why":"The four lectures on solving linear systems, sparse ones included.","level":"Course level"},{"title":"Wikipedia, Condition number","url":"https://en.wikipedia.org/wiki/Condition_number","why":"The definition for matrices and the digits-lost rule of thumb.","level":"Deeper"}]},{"id":"lumped","title":"Lumped cooling","subject":"heat","courses":["eml4140","map2302"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmfrac>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>T\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmo>−\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>h\u003c/mi>\u003cmi>A\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>ρ\u003c/mi>\u003cmi>c\u003c/mi>\u003cmi>V\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmtext> \u003c/mtext>\u003cmrow>\u003cmo fence=\"true\">(\u003c/mo>\u003cmi>T\u003c/mi>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmi mathvariant=\"normal\">∞\u003c/mi>\u003c/msub>\u003cmo fence=\"true\">)\u003c/mo>\u003c/mrow>\u003c/mrow>\u003c/math>\u003c/span>","idea":"When conduction inside a body is fast compared with convection at its surface, the temperature is nearly uniform. The test is a Biot number \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>h\u003c/mi>\u003cmi>L\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>k\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> well below 0.1. The heat equation then collapses to one ODE: Newton's law of cooling, an exponential approach to the surroundings.","requires":["heat-equation"],"labs":[{"course":"map2302","title":"Cooling coffee","href":"https://flux-study.pages.dev/map2302/#/map2302/u1/coffee","notes":"https://flux-study.pages.dev/map2302/#/map2302/u1/coffee?n=s9","note":"Newton cooling, solved exactly and checked by numerical integration."}],"problems":["map2302:u1.cooling-temperature","map2302:u1.cooling-time","map2302:u1.cooling-fit"],"candidate":null,"sources":[{"title":"Lienhard, A Heat Transfer Textbook","url":"https://ahtt.mit.edu","why":"Chapter 1 covers lumped capacity and when it is valid.","level":"Course level"},{"title":"MIT 2.51, calendar: Lumped capacity (session 5)","url":"https://ocw.mit.edu/courses/2-51-intermediate-heat-and-mass-transfer-fall-2008/pages/calendar/","why":"Where it sits, between fins and transient conduction.","level":"Deeper"}]},{"id":"magnetic-force","title":"Magnetic force","subject":"em","courses":["phy2049"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>𝐅\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>q\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>𝐯\u003c/mi>\u003cmo>×\u003c/mo>\u003cmi>𝐁\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>𝐅\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>I\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>𝐋\u003c/mi>\u003cmo>×\u003c/mo>\u003cmi>𝐁\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>r\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>m\u003c/mi>\u003cmi>v\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>q\u003c/mi>\u003cmi>B\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A magnetic field pushes only on moving charge, and always sideways to the motion. So it bends a path without changing the speed: a charge moving across a uniform field goes in a circle. A wire carrying current feels the sum of those pushes, and a current loop feels a torque. That torque turns motors; the circle sorts ions in a mass spectrometer and a cyclotron.","requires":["vectors"],"labs":[{"course":"phy2049","title":"Mag force","href":"https://flux-study.pages.dev/phy2049/#/phy2049/e4/magforce","notes":"https://flux-study.pages.dev/phy2049/#/phy2049/e4/magforce?n=s8","note":"A proton, an electron, a helix, a velocity selector and a wire in B."},{"course":"phy2049","title":"Cyclotron","href":"https://flux-study.pages.dev/phy2049/#/phy2049/e4/cyclotron","notes":null,"note":"The lap time \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>π\u003c/mi>\u003cmi>m\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>q\u003c/mi>\u003cmi>B\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> does not depend on speed, so one frequency keeps kicking the ion."},{"course":"phy2049","title":"Motor","href":"https://flux-study.pages.dev/phy2049/#/phy2049/e4/motor","notes":null,"note":"A DC motor: the torque on a coil, kept one way by the commutator."}],"problems":["phy2049:e4.46.force-mag","phy2049:e4.46.rhr","phy2049:e4.46.circle","phy2049:e4.46.selector","phy2049:e4.46.wire-force","phy2049:e4.46.spectrometer","phy2049:e4.46.torque","phy2049:e4.46.what-B-does","phy2049:e4.46.page-rhr","phy2049:e4.46.track-sign","phy2049:e4.46.force-direction","phy2049:e4.46.qvB-solve","phy2049:e4.46.charge-from-orbit","phy2049:e4.46.coil-sides","phy2049:e4.46.spectrometer-mass","phy2049:e4.46.undeflected","phy2049:e4.47.parallel-wires","phy2049:e4.46.orbit-solve","phy2049:e4.46.cyclotron","phy2049:e4.46.motor"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 2, §11.3 Motion of a charged particle in a magnetic field","url":"https://openstax.org/books/university-physics-volume-2/pages/11-3-motion-of-a-charged-particle-in-a-magnetic-field","why":"Circles and helices, with the radius and period derived.","level":"Intro"},{"title":"MIT 8.02, Problem-solving guide: Force and torque on a current loop","url":"https://ocw.mit.edu/courses/8-02-physics-ii-electricity-and-magnetism-spring-2007/resources/solving06/","why":"From force on each side to the dipole moment and torque.","level":"Course level"}]},{"id":"mass-convection","title":"Convective mass transfer","subject":"heat","courses":["eml4140"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsup>\u003cmover accent=\"true\">\u003cmi>m\u003c/mi>\u003cmo>˙\u003c/mo>\u003c/mover>\u003cmrow>\u003cmo mathvariant=\"normal\">′\u003c/mo>\u003cmo mathvariant=\"normal\">′\u003c/mo>\u003c/mrow>\u003c/msup>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmi>m\u003c/mi>\u003c/msub>\u003cmtext> \u003c/mtext>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsub>\u003cmi>ρ\u003c/mi>\u003cmrow>\u003cmi>A\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>s\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>ρ\u003c/mi>\u003cmrow>\u003cmi>A\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi mathvariant=\"normal\">∞\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmtext>Sh\u003c/mtext>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmi>m\u003c/mi>\u003c/msub>\u003cmi>L\u003c/mi>\u003c/mrow>\u003cmsub>\u003cmi>D\u003c/mi>\u003cmrow>\u003cmi>A\u003c/mi>\u003cmi>B\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmfrac>\u003cmi>h\u003c/mi>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmi>m\u003c/mi>\u003c/msub>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmi>ρ\u003c/mi>\u003cmsub>\u003cmi>c\u003c/mi>\u003cmi>p\u003c/mi>\u003c/msub>\u003cmtext> \u003c/mtext>\u003cmsup>\u003cmtext>Le\u003c/mtext>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmn>3\u003c/mn>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A species carried away from a surface by a flow, such as water vapour off a wet wall, obeys the same equations as heat: Fick's law in place of Fourier's, concentration in place of temperature. So the mass-transfer coefficient follows the heat-transfer correlations, with the Sherwood number for Nu and the Schmidt number for Pr. Evaporation takes latent heat with it, so a wet surface in dry air cools below the air temperature until the heat coming in balances the heat the vapour carries off. That balance is how a wet-bulb thermometer and a cooling tower work.","requires":["diffusion","boundary-layer"],"labs":[],"problems":[],"candidate":"A wet-bulb thermometer in air with sliders for temperature and humidity. It corrects the idea that a wet surface settles at the air temperature: evaporation holds it below, by an amount the heat and mass analogy predicts.","sources":[{"title":"Lienhard, A Heat Transfer Textbook","url":"https://ahtt.mit.edu","why":"Chapter 11 sets out mass transfer and the analogy with heat transfer.","level":"Deeper"},{"title":"MIT 2.51, calendar: Species conservation, analogy to heat transfer, evaporative cooling (sessions 21 and 22)","url":"https://ocw.mit.edu/courses/2-51-intermediate-heat-and-mass-transfer-fall-2008/pages/calendar/","why":"The course closes convection with the heat and mass analogy.","level":"Deeper"},{"title":"Wikipedia, Chilton and Colburn J-factor analogy","url":"https://en.wikipedia.org/wiki/Chilton_and_Colburn_J-factor_analogy","why":"The analogy among momentum, heat and mass in one line, with its range.","level":"Deeper"}]},{"id":"mass-cv","title":"Mass balance on a control volume","subject":"thermo","courses":["eml3100","eml3015"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmfrac>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmtext>cv\u003c/mtext>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmo>∑\u003c/mo>\u003cmsub>\u003cmover accent=\"true\">\u003cmi>m\u003c/mi>\u003cmo>˙\u003c/mo>\u003c/mover>\u003cmtext>in\u003c/mtext>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmo>∑\u003c/mo>\u003cmsub>\u003cmover accent=\"true\">\u003cmi>m\u003c/mi>\u003cmo>˙\u003c/mo>\u003c/mover>\u003cmtext>out\u003c/mtext>\u003c/msub>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmover accent=\"true\">\u003cmi>m\u003c/mi>\u003cmo>˙\u003c/mo>\u003c/mover>\u003cmo>=\u003c/mo>\u003cmi>ρ\u003c/mi>\u003cmi>V\u003c/mi>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Draw a boundary around a device and count what crosses it. The mass flow through an opening is the flux of \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>ρ\u003c/mi>\u003cmi>𝐯\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> through it. That is \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>ρ\u003c/mi>\u003cmi>V\u003c/mi>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> when the velocity is uniform and normal to the opening. In steady flow, what enters leaves.","requires":["surface-flux"],"labs":[{"course":"eml3100","title":"Nozzle and diffuser","href":"https://flux-study.pages.dev/eml3100/#/eml3100/u3/nozzle","notes":"https://flux-study.pages.dev/eml3100/#/eml3100/u3/nozzle?n=s1","note":"Conservation of mass, \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmover accent=\"true\">\u003cmi>m\u003c/mi>\u003cmo>˙\u003c/mo>\u003c/mover>\u003cmo>=\u003c/mo>\u003cmi>A\u003c/mi>\u003cmi>V\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>v\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>, sets the area a stream needs."}],"problems":["eml3100:u3.5.mass-flow","eml3100:u3.5.nozzle-air","eml3100:u3.5.nozzle-steam","eml3100:u3.5.diffuser","eml3100:u3.5.passage"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 1, §14.5 Fluid dynamics","url":"https://openstax.org/books/university-physics-volume-1/pages/14-5-fluid-dynamics","why":"The continuity equation ρAV = constant, from first principles.","level":"Intro"},{"title":"MIT 2.06, Lecture 5 notes: Control volume formulation","url":"https://ocw.mit.edu/courses/2-06-fluid-dynamics-spring-2013/resources/mit2_06s13_notes_lens/","why":"The general control-volume statement, which the thermo version is a case of.","level":"Deeper"}]},{"id":"material-derivative","title":"Material derivative","subject":"fluids","courses":["eml3015"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmfrac>\u003cmrow>\u003cmi>D\u003c/mi>\u003cmi>𝐯\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>D\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmi>𝐯\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo>+\u003c/mo>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>𝐯\u003c/mi>\u003cmo>⋅\u003c/mo>\u003cmi mathvariant=\"normal\">∇\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmi>𝐯\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A velocity field gives the velocity at each fixed point. A fluid particle does not stay at one point, so its acceleration has two parts. One is the change in time at a fixed point. The other is the change it meets by moving to where the field is different, the chain rule along its path. In steady flow the first part is zero, but a particle in a narrowing pipe still speeds up.","requires":["chain-rule","vector-fields"],"labs":[],"problems":[],"candidate":"Trace particles through a steady converging nozzle and plot their speed against time. It corrects the idea that steady flow has no acceleration: the field never changes, but every particle speeds up as it moves.","sources":[{"title":"MIT 2.06, Lecture notes: Differential forms","url":"https://ocw.mit.edu/courses/2-06-fluid-dynamics-spring-2013/resources/mit2_06s13_notes_vo/","why":"Introduces the substantial derivative before the differential equations of motion.","level":"Course level"},{"title":"Cleynen, Fluid Dynamics for Engineers","url":"https://fluidmech.ninja/","why":"The particle and field views side by side, with the convective term explained.","level":"Course level"}]},{"id":"matrix-maps","title":"Matrices as linear maps","subject":"linalg","courses":["egn3203"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>A\u003c/mi>\u003cmi>𝐱\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmsub>\u003cmi>𝐚\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmsub>\u003cmi>𝐚\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmo>⋯\u003c/mo>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>𝐚\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>A\u003c/mi>\u003cmi>B\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmi>𝐱\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>A\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>B\u003c/mi>\u003cmi>𝐱\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>A\u003c/mi>\u003cmi>B\u003c/mi>\u003cmsub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmunder>\u003cmo>∑\u003c/mo>\u003cmi>k\u003c/mi>\u003c/munder>\u003cmsub>\u003cmi>a\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmi>k\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmsub>\u003cmi>b\u003c/mi>\u003cmrow>\u003cmi>k\u003c/mi>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A matrix is a machine that takes a vector to a vector and keeps straight lines straight. Its columns say where the unit vectors land, and \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>A\u003c/mi>\u003cmi>𝐱\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> is the same mix of those columns as \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>𝐱\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> is of the unit vectors. Multiplying two matrices chains the maps: \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>A\u003c/mi>\u003cmi>B\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> does \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>B\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> first, then \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. The row-times-column rule is that chaining written out. Order matters, because turning then stretching is not stretching then turning.","requires":["vectors"],"labs":[],"problems":[],"candidate":"Drag the two columns of a 2×2 matrix and watch the unit square become a parallelogram, then apply two matrices in both orders. It corrects the idea that matrix products commute: a rotation then a shear is not a shear then a rotation.","sources":[{"title":"Margalit and Rabinoff, Interactive Linear Algebra","url":"https://textbooks.math.gatech.edu/ila/","why":"Draws each matrix as a map of the plane before it computes with it.","level":"Course level"},{"title":"Hefferon, Linear Algebra","url":"https://hefferon.net/linearalgebra/","why":"Maps between spaces come first, and matrices are how to write them down.","level":"Deeper"},{"title":"MIT 18.06SC Linear Algebra, Fall 2011","url":"https://ocw.mit.edu/courses/18-06sc-linear-algebra-fall-2011/","why":"Strang’s full course with lectures, problem sets and solutions.","level":"Course level"}]},{"id":"maxwell-div","title":"Maxwell’s divergence equations","subject":"em","courses":["phy2049"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi mathvariant=\"normal\">∇\u003c/mi>\u003cmo>⋅\u003c/mo>\u003cmi>𝐄\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>ρ\u003c/mi>\u003cmsub>\u003cmi>ε\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi mathvariant=\"normal\">∇\u003c/mi>\u003cmo>⋅\u003c/mo>\u003cmi>𝐁\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Apply the divergence theorem to Gauss's law and shrink the surface to a point. The flux per unit volume is the charge density over \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsub>\u003cmi>ε\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span>. The magnetic version is zero because there is no magnetic charge, so every field line that enters a closed surface also leaves it.","requires":["gauss-law","faraday","divergence-theorem"],"labs":[],"problems":[],"candidate":"The same field shown two ways: flux through a shrinking sphere, and the charge density at its centre.","sources":[{"title":"OpenStax University Physics Vol. 2, §16.1 Maxwell’s equations","url":"https://openstax.org/books/university-physics-volume-2/pages/16-1-maxwells-equations-and-electromagnetic-waves","why":"All four equations in one place, in integral form, with what each one says.","level":"Intro"},{"title":"MIT 18.02SC, Part B: Flux and the divergence theorem","url":"https://ocw.mit.edu/courses/18-02sc-multivariable-calculus-fall-2010/pages/4.-triple-integrals-and-surface-integrals-in-3-space/part-b-flux-and-the-divergence-theorem/","why":"The math step that turns the integral law into the point law.","level":"Course level"}]},{"id":"measuring-circuits","title":"Measuring with a multimeter","subject":"circuits","courses":["bench"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmtext>voltmeter\u003c/mtext>\u003c/msub>\u003cmo>≫\u003c/mo>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmtext>part\u003c/mtext>\u003c/msub>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmtext>ammeter\u003c/mtext>\u003c/msub>\u003cmo>≪\u003c/mo>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmtext>circuit\u003c/mtext>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A meter becomes part of the circuit it measures. On volts it sits across a part and draws almost nothing, through a large resistance. On amps it must go in series, so the circuit is broken to fit it in; put across a part instead, its small resistance shorts the part. Resistance is measured with the power off.","requires":["kirchhoff"],"labs":[{"course":"bench","title":"Multimeter","href":"https://flux-study.pages.dev/bench/#/bench/u1/meter","notes":"https://flux-study.pages.dev/bench/#/bench/u1/meter?n=s3","note":"A meter on volts across a part, and on amps in series, with what goes wrong the other way."}],"problems":["bench:u1.loading","bench:u1.ammeter-across","bench:u1.fuse","bench:u1.concept-meter"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 2, §10.4 Electrical measuring instruments","url":"https://openstax.org/books/university-physics-volume-2/pages/10-4-electrical-measuring-instruments","why":"How voltmeters and ammeters connect, and what each one changes.","level":"Intro"},{"title":"Kuphaldt, Lessons in Electric Circuits","url":"https://www.ibiblio.org/kuphaldt/electricCircuits/","why":"Meter use and safety, from the text the course cites.","level":"Intro"}]},{"id":"mechanical-waves","title":"Waves on a string","subject":"mechanics","courses":["phy2048"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>y\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>t\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmi>A\u003c/mi>\u003cmi>sin\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>k\u003c/mi>\u003cmi>x\u003c/mi>\u003cmo>−\u003c/mo>\u003cmi>ω\u003c/mi>\u003cmi>t\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>v\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>ω\u003c/mi>\u003cmi>k\u003c/mi>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmsqrt>\u003cmfrac>\u003cmi>F\u003c/mi>\u003cmi>μ\u003c/mi>\u003c/mfrac>\u003c/msqrt>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A wave carries a disturbance along while each bit of the medium only moves back and forth. Its speed is set by the medium, tension against mass per length for a string, not by the frequency or amplitude. Frequency is set by the source, and wavelength follows as \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>v\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>f\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. The power it carries grows with the square of the amplitude.","requires":["simple-harmonic-motion"],"labs":[{"course":"phy2048","title":"Traveling wave","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u12/traveling-wave","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u12/traveling-wave?n=s1","note":"A wave on a rope moving at \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsqrt>\u003cmrow>\u003cmi>F\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>μ\u003c/mi>\u003c/mrow>\u003c/msqrt>\u003c/mrow>\u003c/math>\u003c/span> while each point only moves up and down."},{"course":"phy2048","title":"Guitar string","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u12/guitar-string","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u12/guitar-string?n=s3","note":"High and low E strings: different mass per length, different tension, the pitch they give."}],"problems":["phy2048:ch16.rope","phy2048:ch16.snapshot","phy2048:ch16.function","phy2048:ch16.particle","phy2048:ch16.power","phy2048:ch16.superpose","phy2048:ch16.concept-speed","phy2048:ch16.concept-particle","phy2048:ch16.concept-power","phy2048:ch16.guitar","phy2048:ch16.pitch"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 1, §16.2 Mathematics of waves","url":"https://openstax.org/books/university-physics-volume-1/pages/16-2-mathematics-of-waves","why":"Reading speed, wavelength and period off the wave function.","level":"Intro"},{"title":"PhET: Wave on a string","url":"https://phet.colorado.edu/en/simulations/wave-on-a-string","why":"Change tension and damping and watch the speed, not the frequency, change.","level":"Intro"}]},{"id":"moment-of-inertia","title":"Mass moment of inertia","subject":"mechanics","courses":["egn3321","phy2048"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmo>∫\u003c/mo>\u003cmsup>\u003cmi>r\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>m\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmi>G\u003c/mi>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmi>m\u003c/mi>\u003cmsup>\u003cmi>d\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A body resists spinning according to how far its mass sits from the axis, weighted by the square of the distance. For a solid it is a volume integral, so the coordinates that fit the shape help. The parallel-axis theorem moves it to any other axis, and composite bodies add their parts.","requires":["triple-integrals"],"labs":[{"course":"egn3321","title":"Inertia","href":"https://flux-study.pages.dev/egn3321/#/egn3321/u6/inertia","notes":"https://flux-study.pages.dev/egn3321/#/egn3321/u6/inertia?n=s1","note":"Moments of inertia of shapes and composite bodies, with the parallel-axis shift."},{"course":"phy2048","title":"Moment of inertia","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u6/inertia","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u6/inertia?n=s5","note":"The table of moments of inertia and the parallel-axis shift."},{"course":"phy2048","title":"Helicopter rotor","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u6/helicopter-rotor","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u6/helicopter-rotor?n=s4","note":"A rescue helicopter’s blades as rods about one end, and the energy they store."}],"problems":["egn3321:u6.17.rod","egn3321:u6.17.spread","egn3321:u6.17.plate","egn3321:u6.17.spin-faster","egn3321:u6.17.spin-time","phy2048:ch10.rod","phy2048:ch10.pair","phy2048:ch10.concept-axis","phy2048:ch10.heli"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 1, §10.5 Calculating moments of inertia","url":"https://openstax.org/books/university-physics-volume-1/pages/10-5-calculating-moments-of-inertia","why":"Rods, disks and the parallel-axis theorem from the integral.","level":"Intro"},{"title":"MIT 18.02SC, Part A: Triple integrals","url":"https://ocw.mit.edu/courses/18-02sc-multivariable-calculus-fall-2010/pages/4.-triple-integrals-and-surface-integrals-in-3-space/part-a-triple-integrals/","why":"The calculus side: moments of inertia as triple integrals.","level":"Course level"}]},{"id":"moments","title":"Moments and couples","subject":"mechanics","courses":["statics"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>𝐌\u003c/mi>\u003cmi>O\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmi>𝐫\u003c/mi>\u003cmo>×\u003c/mo>\u003cmi>𝐅\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>M\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>F\u003c/mi>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmo>⊥\u003c/mo>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A force turns a body about a point by its size times its perpendicular distance from the point, or in vectors \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>𝐫\u003c/mi>\u003cmo>×\u003c/mo>\u003cmi>𝐅\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. Two equal and opposite forces that do not share a line make a couple, whose moment is the same about every point. Any set of forces can be swapped for one force and one couple that act the same.","requires":["vectors"],"labs":[{"course":"statics","title":"Moments","href":"https://flux-study.pages.dev/statics/#/statics/u2/moments","notes":"https://flux-study.pages.dev/statics/#/statics/u2/moments?n=s3","note":"Each moment worked two ways, by components and by perpendicular distance, and a couple about any point."},{"course":"statics","title":"Wall shelf","href":"https://flux-study.pages.dev/statics/#/statics/u2/shelf","notes":"https://flux-study.pages.dev/statics/#/statics/u2/shelf?n=s4","note":"A wall shelf: the anchor force depends on where the load sits and how far apart the anchors are."}],"problems":["statics:ch4.moment-2d","statics:ch4.moment-3d","statics:ch4.moment-axis","statics:ch4.couple-concept","statics:ch4.couple-moment","statics:r4.force-equivalence"],"candidate":null,"sources":[{"title":"MIT 2.001, Lecture 1: Review of forces and moments","url":"https://ocw.mit.edu/courses/2-001-mechanics-materials-i-fall-2006/resources/lec1/","why":"Moments and couples reviewed before equilibrium.","level":"Course level"},{"title":"OpenStax University Physics Vol. 1, §10.6 Torque","url":"https://openstax.org/books/university-physics-volume-1/pages/10-6-torque","why":"The moment as a cross product, with the lever arm drawn.","level":"Intro"}]},{"id":"momentum-cv","title":"Momentum balance on a control volume","subject":"fluids","courses":["eml3015"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmo>∑\u003c/mo>\u003cmi>𝐅\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>d\u003c/mi>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmsub>\u003cmo>∫\u003c/mo>\u003cmtext>CV\u003c/mtext>\u003c/msub>\u003cmi>ρ\u003c/mi>\u003cmi>𝐯\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>V\u003c/mi>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmo>∫\u003c/mo>\u003cmtext>CS\u003c/mtext>\u003c/msub>\u003cmi>𝐯\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>ρ\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>𝐯\u003c/mi>\u003cmo>⋅\u003c/mo>\u003cmi>𝐧\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Put momentum into the transport theorem and Newton's second law holds for a control volume. The forces on it, pressure on the cut surfaces, gravity and whatever holds it in place, equal the net outflow of momentum. With uniform jets that outflow is \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmover accent=\"true\">\u003cmi>m\u003c/mi>\u003cmo>˙\u003c/mo>\u003c/mover>\u003cmtext> \u003c/mtext>\u003cmi>𝐯\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> out minus in. This is how to find the force on a pipe bend, a nozzle or a vane without knowing the flow inside.","requires":["reynolds-transport","impulse-momentum"],"labs":[],"problems":[],"candidate":"Aim a water jet at a fixed vane and then at a vane moving away from it. It corrects the idea that the force depends on the jet’s speed alone: on a moving vane only the relative speed counts, and the force is the momentum flux the vane turns.","sources":[{"title":"MIT 2.06, Lecture notes: Control volume formulation","url":"https://ocw.mit.edu/courses/2-06-fluid-dynamics-spring-2013/resources/mit2_06s13_notes_lens/","why":"The momentum balance follows the mass balance in the same notes.","level":"Course level"},{"title":"MIT 2.06, calendar: Lecture 7, momentum equation and examples","url":"https://ocw.mit.edu/courses/2-06-fluid-dynamics-spring-2013/pages/calendar/","why":"The lecture that applies it to jets, bends and moving vanes.","level":"Course level"}]},{"id":"monte-carlo","title":"Monte Carlo methods","subject":"numerics","courses":["egn3203"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmo>∫\u003c/mo>\u003cmi mathvariant=\"normal\">Ω\u003c/mi>\u003c/msub>\u003cmi>f\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>V\u003c/mi>\u003cmo>≈\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi mathvariant=\"normal\">∣\u003c/mi>\u003cmi mathvariant=\"normal\">Ω\u003c/mi>\u003cmi mathvariant=\"normal\">∣\u003c/mi>\u003c/mrow>\u003cmi>N\u003c/mi>\u003c/mfrac>\u003cmunderover>\u003cmo>∑\u003c/mo>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cmi>N\u003c/mi>\u003c/munderover>\u003cmi>f\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsub>\u003cmi>𝐱\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmtext>standard error\u003c/mtext>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi mathvariant=\"normal\">∣\u003c/mi>\u003cmi mathvariant=\"normal\">Ω\u003c/mi>\u003cmi mathvariant=\"normal\">∣\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmsub>\u003cmi>σ\u003c/mi>\u003cmi>f\u003c/mi>\u003c/msub>\u003c/mrow>\u003cmsqrt>\u003cmi>N\u003c/mi>\u003c/msqrt>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Draw random points, evaluate the quantity at each, and average. The sample mean estimates the true mean, and the central limit theorem says its error is about \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>σ\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmsqrt>\u003cmi>N\u003c/mi>\u003c/msqrt>\u003c/mrow>\u003c/math>\u003c/span>. So a tenfold cut in error needs a hundred times the samples. That is slow next to Simpson's rule in one dimension, but the rate does not depend on the dimension, so in many dimensions sampling wins. It also handles uncertain inputs directly: sample them, run the model, and read the spread of the outputs.","requires":["sampling-distributions"],"labs":[],"problems":[],"candidate":"Estimate \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>π\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> by throwing random points at a square around a circle, with a slider for the count. It corrects the idea that ten times the samples gives ten times the accuracy: it gives about three times.","sources":[{"title":"MIT 2.086, calendar: Probability and statistics, parts 1 to 5","url":"https://ocw.mit.edu/courses/2-086-numerical-computation-for-mechanical-engineers-spring-2013/pages/calendar/","why":"The course builds sampling and estimation, then uses them to compute.","level":"Course level"},{"title":"Wikipedia, Monte Carlo integration","url":"https://en.wikipedia.org/wiki/Monte_Carlo_integration","why":"The estimator, its error and why it suits high dimensions.","level":"Intro"}]},{"id":"natural-convection","title":"Natural convection","subject":"heat","courses":["eml4140"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmtext>Ra\u003c/mtext>\u003cmi>L\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>g\u003c/mi>\u003cmi>β\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmi>T\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmsup>\u003cmi>L\u003c/mi>\u003cmn>3\u003c/mn>\u003c/msup>\u003c/mrow>\u003cmrow>\u003cmi>ν\u003c/mi>\u003cmi>α\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmover accent=\"true\">\u003cmtext>Nu\u003c/mtext>\u003cmo stretchy=\"true\">‾\u003c/mo>\u003c/mover>\u003cmi>L\u003c/mi>\u003c/msub>\u003cmo>≈\u003c/mo>\u003cmn>0.59\u003c/mn>\u003cmtext> \u003c/mtext>\u003cmsubsup>\u003cmtext>Ra\u003c/mtext>\u003cmi>L\u003c/mi>\u003cmrow>\u003cmn>1\u003c/mn>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmn>4\u003c/mn>\u003c/mrow>\u003c/msubsup>\u003cmtext>  \u003c/mtext>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmn>4\u003c/mn>\u003c/msup>\u003cmo>&lt;\u003c/mo>\u003cmsub>\u003cmtext>Ra\u003c/mtext>\u003cmi>L\u003c/mi>\u003c/msub>\u003cmo>&lt;\u003c/mo>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmn>9\u003c/mn>\u003c/msup>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Fluid warmed by a surface becomes less dense, and buoyancy lifts it. No fan sets the speed: the flow's own buoyancy does, so the Reynolds number gives way to the Grashof number, buoyancy over viscous force. The Rayleigh number, Gr times Pr, sets the heat transfer. On a vertical plate in laminar flow \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>h\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> grows as \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmsup>\u003cmi>T\u003c/mi>\u003cmrow>\u003cmn>1\u003c/mn>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmn>4\u003c/mn>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span>, so the heat loss grows faster than the temperature difference. Above a Rayleigh number of about \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmn>9\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span> the layer turns turbulent.","requires":["convection","buoyancy"],"labs":[],"problems":[],"candidate":"A heated vertical plate with a slider for its temperature, the rising layer drawn. It corrects the idea that \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>h\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> is fixed for still air: it grows with the temperature difference, because a hotter plate drives a faster flow.","sources":[{"title":"Lienhard, A Heat Transfer Textbook","url":"https://ahtt.mit.edu","why":"Chapter 8 derives the scaling and gives the plate, cylinder and enclosure correlations.","level":"Course level"},{"title":"MIT 2.51, calendar: Natural convection (session 17)","url":"https://ocw.mit.edu/courses/2-51-intermediate-heat-and-mass-transfer-fall-2008/pages/calendar/","why":"The course’s session on buoyancy-driven flow.","level":"Deeper"}]},{"id":"navier-stokes","title":"Navier–Stokes equations","subject":"fluids","courses":["eml3015"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>ρ\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmfrac>\u003cmrow>\u003cmi>D\u003c/mi>\u003cmi>𝐯\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>D\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmo>−\u003c/mo>\u003cmi mathvariant=\"normal\">∇\u003c/mi>\u003cmi>p\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>μ\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmsup>\u003cmi mathvariant=\"normal\">∇\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmi>𝐯\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>ρ\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>𝐠\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi mathvariant=\"normal\">∇\u003c/mi>\u003cmo>⋅\u003c/mo>\u003cmi>𝐯\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Add viscous shear to Euler's equation. In an incompressible Newtonian fluid, continuity lets the net viscous force on a parcel collapse to \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>μ\u003c/mi>\u003cmsup>\u003cmi mathvariant=\"normal\">∇\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmi>𝐯\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. That term spreads momentum from fast fluid to slow, as conduction spreads heat. With the no-slip condition at walls, the equations fix the flow. Exact solutions exist only for simple shapes; everything else is scaling, approximation or a computer.","requires":["euler-equations","viscosity","continuity"],"labs":[],"problems":[],"candidate":"Start a wall moving under still fluid and watch the velocity spread upward. It corrects the idea that viscosity acts everywhere at once: momentum diffuses in from the wall over a depth of order \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsqrt>\u003cmrow>\u003cmi>ν\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/msqrt>\u003c/mrow>\u003c/math>\u003c/span>, as heat does.","sources":[{"title":"MIT 2.06, calendar: Lecture 9, viscous fluids and the Navier–Stokes equation","url":"https://ocw.mit.edu/courses/2-06-fluid-dynamics-spring-2013/pages/calendar/","why":"The lecture that adds the viscous term, followed by three lectures of solutions.","level":"Course level"},{"title":"Cleynen, Fluid Dynamics for Engineers","url":"https://fluidmech.ninja/","why":"Derives the equations term by term and solves the standard laminar cases.","level":"Course level"}]},{"id":"newton-systems","title":"Newton’s method for systems","subject":"numerics","courses":["egn3203"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>J\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsub>\u003cmi>𝐱\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmi>𝐱\u003c/mi>\u003cmo>=\u003c/mo>\u003cmo>−\u003c/mo>\u003cmi>𝐅\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsub>\u003cmi>𝐱\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>𝐱\u003c/mi>\u003cmrow>\u003cmi>k\u003c/mi>\u003cmo>+\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>𝐱\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmi>𝐱\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>J\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Several nonlinear equations in several unknowns are solved the way one is: replace them by their linear approximation and solve that. The linear approximation uses the Jacobian, the matrix of partial derivatives, so each step solves a linear system. Near a solution where the Jacobian is not singular the error still squares each step. Each step costs a factorization, so solvers often reuse an old Jacobian for a few steps. The equations cannot be solved one at a time, because each unknown appears in all of them.","requires":["root-finding","lu-conditioning","partial-derivatives"],"labs":[],"problems":[],"candidate":"Two curves in the plane whose crossing Newton finds, each step’s tangent planes drawn. It corrects the idea that a system can be solved one equation at a time: fixing one unknown from one equation undoes the other, while Newton moves both together.","sources":[{"title":"MIT 2.086, calendar: Nonlinear problems and MATLAB fsolve","url":"https://ocw.mit.edu/courses/2-086-numerical-computation-for-mechanical-engineers-spring-2013/pages/calendar/","why":"Newton in many unknowns, with the recitation on a library solver.","level":"Course level"},{"title":"Yano, Penn, Konidaris and Patera, Math, Numerics, and Programming (for Mechanical Engineers)","url":"https://ocw.mit.edu/courses/2-086-numerical-computation-for-mechanical-engineers-spring-2013/resources/mit2_086s13_textbook/","why":"Newton’s method for systems, with mechanical examples.","level":"Course level"}]},{"id":"newtons-second-law","title":"Newton’s second law","subject":"mechanics","courses":["egn3321","phy2048"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmo>∑\u003c/mo>\u003cmi>𝐅\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>m\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>𝐚\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"The net force on a particle sets its acceleration. Draw the free-body diagram, choose axes, and write one equation per direction. Friction, ropes and pulleys each add a rule: kinetic friction is \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsub>\u003cmi>μ\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003cmi>N\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>, a rope pulls along itself, and a pulley's geometry ties the blocks' accelerations together. Drag makes the force depend on speed, and the equation becomes a differential one.","requires":["particle-kinematics","vectors"],"labs":[{"course":"egn3321","title":"F = ma","href":"https://flux-study.pages.dev/egn3321/#/egn3321/u2/fma","notes":"https://flux-study.pages.dev/egn3321/#/egn3321/u2/fma?n=s1","note":"Blocks on inclines with friction, alone and connected."},{"course":"egn3321","title":"Pulleys","href":"https://flux-study.pages.dev/egn3321/#/egn3321/u2/pulleys","notes":"https://flux-study.pages.dev/egn3321/#/egn3321/u2/pulleys?n=s4","note":"Pulley systems and the length constraint that links their motions."},{"course":"egn3321","title":"Drag","href":"https://flux-study.pages.dev/egn3321/#/egn3321/u2/drag","notes":"https://flux-study.pages.dev/egn3321/#/egn3321/u2/drag?n=s5","note":"Falling with drag, approaching terminal speed."},{"course":"phy2048","title":"Incline","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u3/incline","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u3/incline?n=s5","note":"A block on an incline: it slides when tan θ beats μs, at a rate that ignores its mass."},{"course":"phy2048","title":"Atwood machine","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u3/atwood","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u3/atwood?n=s7","note":"An Atwood machine: the tension is not the hanging weight while things accelerate."},{"course":"phy2048","title":"Elevator scale","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u3/elevator-scale","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u3/elevator-scale?n=s1","note":"A bathroom scale in an elevator reads the normal force, not the weight."},{"course":"phy2048","title":"Drag","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u3/drag","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u3/drag?n=s11","note":"Falling with linear and quadratic drag toward a terminal speed."},{"course":"phy2048","title":"Skydiver","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u3/skydiver","notes":null,"note":"A skydiver in free fall, then under a canopy that multiplies the drag area."}],"problems":["egn3321:u2.13.atwood","egn3321:u2.13.incline","egn3321:u2.13.tow","egn3321:u2.13.tension","egn3321:u2.13.friction-dir","egn3321:u2.13.pulley-sym","egn3321:u2.13.constraint","egn3321:u2.13.tackle","egn3321:u2.13.terminal","egn3321:u2.13.drag-ask","phy2048:ch6.incline","phy2048:ch6.hold","phy2048:ch6.atwood","phy2048:ch6.connected","phy2048:ch6.concept-tension","phy2048:ch6.elevator","phy2048:ch6.concept-scale","phy2048:ch6.concept-terminal","phy2048:ch6.terminal"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 1, §6.1 Solving problems with Newton’s laws","url":"https://openstax.org/books/university-physics-volume-1/pages/6-1-solving-problems-with-newtons-laws","why":"A fixed method, then connected bodies and inclines.","level":"Intro"},{"title":"MIT 8.01SC, 12.1 Pulley problems, part I: set up the equations","url":"https://ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/pages/week-4-drag-forces-constraints-and-continuous-systems/12-1-pulley-problems-part-i-set-up-the-equations/","why":"The constraint equation that most pulley mistakes skip.","level":"Course level"}]},{"id":"nodal-analysis","title":"Node and mesh analysis","subject":"circuits","courses":["eel3111"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>G\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>𝐯\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>𝐢\u003c/mi>\u003cmi>s\u003c/mi>\u003c/msub>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>G\u003c/mi>\u003cmrow>\u003cmi>k\u003c/mi>\u003cmi>k\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmo>∑\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmi>R\u003c/mi>\u003c/mfrac>\u003cmtext> at node \u003c/mtext>\u003cmi>k\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"1em\"/>\u003cmsub>\u003cmi>G\u003c/mi>\u003cmrow>\u003cmi>k\u003c/mi>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmo>−\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmrow>\u003cmi>k\u003c/mi>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mfrac>\u003cmo separator=\"true\">;\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>R\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>𝐢\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>𝐯\u003c/mi>\u003cmi>s\u003c/mi>\u003c/msub>\u003cmtext> (mesh)\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Pick one node as ground and give every other node an unknown voltage. Kirchhoff's current law at each node, with Ohm's law for each branch, gives one linear equation per node, so the whole circuit becomes \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>G\u003c/mi>\u003cmi>𝐯\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>𝐢\u003c/mi>\u003cmi>s\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span>. Mesh analysis does the same with loop currents and the voltage law. Choose the method with fewer unknowns: nodes minus one, or independent loops. A voltage source between two nodes joins them into a supernode; a current source shared by two meshes makes a supermesh. Either way the circuit is a matrix problem, solved by elimination.","requires":["kirchhoff","gaussian-elimination"],"labs":[],"problems":[],"candidate":"Solve one circuit by nodes and by meshes side by side, with the matrix of each shown. It corrects the idea that one method is right for every circuit: the two agree on every current, but one may need half as many equations.","sources":[{"title":"MIT 6.002, calendar: Lecture 2, KVL, KCL and nodal analysis","url":"https://ocw.mit.edu/courses/6-002-circuits-and-electronics-spring-2007/pages/calendar/","why":"The course reaches the node method in its second lecture, before any theorem.","level":"Course level"},{"title":"Kuphaldt, Lessons in Electric Circuits, Vol. I: DC","url":"https://www.allaboutcircuits.com/textbook/direct-current/","why":"Branch current, mesh current and node voltage methods, each worked on one network.","level":"Intro"}]},{"id":"normal-modes","title":"Coupled normal modes","subject":"diffeq","courses":["map2302"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>M\u003c/mi>\u003cmover accent=\"true\">\u003cmi>𝐱\u003c/mi>\u003cmo>¨\u003c/mo>\u003c/mover>\u003cmo>+\u003c/mo>\u003cmi>K\u003c/mi>\u003cmi>𝐱\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>𝟎\u003c/mn>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>K\u003c/mi>\u003cmo>−\u003c/mo>\u003cmsup>\u003cmi>ω\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmi>M\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmi>𝐯\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>𝟎\u003c/mn>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Masses joined by springs move in patterns where everything shares one frequency: the normal modes. Any free motion is a mix of them, and the starting state sets the mix. Release one mass and both modes usually start, which is why the motion seems to pass back and forth.","requires":["linear-systems","eigenvalues"],"labs":[{"course":"map2302","title":"Coupled normal modes","href":"https://flux-study.pages.dev/map2302/#/map2302/u4/normal-modes","notes":"https://flux-study.pages.dev/map2302/#/map2302/u4/normal-modes?n=s3","note":"Two masses and three springs: release one mass and watch the modes mix."}],"problems":["map2302:u4.mode-frequencies","map2302:u4.coupled-state"],"candidate":null,"sources":[{"title":"Lebl, Notes on Diffy Qs, §3.6 Second-order systems and applications","url":"https://www.jirka.org/diffyqs/html/sol_section.html","why":"Normal modes of mass-spring chains.","level":"Course level"},{"title":"MIT 18.03SC, Matrix methods: eigenvalues and normal modes","url":"https://ocw.mit.edu/courses/18-03sc-differential-equations-fall-2011/pages/unit-iv-first-order-systems/matrix-methods-eigenvalues-and-normal-modes/","why":"Normal modes as eigenvectors, with worked cases.","level":"Course level"}]},{"id":"normal-shock","title":"Normal shocks","subject":"thermo","courses":["eml3101"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsubsup>\u003cmtext>Ma\u003c/mtext>\u003cmn>2\u003c/mn>\u003cmn>2\u003c/mn>\u003c/msubsup>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>k\u003c/mi>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmsubsup>\u003cmtext>Ma\u003c/mtext>\u003cmn>1\u003c/mn>\u003cmn>2\u003c/mn>\u003c/msubsup>\u003cmo>+\u003c/mo>\u003cmn>2\u003c/mn>\u003c/mrow>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>k\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmsubsup>\u003cmtext>Ma\u003c/mtext>\u003cmn>1\u003c/mn>\u003cmn>2\u003c/mn>\u003c/msubsup>\u003cmo>−\u003c/mo>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>k\u003c/mi>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmfrac>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>k\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmsubsup>\u003cmtext>Ma\u003c/mtext>\u003cmn>1\u003c/mn>\u003cmn>2\u003c/mn>\u003c/msubsup>\u003cmo>−\u003c/mo>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>k\u003c/mi>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003cmrow>\u003cmi>k\u003c/mi>\u003cmo>+\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A supersonic stream can slow to subsonic in a jump only a few molecular paths thick. Across the jump mass, momentum and energy are conserved, but the process is far from reversible. Solving the three balances together gives the downstream Mach number, pressure and temperature from the upstream Mach number alone. Entropy rises across the shock, so stagnation pressure falls, and only a jump from supersonic to subsonic is possible. In a nozzle with too much back pressure a shock stands in the diverging section and moves toward the throat as the back pressure rises.","requires":["compressible-flow","momentum-cv"],"labs":[],"problems":[],"candidate":"Raise the back pressure on a supersonic nozzle and watch a shock enter from the exit and walk toward the throat. It corrects the idea that a shock speeds the gas up: it slows it to subsonic, raises its pressure, and loses stagnation pressure.","sources":[{"title":"NASA Glenn, Beginner’s guide to aeronautics: Normal shock wave","url":"https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/normal-shock-wave/","why":"The shock relations with a calculator to check them.","level":"Intro"},{"title":"OpenStax University Physics Vol. 1, §17.8 Shock waves","url":"https://openstax.org/books/university-physics-volume-1/pages/17-8-shock-waves","why":"Shocks from a source faster than sound, as a first course shows them.","level":"Intro"}]},{"id":"normality-check","title":"Checking normality","subject":"stats","courses":["sta3032"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmrow>\u003cmo fence=\"true\">(\u003c/mo>\u003cmsup>\u003cmi mathvariant=\"normal\">Φ\u003c/mi>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmtext> ⁣\u003c/mtext>\u003cmrow>\u003cmo fence=\"true\">(\u003c/mo>\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmfrac>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmo>−\u003c/mo>\u003cmn>0.5\u003c/mn>\u003c/mrow>\u003cmi>n\u003c/mi>\u003c/mfrac>\u003c/mstyle>\u003cmo fence=\"true\">)\u003c/mo>\u003c/mrow>\u003cmo separator=\"true\">,\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmrow>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>i\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/msub>\u003cmo fence=\"true\">)\u003c/mo>\u003c/mrow>\u003cmtext> lies near a line if the data are normal\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/span>","idea":"The t procedures assume roughly normal data. A normal probability plot tests that by eye: sort the data and plot them against where a normal sample of that size would put them. A straight line means normal. Skewed data bend away at one end; heavy tails bend at both. One outlier sits off the line by itself.","requires":["random-variables","descriptive-statistics"],"labs":[{"course":"sta3032","title":"Normal probability plot","href":"https://flux-study.pages.dev/sta3032/#/sta3032/mid/explore/npp","notes":null,"note":"Samples from normal, skewed, heavy-tailed and uniform populations on a normal plot."}],"problems":[],"candidate":null,"sources":[{"title":"OpenStax Introductory Statistics 2e, §6.1 The standard normal distribution","url":"https://openstax.org/books/introductory-statistics-2e/pages/6-1-the-standard-normal-distribution","why":"z-scores and the normal quantiles the plot uses.","level":"Intro"},{"title":"MIT 18.05, Reading 6a: Expectation, variance, law of large numbers and central limit theorem","url":"https://ocw.mit.edu/courses/18-05-introduction-to-probability-and-statistics-spring-2014/resources/mit18_05s14_reading6a/","why":"Why so much data comes out close to normal.","level":"Course level"}]},{"id":"numerical-conduction","title":"Multidimensional and numerical conduction","subject":"heat","courses":["eml4140"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsubsup>\u003cmi>T\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>j\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmtext> \u003c/mtext>\u003cmi>n\u003c/mi>\u003cmo>+\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msubsup>\u003cmo>=\u003c/mo>\u003cmsubsup>\u003cmi>T\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>j\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmtext> \u003c/mtext>\u003cmi>n\u003c/mi>\u003c/mrow>\u003c/msubsup>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmtext>Fo\u003c/mtext>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003c/msub>\u003cmsup>\u003cmrow>\u003cmo fence=\"true\">(\u003c/mo>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmo>+\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>j\u003c/mi>\u003cmo>+\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>j\u003c/mi>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmn>4\u003c/mn>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo fence=\"true\">)\u003c/mo>\u003c/mrow>\u003cmi>n\u003c/mi>\u003c/msup>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmtext>Fo\u003c/mtext>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003c/msub>\u003cmo>≤\u003c/mo>\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmn>4\u003c/mn>\u003c/mfrac>\u003c/mstyle>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Real parts have corners and holes, so the heat equation has no neat solution. Put the body on a grid and replace each derivative with a difference between neighbouring nodes. In steady 2D conduction each node settles to the mean of its four neighbours. In a transient, stepping forward in time is Euler's method on every node at once. The explicit step is stable only if the grid Fourier number stays at or below \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmn>1\u003c/mn>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmn>4\u003c/mn>\u003c/mrow>\u003c/math>\u003c/span> in 2D, so a finer grid forces much smaller time steps.","requires":["heat-equation","euler-method"],"labs":[],"problems":[],"candidate":"Relax a 2D plate on a grid you can refine, and step a transient with a time-step slider. It corrects the idea that a smaller grid with the same time step is always more accurate: past the stability limit the solution oscillates and blows u
