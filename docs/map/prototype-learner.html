ns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmtext>abs\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmtext>gauge\u003c/mtext>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmtext>atm\u003c/mtext>\u003c/msub>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmi>p\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>ρ\u003c/mi>\u003cmi>g\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmi>z\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Pressure is force per unit area, and in a fluid at rest it grows with depth by \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>ρ\u003c/mi>\u003cmi>g\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> per metre. Only the vertical drop counts, not the tube's width or slope. A gauge reads pressure above the atmosphere; the thermodynamics always uses absolute pressure, so add the atmosphere back.","requires":[],"labs":[{"course":"eml3100","title":"Manometer","href":"https://flux-study.pages.dev/eml3100/#/eml3100/u1/manometer","notes":"https://flux-study.pages.dev/eml3100/#/eml3100/u1/manometer?n=s0","note":"A manometer reads depth and density: the gauge pressure is the sum of \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>ρ\u003c/mi>\u003cmi>g\u003c/mi>\u003cmi>z\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>."},{"course":"phy2048","title":"Pressure and depth","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u10/pressure-depth","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u10/pressure-depth?n=s1","note":"Pressure set by depth, not container width, and pistons balanced by area."},{"course":"phy2048","title":"Brake hydraulics","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u10/brake-hydraulics","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u10/brake-hydraulics?n=s3","note":"A car’s brake lines: Pascal’s principle multiplies the pedal force."}],"problems":["eml3100:u1.2.utube","eml3100:u1.2.multifluid","eml3100:u1.2.tube-width","eml3100:u1.2.leg-direction","phy2048:ch14.dam","phy2048:ch14.barometer","phy2048:ch14.utube","phy2048:ch14.concept-shape","phy2048:ch14.concept-gauge","phy2048:ch14.brakes","phy2048:ch14.stroke"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 1, §14.2 Measuring pressure","url":"https://openstax.org/books/university-physics-volume-1/pages/14-2-measuring-pressure","why":"Gauge and absolute pressure, and how a manometer reads a difference.","level":"Intro"},{"title":"Yan, Introduction to Engineering Thermodynamics, §1.3 Extensive and intensive properties","url":"https://pressbooks.bccampus.ca/thermo1/","why":"The course’s own book; pressure as a property of state.","level":"Course level"}]},{"id":"psychrometrics","title":"Psychrometrics and air conditioning","subject":"thermo","courses":["eml3101"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>ω\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>0.622\u003c/mn>\u003cmtext> \u003c/mtext>\u003cmfrac>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>v\u003c/mi>\u003c/msub>\u003cmrow>\u003cmi>p\u003c/mi>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>v\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>ϕ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>v\u003c/mi>\u003c/msub>\u003cmrow>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>g\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>T\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>h\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>c\u003c/mi>\u003cmrow>\u003cmi>p\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>a\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmi>T\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>ω\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmi>g\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Moist air is a mixture of dry air and water vapour, and the vapour's partial pressure cannot pass the saturation pressure at the air's temperature. The humidity ratio counts water per kilogram of dry air; the relative humidity compares the vapour pressure with saturation. Cool air without changing its water content and \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>ϕ\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> rises, until it reaches 100% at the dew point; further cooling condenses water out. An air conditioner cools air below its dew point to dry it, then lets it warm. The psychrometric chart draws all of these states on one sheet.","requires":["gas-mixtures","phases"],"labs":[],"problems":[],"candidate":"Generate the psychrometric chart from its equations and run air through a cooling coil. It corrects the idea that an air conditioner only cools: it dries the air by cooling it below the dew point, and water drips out.","sources":[{"title":"Wikipedia, Psychrometrics","url":"https://en.wikipedia.org/wiki/Psychrometrics","why":"Humidity ratio, relative humidity, dew point and the chart, defined in one place.","level":"Intro"},{"title":"Cleynen, Engineering Thermodynamics","url":"https://thermodynamicsbook.com/","why":"Saturation pressure and phase change, from which the chart is built.","level":"Course level"}]},{"id":"pull-resistors","title":"Floating inputs and pull resistors","subject":"circuits","courses":["bench"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>pin\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmi>s\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmtext>leak\u003c/mtext>\u003c/msub>\u003cmtext> \u003c/mtext>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmtext>pull\u003c/mtext>\u003c/msub>\u003cmtext> (released)\u003c/mtext>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmi>s\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmtext>pull\u003c/mtext>\u003c/msub>\u003c/mfrac>\u003cmtext> (pressed)\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/span>","idea":"An input pin joined to nothing has no voltage of its own and drifts with stray fields, reading high and low by turns. A pull-up or pull-down resistor gives it a definite level, and a button pulls it the other way. Too large a pull resistor loses to leakage and noise; too small wastes current while the button is held.","requires":["voltage-divider"],"labs":[{"course":"bench","title":"Button and pull-up","href":"https://flux-study.pages.dev/bench/#/bench/u3/button","notes":"https://flux-study.pages.dev/bench/#/bench/u3/button?n=s5","note":"A button with no pull resistor, a good one, and one too large."}],"problems":["bench:u3.pull-power","bench:u3.pull-max","bench:u3.concept-float","bench:u3.concept-pull"],"candidate":null,"sources":[{"title":"Kuphaldt, Lessons in Electric Circuits","url":"https://www.ibiblio.org/kuphaldt/electricCircuits/","why":"Digital inputs and pull resistors, from the text the course cites.","level":"Intro"},{"title":"MIT 6.002, calendar: Digital abstraction","url":"https://ocw.mit.edu/courses/6-002-circuits-and-electronics-spring-2007/pages/calendar/","why":"Why a logic input needs a defined level at all.","level":"Course level"}]},{"id":"radiation-networks","title":"Gray-body radiation networks","subject":"heat","courses":["eml4140"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>q\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmrow>\u003cmi>b\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>i\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>J\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>ε\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsub>\u003cmi>ε\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>q\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>J\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>J\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmn>1\u003c/mn>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A gray surface reflects part of what lands on it, so what leaves it, its radiosity \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>J\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>, is emission plus reflection. Each surface then behaves like a node joined to its black-body potential through a surface resistance, and to every other node through a space resistance set by the view factor. Solve the network as a circuit and the heat flows come out. A thin shield between two plates adds two surface resistances, so one polished shield can cut the exchange roughly in half or better.","requires":["view-factors","thermal-resistance"],"labs":[],"problems":[],"candidate":"Two hot plates with radiation shields you add one at a time and polish. It corrects the idea that a shield must be cold to work: it floats at an in-between temperature, and its low emissivity does the work.","sources":[{"title":"Lienhard, A Heat Transfer Textbook","url":"https://ahtt.mit.edu","why":"Chapter 10 builds the gray-body network and treats shields.","level":"Course level"},{"title":"MIT 2.51, calendar: Gray body networks (session 25)","url":"https://ocw.mit.edu/courses/2-51-intermediate-heat-and-mass-transfer-fall-2008/pages/calendar/","why":"The course’s session on exchange among gray surfaces.","level":"Course level"}]},{"id":"radiation-pressure","title":"Momentum of light","subject":"em","courses":["phy2049"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>p\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>I\u003c/mi>\u003cmi>c\u003c/mi>\u003c/mfrac>\u003cmtext> (absorbed)\u003c/mtext>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>p\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>I\u003c/mi>\u003c/mrow>\u003cmi>c\u003c/mi>\u003c/mfrac>\u003cmtext> (reflected)\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Light carries momentum as well as energy, \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>U\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>c\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> for energy \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>U\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. A surface that absorbs it feels a pressure \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>I\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>c\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>; a mirror that sends it back feels twice that. The force is tiny, but in space nothing opposes it, so a large thin sail keeps speeding up.","requires":["light-intensity"],"labs":[{"course":"phy2049","title":"Solar sail","href":"https://flux-study.pages.dev/phy2049/#/phy2049/e6/solarsail","notes":"https://flux-study.pages.dev/phy2049/#/phy2049/e6/solarsail?n=s6","note":"A solar sail: \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>F\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>2\u003c/mn>\u003cmi>I\u003c/mi>\u003cmi>A\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>c\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> and the speed it adds in a year."}],"problems":["phy2049:e6.55.solar-sail"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 2, §16.4 Momentum and radiation pressure","url":"https://openstax.org/books/university-physics-volume-2/pages/16-4-momentum-and-radiation-pressure","why":"Absorbed and reflected cases, with the solar sail as an example.","level":"Intro"},{"title":"Feynman Lectures Vol. I, Ch. 34: Relativistic effects in radiation","url":"https://www.feynmanlectures.caltech.edu/I_34.html","why":"Light pressure and the Doppler shift from one point of view.","level":"Deeper"}]},{"id":"random-variables","title":"Random variables and distributions","subject":"stats","courses":["sta3032","egn3203"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>E\u003c/mi>\u003cmo stretchy=\"false\">[\u003c/mo>\u003cmi>X\u003c/mi>\u003cmo stretchy=\"false\">]\u003c/mo>\u003cmo>=\u003c/mo>\u003cmo>∑\u003c/mo>\u003cmi>x\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmtext> or \u003c/mtext>\u003cmo>∫\u003c/mo>\u003cmi>x\u003c/mi>\u003cmi>f\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>x\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmtext>Var\u003c/mtext>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>X\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmi>E\u003c/mi>\u003cmo stretchy=\"false\">[\u003c/mo>\u003cmsup>\u003cmi>X\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo stretchy=\"false\">]\u003c/mo>\u003cmo>−\u003c/mo>\u003cmi>E\u003c/mi>\u003cmo stretchy=\"false\">[\u003c/mo>\u003cmi>X\u003c/mi>\u003cmsup>\u003cmo stretchy=\"false\">]\u003c/mo>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A random variable puts a number on each outcome, and its distribution says how probability spreads over those numbers. Counting successes gives the binomial; counting rare events, the Poisson; waiting times, the exponential; and measurements that add many small effects, the normal. For a continuous variable a probability is an area under the density, never the height at a point.","requires":["conditional-probability","definite-integral"],"labs":[{"course":"sta3032","title":"Distributions","href":"https://flux-study.pages.dev/sta3032/#/sta3032/mid/explore/dist","notes":null,"note":"Binomial, Poisson, exponential, normal and more: shade an event and read its probability."}],"problems":[],"candidate":null,"sources":[{"title":"MIT 18.05, Reading 5a: Variance, continuous random variables","url":"https://ocw.mit.edu/courses/18-05-introduction-to-probability-and-statistics-spring-2014/resources/mit18_05s14_reading5a/","why":"Densities, expectation and variance in one reading.","level":"Course level"},{"title":"OpenStax Introductory Statistics 2e, §4.3 Binomial distribution","url":"https://openstax.org/books/introductory-statistics-2e/pages/4-3-binomial-distribution","why":"When a count is binomial, with worked tables.","level":"Intro"}]},{"id":"rank-nullspace","title":"Rank, null space and solvability","subject":"linalg","courses":["egn3203"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi mathvariant=\"normal\">rank\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>A\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>dim\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>N\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>A\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmi>n\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>A\u003c/mi>\u003cmi>𝐱\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>𝐛\u003c/mi>\u003cmtext> solvable\u003c/mtext>\u003cmtext>  \u003c/mtext>\u003cmo>⟺\u003c/mo>\u003cmtext>  \u003c/mtext>\u003cmi>𝐛\u003c/mi>\u003cmo>∈\u003c/mo>\u003cmi>C\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>A\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>𝐱\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>𝐱\u003c/mi>\u003cmi>p\u003c/mi>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>𝐱\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span>","idea":"The rank is the number of pivots elimination finds: how many independent directions the columns really span. That span is the column space, and \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>A\u003c/mi>\u003cmi>𝐱\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>𝐛\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> has a solution only when \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>𝐛\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> lies in it. The null space holds every \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>𝐱\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> that \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> sends to zero. Add any of them to one solution and you get another, so a nonzero null space means many answers. Rank plus the null space's dimension always equals the number of unknowns.","requires":["gaussian-elimination"],"labs":[],"problems":[],"candidate":"Tilt three planes until two of the equations agree. It corrects the idea that three equations in three unknowns always fix one answer: dependent rows leave a whole line of solutions, or none at all.","sources":[{"title":"Margalit and Rabinoff, Interactive Linear Algebra","url":"https://textbooks.math.gatech.edu/ila/","why":"Column space, null space and the rank theorem, each with a picture.","level":"Course level"},{"title":"MIT 18.06SC Linear Algebra, Fall 2011","url":"https://ocw.mit.edu/courses/18-06sc-linear-algebra-fall-2011/","why":"Unit I builds the four subspaces that decide when a system can be solved.","level":"Course level"}]},{"id":"rankine-cycle","title":"The Rankine cycle","subject":"thermo","courses":["eml3101"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>η\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmn>3\u003c/mn>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmn>4\u003c/mn>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>−\u003c/mo>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmn>3\u003c/mn>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>w\u003c/mi>\u003cmtext>pump\u003c/mtext>\u003c/msub>\u003cmo>≈\u003c/mo>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmtext> \u003c/mtext>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A steam plant pumps liquid water to high pressure, boils it in a boiler, expands the steam through a turbine and condenses it back to liquid. Pumping a liquid costs little work because its volume is small, which is the cycle's great advantage over a gas cycle. Each device is a steady-flow energy balance, and the states come from steam tables. Raising boiler pressure or superheat raises efficiency. Reheat keeps the turbine exhaust from getting too wet, and feedwater heaters warm the water with bled steam so less heat is added at low temperature.","requires":["isentropic-efficiency","phases"],"labs":[],"problems":[],"candidate":"A Rankine cycle on \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>T\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>–\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>s\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> with sliders for boiler pressure, superheat and reheat. It corrects the idea that a higher boiler pressure is free: it raises efficiency but leaves the turbine exhaust wetter, which reheat then fixes.","sources":[{"title":"MIT 16.050, calendar: Power cycles with two-phase media","url":"https://ocw.mit.edu/courses/16-050-thermal-energy-fall-2002/pages/calendar/","why":"The four lectures on vapour power cycles.","level":"Course level"},{"title":"Cleynen, Engineering Thermodynamics","url":"https://thermodynamicsbook.com/","why":"The Rankine cycle, reheat and regeneration, with steam-table states.","level":"Course level"},{"title":"Wikipedia, Rankine cycle","url":"https://en.wikipedia.org/wiki/Rankine_cycle","why":"The cycle on a \\(T\\)–\\(s\\) diagram and its real-plant variants.","level":"Intro"}]},{"id":"rc-circuits","title":"RC circuits","subject":"circuits","courses":["phy2049","eel3111"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmi>C\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>t\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmi mathvariant=\"script\">E\u003c/mi>\u003cmrow>\u003cmo fence=\"true\">(\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>−\u003c/mo>\u003cmsup>\u003cmi>e\u003c/mi>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmi>t\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>R\u003c/mi>\u003cmi>C\u003c/mi>\u003c/mrow>\u003c/msup>\u003cmo fence=\"true\">)\u003c/mo>\u003c/mrow>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>τ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>R\u003c/mi>\u003cmi>C\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A capacitor charging through a resistor fills fast at first and slowly at the end, because the current falls as the capacitor's voltage rises. The loop rule gives a first-order differential equation, and its solution is an exponential with time constant \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>R\u003c/mi>\u003cmi>C\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. After five time constants it is within one percent of full.","requires":["kirchhoff","capacitance"],"labs":[{"course":"phy2049","title":"RC","href":"https://flux-study.pages.dev/phy2049/#/phy2049/e4/rc","notes":"https://flux-study.pages.dev/phy2049/#/phy2049/e4/rc?n=s7","note":"Charge and discharge, with \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmi>C\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span> and \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>I\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> plotted against \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>t\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>τ\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>."}],"problems":["phy2049:e4.44.rc-charge","phy2049:e4.44.rc-discharge","phy2049:e4.44.capacitor-pair","phy2049:e4.44.rc-limits","phy2049:e4.44.rc-from-tau","phy2049:e4.44.rc-time-to-V","phy2049:e4.44.rc-discharge-state","phy2049:e4.44.rc-setup"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 2, §10.5 RC circuits","url":"https://openstax.org/books/university-physics-volume-2/pages/10-5-rc-circuits","why":"Charging and discharging derived from the loop rule.","level":"Intro"},{"title":"MIT 8.02, Problem-solving guide: RC and RL circuits","url":"https://ocw.mit.edu/courses/8-02-physics-ii-electricity-and-magnetism-spring-2007/resources/solving08/","why":"Treats RC and RL side by side, which makes the pattern plain.","level":"Course level"}]},{"id":"reflection-mirrors","title":"Reflection and mirrors","subject":"em","courses":["phy2049"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>θ\u003c/mi>\u003cmi>r\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>θ\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>o\u003c/mi>\u003c/msub>\u003c/mfrac>\u003cmo>+\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmi>f\u003c/mi>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>f\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>R\u003c/mi>\u003cmn>2\u003c/mn>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"When the wavelength is small next to everything it meets, light travels in straight rays. At a surface a ray leaves at the angle it arrived. A curved mirror bends every ray from one object point toward one image point, and the mirror equation finds where. An image is real if the rays really cross there, and virtual if they only seem to come from it.","requires":["em-waves"],"labs":[{"course":"phy2049","title":"Mirrors","href":"https://flux-study.pages.dev/phy2049/#/phy2049/e7/mirrors","notes":"https://flux-study.pages.dev/phy2049/#/phy2049/e6?n=s20","note":"Concave and convex mirrors with principal rays, real and virtual images."}],"problems":["phy2049:e6.57.plane-mirror","phy2049:e6.57.two-mirrors","phy2049:e6.57.reflection-angle","phy2049:e7.59.mirror","phy2049:e7.59.place-object"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 3, §2.2 Spherical mirrors","url":"https://openstax.org/books/university-physics-volume-3/pages/2-2-spherical-mirrors","why":"Ray diagrams and the sign rules, for concave and convex mirrors.","level":"Intro"},{"title":"PhET: Geometric optics","url":"https://phet.colorado.edu/en/simulations/geometric-optics","why":"Move the object and watch the principal rays find the image.","level":"Intro"}]},{"id":"refraction","title":"Refraction","subject":"em","courses":["phy2049"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>n\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmi>sin\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmsub>\u003cmi>θ\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>n\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmi>sin\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmsub>\u003cmi>θ\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>sin\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmsub>\u003cmi>θ\u003c/mi>\u003cmi>c\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>n\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmsub>\u003cmi>n\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Light slows down in matter, by a factor \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>n\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. Crossing into a slower medium at an angle, a ray bends toward the normal, and Snell's law gives by how much. Going the other way it bends away, and past the critical angle it cannot leave at all. That total internal reflection is what keeps light inside an optical fibre.","requires":["em-waves"],"labs":[{"course":"phy2049","title":"Refraction","href":"https://flux-study.pages.dev/phy2049/#/phy2049/e7/refraction","notes":null,"note":"Rays into and out of water, glass and diamond, through to total internal reflection."}],"problems":["phy2049:e6.56.brewster","phy2049:e6.57.in-medium","phy2049:e6.57.what-changes","phy2049:e7.58.snell","phy2049:e7.58.critical","phy2049:e7.58.tir","phy2049:e7.58.apparent-depth","phy2049:e7.58.dispersion"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 3, §1.3 Refraction","url":"https://openstax.org/books/university-physics-volume-3/pages/1-3-refraction","why":"Snell’s law with a table of indices to work from.","level":"Intro"},{"title":"PhET: Bending light","url":"https://phet.colorado.edu/en/simulations/bending-light","why":"Find the critical angle yourself by turning the laser.","level":"Intro"}]},{"id":"related-rates","title":"Related rates","subject":"calculus","courses":["mac2311"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsup>\u003cmi>x\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>+\u003c/mo>\u003cmsup>\u003cmi>y\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>=\u003c/mo>\u003cmsup>\u003cmi>L\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmtext>  \u003c/mtext>\u003cmo>⇒\u003c/mo>\u003cmtext>  \u003c/mtext>\u003cmi>x\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmover accent=\"true\">\u003cmi>x\u003c/mi>\u003cmo>˙\u003c/mo>\u003c/mover>\u003cmo>+\u003c/mo>\u003cmi>y\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmover accent=\"true\">\u003cmi>y\u003c/mi>\u003cmo>˙\u003c/mo>\u003c/mover>\u003cmo>=\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003c/math>\u003c/span>","idea":"When two quantities are tied by an equation, their rates are tied too. Differentiate the equation with respect to time, then put in the numbers at the moment you care about. Substituting first is the usual mistake, because it freezes what should be changing.","requires":["implicit-differentiation"],"labs":[{"course":"mac2311","title":"Ladder","href":"https://flux-study.pages.dev/mac2311/#/mac2311/c2/rates","notes":"https://flux-study.pages.dev/mac2311/#/mac2311/c2/rates?n=s8","note":"A sliding ladder: the top does not move at the base’s speed."}],"problems":[],"candidate":null,"sources":[{"title":"OpenStax Calculus Vol. 1, §4.1 Related rates","url":"https://openstax.org/books/calculus-volume-1/pages/4-1-related-rates","why":"A step list for setting up the equation before differentiating.","level":"Intro"},{"title":"MIT 18.01SC, Part B: Optimization, related rates and Newton’s method","url":"https://ocw.mit.edu/courses/18-01sc-single-variable-calculus-fall-2010/pages/unit-2-applications-of-differentiation/part-b-optimization-related-rates-and-newtons-method/","why":"Ladders, cones and shadows with checked answers.","level":"Course level"}]},{"id":"relative-motion","title":"Relative motion","subject":"mechanics","courses":["egn3321","phy2048"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>𝐫\u003c/mi>\u003cmi>B\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>𝐫\u003c/mi>\u003cmi>A\u003c/mi>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>𝐫\u003c/mi>\u003cmrow>\u003cmi>B\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>𝐯\u003c/mi>\u003cmi>B\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>𝐯\u003c/mi>\u003cmi>A\u003c/mi>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>𝐯\u003c/mi>\u003cmrow>\u003cmi>B\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Motion depends on who is watching. Seen from axes that move with A but do not turn, B's position, velocity and acceleration are A's plus B's relative to A. The rule is plain vector addition, and it is the first step toward rigid bodies, where every point moves relative to another.","requires":["particle-kinematics","vectors"],"labs":[{"course":"egn3321","title":"Relative","href":"https://flux-study.pages.dev/egn3321/#/egn3321/u1/relative","notes":"https://flux-study.pages.dev/egn3321/#/egn3321/u1/relative?n=s7","note":"Two moving bodies and the velocity of one as seen from the other."},{"course":"phy2048","title":"Relative motion","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u2/relative-motion","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u2/relative-motion?n=s8","note":"A boat in a current: where it points and where it goes differ."},{"course":"phy2048","title":"Wind triangle","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u2/wind-triangle","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u2/wind-triangle?n=s9","note":"A pilot holding a course in a crosswind, nose into the wind."}],"problems":["egn3321:u1.12.relative","phy2048:ch4.river","phy2048:ch4.truck","phy2048:ch4.concept-frames","phy2048:ch4.wind"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 1, §4.5 Relative motion in one and two dimensions","url":"https://openstax.org/books/university-physics-volume-1/pages/4-5-relative-motion-in-one-and-two-dimensions","why":"Boats, planes and wind, solved with vector diagrams.","level":"Intro"},{"title":"MIT 8.01SC, 18.1 Relative velocity","url":"https://ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/pages/week-6-continuous-mass-transfer/18-1-relative-velocity/","why":"Relative velocity set up the way the rocket problem then needs it.","level":"Course level"}]},{"id":"reynolds-transport","title":"Reynolds transport theorem","subject":"fluids","courses":["eml3015"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmfrac>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmsub>\u003cmi>B\u003c/mi>\u003cmtext>sys\u003c/mtext>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>d\u003c/mi>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmsub>\u003cmo>∫\u003c/mo>\u003cmtext>CV\u003c/mtext>\u003c/msub>\u003cmi>ρ\u003c/mi>\u003cmi>b\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>V\u003c/mi>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmo>∫\u003c/mo>\u003cmtext>CS\u003c/mtext>\u003c/msub>\u003cmi>ρ\u003c/mi>\u003cmi>b\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>𝐯\u003c/mi>\u003cmo>⋅\u003c/mo>\u003cmi>𝐧\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"The laws of physics are written for a fixed lump of matter, a system. A fluid machine is easier to study as a fixed region, a control volume, that matter flows through. The theorem links the two: the system's rate of change is what builds up inside the region plus the net flux of the property out through its surface. Put mass in for \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>B\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> and it is the mass balance; momentum and energy follow the same way.","requires":["mass-cv"],"labs":[],"problems":[],"candidate":"Drag a fixed control volume through a flow while a dyed blob of fluid passes through it. It corrects the idea that a control volume follows the fluid: the blob is the system, the box stays put, and the flux term is the difference.","sources":[{"title":"MIT 2.06, Lecture notes: Control volume formulation","url":"https://ocw.mit.edu/courses/2-06-fluid-dynamics-spring-2013/resources/mit2_06s13_notes_lens/","why":"Builds the control-volume balances from a system in the course’s own notation.","level":"Course level"},{"title":"Cleynen, Fluid Dynamics for Engineers","url":"https://fluidmech.ninja/","why":"The integral balances for mass, momentum and energy, with worked control volumes.","level":"Course level"}]},{"id":"rigid-body-fluid","title":"Fluids in rigid-body motion","subject":"fluids","courses":["eml3015"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi mathvariant=\"normal\">∇\u003c/mi>\u003cmi>p\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>ρ\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>𝐠\u003c/mi>\u003cmo>−\u003c/mo>\u003cmi>𝐚\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>tan\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>θ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>a\u003c/mi>\u003cmi>x\u003c/mi>\u003c/msub>\u003cmrow>\u003cmi>g\u003c/mi>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>a\u003c/mi>\u003cmi>z\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A fluid that moves as one block has no shear, so pressure and gravity alone must give each parcel its acceleration. Newton's second law on a small cube says the pressure gradient points along \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>𝐠\u003c/mi>\u003cmo>−\u003c/mo>\u003cmi>𝐚\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. Surfaces of constant pressure, the free surface among them, lie across that direction. A tank on an accelerating truck tilts its surface by \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>a\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>g\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>; a spinning bucket curves it into a paraboloid.","requires":["pressure","newtons-second-law","gradient"],"labs":[],"problems":[],"candidate":"Accelerate a tank of water or spin it, and draw the free surface and the isobars. It corrects the idea that the water piles up at the front: it piles at the back, tilted by \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>a\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>g\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>, and holds that shape while the acceleration holds.","sources":[{"title":"MIT 2.06, calendar: Lecture 3, fluids under constant acceleration","url":"https://ocw.mit.edu/courses/2-06-fluid-dynamics-spring-2013/pages/calendar/","why":"The course places it between statics and moving fluids, which is where it belongs.","level":"Course level"},{"title":"Cleynen, Fluid Dynamics for Engineers","url":"https://fluidmech.ninja/","why":"Pressure in accelerating and rotating liquids, from the same force balance as statics.","level":"Course level"}]},{"id":"rigid-energy","title":"Energy of a rigid body","subject":"mechanics","courses":["egn3321","phy2048"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>T\u003c/mi>\u003cmo>=\u003c/mo>\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmn>2\u003c/mn>\u003c/mfrac>\u003c/mstyle>\u003cmi>m\u003c/mi>\u003cmsubsup>\u003cmi>v\u003c/mi>\u003cmi>G\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msubsup>\u003cmo>+\u003c/mo>\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmn>2\u003c/mn>\u003c/mfrac>\u003c/mstyle>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmi>G\u003c/mi>\u003c/msub>\u003cmtext> \u003c/mtext>\u003cmsup>\u003cmi>ω\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A moving rigid body stores energy in two ways: its centre moving and the body spinning. Down a slope, a hoop, a disk and a sphere share the same energy budget but split it differently, so the one with the least spin wins the race. A couple does work through its rotation. Tipping happens when the weight moves past the pivot.","requires":["work-energy","rigid-kinetics","energy-conservation"],"labs":[{"course":"egn3321","title":"Race","href":"https://flux-study.pages.dev/egn3321/#/egn3321/u7/race","notes":"https://flux-study.pages.dev/egn3321/#/egn3321/u7/race?n=s1","note":"A hoop, a disk and a sphere racing down a ramp."},{"course":"egn3321","title":"Linkage","href":"https://flux-study.pages.dev/egn3321/#/egn3321/u7/linkage","notes":"https://flux-study.pages.dev/egn3321/#/egn3321/u7/linkage?n=s2","note":"A linkage driven by a couple, solved by energy."},{"course":"egn3321","title":"Tip-over","href":"https://flux-study.pages.dev/egn3321/#/egn3321/u7/tipover","notes":"https://flux-study.pages.dev/egn3321/#/egn3321/u7/tipover?n=s6","note":"A body tipping about a pad once its weight passes the edge."},{"course":"egn3321","title":"Wheelchair","href":"https://flux-study.pages.dev/egn3321/#/egn3321/u7/wheelchair","notes":"https://flux-study.pages.dev/egn3321/#/egn3321/u7/wheelchair?n=s7","note":"A wheelchair on a ramp: the energy to climb and the speed coming down."},{"course":"phy2048","title":"Rover wheel","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u7/rover-wheel","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u7/rover-wheel?n=s3","note":"A Mars rover wheel rolling into a basin: speed at the bottom from energy."}],"problems":["egn3321:u7.18.race","egn3321:u7.18.no-work","egn3321:u7.18.race-pair","egn3321:u7.18.spin-share","egn3321:u7.18.roll-sym","egn3321:u7.18.bar","egn3321:u7.18.couple","egn3321:u7.18.slots","egn3321:u7.18.spring","egn3321:u7.18.tip-change","egn3321:u7.18.tipover","egn3321:u7.18.wheelchair","phy2048:ch11.rover"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 1, §11.1 Rolling motion","url":"https://openstax.org/books/university-physics-volume-1/pages/11-1-rolling-motion","why":"Energy conservation for rolling, including the race down a ramp.","level":"Intro"},{"title":"MIT 8.01SC, 37.1 Kinetic energy of translation and rotation","url":"https://ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/pages/week-12-rotations-and-translation-rolling/37-1-kinetic-energy-of-translation-and-rotation/","why":"Splitting kinetic energy about the centre of mass.","level":"Course level"}]},{"id":"rigid-kinematics","title":"Rigid-body velocity and acceleration","subject":"mechanics","courses":["egn3321"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>𝐯\u003c/mi>\u003cmi>B\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>𝐯\u003c/mi>\u003cmi>A\u003c/mi>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmi mathvariant=\"bold-italic\">ω\u003c/mi>\u003cmo>×\u003c/mo>\u003cmsub>\u003cmi>𝐫\u003c/mi>\u003cmrow>\u003cmi>B\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>𝐚\u003c/mi>\u003cmi>B\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>𝐚\u003c/mi>\u003cmi>A\u003c/mi>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmi mathvariant=\"bold-italic\">α\u003c/mi>\u003cmo>×\u003c/mo>\u003cmsub>\u003cmi>𝐫\u003c/mi>\u003cmrow>\u003cmi>B\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsup>\u003cmi>ω\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmsub>\u003cmi>𝐫\u003c/mi>\u003cmrow>\u003cmi>B\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmspace width=\"1em\"/>\u003cmtext>(plane motion)\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Every point of a rigid body moves relative to every other only by turning. So one point's velocity, plus \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi mathvariant=\"bold-italic\">ω\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> crossed with the arm to another, gives the other's. At any instant some point has zero velocity, the instantaneous centre, and the body is momentarily rotating about it. Linkages and slider-cranks are solved one link at a time this way. The acceleration formula is for plane motion, where \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi mathvariant=\"bold-italic\">ω\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> is perpendicular to the plane. In three dimensions the last term becomes \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi mathvariant=\"bold-italic\">ω\u003c/mi>\u003cmo>×\u003c/mo>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi mathvariant=\"bold-italic\">ω\u003c/mi>\u003cmo>×\u003c/mo>\u003cmsub>\u003cmi>𝐫\u003c/mi>\u003cmrow>\u003cmi>B\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/math>\u003c/span>.","requires":["relative-motion"],"labs":[{"course":"egn3321","title":"Slider-crank","href":"https://flux-study.pages.dev/egn3321/#/egn3321/u5/slider-crank","notes":"https://flux-study.pages.dev/egn3321/#/egn3321/u5/slider-crank?n=s2","note":"A slider-crank solved for velocity and acceleration, link by link."},{"course":"egn3321","title":"Centre","href":"https://flux-study.pages.dev/egn3321/#/egn3321/u5/ic","notes":"https://flux-study.pages.dev/egn3321/#/egn3321/u5/ic?n=s4","note":"The instantaneous centre of a moving link, found from two velocities."}],"problems":["egn3321:u5.16.absolute","egn3321:u5.16.accel","egn3321:u5.16.dead-centre","egn3321:u5.16.ladder","egn3321:u5.16.ic-where","egn3321:u5.16.ladder-sym","egn3321:u5.16.four-bar"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 1, §10.3 Relating angular and translational quantities","url":"https://openstax.org/books/university-physics-volume-1/pages/10-3-relating-angular-and-translational-quantities","why":"The link between a point’s speed and the body’s rotation.","level":"Intro"},{"title":"MIT 2.003SC, Velocity, acceleration, and rotational motion","url":"https://ocw.mit.edu/courses/2-003sc-engineering-dynamics-fall-2011/pages/velocity-acceleration-and-rotational-motion/","why":"An engineering dynamics course’s full treatment, with recitations.","level":"Deeper"}]},{"id":"rigid-kinetics","title":"Rigid-body equations of motion","subject":"mechanics","courses":["egn3321","phy2048"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmo>∑\u003c/mo>\u003cmi>𝐅\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>m\u003c/mi>\u003cmsub>\u003cmi>𝐚\u003c/mi>\u003cmi>G\u003c/mi>\u003c/msub>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmo>∑\u003c/mo>\u003cmsub>\u003cmi>M\u003c/mi>\u003cmi>G\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmi>G\u003c/mi>\u003c/msub>\u003cmtext> \u003c/mtext>\u003cmi>α\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A rigid body in plane motion obeys two laws at once: the forces set the acceleration of its centre of mass, and the moments about that centre set its angular acceleration. Taking moments about a fixed pivot or the contact point can remove unknown forces. Whether a wheel rolls or slips is decided by checking the friction it needs against what is available.","requires":["newtons-second-law","moment-of-inertia","rigid-kinematics"],"labs":[{"course":"egn3321","title":"Pendulum","href":"https://flux-study.pages.dev/egn3321/#/egn3321/u6/pendulum","notes":"https://flux-study.pages.dev/egn3321/#/egn3321/u6/pendulum?n=s4","note":"A body swinging about a fixed pivot, with the pin reaction."},{"course":"egn3321","title":"Roll or slip","href":"https://flux-study.pages.dev/egn3321/#/egn3321/u6/roll-slip","notes":"https://flux-study.pages.dev/egn3321/#/egn3321/u6/roll-slip?n=s5","note":"A wheel on a slope: does it roll or slip?"},{"course":"egn3321","title":"Elevator","href":"https://flux-study.pages.dev/egn3321/#/egn3321/u6/hoist","notes":"https://flux-study.pages.dev/egn3321/#/egn3321/u6/hoist?n=s6","note":"A traction elevator: drum, cable, car and counterweight together."},{"course":"phy2048","title":"Rotor","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u6/rotor","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u6/rotor?n=s2","note":"A rotor under torque: \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>α\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>τ\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>I\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>, with the same mass moved farther out."},{"course":"phy2048","title":"Massive pulley","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u6/massive-pulley","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u6/massive-pulley?n=s7","note":"A pulley with inertia makes the two tensions differ."},{"course":"phy2048","title":"Rolling","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u7/rolling","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u7/rolling?n=s1","note":"Rolling without slipping down a slope: a sphere beats a disk beats a hoop."}],"problems":["egn3321:u6.17.pin","egn3321:u6.17.pin-load","egn3321:u6.17.pin-sym","egn3321:u6.17.roll","egn3321:u6.17.friction-way","egn3321:u6.17.hoist","phy2048:ch10.spin","phy2048:ch10.stop","phy2048:ch10.rim","phy2048:ch10.torque","phy2048:ch10.merry","phy2048:ch10.work","phy2048:ch10.flywheel","phy2048:ch10.concept-shape","phy2048:ch10.concept-sign","phy2048:ch10.concept-work","phy2048:ch10.pulley","phy2048:ch10.concept-pulley","phy2048:ch11.roll","phy2048:ch11.slip","phy2048:ch11.concept-race","phy2048:ch11.concept-friction"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 1, §10.7 Newton’s second law for rotation","url":"https://openstax.org/books/university-physics-volume-1/pages/10-7-newtons-second-law-for-rotation","why":"Torque and angular acceleration for fixed-axis problems.","level":"Intro"},{"title":"MIT 2.003SC, Finding equations of motion for rigid body rotation","url":"https://ocw.mit.edu/courses/2-003sc-engineering-dynamics-fall-2011/pages/finding-equations-of-motion-for-rigid-body-rotation/","why":"A careful method for general plane motion.","level":"Deeper"}]},{"id":"rolling-gears","title":"Rolling and gear trains","subject":"mechanics","courses":["egn3321"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmi>G\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmi>r\u003c/mi>\u003cmi>ω\u003c/mi>\u003cmtext> (no slip)\u003c/mtext>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmfrac>\u003cmsub>\u003cmi>ω\u003c/mi>\u003cmtext>out\u003c/mtext>\u003c/msub>\u003cmsub>\u003cmi>ω\u003c/mi>\u003cmtext>in\u003c/mtext>\u003c/msub>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>N\u003c/mi>\u003cmtext>in\u003c/mtext>\u003c/msub>\u003cmsub>\u003cmi>N\u003c/mi>\u003cmtext>out\u003c/mtext>\u003c/msub>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A wheel rolling without slipping touches the ground at a point that is momentarily still, so its centre moves at \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>r\u003c/mi>\u003cmi>ω\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. Two gears in mesh share the speed at their contact, so their spins go inversely with their sizes. A drivetrain is a chain of these contacts.","requires":["rigid-kinematics"],"labs":[{"course":"egn3321","title":"Rolling","href":"https://flux-study.pages.dev/egn3321/#/egn3321/u5/rolling","notes":"https://flux-study.pages.dev/egn3321/#/egn3321/u5/rolling?n=s7","note":"A wheel rolling without slip, with each point’s velocity."},{"course":"egn3321","title":"Gears","href":"https://flux-study.pages.dev/egn3321/#/egn3321/u5/gearbox","notes":"https://flux-study.pages.dev/egn3321/#/egn3321/u5/gearbox?n=s8","note":"Gear trains and their speed ratios."},{"course":"egn3321","title":"Bike","href":"https://flux-study.pages.dev/egn3321/#/egn3321/u5/bike","notes":"https://flux-study.pages.dev/egn3321/#/egn3321/u5/bike?n=s9","note":"A road bike’s chainrings, cogs and wheel, from cadence to road speed."}],"problems":["egn3321:u5.16.wheel","egn3321:u5.16.rim-point","egn3321:u5.16.train-sense","egn3321:u5.16.train","egn3321:u5.16.bike"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 1, §11.1 Rolling motion","url":"https://openstax.org/books/university-physics-volume-1/pages/11-1-rolling-motion","why":"The no-slip condition and what it does to the contact point.","level":"Intro"},{"title":"MIT 8.01SC, 35.1 Translation and rotation of a wheel","url":"https://ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/pages/week-12-rotations-and-translation-rolling/35-1-translation-and-rotation-of-a-wheel/","why":"Rolling as translation plus rotation, drawn point by point.","level":"Course level"}]},{"id":"root-finding","title":"Root finding: bisection and Newton","subject":"numerics","courses":["egn3203"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi mathvariant=\"normal\">∣\u003c/mi>\u003cmsub>\u003cmi>e\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003cmi mathvariant=\"normal\">∣\u003c/mi>\u003cmo>≤\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>b\u003c/mi>\u003cmo>−\u003c/mo>\u003cmi>a\u003c/mi>\u003c/mrow>\u003cmsup>\u003cmn>2\u003c/mn>\u003cmrow>\u003cmtext> \u003c/mtext>\u003cmi>n\u003c/mi>\u003cmo>+\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msup>\u003c/mfrac>\u003cmtext> (bisection)\u003c/mtext>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmrow>\u003cmi>n\u003c/mi>\u003cmo>+\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>f\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003cmrow>\u003cmsup>\u003cmi>f\u003c/mi>\u003cmo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′\u003c/mo>\u003c/msup>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"1em\"/>\u003cmsub>\u003cmi>e\u003c/mi>\u003cmrow>\u003cmi>n\u003c/mi>\u003cmo>+\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo>≈\u003c/mo>\u003cmfrac>\u003cmsup>\u003cmi>f\u003c/mi>\u003cmrow>\u003cmo mathvariant=\"normal\">′\u003c/mo>\u003cmo mathvariant=\"normal\">′\u003c/mo>\u003c/mrow>\u003c/msup>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmsup>\u003cmi>f\u003c/mi>\u003cmo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′\u003c/mo>\u003c/msup>\u003c/mrow>\u003c/mfrac>\u003cmtext> \u003c/mtext>\u003cmsubsup>\u003cmi>e\u003c/mi>\u003cmi>n\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msubsup>\u003cmtext> (Newton)\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/span>","idea":"To solve \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>f\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003c/math>\u003c/span>, bisection keeps an interval where \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>f\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> changes sign and halves it each step: slow, one binary digit per step, but certain. Newton's method replaces \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>f\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> by its tangent line at the current guess and jumps to where the tangent crosses zero. Near a simple root the error squares each step, so the correct digits roughly double. Far from the root, or where \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsup>\u003cmi>f\u003c/mi>\u003cmo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′\u003c/mo>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span> is near zero, Newton can overshoot, cycle or land on a different root. Practical solvers start safe and finish with Newton.","requires":["derivative","truncation-error"],"labs":[],"problems":[],"candidate":"Run Newton’s method from a start you drag along the axis of a cubic. It corrects the idea that Newton finds the nearest root: from some starts it jumps to a far root or cycles, while bisection always closes in.","sources":[{"title":"MIT 2.086, calendar: Nonlinear problems, parts 1 to 3","url":"https://ocw.mit.edu/courses/2-086-numerical-computation-for-mechanical-engineers-spring-2013/pages/calendar/","why":"The course’s unit on nonlinear equations, in one unknown and in many.","level":"Course level"},{"title":"Wikipedia, Newton’s method","url":"https://en.wikipedia.org/wiki/Newton%27s_method","why":"The tangent-line picture, quadratic convergence and its failure cases.","level":"Intro"}]},{"id":"rotating-axes","title":"Rotating axes and Coriolis","subject":"mechanics","courses":["egn3321"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>𝐚\u003c/mi>\u003cmi>B\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>𝐚\u003c/mi>\u003cmi>A\u003c/mi>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmover accent=\"true\">\u003cmi mathvariant=\"bold\">Ω\u003c/mi>\u003cmo>˙\u003c/mo>\u003c/mover>\u003cmo>×\u003c/mo>\u003cmi>𝐫\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi mathvariant=\"bold\">Ω\u003c/mi>\u003cmo>×\u003c/mo>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi mathvariant=\"bold\">Ω\u003c/mi>\u003cmo>×\u003c/mo>\u003cmi>𝐫\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>+\u003c/mo>\u003cmn>2\u003c/mn>\u003cmi mathvariant=\"bold\">Ω\u003c/mi>\u003cmo>×\u003c/mo>\u003cmsub>\u003cmi>𝐯\u003c/mi>\u003cmtext>rel\u003c/mtext>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>𝐚\u003c/mi>\u003cmtext>rel\u003c/mtext>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span>","idea":"When a point slides along a body that is itself turning, its acceleration picks up a term no single motion has: \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi mathvariant=\"bold\">Ω\u003c/mi>\u003cmo>×\u003c/mo>\u003cmsub>\u003cmi>𝐯\u003c/mi>\u003cmtext>rel\u003c/mtext>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span>, the Coriolis acceleration. It is why a collar sliding out along a spinning rod pushes sideways on it, and why winds curve on a turning Earth.","requires":["rigid-kinematics"],"labs":[{"course":"egn3321","title":"Coriolis","href":"https://flux-study.pages.dev/egn3321/#/egn3321/u5/coriolis","notes":"https://flux-study.pages.dev/egn3321/#/egn3321/u5/coriolis?n=s6","note":"A collar sliding along a turning rod, with each acceleration term drawn."}],"problems":["egn3321:u5.16.rocker","egn3321:u5.16.coriolis-dir","egn3321:u5.16.cart-rod"],"candidate":null,"sources":[{"title":"MIT 8.01SC, 4.4 Non-inertial reference frames","url":"https://ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/pages/week-2-newtons-laws/4-4-non-inertial-reference-frames/","why":"What changes when the observer accelerates or turns.","level":"Intro"},{"title":"MIT 2.003SC, Velocity, acceleration, and rotational motion","url":"https://ocw.mit.edu/courses/2-003sc-engineering-dynamics-fall-2011/pages/velocity-acceleration-and-rotational-motion/","why":"Derives every term of the rotating-frame acceleration.","level":"Deeper"}]},{"id":"runge-kutta","title":"Runge–Kutta methods","subject":"numerics","courses":["egn3203"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable rowspacing=\"0.25em\" columnalign=\"right left right left\" columnspacing=\"0em 1em 0em\">\u003cmtr>\u003cmtd>\u003cmstyle scriptlevel=\"0\" displaystyle=\"true\">\u003cmsub>\u003cmi>k\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003c/mstyle>\u003c/mtd>\u003cmtd>\u003cmstyle scriptlevel=\"0\" displaystyle=\"true\">\u003cmrow>\u003cmrow>\u003c/mrow>\u003cmo>=\u003c/mo>\u003cmi>f\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsub>\u003cmi>t\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003cmo separator=\"true\">,\u003c/mo>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo separator=\"true\">,\u003c/mo>\u003c/mrow>\u003c/mstyle>\u003c/mtd>\u003cmtd>\u003cmstyle scriptlevel=\"0\" displaystyle=\"true\">\u003cmsub>\u003cmi>k\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mstyle>\u003c/mtd>\u003cmtd>\u003cmstyle scriptlevel=\"0\" displaystyle=\"true\">\u003cmrow>\u003cmrow>\u003c/mrow>\u003cmo>=\u003c/mo>\u003cmi>f\u003c/mi>\u003cmo fence=\"false\" stretchy=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">(\u003c/mo>\u003cmsub>\u003cmi>t\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmfrac>\u003cmi>h\u003c/mi>\u003cmn>2\u003c/mn>\u003c/mfrac>\u003c/mstyle>\u003cmo separator=\"true\">,\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmfrac>\u003cmi>h\u003c/mi>\u003cmn>2\u003c/mn>\u003c/mfrac>\u003c/mstyle>\u003cmsub>\u003cmi>k\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo fence=\"false\" stretchy=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">)\u003c/mo>\u003cmo separator=\"true\">,\u003c/mo>\u003c/mrow>\u003c/mstyle>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd>\u003cmstyle scriptlevel=\"0\" displaystyle=\"true\">\u003cmsub>\u003cmi>k\u003c/mi>\u003cmn>3\u003c/mn>\u003c/msub>\u003c/mstyle>\u003c/mtd>\u003cmtd>\u003cmstyle scriptlevel=\"0\" displaystyle=\"true\">\u003cmrow>\u003cmrow>\u003c/mrow>\u003cmo>=\u003c/mo>\u003cmi>f\u003c/mi>\u003cmo fence=\"false\" stretchy=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">(\u003c/mo>\u003cmsub>\u003cmi>t\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmfrac>\u003cmi>h\u003c/mi>\u003cmn>2\u003c/mn>\u003c/mfrac>\u003c/mstyle>\u003cmo separator=\"true\">,\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmfrac>\u003cmi>h\u003c/mi>\u003cmn>2\u003c/mn>\u003c/mfrac>\u003c/mstyle>\u003cmsub>\u003cmi>k\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo fence=\"false\" stretchy=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">)\u003c/mo>\u003cmo separator=\"true\">,\u003c/mo>\u003c/mrow>\u003c/mstyle>\u003c/mtd>\u003cmtd>\u003cmstyle scriptlevel=\"0\" displaystyle=\"true\">\u003cmsub>\u003cmi>k\u003c/mi>\u003cmn>4\u003c/mn>\u003c/msub>\u003c/mstyle>\u003c/mtd>\u003cmtd>\u003cmstyle scriptlevel=\"0\" displaystyle=\"true\">\u003cmrow>\u003cmrow>\u003c/mrow>\u003cmo>=\u003c/mo>\u003cmi>f\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsub>\u003cmi>t\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmi>h\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmi>h\u003c/mi>\u003cmsub>\u003cmi>k\u003c/mi>\u003cmn>3\u003c/mn>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo separator=\"true\">,\u003c/mo>\u003c/mrow>\u003c/mstyle>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmrow>\u003cmi>n\u003c/mi>\u003cmo>+\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmfrac>\u003cmi>h\u003c/mi>\u003cmn>6\u003c/mn>\u003c/mfrac>\u003c/mstyle>\u003cmtext> \u003c/mtext>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsub>\u003cmi>k\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmn>2\u003c/mn>\u003cmsub>\u003cmi>k\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmn>2\u003c/mn>\u003cmsub>\u003cmi>k\u003c/mi>\u003cmn>3\u003c/mn>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>k\u003c/mi>\u003cmn>4\u003c/mn>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Euler's method steps along the slope at the start of each step, so its global error is first order in \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>h\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. Runge–Kutta methods sample the slope at a few points inside the step and take a weighted mean. The weights are chosen so the step matches the Taylor series of the true solution to higher order. The classic four-stage method is fourth order: halve the step and the error falls sixteenfold, for four slope evaluations per step. Adaptive solvers pair two orders and use their difference to choose the next step.","requires":["euler-method","truncation-error"],"labs":[],"problems":[],"candidate":"Solve one equation with Euler and with RK4 at the same number of slope evaluations. It corrects the idea that many cheap steps beat a few careful ones: at equal work RK4 is accurate to many more digits.","sources":[{"title":"MIT 2.086, calendar: Ordinary differential equations, parts 1 to 3","url":"https://ocw.mit.edu/courses/2-086-numerical-computation-for-mechanical-engineers-spring-2013/pages/calendar/","why":"The ODE lectures, with the recitation on MATLAB ode45.","level":"Course level"},{"title":"Wikipedia, Runge–Kutta methods","url":"https://en.wikipedia.org/wiki/Runge%E2%80%93Kutta_methods","why":"The classic method, Butcher tableaus and adaptive pairs.","level":"Deeper"}]},{"id":"sampling-distributions","title":"Sampling distributions and the central limit theorem","subject":"stats","courses":["sta3032","egn3203"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmover accent=\"true\">\u003cmi>X\u003c/mi>\u003cmo>ˉ\u003c/mo>\u003c/mover>\u003cmo>≈\u003c/mo>\u003cmi>N\u003c/mi>\u003cmtext> ⁣\u003c/mtext>\u003cmrow>\u003cmo fence=\"true\">(\u003c/mo>\u003cmi>μ\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmfrac>\u003cmsup>\u003cmi>σ\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmi>n\u003c/mi>\u003c/mfrac>\u003cmo fence=\"true\">)\u003c/mo>\u003c/mrow>\u003cmtext> for large \u003c/mtext>\u003cmi>n\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A statistic computed from a random sample is itself random, with its own distribution. The mean of \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>n\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> draws has the population's mean and a spread that shrinks as \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmn>1\u003c/mn>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmsqrt>\u003cmi>n\u003c/mi>\u003c/msqrt>\u003c/mrow>\u003c/math>\u003c/span>. Whatever the population's shape, that mean's distribution approaches a normal as \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>n\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> grows. That is why normal tables serve for so many problems.","requires":["random-variables","descriptive-statistics"],"labs":[{"course":"sta3032","title":"Sampling distributions (CLT)","href":"https://flux-study.pages.dev/sta3032/#/sta3032/final/explore/clt","notes":null,"note":"Thousands of sample means from normal, uniform, skewed and two-humped populations."}],"problems":[],"candidate":null,"sources":[{"title":"MIT 18.05, Reading 6a: Expectation, variance, law of large numbers and central limit theorem","url":"https://ocw.mit.edu/courses/18-05-introduction-to-probability-and-statistics-spring-2014/resources/mit18_05s14_reading6a/","why":"The CLT stated carefully, with simulations.","level":"Course level"},{"title":"OpenStax Introductory Statistics 2e, §7.1 The central limit theorem for sample means","url":"https://openstax.org/books/introductory-statistics-2e/pages/7-1-the-central-limit-theorem-for-sample-means-averages","why":"The sample mean’s spread, with worked probabilities.","level":"Intro"}]},{"id":"second-order-circuits","title":"Second-order circuits","subject":"circuits","courses":["eel3111"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>L\u003c/mi>\u003cmover accent=\"true\">\u003cmi>q\u003c/mi>\u003cmo>¨\u003c/mo>\u003c/mover>\u003cmo>+\u003c/mo>\u003cmi>R\u003c/mi>\u003cmover accent=\"true\">\u003cmi>q\u003c/mi>\u003cmo>˙\u003c/mo>\u003c/mover>\u003cmo>+\u003c/mo>\u003cmfrac>\u003cmi>q\u003c/mi>\u003cmi>C\u003c/mi>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmn>0\u003c/mn>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>α\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>R\u003c/mi>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>L\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"1em\"/>\u003cmsub>\u003cmi>ω\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmsqrt>\u003cmrow>\u003cmi>L\u003c/mi>\u003cmi>C\u003c/mi>\u003c/mrow>\u003c/msqrt>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"1em\"/>\u003cmi>ζ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>α\u003c/mi>\u003cmsub>\u003cmi>ω\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>R\u003c/mi>\u003cmn>2\u003c/mn>\u003c/mfrac>\u003cmsqrt>\u003cmfrac>\u003cmi>C\u003c/mi>\u003cmi>L\u003c/mi>\u003c/mfrac>\u003c/msqrt>\u003cmtext> (series)\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A circuit with an inductor and a capacitor stores energy two ways and can pass it back and forth. The loop law gives a second-order equation, and its characteristic roots depend on how the resistance compares with \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsqrt>\u003cmrow>\u003cmi>L\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>C\u003c/mi>\u003c/mrow>\u003c/msqrt>\u003c/mrow>\u003c/math>\u003c/span>. Too much resistance and the response creeps back with no overshoot; too little and it rings at nearly \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsub>\u003cmi>ω\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span> inside a decaying envelope. Critical damping, between the two, is where the roots meet. In a parallel RLC the roles flip: a larger resistance means less damping.","requires":["first-order-circuits"],"labs":[],"problems":[],"candidate":"Step a series and a parallel RLC with a resistance slider, the regime named as it changes. It corrects the idea that more resistance always means more damping: in the parallel circuit it means less.","sources":[{"title":"MIT 6.002, calendar: Lectures 16 and 17, second-order systems","url":"https://ocw.mit.edu/courses/6-002-circuits-and-electronics-spring-2007/pages/calendar/","why":"Transients in second-order circuits, with and without damping.","level":"Course level"},{"title":"OpenStax University Physics Vol. 2, §14.6 RLC series circuits","url":"https://openstax.org/books/university-physics-volume-2/pages/14-6-rlc-series-circuits","why":"The damped RLC oscillation and its mechanical twin.","level":"Intro"}]},{"id":"semi-infinite","title":"Semi-infinite solids","subject":"heat","courses":["eml4140"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmfrac>\u003cmrow>\u003cmi>T\u003c/mi>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmi>s\u003c/mi>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmi>s\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmi mathvariant=\"normal\">erf\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmtext> ⁣\u003c/mtext>\u003cmrow>\u003cmo fence=\"true\">(\u003c/mo>\u003cmfrac>\u003cmi>x\u003c/mi>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmsqrt>\u003cmrow>\u003cmi>α\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/msqrt>\u003c/mrow>\u003c/mfrac>\u003cmo fence=\"true\">)\u003c/mo>\u003c/mrow>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmi>c\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmsqrt>\u003cmrow>\u003cmi>k\u003c/mi>\u003cmi>ρ\u003c/mi>\u003cmi>c\u003c/mi>\u003c/mrow>\u003c/msqrt>\u003cmi>A\u003c/mi>\u003c/msub>\u003cmtext> \u003c/mtext>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmi>A\u003c/mi>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmsqrt>\u003cmrow>\u003cmi>k\u003c/mi>\u003cmi>ρ\u003c/mi>\u003cmi>c\u003c/mi>\u003c/mrow>\u003c/msqrt>\u003cmi>B\u003c/mi>\u003c/msub>\u003cmtext> \u003c/mtext>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmi>B\u003c/mi>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmsqrt>\u003cmrow>\u003cmi>k\u003c/mi>\u003cmi>ρ\u003c/mi>\u003cmi>c\u003c/mi>\u003c/mrow>\u003c/msqrt>\u003cmi>A\u003c/mi>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmsqrt>\u003cmrow>\u003cmi>k\u003c/mi>\u003cmi>ρ\u003c/mi>\u003cmi>c\u003c/mi>\u003c/mrow>\u003c/msqrt>\u003cmi>B\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Early in a heating, or in a body thick enough, the far side has not felt the change yet. The heat equation then has a solution that depends on \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> and \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> only through \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>x\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmsqrt>\u003cmrow>\u003cmi>α\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/msqrt>\u003c/mrow>\u003c/math>\u003c/span>: an error-function profile. The heated depth grows as \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsqrt>\u003cmrow>\u003cmi>α\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/msqrt>\u003c/mrow>\u003c/math>\u003c/span>. When two such bodies touch, the contact temperature is a weighted mean, and the weight is \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsqrt>\u003cmrow>\u003cmi>k\u003c/mi>\u003cmi>ρ\u003c/mi>\u003cmi>c\u003c/mi>\u003c/mrow>\u003c/msqrt>\u003c/mrow>\u003c/math>\u003c/span>. That is why steel at room temperature feels colder than wood at the same temperature.","requires":["heat-equation"],"labs":[],"problems":[],"candidate":"Touch a hand to steel, glass and wood, all at room temperature, and read the contact temperature. It corrects the idea that metal feels cold because it is colder: it draws heat faster, because its \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsqrt>\u003cmrow>\u003cmi>k\u003c/mi>\u003cmi>ρ\u003c/mi>\u003cmi>c\u003c/mi>\u003c/mrow>\u003c/msqrt>\u003c/mrow>\u003c/math>\u003c/span> is larger.","sources":[{"title":"Lienhard, A Heat Transfer Textbook","url":"https://ahtt.mit.edu","why":"Chapter 5 derives the similarity solution and the contact temperature.","level":"Course level"},{"title":"MIT 2.51, calendar: Semi-infinite bodies (session 7)","url":"https://ocw.mit.edu/courses/2-51-intermediate-heat-and-mass-transfer-fall-2008/pages/calendar/","why":"The course gives it its own session after the series solutions.","level":"Course level"}]},{"id":"series","title":"Sequences and series","subject":"calculus","courses":["mac2311"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmunderover>\u003cmo>∑\u003c/mo>\u003cmrow>\u003cmi>n\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003cmi mathvariant=\"normal\">∞\u003c/mi>\u003c/munderover>\u003cmsup>\u003cmi>r\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msup>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmrow>\u003cmn>1\u003c/mn>\u003cmo>−\u003c/mo>\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmtext>  \u003c/mtext>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi mathvariant=\"normal\">∣\u003c/mi>\u003cmi>r\u003c/mi>\u003cmi mathvariant=\"normal\">∣\u003c/mi>\u003cmo>&lt;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/math>\u003c/span>","idea":"An infinite series is the limit of its partial sums. Terms going to zero is needed but not enough: the harmonic series still diverges. Tests compare a series with one whose fate is known, an integral, a geometric series or a smaller or larger series. An alternating series whose terms shrink steadily to zero converges, and its error is less than the first term left out.","requires":["limits","improper-integrals"],"labs":[{"course":"mac2311","title":"Series","href":"https://flux-study.pages.dev/mac2311/#/mac2311/c6/series","notes":"https://flux-study.pages.dev/mac2311/#/mac2311/c6/series?n=s4","note":"Partial sums of four series: which test each one passes."}],"problems":[],"candidate":null,"sources":[{"title":"OpenStax Calculus Vol. 2, §5.2 Infinite series","url":"https://openstax.org/books/calculus-volume-2/pages/5-2-infinite-series","why":"Partial sums, the geometric series and why the harmonic one diverges.","level":"Intro"},{"title":"OpenStax Calculus Vol. 2, §5.3 The divergence and integral tests","url":"https://openstax.org/books/calculus-volume-2/pages/5-3-the-divergence-and-integral-tests","why":"The integral test, with the tail estimate that comes with it.","level":"Course leve
