l"}]},{"id":"simple-harmonic-motion","title":"Simple harmonic motion","subject":"mechanics","courses":["phy2048"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>m\u003c/mi>\u003cmover accent=\"true\">\u003cmi>x\u003c/mi>\u003cmo>¨\u003c/mo>\u003c/mover>\u003cmo>=\u003c/mo>\u003cmo>−\u003c/mo>\u003cmi>k\u003c/mi>\u003cmi>x\u003c/mi>\u003cmtext>  \u003c/mtext>\u003cmo>⇒\u003c/mo>\u003cmtext>  \u003c/mtext>\u003cmi>x\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>A\u003c/mi>\u003cmi>cos\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>ω\u003c/mi>\u003cmi>t\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>ϕ\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"1em\"/>\u003cmi>ω\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsqrt>\u003cmfrac>\u003cmi>k\u003c/mi>\u003cmi>m\u003c/mi>\u003c/mfrac>\u003c/msqrt>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A restoring force proportional to displacement gives sinusoidal motion whose period does not depend on the amplitude. Energy swaps between the spring and the motion. A pendulum is harmonic only for small swings, with \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>T\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>2\u003c/mn>\u003cmi>π\u003c/mi>\u003cmsqrt>\u003cmrow>\u003cmi>L\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>g\u003c/mi>\u003c/mrow>\u003c/msqrt>\u003c/mrow>\u003c/math>\u003c/span>; a swinging rod is a physical pendulum with its own effective length. A tuned mass damper uses a second oscillator to fight the first.","requires":["newtons-second-law"],"labs":[{"course":"phy2048","title":"Spring and mass","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u11/spring-mass","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u11/spring-mass?n=s1","note":"A mass on a spring: the period set by m and k, not by the amplitude."},{"course":"phy2048","title":"Pendulum","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u11/pendulum","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u11/pendulum?n=s3","note":"Simple and physical pendulums, and where the small-angle period breaks down."},{"course":"phy2048","title":"Skyscraper damper","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u11/skyscraper-damper","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u11/skyscraper-damper?n=s5","note":"A pendulum damper tuned to a tower’s sway."}],"problems":["phy2048:ch15.ultrasound","phy2048:ch15.block","phy2048:ch15.motion","phy2048:ch15.energy","phy2048:ch15.vertical","phy2048:ch15.concept-period","phy2048:ch15.concept-phase","phy2048:ch15.pendulum-g","phy2048:ch15.concept-pendulum","phy2048:ch15.skyscraper"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 1, §15.1 Simple harmonic motion","url":"https://openstax.org/books/university-physics-volume-1/pages/15-1-simple-harmonic-motion","why":"The spring-mass system solved and its energy tracked.","level":"Intro"},{"title":"OpenStax University Physics Vol. 1, §15.4 Pendulums","url":"https://openstax.org/books/university-physics-volume-1/pages/15-4-pendulums","why":"Simple, physical and torsional pendulums side by side.","level":"Intro"}]},{"id":"sinusoidal-response","title":"Sinusoidal response, gain and phase","subject":"diffeq","courses":["map2302"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmover accent=\"true\">\u003cmi>y\u003c/mi>\u003cmo>˙\u003c/mo>\u003c/mover>\u003cmo>+\u003c/mo>\u003cmi>k\u003c/mi>\u003cmi>y\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>k\u003c/mi>\u003cmi>cos\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>ω\u003c/mi>\u003cmi>t\u003c/mi>\u003cmtext>  \u003c/mtext>\u003cmo>⇒\u003c/mo>\u003cmtext>  \u003c/mtext>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>p\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>k\u003c/mi>\u003cmsqrt>\u003cmrow>\u003cmsup>\u003cmi>k\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>+\u003c/mo>\u003cmsup>\u003cmi>ω\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/msqrt>\u003c/mfrac>\u003cmi>cos\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>ω\u003c/mi>\u003cmi>t\u003c/mi>\u003cmo>−\u003c/mo>\u003cmi>ϕ\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"1em\"/>\u003cmi>tan\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>ϕ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>ω\u003c/mi>\u003cmi>k\u003c/mi>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Drive a linear system with a sinusoid and, once the start fades, it answers at the same frequency, scaled by a gain and delayed by a phase. Writing the input as the real part of \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsup>\u003cmi>e\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmi>ω\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span> turns the calculus into algebra with complex numbers. Slow inputs are followed closely; fast ones are attenuated and lag.","requires":["first-order-odes"],"labs":[{"course":"map2302","title":"First-order response","href":"https://flux-study.pages.dev/map2302/#/map2302/u1/first-order-response","notes":"https://flux-study.pages.dev/map2302/#/map2302/u1/first-order-response?n=s7","note":"Slow and fast forcing: gain and lag change, the start only adds a transient."}],"problems":["map2302:u1.gain"],"candidate":null,"sources":[{"title":"MIT 18.03SC, Exponential input; gain and phase lag","url":"https://ocw.mit.edu/courses/18-03sc-differential-equations-fall-2011/pages/unit-i-first-order-differential-equations/exponential-input-gain-and-phase-lag/","why":"Complex exponentials applied to first-order response.","level":"Course level"},{"title":"MIT 18.03SC, Complex arithmetic and exponentials","url":"https://ocw.mit.edu/courses/18-03sc-differential-equations-fall-2011/pages/unit-i-first-order-differential-equations/complex-arithmetic-and-exponentials/","why":"The complex-number tools the method needs.","level":"Intro"}]},{"id":"sound-intensity","title":"Sound intensity and decibels","subject":"mechanics","courses":["phy2048"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>P\u003c/mi>\u003cmrow>\u003cmn>4\u003c/mn>\u003cmi>π\u003c/mi>\u003cmsup>\u003cmi>r\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>β\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>10\u003c/mn>\u003cmsub>\u003cmrow>\u003cmi>log\u003c/mi>\u003cmo>⁡\u003c/mo>\u003c/mrow>\u003cmn>10\u003c/mn>\u003c/msub>\u003cmfrac>\u003cmi>I\u003c/mi>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003c/mfrac>\u003cmtext> dB\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Sound spreading from a small source shares its power over a growing sphere, so intensity falls as \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmn>1\u003c/mn>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmsup>\u003cmi>r\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span>. The ear works on ratios, so loudness is measured in decibels: double the distance and the level drops about 6 dB. Two sources that are not in step add their intensities, not their levels.","requires":["mechanical-waves"],"labs":[{"course":"phy2048","title":"Intensity","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u13/intensity","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u13/intensity?n=s2","note":"A loudspeaker in the open: intensity against distance, and two sources added."}],"problems":["phy2048:ch17.level","phy2048:ch17.ratio","phy2048:ch17.distance","phy2048:ch17.pair","phy2048:ch17.path","phy2048:ch17.concept-add"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 1, §17.4 Sound intensity","url":"https://openstax.org/books/university-physics-volume-1/pages/17-4-sound-intensity","why":"Intensity, the decibel scale and hearing thresholds.","level":"Intro"},{"title":"OpenStax University Physics Vol. 1, §17.2 Speed of sound","url":"https://openstax.org/books/university-physics-volume-1/pages/17-2-speed-of-sound","why":"What sets sound’s speed in air and other media.","level":"Intro"}]},{"id":"standing-waves","title":"Standing waves and resonance","subject":"mechanics","courses":["phy2048"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>f\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>n\u003c/mi>\u003cmi>v\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>L\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmtext> (string, open pipe)\u003c/mtext>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>f\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>n\u003c/mi>\u003cmi>v\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmn>4\u003c/mn>\u003cmi>L\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmi>n\u003c/mi>\u003cmtext> odd (stopped pipe)\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Waves reflecting back and forth between two ends add to a pattern that stays in place, with nodes that never move. Only wavelengths that fit the ends survive, so a string or pipe has a set of resonant frequencies. A pipe closed at one end fits only odd quarter waves, so it has only odd harmonics. Two close frequencies beat at their difference.","requires":["mechanical-waves"],"labs":[{"course":"phy2048","title":"Standing wave","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u12/standing-wave","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u12/standing-wave?n=s5","note":"A string fixed at both ends: modes, nodes and antinodes."},{"course":"phy2048","title":"Pipe modes","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u13/pipe-modes","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u13/pipe-modes?n=s3","note":"Stopped and open organ pipes, and two tuning forks beating."}],"problems":["phy2048:ch16.modes","phy2048:ch16.concept-end","phy2048:ch17.air","phy2048:ch17.stopped","phy2048:ch17.open","phy2048:ch17.beats","phy2048:ch17.concept-pipe","phy2048:ch17.concept-medium"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 1, §16.6 Standing waves and resonance","url":"https://openstax.org/books/university-physics-volume-1/pages/16-6-standing-waves-and-resonance","why":"Nodes, antinodes and the allowed frequencies of a string.","level":"Intro"},{"title":"OpenStax University Physics Vol. 1, §17.5 Normal modes of a standing sound wave","url":"https://openstax.org/books/university-physics-volume-1/pages/17-5-normal-modes-of-a-standing-sound-wave","why":"Open and stopped pipes compared.","level":"Intro"}]},{"id":"static-equilibrium","title":"Static equilibrium","subject":"mechanics","courses":["phy2048","statics"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmo>∑\u003c/mo>\u003cmi>𝐅\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>𝟎\u003c/mn>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmo>∑\u003c/mo>\u003cmsub>\u003cmi>𝐌\u003c/mi>\u003cmi>O\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>𝟎\u003c/mn>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A body at rest has no net force and no net moment about any point. Take moments about the point where the most unknown forces act and they drop out. A support force that reaches zero is the edge of tipping. A ladder against a smooth wall needs friction at the floor, and how much depends on the angle and where the climber stands.","requires":["newtons-second-law","vectors","moments","particle-equilibrium"],"labs":[{"course":"phy2048","title":"Car weight balance","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u8/car-balance","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u8/car-balance?n=s1","note":"Where a car’s centre of mass sits between the axles, and the load shift under braking."},{"course":"phy2048","title":"Beam","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u8/beam","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u8/beam?n=s2","note":"A board on two supports as a person walks along it, to the point of tipping."},{"course":"phy2048","title":"Ladder","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u8/ladder","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u8/ladder?n=s3","note":"A ladder on a smooth wall and the floor friction it needs."},{"course":"statics","title":"Reactions","href":"https://flux-study.pages.dev/statics/#/statics/u3/reactions","notes":"https://flux-study.pages.dev/statics/#/statics/u3/reactions?n=s1","note":"Support reactions for bodies on pins, rollers and fixed supports."}],"problems":["phy2048:ch12.car","phy2048:ch12.concept-pivot","phy2048:ch12.beam","phy2048:ch12.concept-count","phy2048:ch12.ladder","phy2048:ch12.concept-ladder","statics:ch5.beam-reactions","statics:ch5.distributed","statics:ch5.cantilever"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 1, §12.1 Conditions for static equilibrium","url":"https://openstax.org/books/university-physics-volume-1/pages/12-1-conditions-for-static-equilibrium","why":"Both conditions, and choosing the pivot.","level":"Intro"},{"title":"OpenStax University Physics Vol. 1, §12.2 Examples of static equilibrium","url":"https://openstax.org/books/university-physics-volume-1/pages/12-2-examples-of-static-equilibrium","why":"Beams, ladders and hinges worked through.","level":"Intro"}]},{"id":"strengthening","title":"Strengthening mechanisms","subject":"matsci","courses":["ema3010"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>σ\u003c/mi>\u003cmi>y\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>σ\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>k\u003c/mi>\u003cmi>y\u003c/mi>\u003c/msub>\u003cmtext> \u003c/mtext>\u003cmsup>\u003cmi>d\u003c/mi>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmn>2\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmtext> (Hall–Petch)\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A metal yields when dislocations move, so every way of strengthening it puts obstacles in their path. Grain boundaries stop them, and smaller grains mean more boundaries, giving the Hall–Petch rise with \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsup>\u003cmi>d\u003c/mi>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmn>2\u003c/mn>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span>. Solute atoms strain the lattice around them; cold work multiplies dislocations until they tangle; fine precipitates pin them. Those come from quenching the alloy to trap the solute, then ageing it so tiny particles form; slow cooling grows coarse ones that barely help. Each one costs ductility, and annealing gives it back.","requires":["dislocations","phase-diagrams"],"labs":[],"problems":[],"candidate":"Change the grain size and plot yield strength against \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsup>\u003cmi>d\u003c/mi>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmn>2\u003c/mn>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span>. It corrects the idea that more grain boundaries, being flaws, make a metal weaker.","sources":[{"title":"Grain boundary strengthening (Wikipedia)","url":"https://en.wikipedia.org/wiki/Grain_boundary_strengthening","why":"Hall–Petch, its pile-up argument and where it stops working.","level":"Course level"},{"title":"Precipitation hardening (Wikipedia)","url":"https://en.wikipedia.org/wiki/Precipitation_hardening","why":"Solution treatment, quench and ageing, tied to the solvus on the phase diagram.","level":"Course level"}]},{"id":"stress-concentration","title":"Stress concentration","subject":"materials","courses":["egn3331"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>σ\u003c/mi>\u003cmtext>max\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>K\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmtext> \u003c/mtext>\u003cmsub>\u003cmi>σ\u003c/mi>\u003cmtext>nom\u003c/mtext>\u003c/msub>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>K\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>+\u003c/mo>\u003cmn>2\u003c/mn>\u003cmsqrt>\u003cmfrac>\u003cmi>a\u003c/mi>\u003cmi>ρ\u003c/mi>\u003c/mfrac>\u003c/msqrt>\u003cmtext> (elliptical hole)\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Stress flowing round a hole or notch crowds at its edge. How much depends on how sharp the edge is across the load, not on the hole's size. A crack is a very sharp notch, so the peak is enormous; drilling a round hole at its tip blunts it and stops it growing.","requires":["stress-on-a-section"],"labs":[{"course":"egn3331","title":"Stop-drilled crack","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u3/crack","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u3/crack?n=s8","note":"A crack in a skin panel, stop-drilled to blunt its tip."}],"problems":["egn3331:u3.4.hole","egn3331:u3.4.notch"],"candidate":null,"sources":[{"title":"MIT 3.11, calendar: Experimental stress analysis (24)","url":"https://ocw.mit.edu/courses/3-11-mechanics-of-materials-fall-1999/pages/calendar/","why":"Where the course’s reading measures stress raisers.","level":"Deeper"},{"title":"MIT 2.001, Lecture 17: Failure of materials and examples","url":"https://ocw.mit.edu/courses/2-001-mechanics-materials-i-fall-2006/resources/lec17/","why":"Stress raisers in the context of failure.","level":"Course level"}]},{"id":"stress-on-a-section","title":"Stress on a cut","subject":"materials","courses":["egn3331"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>σ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>P\u003c/mi>\u003cmi>A\u003c/mi>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>τ\u003c/mi>\u003cmtext>avg\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>V\u003c/mi>\u003cmi>A\u003c/mi>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmtext>FS\u003c/mtext>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>σ\u003c/mi>\u003cmtext>fail\u003c/mtext>\u003c/msub>\u003cmsub>\u003cmi>σ\u003c/mi>\u003cmtext>allow\u003c/mtext>\u003c/msub>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Cut a loaded member and the internal force spreads over the cut as stress. Across the cut it is normal stress; along it, shear. The same bar shows different stresses on different planes: an axial load puts its largest shear at 45 degrees. A pin in double shear is cut on two planes, so it carries half the stress. Designs keep stress below the failure value by a factor of safety.","requires":["static-equilibrium"],"labs":[{"course":"egn3331","title":"Inclined cut","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u1/cut","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u1/cut?n=s2","note":"A bar cut at any angle: normal and shear stress on the plane, with the shear largest at 45°."},{"course":"egn3331","title":"Truss stress","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u1/truss-stress","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u1/truss-stress?n=s4","note":"Stress in a Pratt truss’s members, against an allowable stress."},{"course":"egn3331","title":"Pins","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u1/pins","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u1/pins?n=s5","note":"A pin in single and double shear, with bearing on the plate."},{"course":"egn3331","title":"Shackle","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u1/shackle","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u1/shackle?n=s6","note":"A rated shackle: the bow pin is in double shear, and the proof load doubles the stress."}],"problems":["egn3331:u1.1.avg-normal","egn3331:u1.1.inclined","egn3331:u1.1.fos","egn3331:u1.1.plane","egn3331:u1.1.margin","egn3331:u1.1.truss-stress","egn3331:u1.1.truss-area","egn3331:u1.1.area-force","egn3331:u1.1.double-shear","egn3331:u1.1.pin-joint","egn3331:u1.1.planes","egn3331:u1.1.lug","egn3331:u1.1.which-area","egn3331:u1.1.shackle"],"candidate":null,"sources":[{"title":"MIT 2.001, Lecture 8: Uniaxial loading and material properties","url":"https://ocw.mit.edu/courses/2-001-mechanics-materials-i-fall-2006/resources/lec8/","why":"Average stress in bars and connections, set up from cuts.","level":"Course level"},{"title":"OpenStax University Physics Vol. 1, §12.3 Stress, strain, and elastic modulus","url":"https://openstax.org/books/university-physics-volume-1/pages/12-3-stress-strain-and-elastic-modulus","why":"Tensile and shear stress defined on simple members.","level":"Intro"}]},{"id":"stress-strain","title":"Stress, strain and Hooke’s law","subject":"materials","courses":["phy2048","egn3331"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>σ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>F\u003c/mi>\u003cmi>A\u003c/mi>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>ε\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmi>L\u003c/mi>\u003c/mrow>\u003cmi>L\u003c/mi>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>σ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>E\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>ε\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Stress is force per area and strain is stretch per length, so they compare bars of any size. Below the yield point a material is elastic: stress is proportional to strain, and the bar springs back. Past yield it flows, and unloading leaves a permanent set.","requires":["static-equilibrium"],"labs":[{"course":"phy2048","title":"Stress and strain","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u8/stress-strain","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u8/stress-strain?n=s4","note":"A bar stretched by \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>F\u003c/mi>\u003cmi>L\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>A\u003c/mi>\u003cmi>E\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>, then past yield, with the permanent set on unloading."},{"course":"egn3331","title":"Tension test","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u2/tension-test","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u2/tension-test?n=s1","note":"A tension curve: E as the first slope, unloading along E, and the 0.2% offset yield."},{"course":"egn3331","title":"Brace rod","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u2/brace","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u2/brace?n=s2","note":"A building brace rod stretched past yield does not spring all the way back."}],"problems":["phy2048:ch12.rod","phy2048:ch12.pillar","phy2048:ch12.shear","phy2048:ch12.yield","phy2048:ch12.concept-stress","egn3331:u2.2.normal-strain","egn3331:u2.2.hooke","egn3331:u2.3.permanent-set","egn3331:u2.2.unload","egn3331:u2.2.brace-english","egn3331:u2.2.rigid-bar"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 1, §12.3 Stress, strain, and elastic modulus","url":"https://openstax.org/books/university-physics-volume-1/pages/12-3-stress-strain-and-elastic-modulus","why":"Tensile, bulk and shear moduli with a table of materials.","level":"Intro"},{"title":"OpenStax University Physics Vol. 1, §12.4 Elasticity and plasticity","url":"https://openstax.org/books/university-physics-volume-1/pages/12-4-elasticity-and-plasticity","why":"The stress-strain curve past the elastic limit.","level":"Intro"}]},{"id":"stress-transformation","title":"Stress transformation and Mohr’s circle","subject":"materials","courses":["egn3331"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>σ\u003c/mi>\u003cmrow>\u003cmn>1\u003c/mn>\u003cmo separator=\"true\">,\u003c/mo>\u003cmn>2\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>σ\u003c/mi>\u003cmi>x\u003c/mi>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>σ\u003c/mi>\u003cmi>y\u003c/mi>\u003c/msub>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/mfrac>\u003cmo>±\u003c/mo>\u003cmsqrt>\u003cmrow>\u003cmsup>\u003cmrow>\u003cmo fence=\"true\">(\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>σ\u003c/mi>\u003cmi>x\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>σ\u003c/mi>\u003cmi>y\u003c/mi>\u003c/msub>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/mfrac>\u003cmo fence=\"true\">)\u003c/mo>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>+\u003c/mo>\u003cmsubsup>\u003cmi>τ\u003c/mi>\u003cmrow>\u003cmi>x\u003c/mi>\u003cmi>y\u003c/mi>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/msubsup>\u003c/mrow>\u003c/msqrt>\u003c/mrow>\u003c/math>\u003c/span>","idea":"The stresses on an element depend on how it is turned. Turning it by \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>θ\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> moves its point round Mohr's circle by \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>θ\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. The circle's ends are the principal stresses, on planes with no shear, and its radius is the largest in-plane shear. Bending and torsion together meet at the outer fibre, where the principal stress is neither of them alone.","requires":["stress-on-a-section"],"labs":[{"course":"egn3331","title":"Mohr's circle","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u5/mohr","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u5/mohr?n=s1","note":"Turn the element and watch its point move round the circle by twice the angle."},{"course":"egn3331","title":"Combined loading","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u5/combined","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u5/combined?n=s6","note":"Bending and torsion at the outer fibre: principal stress and von Mises."},{"course":"egn3331","title":"Trailer ball shank","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u5/hitch","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u5/hitch?n=s7","note":"A trailer-ball shank: two loads add on one side and subtract on the other."}],"problems":["egn3331:u5.9.rotate","egn3331:u5.9.principal","egn3331:u5.9.shear","egn3331:u5.9.plane","egn3331:u5.9.from-principals","egn3331:u5.9.abs-shear","egn3331:u5.9.brittle","egn3331:u5.9.twist-break","egn3331:u5.9.combined","egn3331:u5.9.torque","egn3331:u5.9.theory","egn3331:u5.9.shaft-size","egn3331:u5.9.hitch-english","egn3331:u5.9.side"],"candidate":null,"sources":[{"title":"MIT 2.001, Lecture 15: Stress transformations and principal stress","url":"https://ocw.mit.edu/courses/2-001-mechanics-materials-i-fall-2006/resources/lec15/","why":"The transformation equations and Mohr’s circle derived.","level":"Course level"},{"title":"MIT 3.11, calendar: Tensor transformations, Mohr’s circle (17)","url":"https://ocw.mit.edu/courses/3-11-mechanics-of-materials-fall-1999/pages/calendar/","why":"The tensor view, from the course’s reading.","level":"Deeper"}]},{"id":"superposition","title":"Linearity and superposition","subject":"circuits","courses":["eel3111"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>𝐯\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsup>\u003cmi>G\u003c/mi>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmsub>\u003cmi>𝐢\u003c/mi>\u003cmi>s\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmunder>\u003cmo>∑\u003c/mo>\u003cmi>k\u003c/mi>\u003c/munder>\u003cmsup>\u003cmi>G\u003c/mi>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmsub>\u003cmi>𝐢\u003c/mi>\u003cmrow>\u003cmi>s\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>k\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmtext>source off: \u003c/mtext>\u003cmi>V\u003c/mi>\u003cmo>→\u003c/mo>\u003cmtext>short\u003c/mtext>\u003cmo separator=\"true\">,\u003c/mo>\u003cmtext>  \u003c/mtext>\u003cmi>I\u003c/mi>\u003cmo>→\u003c/mo>\u003cmtext>open\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A circuit of resistors and sources is linear: the node equations are \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>G\u003c/mi>\u003cmi>𝐯\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>𝐢\u003c/mi>\u003cmi>s\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span>, and the sources appear only on the right. So the response to several sources is the sum of the responses to each one alone. To leave a source out, set it to zero: a voltage source becomes a wire, a current source a break. Dependent sources stay in. Power is not linear in the sources, so add voltages and currents first, then find the power.","requires":["nodal-analysis"],"labs":[],"problems":[],"candidate":"Two sources feeding one resistor, switched on one at a time and then together. It corrects the idea that powers add like currents: the currents add, but the power with both on is not the sum of the two powers.","sources":[{"title":"MIT 6.002, calendar: Lecture 3, linearity, superposition, Thévenin","url":"https://ocw.mit.edu/courses/6-002-circuits-and-electronics-spring-2007/pages/calendar/","why":"Superposition and the equivalent circuits share one lecture.","level":"Course level"},{"title":"Kuphaldt, Lessons in Electric Circuits, Vol. I: DC","url":"https://www.allaboutcircuits.com/textbook/direct-current/","why":"Network theorems, superposition among them, worked step by step.","level":"Intro"}]},{"id":"surface-flux","title":"Flux through a surface","subject":"calculus","courses":["mac2313"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi mathvariant=\"normal\">Φ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmo>∬\u003c/mo>\u003cmi>S\u003c/mi>\u003c/msub>\u003cmi>𝐅\u003c/mi>\u003cmo>⋅\u003c/mo>\u003cmover accent=\"true\">\u003cmi>n\u003c/mi>\u003cmo>^\u003c/mo>\u003c/mover>\u003cmtext>  \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"The same idea one dimension up: add the normal component of the field over a surface. The hard part is usually \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmover accent=\"true\">\u003cmi>n\u003c/mi>\u003cmo>^\u003c/mo>\u003c/mover>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>, the area element with its direction. For a fluid, \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>𝐅\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>ρ\u003c/mi>\u003cmi>𝐯\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> and the flux is the mass crossing per second.","requires":["flux-2d"],"labs":[{"course":"phy2049","title":"Gauss","href":"https://flux-study.pages.dev/phy2049/#/phy2049/e2/gauss","notes":null,"note":"Colours a closed surface by \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>𝐄\u003c/mi>\u003cmo>⋅\u003c/mo>\u003cmover accent=\"true\">\u003cmi>n\u003c/mi>\u003cmo>^\u003c/mo>\u003c/mover>\u003c/mrow>\u003c/math>\u003c/span>, from inward to outward."}],"problems":["phy2049:e2.36c.zero-flux","phy2049:e2.36c.surfaces","phy2049:e2.36c.hoop-flux","phy2049:e2.36c.rect-flux","phy2049:e2.36c.hoop-nonuniform","phy2049:e2.36c.insulating-sphere","phy2049:e2.36c.long-wire","phy2049:e2.36c.sheet"],"candidate":null,"sources":[{"title":"OpenStax Calculus Vol. 3, §6.6 Surface integrals","url":"https://openstax.org/books/calculus-volume-3/pages/6-6-surface-integrals","why":"Parametrized surfaces step by step, then flux as a special case.","level":"Course level"},{"title":"MIT 18.02SC, Session 81: Calculating flux, finding n dS","url":"https://ocw.mit.edu/courses/18-02sc-multivariable-calculus-fall-2010/resources/mit18_02sc_mnotes_v9-2/","why":"One clean worked example of the area element, the step that trips people up.","level":"Course level"}]},{"id":"surface-tension","title":"Surface tension and capillarity","subject":"fluids","courses":["eml3015"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmi>p\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>σ\u003c/mi>\u003cmrow>\u003cmo fence=\"true\">(\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003c/mfrac>\u003cmo>+\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mfrac>\u003cmo fence=\"true\">)\u003c/mo>\u003c/mrow>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>h\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>σ\u003c/mi>\u003cmi>cos\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>θ\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>ρ\u003c/mi>\u003cmi>g\u003c/mi>\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A liquid's surface pulls along itself with a force \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>σ\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> per unit length. A curved surface pulls inward, so the pressure on its concave side is higher, by \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>σ\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> times the curvature. In a thin tube the wetted wall pulls the edge up, and the column rises until its weight balances the pull around the rim. The rim grows as \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> and the weight as \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsup>\u003cmi>r\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span>, so a narrower tube lifts water higher.","requires":["pressure","particle-equilibrium"],"labs":[],"problems":[],"candidate":"Dip glass tubes of several radii in water and mercury. It corrects the idea that a wider tube draws liquid higher: rise goes as \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmn>1\u003c/mn>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>, and mercury, which does not wet glass, sinks instead.","sources":[{"title":"MIT 2.06, Lecture notes: Surface tension","url":"https://ocw.mit.edu/courses/2-06-fluid-dynamics-spring-2013/resources/mit2_06s13_notes_st/","why":"The course’s own notes on the pressure jump and capillary rise.","level":"Course level"},{"title":"OpenStax College Physics 2e, §11.8 Cohesion and adhesion in liquids","url":"https://openstax.org/books/college-physics-2e/pages/11-8-cohesion-and-adhesion-in-liquids-surface-tension-and-capillary-action","why":"Surface tension, contact angle and capillary action, at a first-course level.","level":"Intro"}]},{"id":"symmetric-quadratic","title":"Symmetric matrices and quadratic forms","subject":"linalg","courses":["egn3203"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>A\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsup>\u003cmi>A\u003c/mi>\u003cmi mathvariant=\"sans-serif\">T\u003c/mi>\u003c/msup>\u003cmtext>  \u003c/mtext>\u003cmo>⇒\u003c/mo>\u003cmtext>  \u003c/mtext>\u003cmi>A\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>Q\u003c/mi>\u003cmi mathvariant=\"normal\">Λ\u003c/mi>\u003cmsup>\u003cmi>Q\u003c/mi>\u003cmi mathvariant=\"sans-serif\">T\u003c/mi>\u003c/msup>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"1em\"/>\u003cmsup>\u003cmi>Q\u003c/mi>\u003cmi mathvariant=\"sans-serif\">T\u003c/mi>\u003c/msup>\u003cmi>Q\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>I\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsup>\u003cmi>𝐱\u003c/mi>\u003cmi mathvariant=\"sans-serif\">T\u003c/mi>\u003c/msup>\u003cmi>A\u003c/mi>\u003cmi>𝐱\u003c/mi>\u003cmo>&gt;\u003c/mo>\u003cmn>0\u003c/mn>\u003cmtext>  \u003c/mtext>\u003cmi mathvariant=\"normal\">∀\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>𝐱\u003c/mi>\u003cmo mathvariant=\"normal\">≠\u003c/mo>\u003cmn>𝟎\u003c/mn>\u003cmtext>  \u003c/mtext>\u003cmo>⟺\u003c/mo>\u003cmtext>  \u003c/mtext>\u003cmtext>all \u003c/mtext>\u003cmsub>\u003cmi>λ\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&gt;\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A symmetric matrix has real eigenvalues and perpendicular eigenvectors, so it is a set of stretches along perpendicular axes. The quadratic form \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsup>\u003cmi>𝐱\u003c/mi>\u003cmi mathvariant=\"sans-serif\">T\u003c/mi>\u003c/msup>\u003cmi>A\u003c/mi>\u003cmi>𝐱\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> is then a sum of \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsub>\u003cmi>λ\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span> times squared coordinates along those axes. If every \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsub>\u003cmi>λ\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span> is positive the form is a bowl, and the matrix is positive definite. Stiffness matrices, stress tensors and Hessians are symmetric, so strain energy, principal stresses and the second-derivative test all reduce to this one fact.","requires":["eigenvalues","orthogonality-projection"],"labs":[],"problems":[],"candidate":"Edit a symmetric 2×2 matrix and draw the level curves of \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsup>\u003cmi>𝐱\u003c/mi>\u003cmi mathvariant=\"sans-serif\">T\u003c/mi>\u003c/msup>\u003cmi>A\u003c/mi>\u003cmi>𝐱\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> with its eigenvectors. It corrects the idea that positive entries make a matrix positive definite: \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmo fence=\"true\">[\u003c/mo>\u003cmtable rowspacing=\"0.16em\" columnalign=\"center center\" columnspacing=\"1em\">\u003cmtr>\u003cmtd>\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmn>1\u003c/mn>\u003c/mstyle>\u003c/mtd>\u003cmtd>\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmn>2\u003c/mn>\u003c/mstyle>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd>\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmn>2\u003c/mn>\u003c/mstyle>\u003c/mtd>\u003cmtd>\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmn>1\u003c/mn>\u003c/mstyle>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003cmo fence=\"true\">]\u003c/mo>\u003c/mrow>\u003c/math>\u003c/span> has eigenvalues 3 and \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/math>\u003c/span>, a saddle.","sources":[{"title":"MIT 18.06SC Linear Algebra, Fall 2011","url":"https://ocw.mit.edu/courses/18-06sc-linear-algebra-fall-2011/","why":"Unit III is symmetric and positive definite matrices and where they are used.","level":"Course level"},{"title":"Margalit and Rabinoff, Interactive Linear Algebra","url":"https://textbooks.math.gatech.edu/ila/","why":"Orthogonal bases and diagonalization, which the spectral theorem combines.","level":"Course level"}]},{"id":"taylor-series","title":"Taylor and power series","subject":"calculus","courses":["mac2311"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>f\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmunderover>\u003cmo>∑\u003c/mo>\u003cmrow>\u003cmi>n\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003cmi mathvariant=\"normal\">∞\u003c/mi>\u003c/munderover>\u003cmfrac>\u003cmrow>\u003cmsup>\u003cmi>f\u003c/mi>\u003cmrow>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>n\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/msup>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>a\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003cmrow>\u003cmi>n\u003c/mi>\u003cmo stretchy=\"false\">!\u003c/mo>\u003c/mrow>\u003c/mfrac>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>−\u003c/mo>\u003cmi>a\u003c/mi>\u003cmsup>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmi>n\u003c/mi>\u003c/msup>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi mathvariant=\"normal\">∣\u003c/mi>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003cmi mathvariant=\"normal\">∣\u003c/mi>\u003cmo>≤\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>M\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi mathvariant=\"normal\">∣\u003c/mi>\u003cmi>x\u003c/mi>\u003cmo>−\u003c/mo>\u003cmi>a\u003c/mi>\u003cmsup>\u003cmi mathvariant=\"normal\">∣\u003c/mi>\u003cmrow>\u003cmi>n\u003c/mi>\u003cmo>+\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003cmrow>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>n\u003c/mi>\u003cmo>+\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo stretchy=\"false\">!\u003c/mo>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A smooth function near a point is matched, term by term, by a polynomial built from its derivatives there. More terms match it further out, up to the series' radius of convergence. The remainder bound says how many terms a given accuracy needs. A pendulum's period at large swings is a series correction to the small-angle formula.","requires":["series","derivative"],"labs":[{"course":"mac2311","title":"Taylor","href":"https://flux-study.pages.dev/mac2311/#/mac2311/c6/taylor","notes":"https://flux-study.pages.dev/mac2311/#/mac2311/c6/taylor?n=s9","note":"Change the order and centre of a Taylor polynomial and compare its error."},{"course":"mac2311","title":"Pendulum clock","href":"https://flux-study.pages.dev/mac2311/#/mac2311/c6/clock","notes":"https://flux-study.pages.dev/mac2311/#/mac2311/c6/clock?n=s10","note":"A pendulum clock: the large-swing period as a series, with a bound on its tail."}],"problems":[],"candidate":null,"sources":[{"title":"OpenStax Calculus Vol. 2, §6.3 Taylor and Maclaurin series","url":"https://openstax.org/books/calculus-volume-2/pages/6-3-taylor-and-maclaurin-series","why":"Building the polynomial and bounding its error.","level":"Intro"},{"title":"MIT 18.01SC, Part B: Taylor series","url":"https://ocw.mit.edu/courses/18-01sc-single-variable-calculus-fall-2010/pages/unit-5-exploring-the-infinite/part-b-taylor-series/","why":"Power series and Taylor series with checked problems.","level":"Course level"}]},{"id":"thermal-boundary-layer","title":"Thermal boundary layer","subject":"heat","courses":["eml4140"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmfrac>\u003cmrow>\u003cmi>D\u003c/mi>\u003cmi>T\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>D\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmi>α\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmsup>\u003cmi mathvariant=\"normal\">∇\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmi>T\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmfrac>\u003cmsub>\u003cmi>δ\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmi>δ\u003c/mi>\u003c/mfrac>\u003cmo>≈\u003c/mo>\u003cmsup>\u003cmtext>Pr\u003c/mtext>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmn>3\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmtext>Pr\u003c/mtext>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>ν\u003c/mi>\u003cmi>α\u003c/mi>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"In a moving fluid, heat is carried along with the flow as well as conducted, so the heat equation gains a material derivative. Near a heated wall the fluid that has been in contact long enough to warm up forms a thin layer. Heat diffuses outward through it while the stream sweeps it along, so it thickens as \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsqrt>\u003cmi>x\u003c/mi>\u003c/msqrt>\u003c/mrow>\u003c/math>\u003c/span>. The Prandtl number compares how fast momentum diffuses with how fast heat does. In oils, with large Pr, the thermal layer sits deep inside the velocity layer; in liquid metals it is far thicker.","requires":["heat-equation","material-derivative"],"labs":[],"problems":[],"candidate":"Draw the velocity and thermal layers on a heated plate with a slider for the Prandtl number, from liquid metal to oil. It corrects the idea that heat and momentum spread together: in oil the thermal layer is a fraction of the velocity layer.","sources":[{"title":"Lienhard, A Heat Transfer Textbook","url":"https://ahtt.mit.edu","why":"Chapter 6 builds the thermal layer next to the velocity layer and compares them through Pr.","level":"Course level"},{"title":"MIT 2.51, calendar: Convection, conservation equations, laminar boundary layers (sessions 11 and 12)","url":"https://ocw.mit.edu/courses/2-51-intermediate-heat-and-mass-transfer-fall-2008/pages/calendar/","why":"The course opens convection with the energy equation in a moving fluid.","level":"Deeper"}]},{"id":"thermal-radiation","title":"Thermal radiation","subject":"heat","courses":["eml4140"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi>b\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmi>σ\u003c/mi>\u003cmsup>\u003cmi>T\u003c/mi>\u003cmn>4\u003c/mn>\u003c/msup>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>λ\u003c/mi>\u003cmtext>max\u003c/mtext>\u003c/msub>\u003cmi>T\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>2898\u003c/mn>\u003cmtext> \u003c/mtext>\u003cmi>μ\u003c/mi>\u003cmtext>m⋅K\u003c/mtext>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsup>\u003cmi>q\u003c/mi>\u003cmrow>\u003cmo mathvariant=\"normal\">′\u003c/mo>\u003cmo mathvariant=\"normal\">′\u003c/mo>\u003c/mrow>\u003c/msup>\u003cmo>=\u003c/mo>\u003cmi>ε\u003c/mi>\u003cmi>σ\u003c/mi>\u003cmrow>\u003cmo fence=\"true\">(\u003c/mo>\u003cmsubsup>\u003cmi>T\u003c/mi>\u003cmi>s\u003c/mi>\u003cmn>4\u003c/mn>\u003c/msubsup>\u003cmo>−\u003c/mo>\u003cmsubsup>\u003cmi>T\u003c/mi>\u003cmtext>sur\u003c/mtext>\u003cmn>4\u003c/mn>\u003c/msubsup>\u003cmo fence=\"true\">)\u003c/mo>\u003c/mrow>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Every surface emits electromagnetic waves because of its temperature, and needs no medium to do it. A black body emits the most possible at each wavelength, with a total of \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>σ\u003c/mi>\u003cmsup>\u003cmi>T\u003c/mi>\u003cmn>4\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span> and a peak that moves to shorter waves as it heats. A real surface emits a fraction \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>ε\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> of that, and the fraction can change with wavelength. Glass passes visible light but absorbs the infrared, so a window lets sunlight in and blocks the room's own glow; a real greenhouse stays warm mostly because its roof stops the warm air rising away. White paint reflects sunlight yet is nearly black in the infrared. Because of the fourth power, radiation dominates at high temperature and matters even at room temperature.","requires":["light-intensity"],"labs":[],"problems":[],"candidate":"Plot Planck’s spectrum with a temperature slider and a surface’s emissivity laid over it. It corrects the idea that a white surface is cool in every band: white paint is nearly black in the infrared.","sources":[{"title":"Lienhard, A Heat Transfer Textbook","url":"https://ahtt.mit.edu","why":"Chapter 10 covers black bodies, emissivity and spectral and solar radiation.","level":"Course level"},{"title":"MIT 2.51, calendar: Radiation, black bodies (session 23)","url":"https://ocw.mit.edu/courses/2-51-intermediate-heat-and-mass-transfer-fall-2008/pages/calendar/","why":"Opens the radiation part of the course.","level":"Course level"},{"title":"OpenStax University Physics Vol. 2, §1.6 Mechanisms of heat transfer","url":"https://openstax.org/books/university-physics-volume-2/pages/1-6-mechanisms-of-heat-transfer","why":"The Stefan–Boltzmann law and emissivity at a first-course level.","level":"Intro"}]},{"id":"thermal-resistance","title":"Thermal resistance","subject":"heat","courses":["eml4140"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>q\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmi mathvariant=\"normal\">∞\u003c/mi>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmo>∑\u003c/mo>\u003cmi>R\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmtext>wall\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>L\u003c/mi>\u003cmrow>\u003cmi>k\u003c/mi>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"1em\"/>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmtext>cyl\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>ln\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsub>\u003cmi>r\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmsub>\u003cmi>r\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>π\u003c/mi>\u003cmi>k\u003c/mi>\u003cmi>L\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"1em\"/>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmtext>conv\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmrow>\u003cmi>h\u003c/mi>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"In steady conduction with no heat made inside, Fourier's law makes heat flow proportional to the temperature drop. The ratio is a resistance: \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>L\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>k\u003c/mi>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> for a wall, a log of the radii for a pipe wall, \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmn>1\u003c/mn>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>h\u003c/mi>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> at a surface that loses heat to a fluid. Layers in series add their resistances, so the largest one sets the heat flow and takes the largest share of the drop. The overall coefficient \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>U\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> is one over the total resistance per unit area. Insulation on a thin pipe adds conduction resistance but also surface area, so below a critical radius \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>k\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>h\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> it raises the heat loss.","requires":["fourier"],"labs":[],"problems":[],"candidate":"Stack wall layers and a surface film as resistances, and add insulation to a thin pipe. It corrects the idea that more insulation always cuts heat loss: below the critical radius it adds surface faster than resistance.","sources":[{"title":"Lienhard, A Heat Transfer Textbook","url":"https://ahtt.mit.edu","why":"Chapter 2 builds resistances and the overall coefficient; it is the course text MIT 2.51 assigns.","level":"Course level"},{"title":"MIT 2.51, calendar: Conduction, resistances, energy equation","url":"https://ocw.mit.edu/courses/2-51-intermediate-heat-and-mass-transfer-fall-2008/pages/calendar/","why":"The course’s second session: resistances come before the full heat equation.","level":"Course level"},{"title":"OpenStax University Physics Vol. 2, §1.6 Mechanisms of heat transfer","url":"https://openstax.org/books/university-physics-volume-2/pages/1-6-mechanisms-of-heat-transfer","why":"Conduction through a slab and the three modes, at a first-course level.","level":"Intro"}]},{"id":"thevenin-norton","title":"Thévenin and Norton equivalents","subject":"circuits","courses":["eel3111"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>th\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmtext>oc\u003c/mtext>\u003c/msub>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmi>N\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>i\u003c/mi>\u003cmtext>sc\u003c/mtext>\u003c/msub>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmtext>th\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmtext>oc\u003c/mtext>\u003c/msub>\u003cmsub>\u003cmi>i\u003c/mi>\u003cmtext>sc\u003c/mtext>\u003c/msub>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>P\u003c/mi>\u003cmtext>max\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsubsup>\u003cmi>V\u003c/mi>\u003cmtext>th\u003c/mtext>\u003cmn>2\u003c/mn>\u003c/msubsup>\u003cmrow>\u003cmn>4\u003c/mn>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmtext>th\u003c/mtext>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003cmtext> at \u003c/mtext>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmi>L\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmtext>th\u003c/mtext>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Seen from two terminals, any linear network gives a straight line of voltage against current. A line is fixed by two numbers, so the whole network acts like one source and one resistor: Thévenin's voltage in series, or Norton's current in parallel. The intercepts are the open-circuit voltage and the short-circuit current, and their ratio is the resistance. With dependent sources inside, find \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmtext>th\u003c/mtext>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span> with a test source instead of switching sources off. A load takes the most power when it matches \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmtext>th\u003c/mtext>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span>, and then half the power is lost inside.","requires":["superposition"],"labs":[],"problems":[],"candidate":"Sweep a load across a network and plot its terminal voltage against current, with the load power beside it. It corrects the idea that maximum power transfer is the efficient choice: at the peak, half the power heats the source.","sources":[{"title":"MIT 6.002, calendar: Lecture 3 and recitation 3, Thévenin and Norton","url":"https://ocw.mit.edu/courses/6-002-circuits-and-electronics-spring-2007/pages/calendar/","why":"One lecture and a recitation on the equivalents.","level":"Course level"},{"title":"Kuphaldt, Lessons in Electric Circuits, Vol. I: DC","url":"https://www.allaboutcircuits.com/textbook/direct-current/","why":"Thévenin, Norton and maximum power transfer in its network theorems chapter.","level":"Intro"}]},{"id":"thin-film","title":"Thin-film interference","subject":"em","courses":["phy2049"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>t\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>m\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmfrac>\u003cmi>λ\u003c/mi>\u003cmsub>\u003cmi>n\u003c/mi>\u003cmtext>film\u003c/mtext>\u003c/msub>\u003c/mfrac>\u003cmtext> or \u003c/mtext>\u003cmrow>\u003cmo fence=\"true\">(\u003c/mo>\u003cmi>m\u003c/mi>\u003cmo>+\u003c/mo>\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmn>2\u003c/mn>\u003c/mfrac>\u003c/mstyle>\u003cmo fence=\"true\">)\u003c/mo>\u003c/mrow>\u003cmfrac>\u003cmi>λ\u003c/mi>\u003cmsub>\u003cmi>n\u003c/mi>\u003cmtext>film\u003c/mtext>\u003c/msub>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Light reflects from both faces of a thin film, and the two reflections interfere. The second one travels an extra \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> inside the film, where the wavelength is \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>λ\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>n\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. A reflection off a higher index also flips the wave by half a wavelength. Count the flips first, then the path. A quarter-wave coating cancels reflection, which is how lenses are coated.","requires":["interference","refraction"],"labs":[{"course":"phy2049","title":"Thin film","href":"https://flux-study.pages.dev/phy2049/#/phy2049/wave/thinfilm","notes":null,"note":"A film drawn to scale with the wave: soap, oil and an antireflection coating."}],"problems":["phy2049:wave.65.thin-film"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 3, §3.4 Interference in thin films","url":"https://openstax.org/books/university-physics-volume-3/pages/3-4-interference-in-thin-films","why":"The phase-flip rule stated once and used on every example.","level":"Intro"},{"title":"PhET: Wave interference","url":"https://phet.colorado.edu/en/simulations/wave-interference","why":"See path difference make bright and dark before adding films.","level":"Intro"}]},{"id":"thin-lenses","title":"Thin lenses","subject":"em","courses":["phy2049"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>o\u003c/mi>\u003c/msub>\u003c/mfrac>\u003cmo>+\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmi>f\u003c/mi>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>m\u003c/mi>\u003cmo>=\u003c/mo>\u003cmo>−\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>o\u003c/mi>\u003c/msub>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A lens refracts at both faces, and a thin one obeys the same equation as a mirror. A converging lens makes a real image of a distant object and a magnified virtual one of a close object. Two lenses in a row make a microscope or a telescope: the first lens's image is the second lens's object.","requires":["refraction"],"labs":[{"course":"phy2049","title":"Lenses","href":"https://flux-study.pages.dev/phy2049/#/phy2049/e7/lenses","notes":null,"note":"Converging and diverging lenses, then a telescope and a microscope."}],"problems":["phy2049:e7.60.lens","phy2049:e7.60.power","phy2049:e7.60.two-lens","phy2049:e7.62.magnifier","phy2049:e7.62.telescope","phy2049:e7.62.microscope","phy2049:e7.62.eye"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 3, §2.4 Thin lenses","url":"https://openstax.org/books/university-physics-volume-3/pages/2-4-thin-lenses","why":"The lensmaker’s equation, ray tracing and sign rules.","level":"Intro"},{"title":"OpenStax University Physics Vol. 3, §2.8 Microscopes and telescopes","url":"https://openstax.org/books/university-physics-volume-3/pages/2-8-microscopes-and-telescopes","why":"Two-lens instruments, the lab’s last two scenarios.","level":"Intro"}]},{"id":"torsion","title":"Torsion of shafts","subject":"materials","courses":["egn3331"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>τ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>T\u003c/mi>\u003cmi>ρ\u003c/mi>\u003c/mrow>\u003cmi>J\u003c/mi>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>ϕ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>T\u003c/mi>\u003cmi>L\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>G\u003c/mi>\u003cmi>J\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>P\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>T\u003c/mi>\u003cmi>ω\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Twist a round shaft and its shear stress grows linearly from the centre, so the core carries little torque and a hollow shaft keeps most of its strength. The angle of twist is \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>T\u003c/mi>\u003cmi>L\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>G\u003c/mi>\u003cmi>J\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>, added segment by segment. A motor's power and speed set its torque. A closed thin tube resists twist through shear flow all the way round; one lengthwise slit destroys that.","requires":["stress-on-a-section","stress-strain"],"labs":[{"course":"egn3331","title":"Torsion","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u9/torsion","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u9/torsion?n=s1","note":"Shear stress across solid and hollow shafts."},{"course":"egn3331","title":"Twist","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u9/twist","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u9/twist?n=s3","note":"Power and speed to torque, and shafts in series or held at both ends."},{"course":"egn3331","title":"Motor shaft","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u9/motor","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u9/motor?n=s5","note":"A motor shaft sized by stress, not twist."},{"course":"egn3331","title":"Tubes in torsion","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u9/tubes","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u9/tubes?n=s6","note":"A closed tube against the same tube slit along its length."}],"problems":["egn3331:u9.5.solid","egn3331:u9.5.hollow","egn3331:u9.5.size","egn3331:u9.5.scale","egn3331:u9.5.shoulder","egn3331:u9.5.what-raises","egn3331:u9.5.power","egn3331:u9.5.step","egn3331:u9.5.fixed","egn3331:u9.5.side","egn3331:u9.5.fast","egn3331:u9.5.fixed-step","egn3331:u9.5.motor","egn3331:u9.5.box-tube","egn3331:u9.5.rect-bar","egn3331:u9.5.slit"],"candidate":null,"sources":[{"title":"MIT 2.001, Lecture 22: Torsion and twisting","url":"https://ocw.mit.edu/courses/2-001-mechanics-materials-i-fall-2006/resources/lec22/","why":"Shear stress and twist in circular shafts.","level":"Course level"},{"title":"MIT 2.001, Lecture 23: Torsion examples","url":"https://ocw.mit.edu/courses/2-001-mechanics-materials-i-fall-2006/resources/lec23/","why":"Series shafts, indeterminate shafts and power.","level":"Course level"}]},{"id":"transient-conduction","title":"Transient conduction","subject":"heat","courses":["eml4140"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmfrac>\u003cmrow>\u003cmi>T\u003c/mi>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmi mathvariant=\"normal\">∞\u003c/mi>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmi mathvariant=\"normal\">∞\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003cmo>≈\u003c/mo>\u003cmsub>\u003cmi>C\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmtext> \u003c/mtext>\u003cmsup>\u003cmi>e\u003c/mi>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmsubsup>\u003cmi>λ\u003c/mi>\u003cmn>1\u003c/mn>\u003cmn>2\u003c/mn>\u003c/msubsup>\u003cmtext> \u003c/mtext>\u003cmtext>Fo\u003c/mtext>\u003c/mrow>\u003c/msup>\u003cmi>cos\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmtext> ⁣\u003c/mtext>\u003cmrow>\u003cmo fence=\"true\">(\u003c/mo>\u003cmsub>\u003cmi>λ\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmfrac>\u003cmi>x\u003c/mi>\u003cmi>L\u003c/mi>\u003c/mfrac>\u003cmo fence=\"true\">)\u003c/mo>\u003c/mrow>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmtext>Fo\u003c/mtext>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>α\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003cmsup>\u003cmi>L\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"1em\"/>\u003cmtext>Bi\u003c/mtext>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>h\u003c/mi>\u003cmi>L\u003c/mi>\u003c/mrow>\u003cmi>k\u003c/mi>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"When the Biot number is not small, the inside of a body lags its surface and the lumped model fails. Separation of variables solves the heat equation in a slab, cylinder or sphere as a series of decaying modes. Higher modes decay much faster, so after a short time the first term alone is accurate. Two numbers set the answer: Bi, the inside resistance against the surface one, and the Fourier number, time measured in units of \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsup>\u003cmi>L\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>α\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. A thick part takes four times as long to cool as one half its thickness.","requires":["lumped","fourier-series"],"labs":[],"problems":[],"candidate":"Cool a steel and a plastic slab of the same size, with centre and surface temperatures plotted. It corrects the idea that the whole part cools together: with a large Biot number the surface is cold while the centre is still hot, which is what cracks a quenched part.","sources":[{"title":"Lienhard, A Heat Transfer Textbook","url":"https://ahtt.mit.edu","why":"Chapter 5 solves the slab, cylinder and sphere and gives one-term charts.","level":"Course level"},{"title":"MIT 2.51, calendar: Transient conduction (session 6)","url":"https://ocw.mit.edu/courses/2-51-intermediate-heat-and-mass-transfer-fall-2008/pages/calendar/","why":"Follows lumped capacity, the case it extends.","level":"Course level"}]},{"id":"transverse-shear","title":"Transverse shear and shear flow","subject":"materials","courses":["egn3331"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>τ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>V\u003c/mi>\u003cmi>Q\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>I\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>q\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>V\u003c/mi>\u003cmi>Q\u003c/mi>\u003c/mrow>\u003cmi>I\u003c/mi>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Where the moment changes along a beam, layers must slide past each other, and that takes shear. It is largest at the neutral axis and zero at the top and bottom, and in an I beam the web carries most of it. Shear flow is that shear per length; it sets the nail spacing in a built-up beam. In a thin open section the shear flow forms a couple, so the load must pass through the shear centre or the section twists.","requires":["bending-stress"],"labs":[{"course":"egn3331","title":"Shear stress","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u7/shear","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u7/shear?n=s1","note":"Shear stress over a rectangle and an I section, peaking at the neutral axis."},{"course":"egn3331","title":"Nail spacing","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u7/nails","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u7/nails?n=s4","note":"Nail spacing as capacity divided by shear flow."},{"course":"egn3331","title":"Garage header","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u7/header","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u7/header?n=s5","note":"A garage box beam: the flange nails work hardest at the supports."},{"course":"egn3331","title":"Strut channel","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u7/strut","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u7/strut?n=s7","note":"Strut channel loaded through its web twists unless the load passes the shear centre."}],"problems":["egn3331:u7.7.rect","egn3331:u7.7.profile","egn3331:u7.7.web","egn3331:u7.7.where","egn3331:u7.7.carry","egn3331:u7.7.flange","egn3331:u7.7.flow","egn3331:u7.7.space","egn3331:u7.7.header","egn3331:u7.7.nailwhere","egn3331:u7.7.shear-centre","egn3331:u7.7.load-where"],"candidate":null,"sources":[{"title":"MIT 3.11, calendar: Normal and shear stresses in beams (21)","url":"https://ocw.mit.edu/courses/3-11-mechanics-of-materials-fall-1999/pages/calendar/","why":"Where the course’s reading derives the shear formula.","level":"Deeper"},{"title":"MIT 2.001, Lecture 18: Pure bending","url":"https://ocw.mit.edu/courses/2-001-mechanics-materials-i-fall-2006/resources/lec18/","why":"The bending stress whose change along the beam drives the shear.","level":"Course level"}]},{"id":"triple-integrals","title":"Triple integrals","subject":"calculus","courses":["mac2313"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmo>∭\u003c/mo>\u003cmi>E\u003c/mi>\u003c/msub>\u003cmi>f\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>V\u003c/mi>\u003cmo>=\u003c/mo>\u003cmo>∫\u003c/mo>\u003cmtext> ⁣\u003c/mtext>\u003cmtext> ⁣\u003c/mtext>\u003cmo>∫\u003c/mo>\u003cmtext> ⁣\u003c/mtext>\u003cmtext> ⁣\u003c/mtext>\u003cmo>∫\u003c/mo>\u003cmi>f\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>z\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>z\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>y\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"The same idea one dimension up: cut a solid into small boxes, weight each by the function, and add. With \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>f\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/math>\u003c/span> it is the volume; with \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>f\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> a density it is the mass. Integrate one variable at a time, sweeping a plane through the solid.","requires":["double-integrals"],"labs":[{"course":"mac2313","title":"Triple","href":"https://flux-study.pages.dev/mac2313/#/mac2313/ch5/triple","notes":null,"note":"Sweep a plane through a solid and add up its cubes."}],"problems":["mac2313:ch5.triple.vol","mac2313:ch5.triple.xyz","mac2313:ch5.triple.fubini","mac2313:ch5.triple.x"],"candidate":null,"sources":[{"title":"OpenStax Calculus Vol. 3, §5.4 Triple integrals","url":"https://openstax.org/books/calculus-volume-3/pages/5-4-triple-integrals","why":"Limits for general solids, with sketches of each projection.","level":"Intro"},{"title":"MIT 18.02SC, Part A: Triple integrals","url":"https://ocw.mit.edu/courses/18-02sc-multivariable-calculus-fall-2010/pages/4.-triple-integrals-and-surface-integrals-in-3-space/part-a-triple-integrals/","why":"Mass, centre of mass and moment of inertia as triple integrals.","level":"Course level"}]},{"id":"truncation-error","title":"Truncation error and order of accuracy","subject":"numerics","courses":["egn3203"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>E\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>h\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>≈\u003c/mo>\u003cmi>C\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmsup>\u003cmi>h\u003c/mi>\u003cmi>p\u003c/mi>\u003c/msup>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>p\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>ln\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmo fence=\"false\" stretchy=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">(\u003c/mo>\u003cmi>E\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>h\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>E\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>h\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmn>2\u003c/mn>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo fence=\"false\" stretchy=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">)\u003c/mo>\u003c/mrow>\u003cmrow>\u003cmi>ln\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmn>2\u003c/mn>\u003c/mrow>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmtext>total\u003c/mtext>\u003c/msub>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>h\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>≈\u003c/mo>\u003cmi>C\u003c/mi>\u003cmsup>\u003cmi>h\u003c/mi>\u003cmi>p\u003c/mi>\u003c/msup>\u003cmo>+\u003c/mo>\u003cmfrac>\u003cmi>u\u003c/mi>\u003cmi>h\u003c/mi>\u003c/mfrac>\u003cmtext> (a difference quotient)\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A numerical method replaces calculus with a finite step \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>h\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>, and Taylor series say what that drops: the truncation error. For a method of order \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>p\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> it shrinks like \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsup>\u003cmi>h\u003c/mi>\u003cmi>p\u003c/mi>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span>, so halving the step divides the error by \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsup>\u003cmn>2\u003c/mn>\u003cmi>p\u003c/mi>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span>. Plotted against \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>h\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> on log axes the error is a line of slope \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>p\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>, which is how the order is measured. Round-off grows as the step shrinks in a difference quotient, so the total error has a best step. Below it, a smaller step makes the answer worse.","requires":["taylor-series","floating-point"],"labs":[],"problems":[],"candidate":"Halve the step again and again for a first- and a fourth-order method, the errors on log axes. It corrects the idea that every method improves at the same rate: one halves its error, the other divides it by sixteen.","sources":[{"title":"MIT 2.086, calendar: Numerical calculus, parts 1 to 3","url":"https://ocw.mit.edu/courses/2-086-numerical-computation-for-mechanical-engineers-spring-2013/pages/calendar/","why":"The course’s opening lectures, where error and its order are built up.","level":"Course level"},{"title":"Yano, Penn, Konidaris and Patera, Math, Numerics, and Programming (for Mechanical Engineers)","url":"https://ocw.mit.edu/courses/2-086-numerical-computation-for-mechanical-engineers-spring-2013/resources/mit2_086s13_textbook/","why":"Error bounds for interpolation, differentiation and integration, with convergence plots.","level":"Course level"}]},{"id":"trusses-frames","title":"Trusses, frames and machines","subject":"mechanics","courses":["statics"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtext>each joint: \u003c/mtext>\u003cmo>∑\u003c/mo>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmi>x\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmo>∑\u003c/mo>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmi>y\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>0\u003c/mn>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>m\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>r\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>2\u003c/mn>\u003cmi>j\u003c/mi>\u003cmtext> (determinate plane truss)\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A truss is two-force members pinned at joints, so each member only pulls or pushes along itself. Solve joint by joint, or cut through the truss and take moments to reach one member directly. A frame or machine has members that carry more than two forces; pull it apart into one free-body per member and the pin forces appear, equal and opposite. A shallow truss carries big chord forces even under modest loads.","requires":["static-equilibrium"],"labs":[{"course":"statics","title":"Truss","href":"https://flux-study.pages.dev/st
