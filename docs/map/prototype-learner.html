003c/mo>\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A data set is summarised by where it sits and how far it spreads. The mean and standard deviation are pulled by one extreme value; the median and quartiles are not. A histogram's shape depends on its bins, so try more than one. A box plot marks values past \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmn>1.5\u003c/mn>\u003cmtext> \u003c/mtext>\u003cmtext>IQR\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/span> from the quartiles as possible outliers, to look at, not to delete.","requires":[],"labs":[{"course":"sta3032","title":"Describing data","href":"https://flux-study.pages.dev/sta3032/#/sta3032/mid/explore/describe","notes":null,"note":"One data set as a histogram, a dot plot and a box plot, with the largest value moved."}],"problems":[],"candidate":null,"sources":[{"title":"OpenStax Introductory Statistics 2e, §2.4 Box plots","url":"https://openstax.org/books/introductory-statistics-2e/pages/2-4-box-plots","why":"Quartiles, fences and outliers drawn step by step.","level":"Intro"},{"title":"OpenStax Introductory Statistics 2e, §2.7 Measures of the spread of the data","url":"https://openstax.org/books/introductory-statistics-2e/pages/2-7-measures-of-the-spread-of-the-data","why":"Standard deviation and why it divides by n − 1.","level":"Intro"}]},{"id":"determinant-inverse","title":"Determinant and inverse","subject":"linalg","courses":["egn3203"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>det\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>A\u003c/mi>\u003cmi>B\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmi>det\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>A\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>det\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>B\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsup>\u003cmrow>\u003cmo fence=\"true\">[\u003c/mo>\u003cmtable rowspacing=\"0.16em\" columnalign=\"center center\" columnspacing=\"1em\">\u003cmtr>\u003cmtd>\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmi>a\u003c/mi>\u003c/mstyle>\u003c/mtd>\u003cmtd>\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmi>b\u003c/mi>\u003c/mstyle>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd>\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmi>c\u003c/mi>\u003c/mstyle>\u003c/mtd>\u003cmtd>\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmi>d\u003c/mi>\u003c/mstyle>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003cmo fence=\"true\">]\u003c/mo>\u003c/mrow>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmrow>\u003cmi>a\u003c/mi>\u003cmi>d\u003c/mi>\u003cmo>−\u003c/mo>\u003cmi>b\u003c/mi>\u003cmi>c\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmrow>\u003cmo fence=\"true\">[\u003c/mo>\u003cmtable rowspacing=\"0.16em\" columnalign=\"center center\" columnspacing=\"1em\">\u003cmtr>\u003cmtd>\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmi>d\u003c/mi>\u003c/mstyle>\u003c/mtd>\u003cmtd>\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmrow>\u003cmo>−\u003c/mo>\u003cmi>b\u003c/mi>\u003c/mrow>\u003c/mstyle>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd>\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmrow>\u003cmo>−\u003c/mo>\u003cmi>c\u003c/mi>\u003c/mrow>\u003c/mstyle>\u003c/mtd>\u003cmtd>\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmi>a\u003c/mi>\u003c/mstyle>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003cmo fence=\"true\">]\u003c/mo>\u003c/mrow>\u003c/mrow>\u003c/math>\u003c/span>","idea":"The determinant is the factor by which a matrix scales area in 2D or volume in 3D, with a sign that flips when the map turns space over. If it is zero the map squashes space flat, and no map can undo it. Otherwise the inverse exists and undoes \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>: \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsup>\u003cmi>A\u003c/mi>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmi>A\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>I\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. Elimination is how both are found in practice; the cofactor formula is for small cases and proofs. Chaining maps multiplies their scale factors, so \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>det\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>A\u003c/mi>\u003cmi>B\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmi>det\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>A\u003c/mi>\u003cmi>det\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>B\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>.","requires":["gaussian-elimination"],"labs":[],"problems":[],"candidate":"Edit a 2×2 matrix and watch the image of the unit square, its area and the inverse. It corrects the idea that a small determinant means a matrix is nearly singular: scale every entry by 0.1 and the determinant falls a hundredfold, yet the matrix is no closer to singular.","sources":[{"title":"Margalit and Rabinoff, Interactive Linear Algebra","url":"https://textbooks.math.gatech.edu/ila/","why":"Defines the determinant as signed volume and builds its rules from that.","level":"Course level"},{"title":"Hefferon, Linear Algebra","url":"https://hefferon.net/linearalgebra/","why":"Its determinants chapter, with the geometric meaning and the proofs.","level":"Deeper"}]},{"id":"dielectrics","title":"Dielectrics and breakdown","subject":"em","courses":["phy2049"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>C\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>κ\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmsub>\u003cmi>C\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>E\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmi>κ\u003c/mi>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"An insulator between the plates polarizes. Its bound charge partly cancels the field, so the same charge sits at a lower voltage and the capacitance rises by \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>κ\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. Push the field too high and the insulator stops insulating: in air, a spark. How easily a gas breaks down depends on the gap and the pressure together.","requires":["capacitance"],"labs":[{"course":"phy2049","title":"Capacitor","href":"https://flux-study.pages.dev/phy2049/#/phy2049/e3/capacitor","notes":"https://flux-study.pages.dev/phy2049/#/phy2049/e3/capacitor?n=s10","note":"Slide a dielectric in with the battery on or off and watch Q, V and C."},{"course":"phy2049","title":"Breakdown","href":"https://flux-study.pages.dev/phy2049/#/phy2049/e3/breakdown","notes":null,"note":"Spark gaps from a doorknob to a gas tube, on the breakdown curve against pressure times gap."}],"problems":["phy2049:e3.40.parallel-plate","phy2049:e3.40.dielectric-battery","phy2049:e3.40.C-dielectric","phy2049:e3.40.dielectric-isolated","phy2049:e3.40.combo","phy2049:e3.40.energy","phy2049:e3.40.C-for-energy","phy2049:e3.40.scaling","phy2049:e3.40.basics","phy2049:e3.40.spark-energy","phy2049:e3.40.gap-holds","phy2049:e3.40.paschen-min","phy2049:e3.40.wider-gap"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 2, §8.4 Capacitor with a dielectric","url":"https://openstax.org/books/university-physics-volume-2/pages/8-4-capacitor-with-a-dielectric","why":"Battery connected versus isolated, the two cases the lab switches between.","level":"Intro"},{"title":"OpenStax University Physics Vol. 2, §8.5 Molecular model of a dielectric","url":"https://openstax.org/books/university-physics-volume-2/pages/8-5-molecular-model-of-a-dielectric","why":"Why polarization lowers the field, and where breakdown strength comes in.","level":"Course level"}]},{"id":"diffraction","title":"Diffraction","subject":"em","courses":["phy2049"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>a\u003c/mi>\u003cmi>sin\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>θ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>m\u003c/mi>\u003cmi>λ\u003c/mi>\u003cmtext> (dark)\u003c/mtext>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>d\u003c/mi>\u003cmi>sin\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>θ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>m\u003c/mi>\u003cmi>λ\u003c/mi>\u003cmtext> (grating)\u003c/mtext>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>θ\u003c/mi>\u003cmtext>min\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>1.22\u003c/mn>\u003cmtext> \u003c/mtext>\u003cmfrac>\u003cmi>λ\u003c/mi>\u003cmi>D\u003c/mi>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A single slit is many sources side by side. At angles where the slit's halves cancel, the screen goes dark, so a narrower slit spreads light wider. A grating has thousands of slits, which sharpens the bright orders into thin lines that split colours. A round aperture blurs a point into a disk, and that sets the finest detail any lens can resolve.","requires":["interference"],"labs":[{"course":"phy2049","title":"Diffraction","href":"https://flux-study.pages.dev/phy2049/#/phy2049/wave/diffraction","notes":null,"note":"One slit, a grating and the resolution limit, each pattern painted from the real intensity."}],"problems":["phy2049:wave.64.single-slit","phy2049:wave.64.grating","phy2049:wave.64.rayleigh"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 3, §4.1 Single-slit diffraction","url":"https://openstax.org/books/university-physics-volume-3/pages/4-1-single-slit-diffraction","why":"The half-slit pairing argument for the dark fringes.","level":"Intro"},{"title":"Feynman Lectures Vol. I, Ch. 30: Diffraction","url":"https://www.feynmanlectures.caltech.edu/I_30.html","why":"Gratings and resolving power from adding many phasors.","level":"Deeper"}]},{"id":"diffusion","title":"Diffusion and Fick’s laws","subject":"matsci","courses":["ema3010","eml4140"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>J\u003c/mi>\u003cmo>=\u003c/mo>\u003cmo>−\u003c/mo>\u003cmi>D\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi mathvariant=\"normal\">∇\u003c/mi>\u003cmi>C\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmfrac>\u003cmrow>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmi>C\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmi>D\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmsup>\u003cmi mathvariant=\"normal\">∇\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmi>C\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>D\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>D\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmi>exp\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmtext> ⁣\u003c/mtext>\u003cmrow>\u003cmo fence=\"true\">(\u003c/mo>\u003cmo>−\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmi>d\u003c/mi>\u003c/msub>\u003cmrow>\u003cmi>R\u003c/mi>\u003cmi>T\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo fence=\"true\">)\u003c/mo>\u003c/mrow>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Atoms hop between sites, mostly into vacancies, and more hop down a concentration gradient than up it. The net flux is \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmo>−\u003c/mo>\u003cmi>D\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> times the gradient: Fick's first law, the same form as Fourier's law with concentration in place of temperature. Conserve atoms in a small volume, as the heat equation conserves energy, and the divergence theorem gives Fick's second law, the heat equation with \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>D\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> in place of the thermal diffusivity \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>α\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. So depth grows as \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsqrt>\u003cmrow>\u003cmi>D\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/msqrt>\u003c/mrow>\u003c/math>\u003c/span>, and \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>D\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> rises steeply with temperature because each hop needs a vacancy and an energy barrier.","requires":["point-defects","gradient","divergence-theorem"],"labs":[],"problems":[],"candidate":"Carburize a steel surface and watch the carbon profile deepen with time. It corrects the idea that twice the time gives twice the depth: depth grows with the square root of time.","sources":[{"title":"MIT 3.091, Recitation 26: Steady state diffusion","url":"https://ocw.mit.edu/courses/3-091-introduction-to-solid-state-chemistry-fall-2018/resources/mit3_091f18_rec26/","why":"Fick’s first law and steady flux, worked as the course does.","level":"Course level"},{"title":"DoITPoMS, Diffusion (University of Cambridge)","url":"https://www.doitpoms.ac.uk/tlplib/diffusion/index.php","why":"Both of Fick’s laws, the error-function solution and the atomic mechanisms.","level":"Course level"}]},{"id":"dimensional-analysis","title":"Dimensional analysis and similitude","subject":"fluids","courses":["eml3015"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtext>Re\u003c/mtext>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>ρ\u003c/mi>\u003cmi>V\u003c/mi>\u003cmi>L\u003c/mi>\u003c/mrow>\u003cmi>μ\u003c/mi>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmtext>Fr\u003c/mtext>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>V\u003c/mi>\u003cmsqrt>\u003cmrow>\u003cmi>g\u003c/mi>\u003cmi>L\u003c/mi>\u003c/mrow>\u003c/msqrt>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi mathvariant=\"normal\">#\u003c/mi>\u003cmi mathvariant=\"normal\">Π\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>n\u003c/mi>\u003cmo>−\u003c/mo>\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A physical law cannot depend on the units it is written in. So \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>n\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> variables built from \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> base dimensions combine into \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>n\u003c/mi>\u003cmo>−\u003c/mo>\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> dimensionless groups, and the law is a relation among those groups. The Reynolds number compares inertia with viscous force; the Froude number compares inertia with gravity. A model test predicts the full-size flow only when the groups that matter have the same values in both.","requires":["viscosity"],"labs":[],"problems":[],"candidate":"Scale a ship hull down with sliders for the model size and the test fluid. It corrects the idea that a scale model in water behaves like the real ship: matching Reynolds and Froude numbers at once needs a fluid that does not exist.","sources":[{"title":"Cleynen, Fluid Dynamics for Engineers","url":"https://fluidmech.ninja/","why":"Has a chapter on scale effects: the groups, how to find them and how to use them in tests.","level":"Course level"},{"title":"Wikipedia, Buckingham π theorem","url":"https://en.wikipedia.org/wiki/Buckingham_%CF%80_theorem","why":"The theorem stated with care, and the classic pendulum and drag examples.","level":"Deeper"}]},{"id":"diodes-leds","title":"Diodes and LEDs","subject":"circuits","courses":["bench"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>R\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmi>s\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmi>f\u003c/mi>\u003c/msub>\u003c/mrow>\u003cmi>I\u003c/mi>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmi>s\u003c/mi>\u003c/msub>\u003cmrow>\u003cmo fence=\"true\">(\u003c/mo>\u003cmsup>\u003cmi>e\u003c/mi>\u003cmrow>\u003cmi>V\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>n\u003c/mi>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmi>T\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msup>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo fence=\"true\">)\u003c/mo>\u003c/mrow>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A diode conducts one way. An LED's voltage barely changes as its current changes, so it cannot set its own current: the resistor in series does, at \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmi>s\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmi>f\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>I\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. In series, LEDs share one current; in parallel on one resistor, the one with the lowest forward voltage takes most of it, so each needs its own resistor. Buy the next standard value up and check its power.","requires":["current-resistance","kirchhoff"],"labs":[{"course":"bench","title":"LED and resistor","href":"https://flux-study.pages.dev/bench/#/bench/u2/led","notes":"https://flux-study.pages.dev/bench/#/bench/u2/led?n=s1","note":"An LED and its resistor on 3.3, 5 and 9 V, forwards and backwards."},{"course":"bench","title":"LED strings","href":"https://flux-study.pages.dev/bench/#/bench/u2/led-strings","notes":"https://flux-study.pages.dev/bench/#/bench/u2/led-strings?n=s5","note":"LEDs in series, in parallel on one resistor, and with a resistor each."},{"course":"bench","title":"Indicator LED","href":"https://flux-study.pages.dev/bench/#/bench/u2/indicator","notes":"https://flux-study.pages.dev/bench/#/bench/u2/indicator?n=s4","note":"A power-light LED on four supplies: pick a current, buy the resistor, check its power."}],"problems":["bench:u2.pick-r","bench:u2.current","bench:u2.power","bench:u2.concept-fault","bench:u2.concept-curve","bench:u2.series","bench:u2.parallel","bench:u2.concept-strings","bench:u2.bands","bench:u2.design"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 3, §9.7 Semiconductor devices and transistors","url":"https://openstax.org/books/university-physics-volume-3/pages/9-7-semiconductor-devices-and-transistors","why":"Why a p-n junction conducts one way, and its exponential curve.","level":"Course level"},{"title":"Kuphaldt, Lessons in Electric Circuits","url":"https://www.ibiblio.org/kuphaldt/electricCircuits/","why":"Diodes and LEDs in practice, from the text the course cites.","level":"Intro"}]},{"id":"dislocations","title":"Dislocations and slip","subject":"matsci","courses":["ema3010"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>τ\u003c/mi>\u003cmi>R\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmi>σ\u003c/mi>\u003cmi>cos\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>ϕ\u003c/mi>\u003cmi>cos\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>λ\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmtext>slip when \u003c/mtext>\u003cmsub>\u003cmi>τ\u003c/mi>\u003cmi>R\u003c/mi>\u003c/msub>\u003cmo>≥\u003c/mo>\u003cmsub>\u003cmi>τ\u003c/mi>\u003cmtext>crss\u003c/mtext>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Sliding a whole plane of atoms at once would need a shear stress near \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>G\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmn>10\u003c/mn>\u003c/mrow>\u003c/math>\u003c/span>, far above what metals yield at. Instead an extra half-plane, a dislocation, moves through the crystal one row at a time, so only a few bonds break at once. Slip runs on close-packed planes and only the shear stress resolved onto them drives it. That is why yield is a shear event, and why criteria like Tresca and von Mises judge yield by shear.","requires":["crystal-structures","stress-strain","stress-on-a-section"],"labs":[],"problems":[],"candidate":"Pull a single crystal and turn its slip plane, reading the resolved shear stress. It corrects the idea that a crystal yields when the tensile stress reaches a limit: the same pull yields it or not depending on angle.","sources":[{"title":"MIT 3.091, Recitation 18: Line defects, mechanics and stress-strain curves, and slip","url":"https://ocw.mit.edu/courses/3-091-introduction-to-solid-state-chemistry-fall-2018/resources/mit3_091f18_rec18/","why":"Dislocations tied to the stress-strain curve, in the course’s order.","level":"Course level"},{"title":"DoITPoMS, Introduction to dislocations (University of Cambridge)","url":"https://www.doitpoms.ac.uk/tlplib/dislocations/index.php","why":"Animations of a dislocation gliding, and why it lowers the yield stress.","level":"Course level"}]},{"id":"divergence-theorem","title":"Divergence theorem","subject":"calculus","courses":["mac2313"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmo>∮\u003c/mo>\u003cmrow>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmi>V\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmi>𝐅\u003c/mi>\u003cmo>⋅\u003c/mo>\u003cmover accent=\"true\">\u003cmi>n\u003c/mi>\u003cmo>^\u003c/mo>\u003c/mover>\u003cmtext>  \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>A\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmo>∭\u003c/mo>\u003cmi>V\u003c/mi>\u003c/msub>\u003cmi mathvariant=\"normal\">∇\u003c/mi>\u003cmo>⋅\u003c/mo>\u003cmi>𝐅\u003c/mi>\u003cmtext>  \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>V\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Add the divergence over every tiny box in a region. Each inner face is shared by two boxes, so its flux leaves one and enters the other and cancels. Only the outer surface survives. That is the whole theorem. It is also how every conservation law moves between its integral form and its differential form.","requires":["divergence"],"labs":[],"problems":[],"candidate":"Grid a region into boxes and watch the inner-face fluxes cancel as the grid refines.","sources":[{"title":"OpenStax Calculus Vol. 3, §6.8 The divergence theorem","url":"https://openstax.org/books/calculus-volume-3/pages/6-8-the-divergence-theorem","why":"Includes applications to Gauss’s law, which ties this lane to the next one.","level":"Course level"},{"title":"MIT 18.02SC, Session 84: Divergence theorem example","url":"https://ocw.mit.edu/courses/18-02sc-multivariable-calculus-fall-2010/resources/mit18_02sc_mnotes_v10-1/","why":"A full computation both ways, so you can see the two sides agree.","level":"Course level"}]},{"id":"divergence","title":"Divergence","subject":"calculus","courses":["mac2313"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi mathvariant=\"normal\">∇\u003c/mi>\u003cmo>⋅\u003c/mo>\u003cmi>𝐅\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmi>P\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo>+\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmi>Q\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmi>y\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo>+\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmi>R\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmi>z\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Divergence is the net outward flux per unit volume, in the limit of a tiny box. Positive means a source: more leaves than enters. Zero everywhere means whatever flows in flows out. Incompressible flow and the magnetic field both obey that.","requires":["surface-flux"],"labs":[],"problems":[],"candidate":"A small box you drag through a field. It shows the flux out of each face and compares their sum with \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi mathvariant=\"normal\">∇\u003c/mi>\u003cmo>⋅\u003c/mo>\u003cmi>𝐅\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmi>V\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>.","sources":[{"title":"OpenStax Calculus Vol. 3, §6.5 Divergence and curl","url":"https://openstax.org/books/calculus-volume-3/pages/6-5-divergence-and-curl","why":"Defines divergence, then interprets it as sources and sinks.","level":"Course level"},{"title":"MIT 18.02SC, Part B: Flux and the divergence theorem","url":"https://ocw.mit.edu/courses/18-02sc-multivariable-calculus-fall-2010/pages/4.-triple-integrals-and-surface-integrals-in-3-space/part-b-flux-and-the-divergence-theorem/","why":"Divergence taught together with the theorem that gives it meaning.","level":"Course level"}]},{"id":"doppler-light","title":"Doppler shift for light","subject":"em","courses":["phy2049"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>f\u003c/mi>\u003cmtext>obs\u003c/mtext>\u003c/msub>\u003cmo>≈\u003c/mo>\u003cmi>f\u003c/mi>\u003cmrow>\u003cmo fence=\"true\">(\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>±\u003c/mo>\u003cmfrac>\u003cmi>v\u003c/mi>\u003cmi>c\u003c/mi>\u003c/mfrac>\u003cmo fence=\"true\">)\u003c/mo>\u003c/mrow>\u003cmtext>  \u003c/mtext>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>v\u003c/mi>\u003cmo>≪\u003c/mo>\u003cmi>c\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmsub>\u003cmi>f\u003c/mi>\u003cmtext>echo\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>f\u003c/mi>\u003cmi>v\u003c/mi>\u003c/mrow>\u003cmi>c\u003c/mi>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A source and observer closing in see a higher frequency, and moving apart a lower one. For light only their relative speed matters. A radar echo is shifted twice: once as the car receives the wave, once as it sends it back. The gun counts the beat between the outgoing and returning waves and reads the speed from it.","requires":["em-waves","doppler-sound"],"labs":[{"course":"phy2049","title":"Radar gun","href":"https://flux-study.pages.dev/phy2049/#/phy2049/e6/radargun","notes":"https://flux-study.pages.dev/phy2049/#/phy2049/e6/radargun?n=s5","note":"A police radar: the echo returns shifted by \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>f\u003c/mi>\u003cmi>v\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>c\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>."}],"problems":["phy2049:e6.53.radar-gun"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 3, §5.7 Doppler effect for light","url":"https://openstax.org/books/university-physics-volume-3/pages/5-7-doppler-effect-for-light","why":"The relativistic formula and its slow-speed limit.","level":"Intro"},{"title":"Feynman Lectures Vol. I, Ch. 34: Relativistic effects in radiation","url":"https://www.feynmanlectures.caltech.edu/I_34.html","why":"Derives the shift from how a moving source’s waves bunch up.","level":"Deeper"}]},{"id":"doppler-sound","title":"Doppler effect for sound","subject":"mechanics","courses":["phy2048"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsup>\u003cmi>f\u003c/mi>\u003cmo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′\u003c/mo>\u003c/msup>\u003cmo>=\u003c/mo>\u003cmi>f\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmfrac>\u003cmrow>\u003cmi>v\u003c/mi>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmi>o\u003c/mi>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmi>v\u003c/mi>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmi>s\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A source moving toward you packs its wavefronts closer, so you hear a higher pitch; moving away, lower. A listener moving through still air meets the fronts more or less often. The two cases are not symmetric, because sound moves through the air. Past the speed of sound the fronts pile into a cone, the shock wave.","requires":["mechanical-waves"],"labs":[{"course":"phy2048","title":"Doppler effect","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u13/doppler","notes":null,"note":"A horn and a listener, each moving, then a jet past Mach 1."},{"course":"phy2048","title":"Train horn","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u13/train-horn","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u13/train-horn?n=s5","note":"A train horn at a crossing: higher coming in, lower going out, by different amounts."}],"problems":["phy2048:ch17.horn","phy2048:ch17.mach","phy2048:ch17.concept-boom","phy2048:ch17.concept-doppler"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 1, §17.7 The Doppler effect","url":"https://openstax.org/books/university-physics-volume-1/pages/17-7-the-doppler-effect","why":"Moving source and moving observer derived separately.","level":"Intro"},{"title":"OpenStax University Physics Vol. 1, §17.8 Shock waves","url":"https://openstax.org/books/university-physics-volume-1/pages/17-8-shock-waves","why":"The Mach cone and sonic booms.","level":"Intro"}]},{"id":"double-integrals","title":"Double integrals","subject":"calculus","courses":["mac2313"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmo>∬\u003c/mo>\u003cmi>D\u003c/mi>\u003c/msub>\u003cmi>f\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>A\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsubsup>\u003cmo>∫\u003c/mo>\u003cmi>a\u003c/mi>\u003cmi>b\u003c/mi>\u003c/msubsup>\u003cmtext> ⁣\u003c/mtext>\u003cmtext> ⁣\u003c/mtext>\u003cmsubsup>\u003cmo>∫\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>g\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmi>g\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/msubsup>\u003cmi>f\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>y\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Cut a region into small rectangles, multiply each one's area by the function there, and add: the volume under a surface. In practice, integrate one variable at a time. The inner integral is the area of a slice, and the outer one adds the slices. For a nice region, either order gives the same answer.","requires":["definite-integral"],"labs":[{"course":"mac2313","title":"Riemann","href":"https://flux-study.pages.dev/mac2313/#/mac2313/ch3/riemann","notes":null,"note":"A double Riemann sum, one box at a time."},{"course":"mac2313","title":"Iterated","href":"https://flux-study.pages.dev/mac2313/#/mac2313/ch3/iterated","notes":null,"note":"The inner integral as a filled slice, and the outer one adding them up."}],"problems":["mac2313:ch3.riemann.area","mac2313:ch3.riemann.mid","mac2313:ch3.riemann.closed","mac2313:ch3.riemann.limit","mac2313:ch3.iter.fubini","mac2313:ch3.iter.rect","mac2313:ch3.iter.xy","mac2313:ch3.iter.triangle","mac2313:ch3.iter.disk"],"candidate":null,"sources":[{"title":"OpenStax Calculus Vol. 3, §5.2 Double integrals over general regions","url":"https://openstax.org/books/calculus-volume-3/pages/5-2-double-integrals-over-general-regions","why":"Setting the limits for type I and type II regions, the hard part.","level":"Intro"},{"title":"MIT 18.02SC, Part A: Double integrals","url":"https://ocw.mit.edu/courses/18-02sc-multivariable-calculus-fall-2010/pages/3.-double-integrals-and-line-integrals-in-the-plane/part-a-double-integrals/","why":"Iterated integrals and switching order, with checked problems.","level":"Course level"}]},{"id":"drag-lift","title":"Drag and lift","subject":"fluids","courses":["eml3015"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmi>D\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmn>2\u003c/mn>\u003c/mfrac>\u003c/mstyle>\u003cmtext> \u003c/mtext>\u003cmsub>\u003cmi>C\u003c/mi>\u003cmi>D\u003c/mi>\u003c/msub>\u003cmtext> \u003c/mtext>\u003cmi>ρ\u003c/mi>\u003cmsup>\u003cmi>V\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmi>A\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmi>L\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmn>2\u003c/mn>\u003c/mfrac>\u003c/mstyle>\u003cmtext> \u003c/mtext>\u003cmsub>\u003cmi>C\u003c/mi>\u003cmi>L\u003c/mi>\u003c/msub>\u003cmtext> \u003c/mtext>\u003cmi>ρ\u003c/mi>\u003cmsup>\u003cmi>V\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A body in a stream feels shear on its surface and a pressure difference between front and back. Dimensional analysis packs both into coefficients that depend on shape, Reynolds number and roughness. Streamlined bodies lose most to friction; blunt ones to the low-pressure wake left where the boundary layer separates. A momentum balance on a box round the body finds the drag from the wake's missing momentum. A turbulent layer clings longer, so the wake narrows and drag can fall as speed rises.","requires":["boundary-layer","momentum-cv"],"labs":[],"problems":[],"candidate":"Plot a sphere’s drag coefficient against Reynolds number, smooth and dimpled. It corrects the idea that drag always rises with speed: past the drag crisis, a faster or rougher ball has less drag, which is why golf balls have dimples.","sources":[{"title":"Cleynen, Fluid Dynamics for Engineers","url":"https://fluidmech.ninja/","why":"Drag and lift coefficients, separation and the drag crisis.","level":"Course level"},{"title":"NASA Glenn, Beginner’s guide to aeronautics: The drag equation","url":"https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/drag-equation/","why":"What the drag coefficient holds and what it leaves out, from the people who test wings.","level":"Intro"}]},{"id":"dry-friction","title":"Dry friction and tipping","subject":"mechanics","courses":["statics"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>F\u003c/mi>\u003cmo>≤\u003c/mo>\u003cmsub>\u003cmi>μ\u003c/mi>\u003cmi>s\u003c/mi>\u003c/msub>\u003cmi>N\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmtext> \u003c/mtext>\u003cmsup>\u003cmi>e\u003c/mi>\u003cmrow>\u003cmi>μ\u003c/mi>\u003cmi>β\u003c/mi>\u003c/mrow>\u003c/msup>\u003cmtext> (belt)\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Friction is whatever force keeps a contact from slipping, up to \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsub>\u003cmi>μ\u003c/mi>\u003cmi>s\u003c/mi>\u003c/msub>\u003cmi>N\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. It equals \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>μ\u003c/mi>\u003cmi>N\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> only on the verge of slipping or while sliding, so ask first whether the body moves. A tall body pushed high may tip before it slides, and more friction makes tipping more likely. Rope wrapped round a post holds a tension that grows exponentially with the wrap angle.","requires":["static-equilibrium"],"labs":[{"course":"statics","title":"Friction","href":"https://flux-study.pages.dev/statics/#/statics/u4/friction","notes":"https://flux-study.pages.dev/statics/#/statics/u4/friction?n=s1","note":"A block on an incline, the friction cone, tip or slip, and belt friction on a post."},{"course":"statics","title":"Bookcase","href":"https://flux-study.pages.dev/statics/#/statics/u4/bookcase","notes":"https://flux-study.pages.dev/statics/#/statics/u4/bookcase?n=s2","note":"A tall bookcase pushed high: more floor friction can make it tip."}],"problems":["statics:ch8.incline-band","statics:ch8.tip-or-slip","statics:ch8.belt","statics:r4.friction-regime"],"candidate":null,"sources":[{"title":"MIT 2.001, Lecture 4: Friction","url":"https://ocw.mit.edu/courses/2-001-mechanics-materials-i-fall-2006/resources/lec4/","why":"Impending motion, wedges and belts.","level":"Course level"},{"title":"OpenStax University Physics Vol. 1, §6.2 Friction","url":"https://openstax.org/books/university-physics-volume-1/pages/6-2-friction","why":"Static against kinetic friction with measured coefficients.","level":"Intro"}]},{"id":"eigenvalues","title":"Eigenvalues and eigenvectors","subject":"linalg","courses":["egn3203"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>A\u003c/mi>\u003cmi>𝐯\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>λ\u003c/mi>\u003cmi>𝐯\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>det\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>A\u003c/mi>\u003cmo>−\u003c/mo>\u003cmi>λ\u003c/mi>\u003cmi>I\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmn>0\u003c/mn>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmunder>\u003cmo>∑\u003c/mo>\u003cmi>i\u003c/mi>\u003c/munder>\u003cmsub>\u003cmi>λ\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmi mathvariant=\"normal\">tr\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>A\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"1em\"/>\u003cmunder>\u003cmo>∏\u003c/mo>\u003cmi>i\u003c/mi>\u003c/munder>\u003cmsub>\u003cmi>λ\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmi>det\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Most vectors change direction when a matrix acts on them. An eigenvector is one that does not: the matrix only stretches it, by its eigenvalue \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>λ\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. Such a \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>𝐯\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> is in the null space of \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>A\u003c/mi>\u003cmo>−\u003c/mo>\u003cmi>λ\u003c/mi>\u003cmi>I\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>, so that matrix must be singular, and its determinant gives a polynomial whose roots are the eigenvalues. In a basis of eigenvectors the matrix acts as separate stretches, so powers and exponentials of it are easy. That is why eigenvalues set the rates in linear differential equations and the frequencies in vibration.","requires":["determinant-inverse","rank-nullspace"],"labs":[],"problems":[],"candidate":"Apply a 2×2 matrix to a ring of arrows and watch which ones only stretch. It corrects the idea that every matrix has directions it only stretches: a quarter-turn rotation turns every arrow, and its eigenvalues are \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmo>±\u003c/mo>\u003cmi>i\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>.","sources":[{"title":"Margalit and Rabinoff, Interactive Linear Algebra","url":"https://textbooks.math.gatech.edu/ila/","why":"Its eigenvalue chapter shows each matrix acting on the plane, with the characteristic polynomial after.","level":"Course level"},{"title":"MIT 18.06SC Linear Algebra, Fall 2011","url":"https://ocw.mit.edu/courses/18-06sc-linear-algebra-fall-2011/","why":"Unit II ends with eigenvalues, diagonalizing and differential equations.","level":"Course level"},{"title":"Lebl, Notes on Diffy Qs, §3.4 Eigenvalue method","url":"https://www.jirka.org/diffyqs/html/eigenmethod_section.html","why":"Uses eigenvalues to solve systems of ODEs, the use this map leads to.","level":"Course level"}]},{"id":"electric-charge","title":"Electric charge","subject":"em","courses":["phy2049"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>q\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>n\u003c/mi>\u003cmi>e\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>e\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>1.602\u003c/mn>\u003cmo>×\u003c/mo>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmn>19\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmtext> C\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Charge comes in two signs and in whole multiples of \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>e\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. It is conserved: rubbing or touching only moves it from one object to another. In a conductor some charge is free to move; in an insulator it stays put, though its molecules can stretch. A charged rod can pull on a neutral object by shifting the charge inside it.","requires":[],"labs":[{"course":"phy2049","title":"Force","href":"https://flux-study.pages.dev/phy2049/#/phy2049/e1/force","notes":"https://flux-study.pages.dev/phy2049/#/phy2049/e1/force?n=s5","note":"Place charges and watch them push and pull; the notes cover conductors and induction."}],"problems":["phy2049:e1.34.electron-count","phy2049:e1.34.touching-spheres","phy2049:e1.34.induction","phy2049:e1.34.polarization","phy2049:e1.35.coulomb-pair","phy2049:e1.35.distance","phy2049:e1.35.three-inline","phy2049:e1.35.equilibrium-point","phy2049:e1.35.right-triangle","phy2049:e1.35.hydrogen","phy2049:e1.35.hanging-spheres","phy2049:e1.35.scaling"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 2, §5.1 Electric charge","url":"https://openstax.org/books/university-physics-volume-2/pages/5-1-electric-charge","why":"Quantization and conservation, with the experiments that show them.","level":"Intro"},{"title":"OpenStax University Physics Vol. 2, §5.2 Conductors, insulators, and charging by induction","url":"https://openstax.org/books/university-physics-volume-2/pages/5-2-conductors-insulators-and-charging-by-induction","why":"Charging by contact and by induction, step by step with diagrams.","level":"Intro"}]},{"id":"electric-field","title":"Electric field","subject":"em","courses":["phy2049"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>𝐄\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>𝐅\u003c/mi>\u003cmsub>\u003cmi>q\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmunder>\u003cmo>∑\u003c/mo>\u003cmi>i\u003c/mi>\u003c/munder>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmrow>\u003cmn>4\u003c/mn>\u003cmi>π\u003c/mi>\u003cmsub>\u003cmi>ε\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003cmtext> \u003c/mtext>\u003cmfrac>\u003cmsub>\u003cmi>q\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmsubsup>\u003cmi>r\u003c/mi>\u003cmi>i\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msubsup>\u003c/mfrac>\u003cmtext> \u003c/mtext>\u003cmsub>\u003cmover accent=\"true\">\u003cmi>𝐫\u003c/mi>\u003cmo>^\u003c/mo>\u003c/mover>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span>","idea":"The field is the force per unit charge that a small test charge would feel at a point. It belongs to the source charges, whether or not anything is there to feel it. Fields from several charges add as vectors. Field lines start on positive charge, end on negative charge, and crowd together where the field is strong.","requires":["coulombs-law","vector-fields"],"labs":[{"course":"phy2049","title":"Field","href":"https://flux-study.pages.dev/phy2049/#/phy2049/e2/field","notes":"https://flux-study.pages.dev/phy2049/#/phy2049/e2/field?n=s1","note":"The field of point charges as arrows and lines, with a probe you place."}],"problems":["phy2049:e2.36a.force-direction","phy2049:e2.36a.proton-electron","phy2049:e2.36a.trajectory","phy2049:e2.36a.plate-sign","phy2049:e2.36a.square-corner","phy2049:e2.36a.E-from-force","phy2049:e2.36a.accel","phy2049:e2.36a.E-from-accel","phy2049:e2.36a.tension","phy2049:e2.36a.levitate-E","phy2049:e2.36a.levitate-q","phy2049:e2.36a.point-field","phy2049:e2.36a.charge-from-field","phy2049:e2.36a.between-two","phy2049:e2.36a.collinear","phy2049:e2.36a.zero-point","phy2049:e2.36a.three-axes","phy2049:e2.36a.dipole"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 2, §5.4 Electric field","url":"https://openstax.org/books/university-physics-volume-2/pages/5-4-electric-field","why":"From force to field, then superposition of point charges.","level":"Intro"},{"title":"PhET: Charges and fields","url":"https://phet.colorado.edu/en/simulations/charges-and-fields","why":"Drop charges and a sensor; good practice reading a field map.","level":"Intro"}]},{"id":"electric-potential","title":"Electric potential","subject":"em","courses":["phy2049"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>V\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>U\u003c/mi>\u003cmsub>\u003cmi>q\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmi>V\u003c/mi>\u003cmo>=\u003c/mo>\u003cmo>−\u003c/mo>\u003cmsubsup>\u003cmo>∫\u003c/mo>\u003cmi>a\u003c/mi>\u003cmi>b\u003c/mi>\u003c/msubsup>\u003cmi>𝐄\u003c/mi>\u003cmo>⋅\u003c/mo>\u003cmi>d\u003c/mi>\u003cmi>𝐥\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>𝐄\u003c/mi>\u003cmo>=\u003c/mo>\u003cmo>−\u003c/mo>\u003cmi mathvariant=\"normal\">∇\u003c/mi>\u003cmi>V\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"The electrostatic force is conservative, so a charge has potential energy, and potential is that energy per unit charge. It is a scalar, so the potentials of many charges simply add. The field points down the potential's gradient, at right angles to the equipotentials. A charge that falls through \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmi>V\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> gains kinetic energy \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>q\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmi>V\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>; that is how an ion thruster makes its beam.","requires":["electric-field","gradient","line-integrals"],"labs":[{"course":"phy2049","title":"Potential","href":"https://flux-study.pages.dev/phy2049/#/phy2049/e3/potential","notes":"https://flux-study.pages.dev/phy2049/#/phy2049/e3/potential?n=s3","note":"Potential as a coloured surface with equipotentials and field lines over it."},{"course":"phy2049","title":"Ion thruster","href":"https://flux-study.pages.dev/phy2049/#/phy2049/e3/thruster","notes":null,"note":"An ion thruster: ions fall through the grid voltage, \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>q\u003c/mi>\u003cmi>V\u003c/mi>\u003cmo>=\u003c/mo>\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmn>2\u003c/mn>\u003c/mfrac>\u003c/mstyle>\u003cmi>m\u003c/mi>\u003cmsup>\u003cmi>v\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span>, and leave as thrust."}],"problems":["phy2049:e3.38.point-V","phy2049:e3.38.work-radial","phy2049:e3.38.uniform-dV","phy2049:e3.38.accelerate","phy2049:e3.38.pair-energy","phy2049:e3.38.system-energy","phy2049:e3.38.equipotentials","phy2049:e3.38.E-from-V","phy2049:e3.39.two-charges-V","phy2049:e3.39.three-charges-V","phy2049:e3.39.zero-V-point","phy2049:e3.39.compare-configs","phy2049:e3.38.uniform-path","phy2049:e3.38.pe-rank","phy2049:e3.38.moving-charge-energy","phy2049:e3.38.uniform-rank","phy2049:e3.38.uniform-zero-V","phy2049:e3.39.deltaV-two-radii","phy2049:e3.38.ion-thruster"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 2, §7.2 Electric potential and potential difference","url":"https://openstax.org/books/university-physics-volume-2/pages/7-2-electric-potential-and-potential-difference","why":"Separates potential energy from potential, the distinction most students blur.","level":"Intro"},{"title":"OpenStax University Physics Vol. 2, §7.4 Determining field from potential","url":"https://openstax.org/books/university-physics-volume-2/pages/7-4-determining-field-from-potential","why":"The gradient step, with the components written out.","level":"Course level"}]},{"id":"electric-power","title":"Electric power","subject":"circuits","courses":["phy2049","eel3111"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>P\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>I\u003c/mi>\u003cmi>V\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsup>\u003cmi>I\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmi>R\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsup>\u003cmi>V\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmi>R\u003c/mi>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>rms\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmsqrt>\u003cmn>2\u003c/mn>\u003c/msqrt>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A source does work on each coulomb it pushes, so power is current times voltage. In a resistor all of it turns to heat. To send power far, raise the voltage: the current falls, and the line's \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsup>\u003cmi>I\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmi>R\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> loss falls with its square. For AC, the rms value is the steady voltage that would heat a resistor the same.","requires":["current-resistance"],"labs":[{"course":"phy2049","title":"Power","href":"https://flux-study.pages.dev/phy2049/#/phy2049/e3/power","notes":"https://flux-study.pages.dev/phy2049/#/phy2049/e3/power?n=s13","note":"Power in a resistor, and AC against DC with rms and peak marked."},{"course":"phy2049","title":"Power lines","href":"https://flux-study.pages.dev/phy2049/#/phy2049/e3/powerline","notes":null,"note":"A town fed at voltage \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>V\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>: the share lost in the line is \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>P\u003c/mi>\u003cmi>R\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmsup>\u003cmi>V\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span>."}],"problems":["phy2049:e3.42.bulb","phy2049:e3.42.ac-rms","phy2049:e3.42.cost","phy2049:e3.42.two-bulbs","phy2049:e3.42.heater","phy2049:e3.42.fuse","phy2049:e3.42.power-basics","phy2049:e3.42.R-from-P-I","phy2049:e3.42.ac-graph","phy2049:e5.50.transmission","phy2049:e3.42.power-line"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 2, §9.5 Electrical energy and power","url":"https://openstax.org/books/university-physics-volume-2/pages/9-5-electrical-energy-and-power","why":"Power in resistors, with the cost of running real appliances.","level":"Intro"},{"title":"OpenStax University Physics Vol. 2, §10.6 Household wiring and electrical safety","url":"https://openstax.org/books/university-physics-volume-2/pages/10-6-household-wiring-and-electrical-safety","why":"Grounding, breakers and why a shock depends on current, not voltage alone.","level":"Intro"}]},{"id":"em-waves","title":"Electromagnetic waves","subject":"em","courses":["phy2049"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>c\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmsqrt>\u003cmrow>\u003cmsub>\u003cmi>μ\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmsub>\u003cmi>ε\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003c/mrow>\u003c/msqrt>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmi>f\u003c/mi>\u003cmi>λ\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>E\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>c\u003c/mi>\u003cmi>B\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A changing magnetic field makes an electric field, and a changing electric field makes a magnetic one. Maxwell's equations allow the pair to sustain each other and travel, with no charge nearby, at \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmn>1\u003c/mn>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmsqrt>\u003cmrow>\u003cmsub>\u003cmi>μ\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmsub>\u003cmi>ε\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003c/mrow>\u003c/msqrt>\u003c/mrow>\u003c/math>\u003c/span>. That number is the speed of light. \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>𝐄\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> and \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>𝐁\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> are perpendicular to each other and to the motion. Radio, light and X-rays differ only in wavelength.","requires":["maxwell-div","amperes-law"],"labs":[{"course":"phy2049","title":"EM wave","href":"https://flux-study.pages.dev/phy2049/#/phy2049/e6/emwave","notes":"https://flux-study.pages.dev/phy2049/#/phy2049/e6/emwave?n=s1","note":"E and B travelling together, from FM radio to X-rays."}],"problems":["phy2049:e6.53.f-from-lambda","phy2049:e6.53.B-from-E","phy2049:e6.53.direction","phy2049:e6.53.wave-eq","phy2049:e6.53.wave-terms","phy2049:e6.53.true-or-false","phy2049:e6.53.photon-color","phy2049:e6.53.photon-energy","phy2049:e6.54.band","phy2049:e6.54.order","phy2049:e6.54.rank-energy","phy2049:e6.54.uses","phy2049:e6.54.source","phy2049:e6.54.lambda-from-f","phy2049:e6.55.intensity","phy2049:e6.55.E-from-I","phy2049:e6.55.point-source","phy2049:e6.55.pressure","phy2049:e6.55.rms-from-I","phy2049:e6.55.peak-to-rms","phy2049:e6.55.detector-distance"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 2, §16.2 Plane electromagnetic waves","url":"https://openstax.org/books/university-physics-volume-2/pages/16-2-plane-electromagnetic-waves","why":"Shows how the wave equation and c fall out of Maxwell’s equations.","level":"Intro"},{"title":"MIT 8.02, Problem-solving guide: EM radiation","url":"https://ocw.mit.edu/courses/8-02-physics-ii-electricity-and-magnetism-spring-2007/resources/solving10/","why":"Reading direction, polarization and amplitude off a wave’s formula.","level":"Course level"}]},{"id":"energy-conservation","title":"Potential energy and conservation","subject":"mechanics","courses":["phy2048"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>K\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>U\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>K\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>U\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmtext>th\u003c/mtext>\u003c/msub>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmi>x\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmo>−\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>U\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A conservative force stores the work it takes as potential energy, so kinetic plus potential stays fixed. Friction moves some of it into thermal energy instead. Only changes in potential energy matter, so its zero is a free choice. On a potential-energy curve a body can be only where its energy is above the curve, turns round where they meet, and rests at the bottoms.","requires":["work-energy"],"labs":[{"course":"phy2048","title":"Energy track","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u4/track","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u4/track?n=s8","note":"A body on a track sharing kinetic and potential energy, with friction taking a share."},{"course":"phy2048","title":"Energy diagram","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u4/energy-diagram","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u4/energy-diagram?n=s9","note":"Motion read from a potential-energy curve: turning points, force and rest."}],"problems":["phy2048:ch8.loop","phy2048:ch8.concept-zero","phy2048:ch8.concept-friction","phy2048:ch8.turning","phy2048:ch8.concept-diagram"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 1, §8.3 Conservation of energy","url":"https://openstax.org/books/university-physics-volume-1/pages/8-3-conservation-of-energy","why":"Mechanical energy with and without friction, worked on tracks and springs.","level":"Intro"},{"title":"OpenStax University Physics Vol. 1, §8.4 Potential energy diagrams and stability","url":"https://openstax.org/books/university-physics-volume-1/pages/8-4-potential-energy-diagrams-and-stability","why":"Reading turning points and equilibria off a U curve.","level":"Intro"}]},{"id":"energy-cv","title":"Steady-flow energy equation","subject":"thermo","courses":["eml3100","eml3015"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmover accent=\"true\">\u003cmi>Q\u003c/mi>\u003cmo>˙\u003c/mo>\u003c/mover>\u003cmo>−\u003c/mo>\u003cmover accent=\"true\">\u003cmi>W\u003c/mi>\u003cmo>˙\u003c/mo>\u003c/mover>\u003cmo>=\u003c/mo>\u003cmover accent=\"true\">\u003cmi>m\u003c/mi>\u003cmo>˙\u003c/mo>\u003c/mover>\u003cmrow>\u003cmo fence=\"true\">[\u003c/mo>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>+\u003c/mo>\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmn>2\u003c/mn>\u003c/mfrac>\u003c/mstyle>\u003cmrow>\u003cmo fence=\"true\">(\u003c/mo>\u003cmsubsup>\u003cmi>V\u003c/mi>\u003cmn>2\u003c/mn>\u003cmn>2\u003c/mn>\u003c/msubsup>\u003cmo>−\u003c/mo>\u003cmsubsup>\u003cmi>V\u003c/mi>\u003cmn>1\u003c/mn>\u003cmn>2\u003c/mn>\u003c/msubsup>\u003cmo fence=\"true\">)\u003c/mo>\u003c/mrow>\u003cmo>+\u003c/mo>\u003cmi>g\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsub>\u003cmi>z\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>z\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo fence=\"true\">]\u003c/mo>\u003c/mrow>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Energy gets the same boundary bookkeeping as mass. Each kilogram that crosses carries enthalpy, kinetic energy and potential energy. The heat and work crossing the boundary account for the change. Turbines, nozzles and water heaters are all this one equation.","requires":["mass-cv","first-law-closed"],"labs":[{"course":"eml3100","title":"Water heater","href":"https://flux-study.pages.dev/eml3100/#/eml3100/u3/heater","notes":"https://flux-study.pages.dev/eml3100/#/eml3100/u3/heater?n=s7","note":"A tankless water heater as one control volume: \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmover accent=\"true\">\u003cmi>Q\u003c/mi>\u003cmo>˙\u003c/mo>\u003c/mover>\u003cmo>=\u003c/mo>\u003cmover accent=\"true\">\u003cmi>m\u003c/mi>\u003cmo>˙\u003c/mo>\u003c/mover>\u003cmtext> \u003c/mtext>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmtext>out\u003c/mtext>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmtext>in\u003c/mtext>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/math>\u003c/span>."},{"course":"eml3100","title":"Steady-flow devices","href":"https://flux-study.pages.dev/eml3100/#/eml3100/u3/devices","notes":"https://flux-study.pages.dev/eml3100/#/eml3100/u3/devices?n=s2","note":"Turbine, compressor, throttle, mixer and heat exchanger: one balance with different terms on."}],"problems":["eml3100:u3.5.heater","eml3100:u3.5.heater-power","eml3100:u3.5.turbine","eml3100:u3.5.compressor","eml3100:u3.5.throttle-steam","eml3100:u3.5.flash","eml3100:u3.5.mixer","eml3100:u3.5.exchanger","eml3100:u3.5.which-device","eml3100:u3.5.throttle-temperature"],"candidate":null,"sources":[{"title":"Cleynen, Engineering Thermodynamics","url":"https://thermodynamicsbook.com/","why":"Open systems with many worked examples and problems with solutions.","level":"Course level"},{"title":"MIT 16.050 Thermal Energy, calendar","url":"https://ocw.mit.edu/courses/16-050-thermal-energy-fall-2002/pages/calendar/","why":"The prelude reviews control-volume energy before the second law.","level":"Course level"}]},{"id":"energy-methods","title":"Strain energy and Castigliano","subject":"materials","courses":["egn3331"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>U\u003c/mi>\u003cmo>=\u003c/mo>\u003cmo>∫\u003c/mo>\u003cmfrac>\u003cmsup>\u003cmi>N\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>A\u003c/mi>\u003cmi>E\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmi>d\u003c/mi>\u003cmi>x\u003c/mi>\u003cmo>+\u003c/mo>\u003cmo>∫\u003c/mo>\u003cmfrac>\u003cmsup>\u003cmi>M\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>E\u003c/mi>\u003cmi>I\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmi>d\u003c/mi>\u003cmi>x\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>δ\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmi>U\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmsub>\u003cmi>P\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A loaded elastic body stores strain energy, and the deflection at a load is the derivative of that energy with respect to the load. A dummy load finds a deflection where no real load acts; the unit-load method does the same with a table of member forces. Energy also handles impact: a weight dropped onto a rope multiplies the static force by \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmn>1\u003c/mn>\u003cmo>+\u003c/mo>\u003cmsqrt>\u003cmrow>\u003cmn>1\u003c/mn>\u003cmo>+\u003c/mo>\u003cmn>2\u003c/mn>\u003cmi>h\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmsub>\u003cmi>δ\u003c/mi>\u003cmtext>st\u003c/mtext>\u003c/msub>\u003c/mrow>\u003c/msqrt>\u003c/mrow>\u003c/math>\u003c/span>.","requires":["axial-deformation","beam-deflection","partial-derivatives"],"labs":[{"course":"egn3331","title":"Castigliano","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u10/castigliano","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u10/castigliano?n=s1","note":"Deflection as the derivative of strain energy, with a dummy load."},{"course":"egn3331","title":"Crane rope","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u10/drop","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u10/drop?n=s4","note":"A weight dropped onto a crane rope, and the factor it adds."},{"course":"egn3331","title":"Roof truss sag","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u10/rooftruss","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u10/rooftruss?n=s6","note":"A roof truss’s sag by unit loads on a table of member forces."}],"problems":["egn3331:u10.14.axial","egn3331:u10.14.beam","egn3331:u10.14.station","egn3331:u10.14.truss","egn3331:u10.14.shaft","egn3331:u10.14.scale","egn3331:u10.14.dummy","egn3331:u10.14.beam-unit","egn3331:u10.14.impact","egn3331:u10.14.rope","egn3331:u10.14.height","egn3331:u10.14.release","egn3331:u10.14.beam-drop","egn3331:u10.14.truss-unit","egn3331:u10.14.unit-where"],"candidate":null,"sources":[{"title":"MIT 2.001, Lecture 24: Energy methods","url":"https://ocw.mit.edu/courses/2-001-mechanics-materials-i-fall-2006/resources/lec24/","why":"Strain energy and Castigliano’s theorem.","level":"Course level"},{"title":"MIT 3.11, calendar: Truss deflections and Castigliano’s method (8)","url":"https://ocw.mit.edu/courses/3-11-mechanics-of-materials-fall-1999/pages/calendar/","why":"Where the course’s reading applies Castigliano to trusses.","level":"Deeper"}]},{"id":"entropy-generation","title":"Entropy generation","subject":"thermo","courses":["eml3100","eml3101"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>S\u003c/mi>\u003cmtext>gen\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmi>S\u003c/mi>\u003cmo>−\u003c/mo>\u003cmo>∑\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003c/mfrac>\u003cmo>≥\u003c/mo>\u003cmn>0\u003c/mn>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmover accent=\"true\">\u003cmi>S\u003c/mi>\u003cmo>˙\u003c/mo>\u003c/mover>\u003cmtext>gen\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmover accent=\"true\">\u003cmi>Q\u003c/mi>\u003cmo>˙\u003c/mo>\u003c/mover>\u003cmrow>\u003cmo fence=\"true\">(\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmi>L\u003c/mi>\u003c/msub>\u003c/mfrac>\u003cmo>−\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmi>H\u003c/mi>\u003c/msub>\u003c/mfrac>\u003cmo fence=\"true\">)\u003c/mo>\u003c/mrow>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Every real process makes entropy, and none destroys it. Heat flowing from warm to cold is the simplest case: the cold side gains more entropy than the warm side loses. The bigger the temperature gap the heat falls through, the more is generated. Zero generation is the reversible ideal.","requires":["entropy"],"labs":[{"course":"eml3100","title":"Heat through a wall","href":"https://flux-study.pages.dev/eml3100/#/eml3100/u5/wall","notes":"https://flux-study.pages.dev/eml3100/#/eml3100/u5/wall?n=s6","note":"Heat through a wall from a warm room to cold air, and the entropy it makes."}],"problems":["eml3100:u5.6.wall","eml3100:u5.6.english","eml3100:u5.6.generation"],"candidate":null,"sources":[{"title":"Yan, Introduction to Engineering Thermodynamics, Ch. 6 Entropy and the second law","url":"https://pressbooks.bccampus.ca/thermo1/","why":"The course’s own book: the entropy balance and its generation term.","level":"Course level"},{"title":"OpenStax University Physics Vol. 2, §4.6 Entropy","url":"https://openstax.org/books/university-physics-volume-2/pages/4-6-entropy","why":"Heat flow between two bodies as the example of entropy rising.","level":"Intro"}]},{"id":"entropy","title":"Entropy","subject":"thermo","courses":["eml3100","eml3101"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>s\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmrow>\u003cmo fence=\"true\">(\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>δ\u003c/mi>\u003cmi>q\u003c/mi>\u003c/mrow>\u003cmi>T\u003c/mi>\u003c/mfrac>\u003cmo fence=\"true\">)\u003c/mo>\u003c/mrow>\u003cmtext>rev\u003c/mtext>\u003c/msub>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>c\u003c/mi>\u003cmi>p\u003c/mi>\u003c/msub>\u003cmi>ln\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003c/mfrac>\u003cmo>−\u003c/mo>\u003cmi>R\u003c/mi>\u003cmi>ln\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Entropy is a property, so its change depends only on the end states. Along a reversible path it is heat divided by temperature, so the area under a reversible path on a \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>T\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>–\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>s\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> diagram is the heat. For an ideal gas and for a liquid there are formulas; for steam, tables. In an adiabatic process, a real one ends to the right of the reversible one, because friction and mixing can only add entropy. With heat removed, a real process can end to the left.","requires":["carnot-limit"],"labs":[{"course":"eml3100","title":"Temperature and entropy","href":"https://flux-study.pages.dev/eml3100/#/eml3100/u5/ts","notes":"https://flux-study.pages.dev/eml3100/#/eml3100/u5/ts?n=s2","note":"Reversible isobars on a T–s diagram, where the area under the path is the heat."}],"problems":["eml3100:u5.6.isobar","eml3100:u5.6.liquid","eml3100:u5.6.exit"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 2, §4.6 Entropy","url":"https://openstax.org/books/university-physics-volume-2/pages/4-6-entropy","why":"Entropy defined from the Carnot cycle, with ideal-gas changes.","level":"Intro"},{"title":"Yan, Introduction to Engineering Thermodynamics, Ch. 6 Entropy and the second law","url":"https://pressbooks.bccampus.ca/thermo1/","why":"The course’s own book: T–s diagrams and entropy from the tables.","level":"Course level"}]},{"id":"euler-equations","title":"Euler’s equation of motion","subject":"fluids","courses":["eml3015"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>ρ\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmfrac>\u003cmrow>\u003cmi>D\u003c/mi>\u003cmi>𝐯\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>D\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmo>−\u003c/mo>\u003cmi mathvariant=\"normal\">∇\u003c/mi>\u003cmi>p\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>ρ\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>𝐠\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"In rigid-body motion every parcel had the same acceleration. Let the acceleration vary from point to point, as the material derivative, and the same balance holds for any flow without friction. Pressure differences and gravity are the only forces. Integrate it along a streamline in steady flow and Bernoulli's equation comes out. Across curved streamlines it says pressure rises toward the outside of the bend.","requires":["material-derivative","rigid-body-fluid"],"labs":[],"problems":[],"candidate":"Flow round a bend with pressure contours drawn across it. It corrects the idea that pressure is uniform across a stream: curved streamlines need higher pressure on the outside to turn the fluid.","sources":[{"title":"MIT 2.06, Lecture notes: Differential forms","url":"https://ocw.mit.edu/courses/2-06-fluid-dynamics-spring-2013/resources/mit2_06s13_notes_vo/","why":"Derives the Euler equations from a force balance on a fluid element.","level":"Course level"},{"title":"Cleynen, Fluid Dynamics for Engineers","url":"https://fluidmech.ninja/","why":"The inviscid momentum equation and how Bernoulli follows from it.","level":"Course level"}]},{"id":"euler-method","title":"Euler’s method","subject":"numerics","courses":["map2302","egn3203"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmrow>\u003cmi>n\u003c/mi>\u003cmo>+\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmi>h\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>f\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsub>\u003cmi>t\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003cmo separator=\"true\">,\u003c/mo>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo separator=\"true\">;\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsup>\u003cmi>y\u003c/mi>\u003cmo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′\u003c/mo>\u003c/msup>\u003cmo>=\u003c/mo>\u003cmo>−\u003c/mo>\u003cmi>k\u003c/mi>\u003cmi>y\u003c/mi>\u003cmo>⇒\u003c/mo>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>−\u003c/mo>\u003cmi>k\u003c/mi>\u003cmi>h\u003c/mi>\u003cmsup>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmi>n\u003c/mi>\u003c/msup>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Walk along the slope field in short straight steps. Smaller steps follow the true solution more closely, with error proportional to the step. But a step too large for a fast-decaying equation makes the numbers oscillate and grow, even though the exact solution decays: \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi mathvariant=\"normal\">∣\u003c/mi>\u003cmn>1\u003c/mn>\u003cmo>−\u003c/mo>\u003cmi>k\u003c/mi>\u003cmi>h\u003c/mi>\u003cmi mathvariant=\"normal\">∣\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> must stay below one.","requires":["first-order-odes"],"labs":[{"course":"map2302","title":"Euler steps","href":"https://flux-study.pages.dev/map2302/#/map2302/u1/euler","notes":"https://flux-study.pages.dev/map2302/#/map2302/u1/euler?n=s4","note":"Euler steps against the exact curve, including a stable equation with unstable steps."}],"problems":[],"candidate":null,"sources":[{"title":"Lebl, Notes on Diffy Qs, §1.7 Numerical methods: Euler’s method","url":"https://www.jirka.org/diffyqs/html/numer_section.html","why":"Euler’s method and its error, from the course’s book.","level":"Course level"},{"title":"OpenStax Calculus Vol. 2, §4.2 Direction fields and numerical methods","url":"https://openstax.org/books/calculus-volume-2/pages/4-2-direction-fields-and-numerical-methods","why":"Direction fields and Euler steps with worked tables.","level":"Intro"}]},{"id":"exact-equations","title":"Exact equations","subject":"diffeq","courses":["map2302"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>M\u003c/mi>\u003cmi>y\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>N\u003c/mi>\u003cmi>x\u003c/mi>\u003c/msub>\u003cmtext>  \u003c/mtext>\u003cmo>⇒\u003c/mo>\u003cmtext>  \u003c/mtext>\u003cmi>F\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmi>C\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Some first-order equations are the total differential of one function set to zero. When \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsub>\u003cmi>M\u003c/mi>\u003cmi>y\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>N\u003c/mi>\u003cmi>x\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span>, that function \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>F\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> exists, and every solution keeps \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>F\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> constant, so solutions are level curves. The test is the equal-mixed-partials test for a gradient field from Calculus III. When it fails, a factor \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>μ\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/math>\u003c/span> or \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>μ\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/math>\u003c/span> can make the equation exact.","requires":["first-order-odes","partial-derivatives"],"labs":[{"course":"map2302","title":"Exact and substitution","href":"https://flux-study.pages.dev/map2302/#/map2302/u1/exact-substitution","notes":"h
