splay=\"block\">\u003cmrow>\u003cmi>ρ\u003c/mi>\u003cmi>c\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmfrac>\u003cmrow>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmi>T\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmi mathvariant=\"normal\">∇\u003c/mi>\u003cmo>⋅\u003c/mo>\u003cmrow>\u003cmo fence=\"true\">(\u003c/mo>\u003cmi>k\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi mathvariant=\"normal\">∇\u003c/mi>\u003cmi>T\u003c/mi>\u003cmo fence=\"true\">)\u003c/mo>\u003c/mrow>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Balance energy on a tiny volume. The energy stored per second equals the net heat flux in, and the divergence theorem turns that into this equation. With constant \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>k\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> it is \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmi>T\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmi>t\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>α\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmsup>\u003cmi mathvariant=\"normal\">∇\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmi>T\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. Steady conduction is \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsup>\u003cmi mathvariant=\"normal\">∇\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmi>T\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003c/math>\u003c/span>.","requires":["fourier","divergence-theorem","energy-cv"],"labs":[],"problems":[],"candidate":"A rod with a starting temperature profile, solved by Fourier series and by finite differences, side by side.","sources":[{"title":"Lienhard, A Heat Transfer Textbook","url":"https://ahtt.mit.edu","why":"Chapter 2 derives this equation and solves the standard cases.","level":"Course level"},{"title":"MIT 2.51, calendar: Conduction, resistances, energy equation","url":"https://ocw.mit.edu/courses/2-51-intermediate-heat-and-mass-transfer-fall-2008/pages/calendar/","why":"Shows where the equation sits in a heat transfer course.","level":"Deeper"}]},{"id":"heat-exchangers","title":"Heat exchangers: LMTD and ε-NTU","subject":"heat","courses":["eml4140"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>q\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>U\u003c/mi>\u003cmi>A\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmtext>lm\u003c/mtext>\u003c/msub>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"1em\"/>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmtext>lm\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmi>ln\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>q\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>ε\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmsub>\u003cmi>C\u003c/mi>\u003cmtext>min\u003c/mtext>\u003c/msub>\u003cmtext> \u003c/mtext>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmrow>\u003cmi>h\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>i\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmrow>\u003cmi>c\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>i\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"1em\"/>\u003cmtext>NTU\u003c/mtext>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>U\u003c/mi>\u003cmi>A\u003c/mi>\u003c/mrow>\u003cmsub>\u003cmi>C\u003c/mi>\u003cmtext>min\u003c/mtext>\u003c/msub>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A heat exchanger passes heat from one stream to another through a wall, and the overall coefficient \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>U\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> sums the resistances in between. The temperature difference changes along the length, so energy balances on both streams give a log-mean difference to use with \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>U\u003c/mi>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. When the outlet temperatures are not known, the effectiveness method is quicker: \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>ε\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> is the heat moved over the most that could move, and it depends only on NTU, the capacity ratio and the flow arrangement. In counterflow the cold stream can leave hotter than the hot stream leaves; in parallel flow it never can.","requires":["thermal-resistance","energy-cv"],"labs":[],"problems":[],"candidate":"Run one exchanger in counterflow and parallel flow, the two temperature profiles drawn. It corrects the idea that the cold stream can never leave hotter than the hot stream leaves: in counterflow it can, and LMTD and ε-NTU give the same duty.","sources":[{"title":"Lienhard, A Heat Transfer Textbook","url":"https://ahtt.mit.edu","why":"Chapter 3 covers exchanger types, LMTD and effectiveness.","level":"Course level"},{"title":"MIT 16.050, calendar: Applications of the concepts, heat exchangers","url":"https://ocw.mit.edu/courses/16-050-thermal-energy-fall-2002/pages/calendar/","why":"MIT 2.51’s calendar has no exchanger session; 16.050 gives it two lectures.","level":"Course level"},{"title":"Wikipedia, NTU method","url":"https://en.wikipedia.org/wiki/NTU_method","why":"Effectiveness against NTU for the common flow arrangements.","level":"Intro"}]},{"id":"higher-order-linear","title":"Higher-order linear equations and annihilators","subject":"diffeq","courses":["map2302"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>W\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>t\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmi>W\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsub>\u003cmi>t\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmsup>\u003cmi>e\u003c/mi>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmo>∫\u003c/mo>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmrow>\u003cmi>n\u003c/mi>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span>","idea":"An nth-order linear equation needs n independent solutions and n initial values. With constant coefficients each root of the characteristic polynomial gives a solution, and a root of multiplicity m also gives it times \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmo>…\u003c/mo>\u003cmo separator=\"true\">,\u003c/mo>\u003cmsup>\u003cmi>t\u003c/mi>\u003cmrow>\u003cmi>m\u003c/mi>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span>. Abel’s formula says the Wronskian is never zero or always zero. An annihilator turns the undetermined-coefficients guess into a derivation: apply the operator that kills the forcing, then drop the roots the equation already has.","requires":["damped-oscillator","determinant-inverse"],"labs":[{"course":"map2302","title":"Higher-order equations","href":"https://flux-study.pages.dev/map2302/#/map2302/u2/higher-order","notes":"https://flux-study.pages.dev/map2302/#/map2302/u2/higher-order?n=s13","note":"Third- and fourth-order bases checked against RK4 and Abel’s formula, and an annihilator trial."}],"problems":["map2302:u2.third-order","map2302:u2.abel","map2302:u2.annihilator-ivp"],"candidate":null,"sources":[{"title":"Lebl, Notes on Diffy Qs, §2.3 Higher order linear ODEs","url":"https://www.jirka.org/diffyqs/","why":"Fundamental sets, the Wronskian and constant coefficients of any order.","level":"Course level"},{"title":"MIT 18.03SC, Linear operators, linear time invariance","url":"https://ocw.mit.edu/courses/18-03sc-differential-equations-fall-2011/pages/unit-ii-second-order-constant-coefficient-linear-equations/linear-operators-linear-time-invariance/","why":"Writing equations as polynomials in D, the language annihilators use.","level":"Course level"}]},{"id":"hydrostatic-forces","title":"Forces on submerged surfaces","subject":"fluids","courses":["eml3015"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmi>R\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmi>ρ\u003c/mi>\u003cmi>g\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmi>c\u003c/mi>\u003c/msub>\u003cmi>A\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmtext>cp\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>c\u003c/mi>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmrow>\u003cmi>x\u003c/mi>\u003cmi>c\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmrow>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>c\u003c/mi>\u003c/msub>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Pressure grows with depth, so a gate or a dam face carries a load that rises toward its bottom edge. Integrate \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>ρ\u003c/mi>\u003cmi>g\u003c/mi>\u003cmi>h\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> over the face and the total is the pressure at the centroid times the area. The resultant does not act at the centroid: the deeper half pushes harder, so it acts lower, by the area moment of inertia over \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>c\u003c/mi>\u003c/msub>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. On a curved face, take the horizontal part on the face's vertical projection and the vertical part as the weight of fluid above it.","requires":["pressure","centroids"],"labs":[],"problems":[],"candidate":"Slide a rectangular gate deeper into a tank and watch the resultant arrow. It corrects the idea that the force acts at the centroid: it acts below it, and closes in on it as the gate goes deeper.","sources":[{"title":"MIT 2.06, calendar: Lecture 1, fluid statics and forces on surfaces","url":"https://ocw.mit.edu/courses/2-06-fluid-dynamics-spring-2013/pages/calendar/","why":"Where the course starts: the pressure field at rest, then the force it puts on a wall.","level":"Course level"},{"title":"Cleynen, Fluid Dynamics for Engineers","url":"https://fluidmech.ninja/","why":"A free text for the whole course. Its statics chapter works plane and curved surfaces.","level":"Course level"}]},{"id":"hypothesis-tests","title":"Hypothesis tests, errors and power","subject":"stats","courses":["sta3032"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>α\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>P\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmtext>reject \u003c/mtext>\u003cmsub>\u003cmi>H\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmo>∣\u003c/mo>\u003cmsub>\u003cmi>H\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmtext>power\u003c/mtext>\u003cmo>=\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>−\u003c/mo>\u003cmi>β\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>P\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmtext>reject \u003c/mtext>\u003cmsub>\u003cmi>H\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmo>∣\u003c/mo>\u003cmsub>\u003cmi>H\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A test asks whether the data are surprising if the null hypothesis is true. Rejecting a true null is a Type I error, with probability \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>α\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>; missing a real effect is a Type II error. Power grows with the effect size and the sample size. Which test fits depends on the question: one mean or two, paired or not, known spread or not, a proportion or a mean.","requires":["sampling-distributions"],"labs":[{"course":"sta3032","title":"Errors and power","href":"https://flux-study.pages.dev/sta3032/#/sta3032/final/explore/power","notes":null,"note":"The null and alternative distributions with α, β and power shaded."},{"course":"sta3032","title":"Which test?","href":"https://flux-study.pages.dev/sta3032/#/sta3032/final/explore/tests","notes":null,"note":"The questions that pick a test, with the decision tree lit."}],"problems":[],"candidate":null,"sources":[{"title":"MIT 18.05, Reading 17a: Frequentist methods; null hypothesis significance testing","url":"https://ocw.mit.edu/courses/18-05-introduction-to-probability-and-statistics-spring-2014/resources/mit18_05s14_reading17a/","why":"Rejection regions, significance and power.","level":"Course level"},{"title":"MIT 18.05, Reading 19: NHST III, gallery of tests","url":"https://ocw.mit.edu/courses/18-05-introduction-to-probability-and-statistics-spring-2014/resources/mit18_05s14_reading19/","why":"The common tests side by side, which is the choice the lab drills.","level":"Course level"}]},{"id":"ideal-gas","title":"The ideal-gas law","subject":"thermo","courses":["eml3100"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>p\u003c/mi>\u003cmi>v\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>R\u003c/mi>\u003cmi>T\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>Z\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>p\u003c/mi>\u003cmi>v\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>R\u003c/mi>\u003cmi>T\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"At low pressure or high temperature a gas's molecules are far apart and hardly interact, and pressure, volume and temperature obey \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>p\u003c/mi>\u003cmi>v\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>R\u003c/mi>\u003cmi>T\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. Near the saturation dome or at very high pressure they do not. The compressibility factor \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>Z\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> measures how far a real gas strays: \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>Z\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/math>\u003c/span> means ideal.","requires":["pressure"],"labs":[{"course":"eml3100","title":"Phase diagram","href":"https://flux-study.pages.dev/eml3100/#/eml3100/u1/phase","notes":"https://flux-study.pages.dev/eml3100/#/eml3100/u1/phase?n=s5","note":"Where on the phase diagram steam behaves as an ideal gas, and where it does not."}],"problems":["eml3100:u1.2.phase","eml3100:u1.2.tank-quality","eml3100:u1.2.mixture","eml3100:u1.2.superheat","eml3100:u1.2.find-T","eml3100:u1.2.where","eml3100:u1.3.steam-z","eml3100:u1.2.hold","eml3100:u2.4.tank-heat"],"candidate":null,"sources":[{"title":"Yan, Introduction to Engineering Thermodynamics, §3.1 Ideal gas and §3.2 Compressibility factor","url":"https://pressbooks.bccampus.ca/thermo1/","why":"The course’s own book: when the law holds and how to tell.","level":"Course level"},{"title":"OpenStax University Physics Vol. 2, §2.1 Molecular model of an ideal gas","url":"https://openstax.org/books/university-physics-volume-2/pages/2-1-molecular-model-of-an-ideal-gas","why":"Where the law comes from, molecule by molecule.","level":"Intro"}]},{"id":"impact","title":"Impact and restitution","subject":"mechanics","courses":["egn3321","phy2048"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>e\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmrow>\u003cmi>B\u003c/mi>\u003cmn>2\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmrow>\u003cmi>A\u003c/mi>\u003cmn>2\u003c/mn>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmrow>\u003cmi>A\u003c/mi>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmrow>\u003cmi>B\u003c/mi>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"In a collision, momentum along the line of impact is shared and conserved. One more equation is needed, and the coefficient of restitution supplies it: how fast they separate over how fast they closed. \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>e\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/math>\u003c/span> loses no energy; \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>e\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003c/math>\u003c/span> makes them move together. In an oblique impact the parts across the line of impact are unchanged.","requires":["impulse-momentum"],"labs":[{"course":"egn3321","title":"Impact","href":"https://flux-study.pages.dev/egn3321/#/egn3321/u4/impact","notes":"https://flux-study.pages.dev/egn3321/#/egn3321/u4/impact?n=s3","note":"Central and oblique impact, with the energy each one loses."},{"course":"phy2048","title":"Collisions","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u5/collide","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u5/collide?n=s3","note":"One-dimensional collisions from elastic to sticking, with the energy lost."},{"course":"phy2048","title":"Collisions in two dimensions","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u5/collide-2d","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u5/collide-2d?n=s5","note":"Collisions in a plane: momentum by components, and the right-angle split."},{"course":"phy2048","title":"Crash reconstruction","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u5/crash-reconstruction","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u5/crash-reconstruction?n=s4","note":"A car into a parked truck: skid lengths give speeds, momentum gives the rest."}],"problems":["egn3321:u4.15.ballistic","egn3321:u4.15.central","egn3321:u4.15.oblique","egn3321:u4.15.what-conserved","egn3321:u4.15.collide-sym","phy2048:ch9.elastic","phy2048:ch9.stick","phy2048:ch9.partial","phy2048:ch9.concept-collide","phy2048:ch9.oblique","phy2048:ch9.concept-2d","phy2048:ch9.crash"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 1, §9.4 Types of collisions","url":"https://openstax.org/books/university-physics-volume-1/pages/9-4-types-of-collisions","why":"Elastic and inelastic cases side by side.","level":"Intro"},{"title":"MIT 8.01SC, 26.1 Momentum in collisions","url":"https://ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/pages/week-9-collision-theory/26-1-momentum-in-collisions/","why":"Collision theory before the worked 1D and 2D cases.","level":"Course level"}]},{"id":"impedance-analysis","title":"Complex impedance and phasor analysis","subject":"circuits","courses":["eel3111"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>Z\u003c/mi>\u003cmi>R\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmi>R\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"1em\"/>\u003cmsub>\u003cmi>Z\u003c/mi>\u003cmi>L\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmi>j\u003c/mi>\u003cmi>ω\u003c/mi>\u003cmi>L\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"1em\"/>\u003cmsub>\u003cmi>Z\u003c/mi>\u003cmi>C\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmrow>\u003cmi>j\u003c/mi>\u003cmi>ω\u003c/mi>\u003cmi>C\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>𝐕\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>Z\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>𝐈\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmo>∑\u003c/mo>\u003cmi>𝐈\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>0\u003c/mn>\u003cmo separator=\"true\">,\u003c/mo>\u003cmtext>  \u003c/mtext>\u003cmo>∑\u003c/mo>\u003cmi>𝐕\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003c/math>\u003c/span>","idea":"In sinusoidal steady state every voltage and current is a sine at the source frequency, so each is fixed by an amplitude and a phase: one complex number, its phasor. A derivative becomes multiplication by \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>j\u003c/mi>\u003cmi>ω\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>, so inductors and capacitors act like resistors with complex values. Ohm's law, the series and parallel rules, node analysis and Thévenin then all work unchanged, with complex arithmetic. Kirchhoff's laws hold for the phasors, not for the magnitudes, which is why two voltages of 3 V and 4 V can add to 5 V.","requires":["ac-circuits","nodal-analysis"],"labs":[],"problems":[],"candidate":"Rotating phasors for a series RC with the time waveforms they project. It corrects the idea that the voltages around a loop add as magnitudes: 3 V across the resistor and 4 V across the capacitor make 5 V, not 7 V.","sources":[{"title":"MIT 6.002, calendar: Lectures 18 and 19, sinusoidal steady state, impedance methods","url":"https://ocw.mit.edu/courses/6-002-circuits-and-electronics-spring-2007/pages/calendar/","why":"Where the course turns derivatives into algebra.","level":"Course level"},{"title":"Kuphaldt, Lessons in Electric Circuits, Vol. II: AC","url":"https://www.allaboutcircuits.com/textbook/alternating-current/","why":"Complex numbers, reactance and impedance, then series-parallel AC networks.","level":"Intro"}]},{"id":"implicit-differentiation","title":"Chain rule and implicit differentiation","subject":"calculus","courses":["mac2311"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmfrac>\u003cmi>d\u003c/mi>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmi>f\u003c/mi>\u003cmo fence=\"false\" stretchy=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">(\u003c/mo>\u003cmi>g\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo fence=\"false\" stretchy=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmsup>\u003cmi>f\u003c/mi>\u003cmo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′\u003c/mo>\u003c/msup>\u003cmo fence=\"false\" stretchy=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">(\u003c/mo>\u003cmi>g\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo fence=\"false\" stretchy=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">)\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmsup>\u003cmi>g\u003c/mi>\u003cmo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′\u003c/mo>\u003c/msup>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmfrac>\u003cmi>d\u003c/mi>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmi>ln\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmi>x\u003c/mi>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A function of a function changes at the outer rate times the inner rate. That one rule differentiates an equation that never solves for \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>y\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>: differentiate both sides, treating \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>y\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> as a function of \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>, and solve for \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsup>\u003cmi>y\u003c/mi>\u003cmo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′\u003c/mo>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span>. The same move gives the derivatives of inverse functions, of \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>ln\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> and of \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsup>\u003cmi>e\u003c/mi>\u003cmi>x\u003c/mi>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span>.","requires":["derivative"],"labs":[{"course":"mac2311","title":"Camera focus","href":"https://flux-study.pages.dev/mac2311/#/mac2311/c1/focus","notes":"https://flux-study.pages.dev/mac2311/#/mac2311/c1/focus?n=s11","note":"A camera lens: the image distance from the thin-lens equation, and how fast it moves as the subject does."}],"problems":[],"candidate":null,"sources":[{"title":"OpenStax Calculus Vol. 1, §3.8 Implicit differentiation","url":"https://openstax.org/books/calculus-volume-1/pages/3-8-implicit-differentiation","why":"Tangent lines to curves that are not graphs of functions.","level":"Intro"},{"title":"MIT 18.01SC, Part B: Implicit differentiation and inverse functions","url":"https://ocw.mit.edu/courses/18-01sc-single-variable-calculus-fall-2010/pages/1.-differentiation/part-b-implicit-differentiation-and-inverse-functions/","why":"Implicit and inverse derivatives, with exp and log, and checked problems.","level":"Course level"}]},{"id":"improper-integrals","title":"Improper integrals","subject":"calculus","courses":["mac2311"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsubsup>\u003cmo>∫\u003c/mo>\u003cmn>1\u003c/mn>\u003cmi mathvariant=\"normal\">∞\u003c/mi>\u003c/msubsup>\u003cmfrac>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>x\u003c/mi>\u003c/mrow>\u003cmsup>\u003cmi>x\u003c/mi>\u003cmi>p\u003c/mi>\u003c/msup>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmrow>\u003cmi>p\u003c/mi>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/mfrac>\u003cmtext>  \u003c/mtext>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo>&gt;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/math>\u003c/span>","idea":"An integral over an infinite interval, or across a spike, is a limit: integrate to a finite bound and let it go. If the limit is finite, the integral converges, and the tail past any bound is what remains. Whether \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmn>1\u003c/mn>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmsup>\u003cmi>x\u003c/mi>\u003cmi>p\u003c/mi>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span> converges depends only on \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>p\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>, and that sets the pattern for comparing others.","requires":["fundamental-theorem","limits"],"labs":[{"course":"mac2311","title":"Improper","href":"https://flux-study.pages.dev/mac2311/#/mac2311/c6/improper","notes":"https://flux-study.pages.dev/mac2311/#/mac2311/c6/improper?n=s2","note":"Slide the bound: the area approaches its limit and the tail shrinks."}],"problems":[],"candidate":null,"sources":[{"title":"OpenStax Calculus Vol. 2, §3.7 Improper integrals","url":"https://openstax.org/books/calculus-volume-2/pages/3-7-improper-integrals","why":"Both kinds, with the comparison test.","level":"Intro"},{"title":"MIT 18.01SC, Part A: L’Hospital’s rule and improper integrals","url":"https://ocw.mit.edu/courses/18-01sc-single-variable-calculus-fall-2010/pages/unit-5-exploring-the-infinite/part-a-lhospitals-rule-and-improper-integrals/","why":"Improper integrals beside the limits they need.","level":"Course level"}]},{"id":"impulse-momentum","title":"Impulse and momentum","subject":"mechanics","courses":["egn3321","phy2048"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>m\u003c/mi>\u003cmsub>\u003cmi>𝐯\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsubsup>\u003cmo>∫\u003c/mo>\u003cmsub>\u003cmi>t\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmsub>\u003cmi>t\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/msubsup>\u003cmo>∑\u003c/mo>\u003cmi>𝐅\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>t\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>m\u003c/mi>\u003cmsub>\u003cmi>𝐯\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Integrate Newton's law over time and the force's impulse equals the change in momentum. It suits short, hard pushes where the force is unknown but its effect is not. When no outside force acts on a system, its total momentum stays put. A rocket is that rule applied to a body that keeps throwing mass away.","requires":["newtons-second-law"],"labs":[{"course":"egn3321","title":"Impulse","href":"https://flux-study.pages.dev/egn3321/#/egn3321/u4/impulse","notes":"https://flux-study.pages.dev/egn3321/#/egn3321/u4/impulse?n=s1","note":"A force pulse and the momentum it changes."},{"course":"egn3321","title":"Rocket","href":"https://flux-study.pages.dev/egn3321/#/egn3321/u4/rocket","notes":"https://flux-study.pages.dev/egn3321/#/egn3321/u4/rocket?n=s6","note":"A rocket's speed from \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmi>e\u003c/mi>\u003c/msub>\u003cmi>ln\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>m\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/math>\u003c/span>, with and without gravity."},{"course":"egn3321","title":"Helmet","href":"https://flux-study.pages.dev/egn3321/#/egn3321/u4/helmet","notes":"https://flux-study.pages.dev/egn3321/#/egn3321/u4/helmet?n=s7","note":"A bicycle helmet stretches the stop to keep the peak force down."},{"course":"phy2048","title":"Impulse","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u5/impulse","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u5/impulse?n=s2","note":"Force pulses with the same area give the same change in momentum."},{"course":"phy2048","title":"Rocket","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u5/rocket","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u5/rocket?n=s7","note":"A rocket’s Δv from the log of its mass ratio, less g times the burn."},{"course":"phy2048","title":"Crumple zone","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u5/crumple-zone","notes":null,"note":"A seatbelt against a steering wheel: the same Δp over a longer time."}],"problems":["egn3321:u4.15.impulse","egn3321:u4.15.soft-landing","egn3321:u4.15.rocket","egn3321:u4.15.helmet","phy2048:ch9.impulse","phy2048:ch9.graph","phy2048:ch9.bounce","phy2048:ch9.meteor","phy2048:ch9.concept-impulse","phy2048:ch9.rocket","phy2048:ch9.concept-rocket"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 1, §9.2 Impulse and collisions","url":"https://openstax.org/books/university-physics-volume-1/pages/9-2-impulse-and-collisions","why":"Impulse as the area under a force-time curve, with helmets and airbags.","level":"Intro"},{"title":"OpenStax University Physics Vol. 1, §9.7 Rocket propulsion","url":"https://openstax.org/books/university-physics-volume-1/pages/9-7-rocket-propulsion","why":"The rocket equation derived from momentum, step by step.","level":"Intro"}]},{"id":"inductance","title":"Inductance and transformers","subject":"em","courses":["phy2049","eel3111"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi mathvariant=\"script\">E\u003c/mi>\u003cmo>=\u003c/mo>\u003cmo>−\u003c/mo>\u003cmi>L\u003c/mi>\u003cmfrac>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>I\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmfrac>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmi>s\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmi>p\u003c/mi>\u003c/msub>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>N\u003c/mi>\u003cmi>s\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>N\u003c/mi>\u003cmi>p\u003c/mi>\u003c/msub>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>U\u003c/mi>\u003cmo>=\u003c/mo>\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmn>2\u003c/mn>\u003c/mfrac>\u003c/mstyle>\u003cmi>L\u003c/mi>\u003cmsup>\u003cmi>I\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A changing current changes its own flux, so a coil fights changes in its current. That is self-inductance, and the energy it stores lives in the magnetic field. Two coils on one core share their flux, so each turn of either coil sees the same emf. The voltages then go as the turns, which is how a transformer steps voltage up for the grid and down for the home.","requires":["faraday"],"labs":[{"course":"phy2049","title":"Transformer","href":"https://flux-study.pages.dev/phy2049/#/phy2049/e5/transformer","notes":"https://flux-study.pages.dev/phy2049/#/phy2049/e5/transformer?n=s5","note":"Two coils on one core: voltage goes with turns, current the other way."}],"problems":["phy2049:e5.50.pole-transformer"],"candidate":"An RL circuit beside the RC lab: current rising toward \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi mathvariant=\"script\">E\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>R\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> with time constant \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>L\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>R\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>, and an LC loop trading energy between the capacitor's electric field and the coil's magnetic field.","sources":[{"title":"OpenStax University Physics Vol. 2, §14.2 Self-inductance and inductors","url":"https://openstax.org/books/university-physics-volume-2/pages/14-2-self-inductance-and-inductors","why":"Inductance of a solenoid and a toroid, derived from flux.","level":"Intro"},{"title":"MIT 8.02, Problem-solving guide: Mutual inductance and transformers; inductors","url":"https://ocw.mit.edu/courses/8-02-physics-ii-electricity-and-magnetism-spring-2007/resources/solving07/","why":"Mutual and self inductance in one method, with transformers as the payoff.","level":"Course level"}]},{"id":"integral-applications","title":"Areas, volumes and work","subject":"calculus","courses":["mac2311"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>V\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsubsup>\u003cmo>∫\u003c/mo>\u003cmi>a\u003c/mi>\u003cmi>b\u003c/mi>\u003c/msubsup>\u003cmi>π\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>r\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmsup>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>x\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>V\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsubsup>\u003cmo>∫\u003c/mo>\u003cmi>a\u003c/mi>\u003cmi>b\u003c/mi>\u003c/msubsup>\u003cmn>2\u003c/mn>\u003cmi>π\u003c/mi>\u003cmi>x\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>h\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Slice, approximate one slice, add. A solid of revolution cut across its axis gives disks; cut along it gives shells. Both must name the same volume. The same recipe gives the area between curves, the work to pump a tank and the centre of mass of a plate: decide what one thin piece contributes, then integrate.","requires":["fundamental-theorem"],"labs":[{"course":"mac2311","title":"Solids","href":"https://flux-study.pages.dev/mac2311/#/mac2311/c3/solids","notes":"https://flux-study.pages.dev/mac2311/#/mac2311/c3/solids?n=s7","note":"One solid sliced into disks and into shells; the two volumes agree."},{"course":"mac2311","title":"Spheroid slices","href":"https://flux-study.pages.dev/mac2311/#/mac2311/c3/spheroid","notes":null,"note":"A stack of disks against a spheroid’s exact volume."},{"course":"mac2311","title":"Riemann","href":"https://flux-study.pages.dev/mac2311/#/mac2311/c3/riemann","notes":"https://flux-study.pages.dev/mac2311/#/mac2311/c3/riemann?n=s10","note":"Rectangles under a curve, the same sums a centre of mass is built from."}],"problems":["mac2311:c3.volume","mac2311:c3.riemann","mac2311:c3.area","mac2311:c3.work","mac2311:c3.weighted"],"candidate":null,"sources":[{"title":"OpenStax Calculus Vol. 1, §6.2 Determining volumes by slicing","url":"https://openstax.org/books/calculus-volume-1/pages/6-2-determining-volumes-by-slicing","why":"Disks and washers, with the slice drawn each time.","level":"Intro"},{"title":"OpenStax Calculus Vol. 1, §6.5 Physical applications","url":"https://openstax.org/books/calculus-volume-1/pages/6-5-physical-applications","why":"Mass, work and force from the same slice-and-add idea.","level":"Course level"}]},{"id":"integration-techniques","title":"Techniques of integration","subject":"calculus","courses":["mac2311"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmo>∫\u003c/mo>\u003cmi>u\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>v\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>u\u003c/mi>\u003cmi>v\u003c/mi>\u003cmo>−\u003c/mo>\u003cmo>∫\u003c/mo>\u003cmi>v\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>u\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Each technique rewrites an integral into one you know. Parts trades a product for a simpler one; a trigonometric substitution turns a square root into a trig function; partial fractions split a rational function into easy pieces. Different routes can give answers that look different and differ by a constant. The definite integral still needs the two ends subtracted.","requires":["fundamental-theorem"],"labs":[{"course":"mac2311","title":"Integral workbench","href":"https://flux-study.pages.dev/mac2311/#/mac2311/c4/technique","notes":"https://flux-study.pages.dev/mac2311/#/mac2311/c4/technique?n=s1","note":"Integrals worked by different methods to the same area, with the endpoint subtraction shown."}],"problems":["mac2311:c4.arc","mac2311:c4.surface"],"candidate":null,"sources":[{"title":"OpenStax Calculus Vol. 2, §3.1 Integration by parts","url":"https://openstax.org/books/calculus-volume-2/pages/3-1-integration-by-parts","why":"How to choose u, with the cases that loop back.","level":"Intro"},{"title":"MIT 18.01SC, Part B: Partial fractions, integration by parts, arc length, and surface area","url":"https://ocw.mit.edu/courses/18-01sc-single-variable-calculus-fall-2010/pages/unit-4-techniques-of-integration/part-b-partial-fractions-integration-by-parts-arc-length-and-surface-area/","why":"Parts and partial fractions with checked problems.","level":"Course level"}]},{"id":"interference","title":"Two-slit interference","subject":"em","courses":["phy2049"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>sin\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>θ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>m\u003c/mi>\u003cmi>λ\u003c/mi>\u003cmtext> (bright)\u003c/mtext>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmi>y\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>λ\u003c/mi>\u003cmi>L\u003c/mi>\u003c/mrow>\u003cmi>d\u003c/mi>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Waves from two slits arrive at the screen having travelled different distances. Where the difference is a whole number of wavelengths they add; where it is a half number they cancel. The result is a row of equally spaced bright fringes, and measuring their spacing measures the wavelength.","requires":["em-waves"],"labs":[{"course":"phy2049","title":"Interference","href":"https://flux-study.pages.dev/phy2049/#/phy2049/wave/interference","notes":null,"note":"A double slit: every fringe painted from \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>I\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>θ\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/math>\u003c/span> for the panel's \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>λ\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>, \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>d\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> and \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>L\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>."}],"problems":["phy2049:wave.63.double-slit","phy2049:wave.63.find-lambda","phy2049:wave.63.dark-angle"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 3, §3.1 Young’s double-slit interference","url":"https://openstax.org/books/university-physics-volume-3/pages/3-1-youngs-double-slit-interference","why":"Path difference to fringe position, with the small-angle step shown.","level":"Intro"},{"title":"MIT 8.02, Problem-solving guide: Interference","url":"https://ocw.mit.edu/courses/8-02-physics-ii-electricity-and-magnetism-spring-2007/resources/solving11/","why":"Intensity, not just positions, worked for two and more slits.","level":"Course level"}]},{"id":"internal-convection","title":"Convection in pipes","subject":"heat","courses":["eml4140"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmi>s\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmi>m\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmi>s\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmrow>\u003cmi>m\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>i\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmi>exp\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmtext> ⁣\u003c/mtext>\u003cmrow>\u003cmo fence=\"true\">(\u003c/mo>\u003cmo>−\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>h\u003c/mi>\u003cmi>P\u003c/mi>\u003cmi>x\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmover accent=\"true\">\u003cmi>m\u003c/mi>\u003cmo>˙\u003c/mo>\u003c/mover>\u003cmsub>\u003cmi>c\u003c/mi>\u003cmi>p\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003cmo fence=\"true\">)\u003c/mo>\u003c/mrow>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmtext>Nu\u003c/mtext>\u003cmi>D\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>3.66\u003c/mn>\u003cmtext> (laminar, uniform wall temperature)\u003c/mtext>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"1em\"/>\u003cmn>0.023\u003c/mn>\u003cmtext> \u003c/mtext>\u003cmsubsup>\u003cmtext>Re\u003c/mtext>\u003cmi>D\u003c/mi>\u003cmn>0.8\u003c/mn>\u003c/msubsup>\u003cmsup>\u003cmtext>Pr\u003c/mtext>\u003cmn>0.4\u003c/mn>\u003c/msup>\u003cmtext> (turbulent)\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Inside a pipe the layers from the wall meet in the middle, and the flow becomes fully developed. In laminar flow \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>h\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> then stops changing and the Nusselt number is a constant: 3.66 for a wall at one temperature, 4.36 for a wall with uniform heat flux. An energy balance on a slice of the pipe says the bulk temperature approaches a constant wall temperature exponentially along the length. So the average driving difference over the pipe is a logarithmic mean, not an arithmetic one. Turbulent flow mixes the core and raises Nu sharply, and the correlations use the same Reynolds number as the friction factor.","requires":["convection","pipe-flow","energy-cv"],"labs":[],"problems":[],"candidate":"March the bulk temperature down a heated tube with a slider for the flow rate. It corrects the idea that the fluid warms at a steady rate along the pipe: it closes on the wall temperature exponentially, so the last metres do little.","sources":[{"title":"Lienhard, A Heat Transfer Textbook","url":"https://ahtt.mit.edu","why":"Chapter 7 covers laminar and turbulent pipe flow, entry lengths and noncircular ducts.","level":"Course level"},{"title":"MIT 2.51, calendar: Internal flows, turbulence (sessions 14 to 16)","url":"https://ocw.mit.edu/courses/2-51-intermediate-heat-and-mass-transfer-fall-2008/pages/calendar/","why":"The three sessions on internal flow and turbulent transfer.","level":"Deeper"}]},{"id":"internal-loads","title":"Shear and bending moment","subject":"mechanics","courses":["statics","egn3331"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmfrac>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>V\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmo>−\u003c/mo>\u003cmi>w\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmfrac>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>M\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmi>V\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Cut a beam anywhere and the piece on one side must be in equilibrium, so the cut carries an internal axial force, shear and bending moment. Along the beam the shear changes by the load and the moment changes by the shear. So the moment is the area under the shear diagram, and it peaks where the shear crosses zero.","requires":["static-equilibrium","definite-integral"],"labs":[{"course":"statics","title":"Beam","href":"https://flux-study.pages.dev/statics/#/statics/u4/beam","notes":"https://flux-study.pages.dev/statics/#/statics/u4/beam?n=s3","note":"Beams with point, uniform and triangular loads, with V and M diagrams under one moving cut."},{"course":"egn3331","title":"Shear and moment","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u6/diagrams","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u6/diagrams?n=s1","note":"Shear and moment diagrams by sections and by areas and jumps."}],"problems":["statics:ch7.internal-point","statics:ch7.udl-diagrams","statics:r4.diagram-jumps","egn3331:u6.6.point","egn3331:u6.6.uniform","egn3331:u6.6.allow","egn3331:u6.6.peak","egn3331:u6.6.overhang","egn3331:u6.6.couple","egn3331:u6.6.where-max"],"candidate":null,"sources":[{"title":"MIT 2.001, Lecture 5: Shear force and bending moment diagrams","url":"https://ocw.mit.edu/courses/2-001-mechanics-materials-i-fall-2006/resources/lec5/","why":"The diagrams from cuts, then from the load–shear–moment relations.","level":"Course level"},{"title":"MIT 2.001, Lecture 6: Shear force and bending moment diagrams (cont.)","url":"https://ocw.mit.edu/courses/2-001-mechanics-materials-i-fall-2006/resources/lec6/","why":"Distributed loads and couples on the same diagrams.","level":"Course level"}]},{"id":"internal-resistance","title":"Internal resistance and voltage drop","subject":"circuits","courses":["bench"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>terminal\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmi mathvariant=\"script\">E\u003c/mi>\u003cmo>−\u003c/mo>\u003cmi>I\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsub>\u003cmi>r\u003c/mi>\u003cmtext>source\u003c/mtext>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>r\u003c/mi>\u003cmtext>cable\u003c/mtext>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A real source has resistance inside it, and so do the wires from it. Draw more current and more voltage is lost before it reaches the load. So the 5 V a USB port promises sags under a motor, and a short, thick cable keeps more of it. The same drop sets how hard you can push any battery or adapter.","requires":["kirchhoff"],"labs":[{"course":"bench","title":"USB power","href":"https://flux-study.pages.dev/bench/#/bench/u1/usb-rail","notes":"https://flux-study.pages.dev/bench/#/bench/u1/usb-rail?n=s6","note":"USB power on a breadboard: the rail voltage sags with current and cable."}],"problems":["bench:u1.cable","bench:u1.bank-life","bench:u1.concept-usb"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 2, §10.1 Electromotive force","url":"https://openstax.org/books/university-physics-volume-2/pages/10-1-electromotive-force","why":"EMF, internal resistance and terminal voltage.","level":"Intro"},{"title":"MIT 6.002, calendar: Thevenin and Norton equivalences","url":"https://ocw.mit.edu/courses/6-002-circuits-and-electronics-spring-2007/pages/calendar/","why":"Where a source with internal resistance becomes a Thévenin model.","level":"Course level"}]},{"id":"interpolation","title":"Interpolation","subject":"numerics","courses":["egn3203"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmunderover>\u003cmo>∑\u003c/mo>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003cmi>n\u003c/mi>\u003c/munderover>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmunder>\u003cmo>∏\u003c/mo>\u003cmrow>\u003cmi>j\u003c/mi>\u003cmo mathvariant=\"normal\">≠\u003c/mo>\u003cmi>i\u003c/mi>\u003c/mrow>\u003c/munder>\u003cmfrac>\u003cmrow>\u003cmi>x\u003c/mi>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>f\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>−\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsup>\u003cmi>f\u003c/mi>\u003cmrow>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>n\u003c/mi>\u003cmo>+\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/msup>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>ξ\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003cmrow>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>n\u003c/mi>\u003cmo>+\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo stretchy=\"false\">!\u003c/mo>\u003c/mrow>\u003c/mfrac>\u003cmunderover>\u003cmo>∏\u003c/mo>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003cmi>n\u003c/mi>\u003c/munderover>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Interpolation draws a function through known points, to read values in between. Through \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>n\u003c/mi>\u003cmo>+\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/math>\u003c/span> points passes exactly one polynomial of degree \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>n\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. Its error looks like a Taylor remainder, times a product that is small near the points and large between them. With many equally spaced points that product swells near the ends and the curve swings wildly, Runge's phenomenon. Piecewise curves, such as linear segments or cubic splines, avoid it by keeping each piece low in degree.","requires":["taylor-series","truncation-error"],"labs":[],"problems":[],"candidate":"Interpolate \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmn>1\u003c/mn>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>+\u003c/mo>\u003cmn>25\u003c/mn>\u003cmsup>\u003cmi>x\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/math>\u003c/span> with more and more equally spaced points, then with Chebyshev points. It corrects the idea that more points always give a better fit: on equal spacing the error near the ends grows without bound.","sources":[{"title":"MIT 2.086, calendar: Numerical calculus, part 1","url":"https://ocw.mit.edu/courses/2-086-numerical-computation-for-mechanical-engineers-spring-2013/pages/calendar/","why":"The course starts numerical calculus with interpolation.","level":"Course level"},{"title":"Wikipedia, Runge’s phenomenon","url":"https://en.wikipedia.org/wiki/Runge%27s_phenomenon","why":"The classic example, and why Chebyshev points cure it.","level":"Intro"}]},{"id":"iron-carbon","title":"The iron–carbon diagram and heat treatment","subject":"matsci","courses":["ema3010"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>γ\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmn>0.76\u003c/mn>\u003cmtext> wt% C\u003c/mtext>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmover>\u003cmo stretchy=\"true\" minsize=\"3.0em\">→\u003c/mo>\u003cmpadded width=\"+0.6em\" lspace=\"0.3em\">\u003cmrow>\u003cmn>727\u003c/mn>\u003cmtext> \u003c/mtext>\u003cmsup>\u003cmrow>\u003c/mrow>\u003cmo>∘\u003c/mo>\u003c/msup>\u003cmtext>C\u003c/mtext>\u003c/mrow>\u003c/mpadded>\u003c/mover>\u003cmi>α\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmn>0.022\u003c/mn>\u003cmtext> wt% C\u003c/mtext>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmtext>Fe\u003c/mtext>\u003cmn>3\u003c/mn>\u003c/msub>\u003cmtext>C\u003c/mtext>\u003cmtext> \u003c/mtext>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmn>6.7\u003c/mn>\u003cmtext> wt% C\u003c/mtext>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Austenite dissolves far more carbon than ferrite, so cooling steel through 727 °C forces the carbon out. Cooled slowly, carbon has time to diffuse into layers of cementite, and the steel becomes pearlite. Quenched fast, carbon has no time to move, and the iron shears into martensite, hard and brittle; tempering lets some carbon out to buy back toughness. How fast a point inside a part cools is set by heat conduction, so a thick bar hardens near its surface and stays softer in its core.","requires":["phase-diagrams","diffusion","heat-equation"],"labs":[],"problems":[],"candidate":"Quench a steel bar from one end and read the cooling rate and microstructure along it. It corrects the idea that quenching hardens the whole part equally.","sources":[{"title":"DoITPoMS, The Jominy end quench test (University of Cambridge)","url":"https://www.doitpoms.ac.uk/tlplib/jominy/index.php","why":"Cooling rate against hardness along one bar, the link between conduction and microstructure.","level":"Course level"},{"title":"Martensite (Wikipedia)","url":"https://en.wikipedia.org/wiki/Martensite","why":"Why a diffusionless transformation is hard, and what tempering does.","level":"Intro"}]},{"id":"isentropic-efficiency","title":"Isentropic efficiency","subject":"thermo","courses":["eml3100"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>η\u003c/mi>\u003cmi>T\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>s\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>η\u003c/mi>\u003cmi>C\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>s\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Compare a real turbine, compressor or nozzle with an ideal one that runs between the same pressures with no entropy change. The ratio of their enthalpy changes is the isentropic efficiency. A less efficient turbine leaves its steam hotter and makes less work; a less efficient compressor needs more.","requires":["entropy","energy-cv"],"labs":[{"course":"eml3100","title":"Isentropic efficiency","href":"https://flux-study.pages.dev/eml3100/#/eml3100/u5/efficiency","notes":"https://flux-study.pages.dev/eml3100/#/eml3100/u5/efficiency?n=s4","note":"A steam turbine, an air compressor and a nozzle, each beside its isentropic twin."}],"problems":["eml3100:u5.6.turbine","eml3100:u5.6.compressor","eml3100:u5.6.nozzle","eml3100:u5.6.reversible"],"candidate":null,"sources":[{"title":"Cleynen, Engineering Thermodynamics","url":"https://thermodynamicsbook.com/","why":"Isentropic efficiencies of real devices, with worked steam examples.","level":"Course level"},{"title":"Yan, Introduction to Engineering Thermodynamics, Ch. 6 Entropy and the second law","url":"https://pressbooks.bccampus.ca/thermo1/","why":"The course’s own book: the ideal comparison process.","level":"Course level"}]},{"id":"jet-propulsion","title":"Jet propulsion","subject":"thermo","courses":["eml3101"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>F\u003c/mi>\u003cmo>=\u003c/mo>\u003cmover accent=\"true\">\u003cmi>m\u003c/mi>\u003cmo>˙\u003c/mo>\u003c/mover>\u003cmtext> \u003c/mtext>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmi>e\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>+\u003c/mo>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>e\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmi>e\u003c/mi>\u003c/msub>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>η\u003c/mi>\u003cmi>p\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmn>2\u003c/mn>\u003cmrow>\u003cmn>1\u003c/mn>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmi>e\u003c/mi>\u003c/msub>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A turbojet is a Brayton cycle whose turbine drives only the compressor; the rest of the expansion happens in a nozzle and makes a fast jet. A momentum balance on the engine gives the thrust: the mass flow times the speed it gains, plus a pressure term at the exit. The power that moves the aircraft is thrust times flight speed, and the rest of the jet's kinetic energy is wasted in the wake. So propulsive efficiency is best when the jet is only a little faster than the aircraft. That is why airliners use turbofans, which push a lot of air a little.","requires":["brayton-cycle","momentum-cv"],"labs":[],"problems":[],"candidate":"One engine core with a bypass-ratio slider, thrust and fuel use read out. It corrects the idea that a faster jet means a better engine: at the same thrust, more air at a lower speed wastes less energy in the wake.","sources":[{"title":"MIT 16.050, calendar: Gas power and propulsion cycles","url":"https://ocw.mit.edu/courses/16-050-thermal-energy-fall-2002/pages/calendar/","why":"An aero course’s thermodynamics: the cycles end at the jet engine.","level":"Course level"},{"title":"NASA Glenn, Beginner’s guide to aeronautics: Turbine engine thrust","url":"https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/turbine-engine-thrust/","why":"The thrust equation with each term labelled on an engine.","level":"Intro"}]},{"id":"kirchhoff","title":"Kirchhoff’s rules","subject":"circuits","courses":["phy2049","eel3111"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmo>∑\u003c/mo>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmtext>in\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmo>∑\u003c/mo>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmtext>out\u003c/mtext>\u003c/msub>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmo>∮\u003c/mo>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmi>V\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Two rules solve any circuit. At a junction, charge in equals charge out. Around any loop, the voltage changes add to zero, because potential has one value at each point. Series and parallel rules follow from these. When a network does not reduce, write one equation per loop and junction and solve them together.","requires":["current-resistance"],"labs":[{"course":"phy2049","title":"Circuits","href":"https://flux-study.pages.dev/phy2049/#/phy2049/e4/circuits","notes":"https://flux-study.pages.dev/phy2049/#/phy2049/e4/circuits?n=s1","note":"Wires coloured by potential; series, parallel and networks reduced step by step."}],"problems":["phy2049:e3.41.across-resistor","phy2049:e4.43.series","phy2049:e4.43.parallel","phy2049:e4.43.combo","phy2049:e4.43.add-resistor","phy2049:e4.43.series-parallel-ideas","phy2049:e4.43.four-resistors","phy2049:e4.43.parallel-from-total","phy2049:e4.43.bulb-networks","phy2049:e4.43.series-pair-series","phy2049:e4.43.branch-currents","phy2049:e4.43.single-loop","phy2049:e4.43.three-branch","phy2049:e4.43.two-battery-bridge","phy2049:e4.44.two-loop","phy2049:e4.44.terminal","phy2049:e4.44.rules","phy2049:e4.44.cells-and-bulb","phy2049:e4.44.battery-terminal"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 2, §10.3 Kirchhoff’s rules","url":"https://openstax.org/books/university-physics-volume-2/pages/10-3-kirchhoffs-rules","why":"A sign convention you can follow every time, with a multi-loop example.","level":"Intro"},{"title":"PhET: Circuit construction kit (DC)","url":"https://phet.colorado.edu/en/simulations/circuit-construction-kit-dc","why":"Build a network, then check your loop equations against its meters.","level":"Intro"}]},{"id":"laplace-transform","title":"Laplace transform","subject":"diffeq","courses":["map2302"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>F\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>s\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmsubsup>\u003cmo>∫\u003c/mo>\u003cmn>0\u003c/mn>\u003cmi mathvariant=\"normal\">∞\u003c/mi>\u003c/msubsup>\u003cmsup>\u003cmi>e\u003c/mi>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmi>s\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/msup>\u003cmi>f\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>t\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>t\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi mathvariant=\"script\">L\u003c/mi>\u003cmo stretchy=\"false\">{\u003c/mo>\u003cmsup>\u003cmi>f\u003c/mi>\u003cmo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′\u003c/mo>\u003c/msup>\u003cmo stretchy=\"false\">}\u003c/mo>\u003cmo>=\u003c/mo>\u003cmi>s\u003c/mi>\u003cmi>F\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>s\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>−\u003c/mo>\u003cmi>f\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmn>0\u003c/mn>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/math>\u003c/span>","idea":"The Laplace transform turns derivatives into multiplication by \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>s\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>, so a linear initial-value problem becomes algebra. Steps and impulses are easy inputs to write. Partial fractions bring the answer back, and the poles of the transfer function say how the system rings or decays. A transfer function assumes the system starts at rest; motion already present adds its own terms.","requires":["forced-resonance","improper-integrals"],"labs":[{"course":"map2302","title":"Steps, impulses and poles","href":"https://flux-study.pages.dev/map2302/#/map2302/u3/laplace","notes":"https://flux-study.pages.dev/map2302/#/map2302/u3/laplace?n=s4","note":"Steps, delayed steps and a hammer tap on a mass, at rest and already moving."},{"course":"map2302","title":"Transform rules","href":"https://flux-study.pages.dev/map2302/#/map2302/u3/laplace-rules","notes":"https://flux-study.pages.dev/map2302/#/map2302/u3/laplace-rules?n=s13","note":"Multiply by t, shift in s, shift in t and periodic inputs, each checked against the defining integral."}],"problems":["map2302:u3.impulse-response","map2302:u3.step-response","map2302:u3.initial-pulse","map2302:u3.t-rule","map2302:u3.power-shift","map2302:u3.delay-rule","map2302:u3.periodic"],"candidate":null,"sources":[{"title":"Lebl, Notes on Diffy Qs, §6.1 The Laplace transform","url":"https://www.jirka.org/diffyqs/html/laplace_section.html","why":"The transform and its table, from the course’s book.","level":"Course level"},{"title":"MIT 18.03SC, Laplace transform: solving initial value problems","url":"https://ocw.mit.edu/courses/18-03sc-differential-equations-fall-2011/pages/unit-iii-fourier-series-and-laplace-transform/laplace-transform-solving-initial-value-problems/","why":"Initial-value problems solved start to finish.","level":"Course level"}]},{"id":"least-squares","title":"Least squares and data fitting","subject":"numerics","courses":["egn3203"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmunder>\u003cmrow>\u003cmi>min\u003c/mi>\u003cmo>⁡\u003c/mo>\u003c/mrow>\u003cmi>𝐱\u003c/mi>\u003c/munder>\u003cmi mathvariant=\"normal\">∥\u003c/mi>\u003cmi>A\u003c/mi>\u003cmi>𝐱\u003c/mi>\u003cmo>−\u003c/mo>\u003cmi>𝐛\u003c/mi>\u003cmsup>\u003cmi mathvariant=\"normal\">∥\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsup>\u003cmi>A\u003c/mi>\u003cmi mathvariant=\"sans-serif\">T\u003c/mi>\u003c/msup>\u003cmi>A\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmover accent=\"true\">\u003cmi>𝐱\u003c/mi>\u003cmo>^\u003c/mo>\u003c/mover>\u003cmo>=\u003c/mo>\u003cmsup>\u003cmi>A\u003c/mi>\u003cmi mathvariant=\"sans-serif\">T\u003c/mi>\u003c/msup>\u003cmi>𝐛\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>A\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>Q\u003c/mi>\u003cmi>R\u003c/mi>\u003cmo>⇒\u003c/mo>\u003cmi>R\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmover accent=\"true\">\u003cmi>𝐱\u003c/mi>\u003cmo>^\u003c/mo>\u003c/mover>\u003cmo>=\u003c/mo>\u003cmsup>\u003cmi>Q\u003c/mi>\u003cmi mathvariant=\"sans-serif\">T\u003c/mi>\u003c/msup>\u003cmi>𝐛\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Fitting a model with a few parameters to many measurements gives more equations than unknowns. Least squares picks the parameters that make the sum of squared misses smallest, which is the projection of the data onto the model's column space. Each column is one basis function evaluated at the data, so a polynomial or any linear mix of functions fits the same way. The normal equations are quick, but they lose accuracy when columns are nearly parallel; a QR factorization reaches the same answer without that loss. A model with as many parameters as points fits the data exactly and predicts badly between them.","requires":["orthogonality-projection","floating-point"],"labs":[],"problems":[],"candidate":"Fit polynomials of rising degree to noisy points from a straight line. It corrects the idea that a better fit to the data is a better model: the misses shrink to zero while the curve swings between the points.","sources":[{"title":"MIT 2.086, calendar: Linear algebra 1 and MATLAB backslash (least squares)","url":"https://ocw.mit.edu/courses/2-086-numerical-computation-for-mechanical-engineers-spring-2013/pages/calendar/","why":"The course reaches least squares in its first linear algebra unit.","level":"Course level"},{"title":"Yano, Penn, Konidaris and Patera, Math, Numerics, and Programming (for Mechanical Engineers)","url":"https://ocw.mit.edu/courses/2-086-numerical-computation-for-mechanical-engineers-spring-2013/resources/mit2_086s13_textbook/","why":"Regression and least squares, with QR and the normal equations compared.","level":"Course level"}]},{"id":"light-intensity","title":"Energy and intensity of light","subject":"em","courses":["phy2049"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>𝐒\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmsub>\u003cmi>μ\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003c/mfrac>\u003cmtext> \u003c/mtext>\u003cmi>𝐄\u003c/mi>\u003cmo>×\u003c/mo>\u003cmi>𝐁\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmo stretchy=\"false\">⟨\u003c/mo>\u003cmi>S\u003c/mi>\u003cmo stretchy=\"false\">⟩\u003c/mo>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsubsup>\u003cmi>E\u003c/mi>\u003cmn>0\u003c/mn>\u003cmn>2\u003c/mn>\u003c/msubsup>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmsub>\u003cmi>μ\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmi>c\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A wave carries energy in both its fields, shared equally. The Poynting vector points the way the energy flows, and its time average is the intensity, in watts per square metre. From a point source the intensity falls as \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmn>1\u003c/mn>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmsup>\u003cmi>r\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span>. Sunlight arrives at Earth at about 1360 W/m².","requires":["em-waves"],"labs":[{"course":"phy2049","title":"EM wave","href":"https://flux-study.pages.dev/phy2049/#/phy2049/e6/emwave","notes":"https://flux-study.pages.dev/phy2049/#/phy2049/e6/emwave?n=s11","note":"Field amplitudes and intensity, up to sunlight scale."}],"problems":["phy2049:e6.53.f-from-lambda","phy2049:e6.53.B-from-E","phy2049:e6.53.direction","phy2049:e6.53.wave-eq","phy2049:e6.53.wave-terms","phy2049:e6.53.true-or-false","phy2049:e6.53.photon-color","phy2049:e6.53.photon-energy","phy2049:e6.54.band","phy2049:e6.54.order","phy2049:e6.54.rank-energy","phy2049:e6.54.uses","phy2049:e6.54.source","phy2049:e6.54.lambda-from-f","phy2049:e6.55.intensity","phy2049:e6.55.E-from-I","phy2049:e6.55.point-source","phy2049:e6.55.pressure","phy2049:e6.55.rms-from-I","phy2049:e6.55.peak-to-rms","phy2049:e6.55.detector-distance"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 2, §16.3 Energy carried by electromagnetic waves","url":"https://openstax.org/books/university-physics-volume-2/pages/16-3-energy-carried-by-electromagnetic-waves","why":"Energy density, the Poynting vector and intensity in one short section.","level":"Intro"},{"title":"Feynman Lectures Vol. II, Ch. 27: Field energy and field momentum","url":"https://www.feynmanlectures.caltech.edu/II_27.html","why":"Where the Poynting vector comes from, and its surprising cases.","level":"Deeper"}]},{"id":"limit-cycles","title":"Limit cycles and nonlinear oscillation","subject":"diffeq","courses":["map2302"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmover accent=\"true\">\u003cmi>r\u003c/mi>\u003cmo>˙\u003c/mo>\u003c/mover>\u003cmo>=\u003c/mo>\u003cmi>r\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>−\u003c/mo>\u003cmsup>\u003cmi>r\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmover accent=\"true\">\u003cmi>θ\u003c/mi>\u003cmo>˙\u003c/mo>\u003c/mover>\u003cmo>=\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A limit cycle is a lone closed orbit that nearby motions approach or leave. Unlike a centre's family of orbits, it sets one amplitude whatever the start, which is how a clock keeps time with a drive. A pendulum's period grows with its swing, so a large-amplitude clock runs slow. Past two dimensions, motion can become chaotic.","requires":["linearization"],"labs":[{"course":"map2302","title":"Attracting cycles","href":"https://flux-study.pages.dev/map2302/#/map2302/u4/limit-cycle","notes":"https://flux-study.pages.dev/map2302/#/map2302/u4/limit-cycle?n=s9","note":"Orbits approaching an attracting cycle from inside and outside."},{"course":"map2302","title":"Pendulum clock","href":"https://flux-study.pages.dev/map2302/#/map2302/u4/clock-pendulum","notes":"https://flux-study.pages.dev/map2302/#/map2302/u4/clock-pendulum?n=s11","note":"A pendulum clock: amplitude changes the period, and a drive sustains the swing."}],"problems":["map2302:u4.cycle-radius","map2302:u4.clock-length","map2302:u4.pendulum-period"],"candidate":null,"sources":[{"title":"Lebl, Notes on Diffy Qs, §8.4 Limit cycles","url":"https://www.jirka.org/diffyqs/html/limitcycles_section.html","why":"Limit cycles and the Poincaré–Bendixson idea.","level":"Course level"},{"title":"Lebl, Notes on Diffy Qs, §8.3 Applications of nonlinear systems","url":"https://www.jirka.org/diffyqs/html/nlinapps_section.html","why":"The pendulum and its period at large swings.","level":"Course level"}]},{"id":"limits","title":"Limits and continuity","subject":"calculus","courses":["mac2311"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmunder>\u003cmrow>\u003cmi>lim\u003c/mi>\u003cmo>⁡\u003c/mo>\u003c/mrow>\u003cmrow>\u003cmi>x\u003c/mi>\u003cmo>→\u003c/mo>\u003cmi>a\u003c/mi>\u003c/mrow>\u003c/munder>\u003cmi>f\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmi>L\u003c/mi>\u003cmtext>  \u003c/mtext>\u003cmo>⟺\u003c/mo>\u003cmtext>  \u003c/mtext>\u003cmi mathvariant=\"normal\">∀\u003c/mi>\u003cmi>ε\u003c/mi>\u003cmo>&gt;\u003c/mo>\u003cmn>0\u003c/mn>\u003cmtext> \u003c/mtext>\u003cmi mathvariant=\"normal\">∃\u003c/mi>\u003cmi>δ\u003c/mi>\u003cmo>&gt;\u003c/mo>\u003cmn>0\u003c/mn>\u003cmo>:\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmn>0\u003c/mn>\u003cmo>&lt;\u003c/mo>\u003cmi mathvariant=\"normal\">∣\u003c/mi>\u003cmi>x\u003c/mi>\u003cmo>−\u003c/mo>\u003cmi>a\u003c/mi>\u003cmi mathvariant=\"normal\">∣\u003c/mi>\u003cmo>&lt;\u003c/mo>\u003cmi>δ\u003c/mi>\u003cmo>⇒\u003c/mo>\u003cmi mathvariant=\"normal\">∣\u003c/mi>\u003cmi>f\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>−\u003c/mo>\u003cmi>L\u003c/mi>\u003cmi mathvariant=\"normal\">∣\u003c/mi>\u003cmo>&lt;\u003c/mo>\u003cmi>ε\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A limit is the value a function heads toward as its input closes in, whatever happens exactly there. Both sides must agree. A function is continuous where its limit equals its value, so its graph has no jump or hole. The \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>ε\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>–\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>δ\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> definition makes \"c
