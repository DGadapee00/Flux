atics/#/statics/u3/truss","notes":"https://flux-study.pages.dev/statics/#/statics/u3/truss?n=s2","note":"Plane trusses by joints and sections, with the residual at every joint."},{"course":"statics","title":"Frame","href":"https://flux-study.pages.dev/statics/#/statics/u3/frame","notes":"https://flux-study.pages.dev/statics/#/statics/u3/frame?n=s3","note":"An A-frame, a wall bracket and pliers, exploded into members to show the pin forces."},{"course":"statics","title":"Sign gantry","href":"https://flux-study.pages.dev/statics/#/statics/u3/gantry","notes":"https://flux-study.pages.dev/statics/#/statics/u3/gantry?n=s4","note":"A highway sign truss: depth lowers the chord forces, not the reactions."},{"course":"statics","title":"Scissor jack","href":"https://flux-study.pages.dev/statics/#/statics/u3/jack","notes":null,"note":"A scissor jack needs its greatest screw force when it is low."}],"problems":["statics:ch6.truss-joints","statics:ch6.zero-force","statics:ch6.sections","statics:r4.truss-geometry","statics:ch6.frame-aframe","statics:ch6.pliers"],"candidate":null,"sources":[{"title":"MIT 2.001, Lecture 3: Applying the equations of equilibrium, planar trusses","url":"https://ocw.mit.edu/courses/2-001-mechanics-materials-i-fall-2006/resources/lec3/","why":"The method of joints and determinacy.","level":"Course level"},{"title":"Engineering Statics: Open and Interactive (Baker and Haynes)","url":"https://engineeringstatics.org/","why":"Trusses, frames and machines with interactive examples.","level":"Course level"}]},{"id":"vapour-compression","title":"Vapour-compression refrigeration","subject":"thermo","courses":["eml3101"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmtext>COP\u003c/mtext>\u003cmi>R\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmn>4\u003c/mn>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmn>4\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmn>3\u003c/mn>\u003c/msub>\u003cmtext> (throttle)\u003c/mtext>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmtext>COP\u003c/mtext>\u003cmrow>\u003cmi>R\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmtext>Carnot\u003c/mtext>\u003c/mrow>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmi>L\u003c/mi>\u003c/msub>\u003cmrow>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmi>H\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmi>L\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A refrigerant boils in the evaporator, taking heat from the cold space at low pressure. A compressor raises its pressure, so it condenses at a temperature above the room and rejects heat there. A throttle valve drops the pressure again with no work, at constant enthalpy. The COP is the heat lifted over the work paid. It falls as the lift between the two temperatures grows, which is why a heat pump struggles on the coldest days.","requires":["isentropic-efficiency","phases"],"labs":[],"problems":[],"candidate":"A heat pump on a \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>p\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>–\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>h\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> chart with a slider for the outdoor temperature. It corrects the idea that a heat pump gets more out than it puts in by a fixed factor: its COP falls as the outdoor air gets colder.","sources":[{"title":"Cleynen, Engineering Thermodynamics","url":"https://thermodynamicsbook.com/","why":"Refrigerators and heat pumps as cycles with real devices.","level":"Course level"},{"title":"OpenStax University Physics Vol. 2, §4.3 Refrigerators and heat pumps","url":"https://openstax.org/books/university-physics-volume-2/pages/4-3-refrigerators-and-heat-pumps","why":"COP and the reversed engine, before the real cycle.","level":"Intro"},{"title":"Wikipedia, Vapor-compression refrigeration","url":"https://en.wikipedia.org/wiki/Vapor-compression_refrigeration","why":"The four components and the cycle on a pressure–enthalpy chart.","level":"Intro"}]},{"id":"variation-of-parameters","title":"Variation of parameters","subject":"diffeq","courses":["map2302"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsubsup>\u003cmi>u\u003c/mi>\u003cmn>1\u003c/mn>\u003cmo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′\u003c/mo>\u003c/msubsup>\u003cmo>=\u003c/mo>\u003cmo>−\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmi>f\u003c/mi>\u003c/mrow>\u003cmi>W\u003c/mi>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"1em\"/>\u003cmsubsup>\u003cmi>u\u003c/mi>\u003cmn>2\u003c/mn>\u003cmo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′\u003c/mo>\u003c/msubsup>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmi>f\u003c/mi>\u003c/mrow>\u003cmi>W\u003c/mi>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Variation of parameters finds a particular solution for any continuous forcing, given a basis of homogeneous solutions. The constants become functions, with one free condition chosen so that no second derivatives of them appear. Cramer’s rule then gives each \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsubsup>\u003cmi>u\u003c/mi>\u003cmi>i\u003c/mi>\u003cmo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′\u003c/mo>\u003c/msubsup>\u003c/mrow>\u003c/math>\u003c/span> as a ratio with the Wronskian. It handles \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>sec\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> and \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsup>\u003cmi>e\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msup>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>, where undetermined coefficients has no trial, and for constant coefficients it is the same as convolution with the impulse response.","requires":["forced-resonance","determinant-inverse"],"labs":[{"course":"map2302","title":"Variation of parameters","href":"https://flux-study.pages.dev/map2302/#/map2302/u2/variation","notes":"https://flux-study.pages.dev/map2302/#/map2302/u2/variation?n=s11","note":"Forcing by sec t and e^t/t, an answer left as an integral, and a third-order case."}],"problems":["map2302:u2.vop-secant","map2302:u2.vop-repeated"],"candidate":null,"sources":[{"title":"Lebl, Notes on Diffy Qs, §2.5 Nonhomogeneous equations","url":"https://www.jirka.org/diffyqs/","why":"Variation of parameters next to undetermined coefficients.","level":"Course level"},{"title":"MIT 18.03SC, Transfer and weight functions, Green’s formula","url":"https://ocw.mit.edu/courses/18-03sc-differential-equations-fall-2011/pages/unit-iii-fourier-series-and-laplace-transform/transfer-system-and-weight-functions-greens-formula/","why":"Green’s formula: the integral form the method takes for constant coefficients.","level":"Deeper"}]},{"id":"vector-fields","title":"Vector fields","subject":"calculus","courses":["mac2313","phy2049"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>𝐅\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmi>P\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmover accent=\"true\">\u003cmi mathvariant=\"normal\">ı\u003c/mi>\u003cmo>^\u003c/mo>\u003c/mover>\u003cmo>+\u003c/mo>\u003cmi>Q\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmover accent=\"true\">\u003cmi mathvariant=\"normal\">ȷ\u003c/mi>\u003cmo>^\u003c/mo>\u003c/mover>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A vector field puts an arrow at every point: a fluid's velocity, a force per unit charge, a rate of heat flow. A gradient field is the special case \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>𝐅\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi mathvariant=\"normal\">∇\u003c/mi>\u003cmi>f\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. The electrostatic field is one.","requires":["gradient"],"labs":[{"course":"phy2049","title":"Field","href":"https://flux-study.pages.dev/phy2049/#/phy2049/e2/field","notes":null,"note":"The field of point charges, drawn as arrows and field lines."}],"problems":["phy2049:e2.36a.force-direction","phy2049:e2.36a.proton-electron","phy2049:e2.36a.trajectory","phy2049:e2.36a.plate-sign","phy2049:e2.36a.square-corner","phy2049:e2.36a.E-from-force","phy2049:e2.36a.accel","phy2049:e2.36a.E-from-accel","phy2049:e2.36a.tension","phy2049:e2.36a.levitate-E","phy2049:e2.36a.levitate-q","phy2049:e2.36a.point-field","phy2049:e2.36a.charge-from-field","phy2049:e2.36a.between-two","phy2049:e2.36a.collinear","phy2049:e2.36a.zero-point","phy2049:e2.36a.three-axes","phy2049:e2.36a.dipole"],"candidate":null,"sources":[{"title":"OpenStax Calculus Vol. 3, §6.1 Vector fields","url":"https://openstax.org/books/calculus-volume-3/pages/6-1-vector-fields","why":"Many sketched fields; good for learning to read one at a glance.","level":"Course level"},{"title":"MIT 18.02SC, Session 56: Vector fields (problems with solutions)","url":"https://ocw.mit.edu/courses/18-02sc-multivariable-calculus-fall-2010/resources/mit18_02sc_pb_56_comb/","why":"Short problems with full solutions to check yourself against.","level":"Course level"}]},{"id":"vectors","title":"Vectors, dot and cross products","subject":"calculus","courses":["phy2049","mac2313","phy2048","statics"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>𝐚\u003c/mi>\u003cmo>⋅\u003c/mo>\u003cmi>𝐛\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>a\u003c/mi>\u003cmi>b\u003c/mi>\u003cmi>cos\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>θ\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi mathvariant=\"normal\">∣\u003c/mi>\u003cmi>𝐚\u003c/mi>\u003cmo>×\u003c/mo>\u003cmi>𝐛\u003c/mi>\u003cmi mathvariant=\"normal\">∣\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>a\u003c/mi>\u003cmi>b\u003c/mi>\u003cmi>sin\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>θ\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A vector has a size and a direction, and in components it is just three numbers. The dot product measures how much two vectors point the same way, so it is zero when they are perpendicular. The cross product gives a third vector perpendicular to both, with a length set by how far apart they point. Work and flux use the dot product; torque and the magnetic force use the cross product.","requires":[],"labs":[{"course":"phy2049","title":"Vectors","href":"https://flux-study.pages.dev/phy2049/#/phy2049/e1/vectors","notes":"https://flux-study.pages.dev/phy2049/#/phy2049/e1/vectors?n=s1","note":"Components, the dot product and the cross product, drawn in 3D."},{"course":"mac2313","title":"R³","href":"https://flux-study.pages.dev/mac2313/#/mac2313/ch4/r3","notes":null,"note":"Two vectors in space, their sum, and the parallelogram whose area is the cross product."},{"course":"phy2048","title":"Vectors","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u1/vectors","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u1/vectors?n=s4","note":"Vectors added by components, the dot product as a projection, the cross product as an area."},{"course":"statics","title":"Vectors","href":"https://flux-study.pages.dev/statics/#/statics/u1/vectors","notes":"https://flux-study.pages.dev/statics/#/statics/u1/vectors?n=s1","note":"Forces in 3D by components and along a line, with \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsup>\u003cmrow>\u003cmi>cos\u003c/mi>\u003cmo>⁡\u003c/mo>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmi>α\u003c/mi>\u003cmo>+\u003c/mo>\u003cmsup>\u003cmrow>\u003cmi>cos\u003c/mi>\u003cmo>⁡\u003c/mo>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmi>β\u003c/mi>\u003cmo>+\u003c/mo>\u003cmsup>\u003cmrow>\u003cmi>cos\u003c/mi>\u003cmo>⁡\u003c/mo>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmi>γ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/math>\u003c/span>."}],"problems":["phy2049:e1.v.mag-dir","phy2049:e1.v.components","phy2049:e1.v.dot","phy2049:e1.v.add","phy2049:e1.v.cross","phy2049:e1.v.dot-sign","mac2313:ch4.r3.dot","mac2313:ch4.r3.cross","mac2313:ch4.r3.only3","mac2313:ch4.r3.area","phy2048:ch2.concept-sum","statics:ch2.parallelogram","statics:ch2.components-resultant","statics:ch2.cartesian-angles","statics:ch2.force-along-line","statics:ch2.projection","statics:r4.vector-cancellation","statics:r4.projection-sign","statics:r4.cable-design"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 1, §2.4 Products of vectors","url":"https://openstax.org/books/university-physics-volume-1/pages/2-4-products-of-vectors","why":"Both products from components, with the right-hand rule drawn out.","level":"Intro"},{"title":"MIT 8.02, Problem-solving guide: Coordinate systems, gradients, line and surface integrals","url":"https://ocw.mit.edu/courses/8-02-physics-ii-electricity-and-magnetism-spring-2007/resources/solving01/","why":"The vector tools the rest of E&M leans on, set up the way 8.02 uses them.","level":"Course level"}]},{"id":"view-factors","title":"View factors","subject":"heat","courses":["eml4140"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmn>12\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003c/mfrac>\u003cmsub>\u003cmo>∫\u003c/mo>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003c/msub>\u003cmtext> ⁣\u003c/mtext>\u003cmsub>\u003cmo>∫\u003c/mo>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/msub>\u003cmfrac>\u003cmrow>\u003cmi>cos\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmsub>\u003cmi>θ\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmi>cos\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmsub>\u003cmi>θ\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmi>π\u003c/mi>\u003cmsup>\u003cmi>R\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/mfrac>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmn>12\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmn>21\u003c/mn>\u003c/msub>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmunder>\u003cmo>∑\u003c/mo>\u003cmi>j\u003c/mi>\u003c/munder>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Of the radiation leaving one surface, the view factor is the fraction that lands on another. It depends only on geometry: the area each patch presents to the other and the distance between them, integrated over both. Reciprocity, \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmn>12\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmn>21\u003c/mn>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span>, and the rule that the fractions from one surface sum to 1 fill in most factors from a few known ones. A flat or convex surface cannot see itself, so its self factor is zero.","requires":["thermal-radiation","double-integrals"],"labs":[],"problems":[],"candidate":"Two plates you move and tilt, with rays fired at random and counted. It corrects the idea that a large plate sees a small one as much as the small one sees it: the fractions differ by the area ratio, while \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmn>12\u003c/mn>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span> and \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmn>21\u003c/mn>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span> agree.","sources":[{"title":"Lienhard, A Heat Transfer Textbook","url":"https://ahtt.mit.edu","why":"Chapter 10 derives the view factor and its algebra, with a catalogue of shapes.","level":"Course level"},{"title":"MIT 2.51, calendar: View factors (session 24)","url":"https://ocw.mit.edu/courses/2-51-intermediate-heat-and-mass-transfer-fall-2008/pages/calendar/","why":"The course’s session on geometry in radiation.","level":"Course level"},{"title":"Wikipedia, View factor","url":"https://en.wikipedia.org/wiki/View_factor","why":"The definition, reciprocity, summation and the Nusselt unit-sphere picture.","level":"Intro"}]},{"id":"viscosity","title":"Viscosity","subject":"fluids","courses":["eml3015"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>τ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>μ\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmfrac>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>u\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>y\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>ν\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>μ\u003c/mi>\u003cmi>ρ\u003c/mi>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A fluid sticks to a wall and moves with it, so layers next to each other slide at different speeds. Neighbouring layers drag on each other with a shear stress. For a Newtonian fluid that stress is the viscosity times the velocity gradient, the same \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>τ\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> as on a cut through a solid, but set by a rate of strain, not a strain. Viscosity falls with temperature in a liquid and rises in a gas. The kinematic viscosity \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>ν\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> is how fast velocity differences diffuse.","requires":["stress-on-a-section","derivative"],"labs":[],"problems":[],"candidate":"Drag a plate over a thin layer of honey, water and mercury, with the velocity profile drawn. It corrects the idea that viscosity is a fluid’s thickness or weight: mercury is dense and runny, and the drag depends on the velocity gradient, not on the speed alone.","sources":[{"title":"OpenStax University Physics Vol. 1, §14.7 Viscosity and turbulence","url":"https://openstax.org/books/university-physics-volume-1/pages/14-7-viscosity-and-turbulence","why":"Viscosity from a plate dragged over a fluid layer, with values for common fluids.","level":"Intro"},{"title":"MIT 2.06, calendar: Lecture 9, viscous fluids","url":"https://ocw.mit.edu/courses/2-06-fluid-dynamics-spring-2013/pages/calendar/","why":"Where the course adds shear stress to the equations of motion.","level":"Course level"}]},{"id":"voltage-divider","title":"Voltage dividers and resistive sensors","subject":"circuits","courses":["bench","eel3111"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>out\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmi>s\u003c/mi>\u003c/msub>\u003cmtext> \u003c/mtext>\u003cmfrac>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmrow>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmtext>fixed\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsqrt>\u003cmrow>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmtext>light\u003c/mtext>\u003c/msub>\u003cmtext> \u003c/mtext>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmtext>dark\u003c/mtext>\u003c/msub>\u003c/mrow>\u003c/msqrt>\u003cmtext> (largest swing)\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Two resistors in series split a voltage in proportion to their sizes. A load across the lower one sits in parallel with it and pulls the output down, harder when the divider's resistors are large. Put a sensor whose resistance changes, a light or temperature sensor, in one place and the output tracks what it senses. The fixed resistor that gives the largest swing is the geometric mean of the sensor's two extremes.","requires":["kirchhoff"],"labs":[{"course":"bench","title":"Voltage divider","href":"https://flux-study.pages.dev/bench/#/bench/u3/divider","notes":"https://flux-study.pages.dev/bench/#/bench/u3/divider?n=s1","note":"A potentiometer, an LDR and a thermistor in dividers, then a load across the output."},{"course":"bench","title":"Night light","href":"https://flux-study.pages.dev/bench/#/bench/u3/nightlight","notes":"https://flux-study.pages.dev/bench/#/bench/u3/nightlight?n=s4","note":"A night light’s LDR divider read by a 10-bit input, with the fixed resistor chosen."}],"problems":["bench:u3.divider","bench:u3.ldr","bench:u3.load","bench:u3.ntc","bench:u3.concept-divider","bench:u3.best"],"candidate":null,"sources":[{"title":"Kuphaldt, Lessons in Electric Circuits","url":"https://www.ibiblio.org/kuphaldt/electricCircuits/","why":"The divider and its loading, from the text the course cites.","level":"Intro"},{"title":"MIT 6.002, calendar: KVL, KCL resistive network analysis","url":"https://ocw.mit.edu/courses/6-002-circuits-and-electronics-spring-2007/pages/calendar/","why":"Where the divider sits in network analysis.","level":"Course level"}]},{"id":"work-energy","title":"Work and energy","subject":"mechanics","courses":["egn3321","phy2048"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmo>∑\u003c/mo>\u003cmsub>\u003cmi>U\u003c/mi>\u003cmrow>\u003cmn>1\u003c/mn>\u003cmo>→\u003c/mo>\u003cmn>2\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>U\u003c/mi>\u003cmo>=\u003c/mo>\u003cmo>∫\u003c/mo>\u003cmi>𝐅\u003c/mi>\u003cmo>⋅\u003c/mo>\u003cmi>d\u003c/mi>\u003cmi>𝐫\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"The work done on a particle equals the change in its kinetic energy. Work is a line integral of force along the path, so it skips the acceleration entirely and goes straight from speeds to positions. Gravity and springs do work that depends only on the endpoints; friction does not. Power is how fast the work is done.","requires":["newtons-second-law","line-integrals"],"labs":[{"course":"egn3321","title":"Collar","href":"https://flux-study.pages.dev/egn3321/#/egn3321/u3/collar","notes":"https://flux-study.pages.dev/egn3321/#/egn3321/u3/collar?n=s1","note":"A collar on a rod with a spring and friction: work in, speed out."},{"course":"egn3321","title":"Paths","href":"https://flux-study.pages.dev/egn3321/#/egn3321/u3/paths","notes":"https://flux-study.pages.dev/egn3321/#/egn3321/u3/paths?n=s5","note":"Two paths between the same points: gravity agrees, friction does not."},{"course":"egn3321","title":"Stopping","href":"https://flux-study.pages.dev/egn3321/#/egn3321/u3/stopping","notes":"https://flux-study.pages.dev/egn3321/#/egn3321/u3/stopping?n=s6","note":"Stopping sight distance: reaction distance plus braking distance."},{"course":"phy2048","title":"Work and energy","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u4/work-energy","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u4/work-energy?n=s1","note":"The works of every force add to the change in kinetic energy."},{"course":"phy2048","title":"Work along a path","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u4/work-path","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u4/work-path?n=s2","note":"Gravity’s work depends only on the ends; friction’s and a swirling force’s do not."},{"course":"phy2048","title":"Automotive power","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u4/automotive-power","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u4/automotive-power?n=s5","note":"The power a car needs up a hill, \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>P\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>F\u003c/mi>\u003cmi>v\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>."}],"problems":["egn3321:u3.14.speed","egn3321:u3.14.rough","egn3321:u3.14.paths","egn3321:u3.14.brake-scale","egn3321:u3.14.stopping","phy2048:ch7.work","phy2048:ch7.push","phy2048:ch7.concept-work","phy2048:ch7.concept-ke","phy2048:ch8.concept-conservative","phy2048:ch7.climb","phy2048:ch7.concept-power"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 1, §7.3 Work-energy theorem","url":"https://openstax.org/books/university-physics-volume-1/pages/7-3-work-energy-theorem","why":"The theorem derived from Newton’s law, then used on real paths.","level":"Intro"},{"title":"MIT 8.01SC, 22.1 Path independence: gravity","url":"https://ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/pages/week-7-kinetic-energy-and-work/22-1-path-independence-gravity/","why":"Why some forces only care about the endpoints.","level":"Course level"}]},{"id":"xray-diffraction","title":"X-ray diffraction and Bragg’s law","subject":"matsci","courses":["ema3010"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>n\u003c/mi>\u003cmi>λ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>2\u003c/mn>\u003cmi>d\u003c/mi>\u003cmi>sin\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>θ\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmrow>\u003cmi>h\u003c/mi>\u003cmi>k\u003c/mi>\u003cmi>l\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>a\u003c/mi>\u003cmsqrt>\u003cmrow>\u003cmsup>\u003cmi>h\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>+\u003c/mo>\u003cmsup>\u003cmi>k\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>+\u003c/mo>\u003cmsup>\u003cmi>l\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/msqrt>\u003c/mfrac>\u003cmtext> (cubic)\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/span>","idea":"X-rays have wavelengths near atomic spacings, so a crystal's planes of atoms act like a grating. Waves reflected from neighbouring planes add only when the extra path \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>d\u003c/mi>\u003cmi>sin\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>θ\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> is a whole number of wavelengths. Each set of planes, named by its Miller indices, therefore shows up at one angle. Reading the angles back gives the plane spacings, and from them the lattice and its size.","requires":["crystal-structures","interference"],"labs":[],"problems":[],"candidate":"Turn a beam on a crystal and watch peaks appear only at the angles each plane set allows. It corrects the idea that a crystal reflects X-rays at every angle, like a mirror.","sources":[{"title":"MIT 3.091, Recitation 15: X-ray generation, diffraction, and Bragg’s law","url":"https://ocw.mit.edu/courses/3-091-introduction-to-solid-state-chemistry-fall-2018/resources/mit3_091f18_rec15/","why":"Bragg’s condition derived from path difference, then used.","level":"Course level"},{"title":"MIT 3.091, Recitation 14: Miller indices and interplanar spacing","url":"https://ocw.mit.edu/courses/3-091-introduction-to-solid-state-chemistry-fall-2018/resources/mit3_091f18_rec14/","why":"Naming planes and finding their spacing, which Bragg’s law needs.","level":"Course level"}]}],"paths":{"bench":[{" const memo = {};
function closureSize(id) {
  const seen = new Set();
  const walk = (x) => { for (const y of LEADS[x] || []) if (!seen.has(y)) { seen.add(y); walk(y); } };
  walk(id);
  return seen.size;
}
const depthMemo = {};
function depth(id) {
  if (depthMemo[id] != null) return depthMemo[id];
  const reqs = C[id].requires;
  return (depthMemo[id] = reqs.length ? 1 + Math.max(...reqs.map(depth)) : 0);
}

/* ---------- The learner ---------- */
let now = Date.now();
let items = {};
let sourceNote = '';

function rng(seed) {
  return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

/** A made-up learner who matches the owner's course standing: taken, taking now, next term. */
function sampleItems() {
  const rand = rng(2049);
  const out = {};
  const phyExam = {};
  (D.paths.phy2049 || []).forEach((u, i) => u.concepts.forEach((id) => { phyExam[id] = i + 1; }));
  const staOrder = (D.paths.sta3032 || []).flatMap((u) => u.concepts);
  // Tried with probability `share`; once tried, solid (box 3 to 5) with probability `pSolid`.
  const put = (key, pSolid, share) => {
    if (out[key] || rand() > share) return;
    const box = rand() < pSolid ? 3 + Math.floor(rand() * 3) : 1 + Math.floor(rand() * 2);
    const interval = INTERVAL_DAYS[box] * DAY;
    const last = now - rand() * interval * 1.03;

  for (const c of D.concepts) {
    for (const key of c.problems) {
      const course = key.split(':')[0];
      const status = COURSE[course]?.status;
      if (status === 'taken') put(key, 0.92, 0.97);
      else if (course === 'phy2049') {
        const n = phyExam[c.id] || 9;
        if (n <= 4) put(key, 0.9, 0.97);
        else if (n === 5) put(key, 0.7, 0.9);
        else if (n === 6 && ['em-waves', 'light-intensity', 'polarization'].includes(c.id)) put(key, 0.45, 0.8);
      } else if (course === 'sta3032') {
        const at = staOrder.indexOf(c.id);
        if (at >= 0 && at < 5) put(key, 0.6, 0.8);
      } else if (course === 'bench') put(key, 0.4, 0.5);

}

function readCourseProblems(course, raw) {

}

/* ---------- Planning ---------- */
function reviewQueue() {
  const seen = new Set();
  const rows = [];
  for (const c of D.concepts) {
    for (const key of S[c.id].dueKeys) {
      if (seen.has(key)) continue;
      seen.add(key);
      rows.push({ key, concept: c, due: items[key].due, missed: items[key].lastOk === false });
    }
  }
  rows.sort((a, b) => (b.missed - a.missed) || (a.due - b.due));
  return rows;
}

/** True when `a` builds on `b`, directly or further back. */
const buildsOnMemo = {};
function buildsOn(a, b) {
  const k = `${a}>${b}`;
  if (k in buildsOnMemo) return buildsOnMemo[k];
  return (buildsOnMemo[k] = C[a].requires.some((r) => r === b || buildsOn(r, b)));
}

/**
 * Review by thread. A thread is a line of prerequisites on the map, and it may cross subjects the
 * way flux runs from calculus into electricity. Each due concept hangs from its nearest due
 * prerequisite, up to THREAD_REACH steps back; each tree that makes is one review, walked depth
 * first so every concept comes straight after the one it builds on. A tree too big for one sitting
 * splits into its branches. The nearest exam's thread goes first, then misses, then the oldest.
 */
const SET_MAX = 8;
const THREAD_REACH = 3;

/** The nearest due prerequisites of `id`: breadth first up `requires`, stopping at the first hit. */
function nearestDueAncestor(id, due) {
  let frontier = [id];
  const from = { [id]: null };
  for (let step = 1; step <= THREAD_REACH; step++) {
    const next = [];
    for (const x of frontier) for (const r of C[x].requires) if (!(r in from)) { from[r] = x; next.push(r); }
    const hits = next.filter((r) => due.has(r));
    if (hits.length) {
      // Prefer a prerequisite in the same subject, then the deeper one, which is the closer idea.
      hits.sort((a, b) => (C[b].subject === C[id].subject) - (C[a].subject === C[id].subject) || depth(b) - depth(a) || a.localeCompare(b));
      // The concepts between the two, from the prerequisite down toward this one.
      const via = [];
      for (let x = from[hits[0]]; x && x !== id; x = from[x]) via.push(x);
      return { id: hits[0], steps: step, via };
    }
    frontier = next;
  }
  return null;
}

function reviewSets() {
  const byConcept = new Map();
  for (const r of reviewQueue()) {
    if (!byConcept.has(r.concept.id)) byConcept.set(r.concept.id, []);
    byConcept.get(r.concept.id).push(r);
  }
  const due = new Set(byConcept.keys());
  const parent = {};
  const kids = {};
  for (const id of due) {
    const hit = nearestDueAncestor(id, due);
    if (hit) { parent[id] = hit; (kids[hit.id] ||= []).push(id); }
  }
  const order = (a, b) => depth(a) - depth(b) || C[a].title.localeCompare(C[b].title);
  const walk = (id, out) => { out.push(id); for (const k of (kids[id] || []).sort(order)) walk(k, out); return out; };
  const size = (id) => byConcept.get(id).length + (kids[id] || []).reduce((s, k) => s + size(k), 0);

  // Split a tree that will not fit one sitting: the root keeps its first branch, the rest stand alone.
  const pieces = [];
  const place = (root) => {
    if (size(root) <= SET_MAX || !(kids[root] || []).length) { pieces.push(walk(root, [])); return; }
    const branches = [...kids[root]].sort(order);
    const first = branches.shift();
    const head = [root];
    if (byConcept.get(root).length + size(first) <= SET_MAX) walk(first, head); else place(first);
    pieces.push(head);
    for (const b of branches) place(b);
  };
  for (const id of [...due].filter((x) => !parent[x]).sort(order)) place(id);

  const upcoming = D.exams.filter((e) => examDays(e) >= 0);
  const sets = pieces.map((ids) => {
    const groups = ids.map((id) => ({ concept: C[id], rows: byConcept.get(id), parent: ids.includes(parent[id]?.id) ? parent[id] : null }));
    const rows = groups.flatMap((g) => g.rows);
    const examIdx = Math.min(...ids.map((id) => { const i = upcoming.findIndex((e) => e.concepts.includes(id)); return i < 0 ? 99 : i; }));
    const subjects = [];
    for (const g of groups) if (!subjects.includes(g.concept.subject)) subjects.push(g.concept.subject);
    return {
      key: ids[0],
      root: C[ids[0]],
      subjects,
      groups,
      n: rows.length,
      waiting: 0,
      missed: rows.filter((r) => r.missed).length,
      oldest: Math.min(...rows.map((r) => r.due)),
      exam: examIdx < 99 ? upcoming[examIdx] : null,
      examIdx,
    };
  });
  sets.sort((a, b) => a.examIdx - b.examIdx || (b.missed > 0) - (a.missed > 0) || a.oldest - b.oldest);
  // Today takes whole threads up to the daily cap and at most four sittings, always at least one.
  // A lone problem with no miss and no exam waits a day; its thread may grow by then.
  let total = 0;
  let count = 0;
  for (const s of sets) {
    const small = s.n < 2 && !s.missed && !s.exam;
    s.today = count === 0 || (!small && count < 4 && total + s.n <= DAILY_CAP);
    if (s.today) { total += s.n; count++; }

}
/**

function chain(groups) {

function connection(g, i, groups) {

  if (!g.parent.via.length) return `It builds on ${esc(p.title)}, ${ago}.`;

/* The orbit check: the learner's speed and period against a closed form and an integrated orbit. */
const MU = 398600.4418; // km^3/s^2, Earth
const RE = 6371.0; // km, mean radius
function integratePeriod(r) {
  const v = Math.sqrt(MU / r);
  let x = r, y = 0, vx = 0, vy = v;
  const T0 = (2 * Math.PI * r) / v;
  const dt = T0 / 20000;
  let t = 0, prevY = 0, path = 0;
  let ax = -MU * x / r ** 3, ay = -MU * y / r ** 3;
  // Velocity Verlet, stepped until the craft crosses its starting line again.
  for (let i = 0; i < 40000; i++) {
    const x0 = x, y0 = y;
    vx += 0.5 * dt * ax; vy += 0.5 * dt * ay;
    x += dt * vx; y += dt * vy;
    const rr = Math.hypot(x, y);
    ax = -MU * x / rr ** 3; ay = -MU * y / rr ** 3;
    vx += 0.5 * dt * ax; vy += 0.5 * dt * ay;
    const step = Math.hypot(x - x0, y - y0);
    t += dt;
    if (prevY < 0 && y >= 0 && t > T0 / 2) {
      const frac = -prevY / (y - prevY);
      const T = t - dt + frac * dt;
      path += frac * step;
      return { T, speed: path / T };
    }
    path += step;
    prevY = y;
  }
  return { T: NaN, speed: NaN };
}
let orbitInput = store.get('flux.proto.orbit', { h: '550', v: '', T: '' });
function orbitCheck(done) {
  return `<form class="task" id="orbit-form" novalidate>
    <p style="margin:0"><strong>Your task.</strong> Choose an altitude for a circular orbit. Work out the speed and the period by hand or in your own code, then enter them. Flux checks them against √(μ/r) and against an orbit it integrates step by step.</p>
    <div class="fields">
      <label for="o-h">Altitude, km<input id="o-h" inputmode="decimal" value="${esc(orbitInput.h)}" /></label>
      <label for="o-v">Your speed, km/s<input id="o-v" inputmode="decimal" value="${esc(orbitInput.v)}" placeholder="e.g. 7.6" /></label>
      <label for="o-T">Your period, minutes<input id="o-T" inputmode="decimal" value="${esc(orbitInput.T)}" placeholder="e.g. 95" /></label>
    </div>
    <div><button class="btn" type="submit">Check my numbers</button></div>
    <div class="result" id="orbit-result" aria-live="polite">${done ? '<span class="pass">Checked. Power and Structure can use your period.</span>' : ''}</div>
    <p class="meta" style="margin:0">Uses μ = 398 600.4418 km³/s² and a mean Earth radius of 6 371 km. Within 1% passes.</p>
  </form>`;
}
function runOrbitCheck(form) {
  const h = parseFloat(form.querySelector('#o-h').value);
  const vIn = parseFloat(form.querySelector('#o-v').value);
  const TIn = parseFloat(form.querySelector('#o-T').value);
  orbitInput = { h: form.querySelector('#o-h').value, v: form.querySelector('#o-v').value, T: form.querySelector('#o-T').value };
  store.set('flux.proto.orbit', orbitInput);
  const out = form.querySelector('#orbit-result');
  if (!(h > 100 && h < 40000)) { out.innerHTML = '<span class="fail">Enter an altitude between 100 and 40 000 km.</span>'; return; }
  if (!(vIn > 0) || !(TIn > 0)) { out.innerHTML = '<span class="fail">Enter your speed and your period. The check compares your numbers, so it needs both.</span>'; return; }
  const r = RE + h;
  const v = Math.sqrt(MU / r);
  const T = (2 * Math.PI * r) / v / 60;
  const orbit = integratePeriod(r);
  const Tnum = orbit.T / 60;
  const ev = Math.abs(vIn - v) / v, eT = Math.abs(TIn - T) / T;
  const pass = ev < 0.01 && eT < 0.01;
  const hint = pass ? '' : ev >= 0.01 && Math.abs(Math.sqrt(MU / h) - vIn) / vIn < 0.01 ? ' Your speed matches r = altitude alone. The radius is measured from Earth’s centre.' : eT >= 0.01 && Math.abs(TIn * 60 - T) / (T) < 0.01 ? ' Your period looks like seconds. The box asks for minutes.' : '';
  out.innerHTML = `<div class="table-wrap"><table>
    <tr><th></th><th>Yours</th><th>√(μ/r)</th><th>Integrated orbit</th></tr>
    <tr><td>Speed, km/s</td><td>${vIn.toFixed(3)}</td><td>${v.toFixed(3)}</td><td>${orbit.speed.toFixed(3)}</td></tr>
    <tr><td>Period, min</td><td>${TIn.toFixed(2)}</td><td>${T.toFixed(2)}</td><td>${Tnum.toFixed(2)}</td></tr>
  </table></div>
  <p style="margin:8px 0 0" class="${pass ? 'pass' : 'fail'}">${pass ? 'Your numbers agree with both methods. Orbit is checked, and Power and Structure can use your period.' : `Not yet: speed is off by ${(ev * 100).toFixed(1)}%, period by ${(eT * 100).toFixed(1)}%.${hint}`}</p>`;
  if (pass && !satDone.orbit) {
    satDone.orbit = true;
    store.set('flux.proto.satellite', satDone);
    setTimeout(() => render(), 1600);
  }
}

const PLACES = ['today', 'map', 'satellite'];
function render() {
  const hash = decodeURIComponent(location.hash.slice(1)) || 'today';
  const place = PLACES.includes(hash) ? hash : C[hash] ? 'concept' : hash.startsWith('sat-') ? 'satellite' : hash.startsWith('review-') ? 'review' : 'today';
  document.body.classList.toggle('author', author);
  for (const a of document.querySelectorAll('nav.places a')) { if (a.dataset.place === place) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); }
  if (place === 'today') renderToday();
  else if (place === 'map') renderMap();
  else if (place === 'satellite') renderSatellite();
  else if (place === 'review') renderReview(hash.slice('review-'.length));
  else renderConcept(hash);
  if (place !== 'concept') cameFrom = place === 'review' ? 'today' : place;
  for (const a of document.querySelectorAll('nav.places a')) if (place === 'review' && a.dataset.place === 'today') a.setAttribute('aria-current', 'page');
  const note = document.createElement('p');
  note.className = 'notice';
  note.textContent = sourceNote;
  note.style.margin = '32px 0 0';
  view.append(note);
  if (hash.startsWith('sat-')) document.getElementById(hash)?.scrollIntoView();
  else window.scrollTo(0, 0);
}

view.addEventListener('click', (e) => {
  const r = e.target.closest('[data-show],[data-rate],[data-next],[data-goto]');
  if (r) {
    if (r.dataset.goto != null) { e.preventDefault(); session.i = Number(r.dataset.goto); session.shown = false; }
    else if (r.hasAttribute('data-show')) session.shown = true;
    else if (r.dataset.rate) { const set = reviewSets().find((s) => s.key === session.key); session.rated[set.groups[session.i].concept.id] = r.dataset.rate; }
    else if (r.hasAttribute('data-next')) { session.i++; session.shown = false; }
    renderReview(session.key);
    if (r.hasAttribute('data-next') || r.dataset.goto != null) window.scrollTo(0, 0);
    return;
  }
  const t = e.target.closest('[data-set-lens],[data-lens],[data-skip],[data-undo],[data-proto]');
  if (!t) return;
  if (t.dataset.setLens || t.dataset.lens) {
    lens = t.dataset.setLens || t.dataset.lens;
    store.set('flux.proto.lens', lens);
    if (t.dataset.setLens) { e.preventDefault(); renderMap(); }
  } else if (t.dataset.skip) { satDone[t.dataset.skip] = true; store.set('flux.proto.satellite', satDone); renderSatellite(); }
  else if (t.dataset.undo) { delete satDone[t.dataset.undo]; store.set('flux.proto.satellite', satDone); renderSatellite(); }
  else if (t.dataset.proto) {
    let msg = t.parentElement.querySelector('.proto-msg');
    if (!msg) { msg = document.createElement('p'); msg.className = 'meta proto-msg'; msg.style.margin = '10px 0 0'; t.after(msg); }
    msg.textContent = t.dataset.proto;
  }
});
view.addEventListener('change', (e) => {
  if (e.target.dataset.done) session.done[e.target.dataset.done] = e.target.checked;
});
view.addEventListener('submit', (e) => {
  if (e.target.id === 'orbit-form') { e.preventDefault(); runOrbitCheck(e.target); }
});

const authorBox = document.getElementById('author');
authorBox.checked = author;
authorBox.addEventListener('change', () => { author = authorBox.checked; store.set('flux.proto.author', author); render(); });

const sourceSel = document.getElementById('source');
const fileIn = document.getElementById('backup-file');
let source = store.get('flux.proto.source', 'sample');
function applySource() {
  if (source === 'browser') useBrowser();
  else if (source === 'backup') {
    const saved = store.get('flux.proto.backup', null);
    if (saved) useBackup(saved); else { source = 'sample'; useSample(); }
  } else useSample();
  sourceSel.value = source;
  recompute();
}
sourceSel.addEventListener('change', () => {
  if (sourceSel.value === 'backup') { fileIn.click(); sourceSel.value = source; return; }
  source = sourceSel.value;
  store.set('flux.proto.source', source);
  applySource();
  render();
});
fileIn.addEventListener('change', async () => {
  const f = fileIn.files[0];
  if (!f) return;
  try {
    const bundle = JSON.parse(await f.text());
    if (useBackup(bundle)) { source = 'backup'; store.set('flux.proto.backup', bundle); store.set('flux.proto.source', 'backup'); }
    else { source = 'sample'; const note = sourceNote; useSample(); sourceNote = note; }
  } catch {
    source = 'sample'; useSample(); sourceNote = 'That file is not a Flux backup. Make one with the hub’s Back up progress button.';
  }
  fileIn.value = '';
  sourceSel.value = source;
  recompute();
  render();
});

document.getElementById('built').textContent = `Built from the map on ${D.built}: ${D.concepts.length} concepts, ${Object.keys(D.problems).length} problems`;
window.addEventListener('hashchange', render);
applySource();
render();
</script>

</body>
</html>
