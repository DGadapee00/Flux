p.","sources":[{"title":"Lienhard, A Heat Transfer Textbook","url":"https://ahtt.mit.edu","why":"Chapters 4 and 5 cover shape factors and finite-difference solutions.","level":"Course level"},{"title":"MIT 2.51, calendar: Multidimensional conduction, numerical simulation (sessions 8 and 9)","url":"https://ocw.mit.edu/courses/2-51-intermediate-heat-and-mass-transfer-fall-2008/pages/calendar/","why":"The two sessions that close the conduction part of the course.","level":"Course level"}]},{"id":"numerical-differentiation","title":"Numerical differentiation","subject":"numerics","courses":["egn3203"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmfrac>\u003cmrow>\u003cmi>f\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>h\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>−\u003c/mo>\u003cmi>f\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003cmi>h\u003c/mi>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmsup>\u003cmi>f\u003c/mi>\u003cmo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′\u003c/mo>\u003c/msup>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>+\u003c/mo>\u003cmfrac>\u003cmi>h\u003c/mi>\u003cmn>2\u003c/mn>\u003c/mfrac>\u003cmsup>\u003cmi>f\u003c/mi>\u003cmrow>\u003cmo mathvariant=\"normal\">′\u003c/mo>\u003cmo mathvariant=\"normal\">′\u003c/mo>\u003c/mrow>\u003c/msup>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>+\u003c/mo>\u003cmo>⋯\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmfrac>\u003cmrow>\u003cmi>f\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>h\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>−\u003c/mo>\u003cmi>f\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>−\u003c/mo>\u003cmi>h\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>h\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmsup>\u003cmi>f\u003c/mi>\u003cmo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′\u003c/mo>\u003c/msup>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>+\u003c/mo>\u003cmfrac>\u003cmsup>\u003cmi>h\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmn>6\u003c/mn>\u003c/mfrac>\u003cmsup>\u003cmi>f\u003c/mi>\u003cmrow>\u003cmo mathvariant=\"normal\">′\u003c/mo>\u003cmo mathvariant=\"normal\">′\u003c/mo>\u003cmo mathvariant=\"normal\">′\u003c/mo>\u003c/mrow>\u003c/msup>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>+\u003c/mo>\u003cmo>⋯\u003c/mo>\u003c/mrow>\u003c/math>\u003c/span>","idea":"The derivative is the limit of a difference quotient, so a computer stops at a small step \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>h\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. Expand \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>f\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>±\u003c/mo>\u003cmi>h\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/math>\u003c/span> in Taylor series and the error appears: a forward difference is first order, and a central difference cancels the even terms to reach second order for the same work. Shrinking \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>h\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> cuts that error, but the quotient subtracts nearly equal numbers and divides by a small one, so round-off grows as \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>u\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>h\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. The best step balances the two, near \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmn>8\u003c/mn>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span> for a forward difference and \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmn>5\u003c/mn>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span> for a central one in double precision.","requires":["derivative","truncation-error"],"labs":[],"problems":[],"candidate":"Plot the error of forward and central differences of \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>sin\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> against \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>h\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> on log axes. It corrects the idea that a smaller step is always more accurate: the error falls, bottoms out, then climbs as round-off takes over.","sources":[{"title":"MIT 2.086, calendar: Numerical calculus, part 2","url":"https://ocw.mit.edu/courses/2-086-numerical-computation-for-mechanical-engineers-spring-2013/pages/calendar/","why":"Differentiation follows interpolation in the course.","level":"Course level"},{"title":"Yano, Penn, Konidaris and Patera, Math, Numerics, and Programming (for Mechanical Engineers)","url":"https://ocw.mit.edu/courses/2-086-numerical-computation-for-mechanical-engineers-spring-2013/resources/mit2_086s13_textbook/","why":"Forward, backward and central differences with their error orders.","level":"Course level"}]},{"id":"numerical-integration","title":"Numerical integration","subject":"numerics","courses":["mac2311","egn3203"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>S\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>h\u003c/mi>\u003cmn>3\u003c/mn>\u003c/mfrac>\u003cmo fence=\"false\" stretchy=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">[\u003c/mo>\u003cmsub>\u003cmi>f\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmn>4\u003c/mn>\u003cmsub>\u003cmi>f\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmn>2\u003c/mn>\u003cmsub>\u003cmi>f\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmo>⋯\u003c/mo>\u003cmo>+\u003c/mo>\u003cmn>4\u003c/mn>\u003cmsub>\u003cmi>f\u003c/mi>\u003cmrow>\u003cmi>n\u003c/mi>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>f\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003cmo fence=\"false\" stretchy=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">]\u003c/mo>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi mathvariant=\"normal\">∣\u003c/mi>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi>S\u003c/mi>\u003c/msub>\u003cmi mathvariant=\"normal\">∣\u003c/mi>\u003cmo>≤\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>b\u003c/mi>\u003cmo>−\u003c/mo>\u003cmi>a\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmsup>\u003cmi>h\u003c/mi>\u003cmn>4\u003c/mn>\u003c/msup>\u003c/mrow>\u003cmn>180\u003c/mn>\u003c/mfrac>\u003cmi>max\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi mathvariant=\"normal\">∣\u003c/mi>\u003cmsup>\u003cmi>f\u003c/mi>\u003cmrow>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmn>4\u003c/mn>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/msup>\u003cmi mathvariant=\"normal\">∣\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"When no antiderivative is at hand, sample the function and add weighted heights. The trapezoid rule joins samples with straight lines; Simpson's rule uses parabolas and, from the same points, shrinks its error sixteen times when the panels halve. The error bounds say how many panels a given accuracy needs.","requires":["definite-integral"],"labs":[{"course":"mac2311","title":"Numerical","href":"https://flux-study.pages.dev/mac2311/#/mac2311/c3/numint","notes":"https://flux-study.pages.dev/mac2311/#/mac2311/c3/numint?n=s11","note":"Add panels and watch Simpson pull ahead of the trapezoid from the same points."}],"problems":["mac2311:c3.quadrature"],"candidate":null,"sources":[{"title":"OpenStax Calculus Vol. 2, §3.6 Numerical integration","url":"https://openstax.org/books/calculus-volume-2/pages/3-6-numerical-integration","why":"Midpoint, trapezoid and Simpson, with their error bounds.","level":"Intro"},{"title":"MIT 18.01SC, Part C: Average value, probability and numerical integration","url":"https://ocw.mit.edu/courses/18-01sc-single-variable-calculus-fall-2010/pages/unit-3-the-definite-integral-and-its-applications/part-c-average-value-probability-and-numerical-integration/","why":"Numerical rules beside averages and probability.","level":"Course level"}]},{"id":"ode-stability","title":"Stability and stiffness of ODE solvers","subject":"numerics","courses":["egn3203"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsup>\u003cmi>y\u003c/mi>\u003cmo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′\u003c/mo>\u003c/msup>\u003cmo>=\u003c/mo>\u003cmi>λ\u003c/mi>\u003cmi>y\u003c/mi>\u003cmo>:\u003c/mo>\u003cmspace width=\"1em\"/>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmrow>\u003cmi>n\u003c/mi>\u003cmo>+\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>+\u003c/mo>\u003cmi>h\u003c/mi>\u003cmi>λ\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003cmtext> (explicit Euler)\u003c/mtext>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmrow>\u003cmi>n\u003c/mi>\u003cmo>+\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003cmrow>\u003cmn>1\u003c/mn>\u003cmo>−\u003c/mo>\u003cmi>h\u003c/mi>\u003cmi>λ\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmtext> (implicit Euler)\u003c/mtext>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi mathvariant=\"normal\">∣\u003c/mi>\u003cmn>1\u003c/mn>\u003cmo>+\u003c/mo>\u003cmi>h\u003c/mi>\u003cmi>λ\u003c/mi>\u003cmi mathvariant=\"normal\">∣\u003c/mi>\u003cmo>≤\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Apply a solver to \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsup>\u003cmi>y\u003c/mi>\u003cmo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′\u003c/mo>\u003c/msup>\u003cmo>=\u003c/mo>\u003cmi>λ\u003c/mi>\u003cmi>y\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> and each step multiplies the answer by a factor that depends on \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>h\u003c/mi>\u003cmi>λ\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. If that factor's size exceeds one, a decaying solution grows in the numbers. For a system, \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>λ\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> runs over the eigenvalues of the matrix, so the fastest mode sets the step limit. A stiff system has modes decaying at very different rates: the fast one dies out at once but still caps an explicit method's step. Implicit methods solve an equation at each step and stay stable for any step on a decaying mode, so they suit stiff problems.","requires":["runge-kutta","eigenvalues"],"labs":[],"problems":[],"candidate":"Integrate a two-mode system with rates 1 and 1000 by explicit and implicit Euler. It corrects the idea that the step only needs to resolve the motion you can see: the fast mode has died out within 10 milliseconds, yet any explicit step over 0.002 still blows up.","sources":[{"title":"MIT 2.086, calendar: Ordinary differential equations and MATLAB eig","url":"https://ocw.mit.edu/courses/2-086-numerical-computation-for-mechanical-engineers-spring-2013/pages/calendar/","why":"The course puts eigenvalues inside its ODE unit, for stability.","level":"Course level"},{"title":"Wikipedia, Stiff equation","url":"https://en.wikipedia.org/wiki/Stiff_equation","why":"Stiffness, A-stability and the classic examples.","level":"Deeper"}]},{"id":"ode-substitutions","title":"Substitutions for first-order equations","subject":"diffeq","courses":["map2302"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>v\u003c/mi>\u003cmo>=\u003c/mo>\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmfrac>\u003cmi>y\u003c/mi>\u003cmi>x\u003c/mi>\u003c/mfrac>\u003c/mstyle>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>w\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsup>\u003cmi>y\u003c/mi>\u003cmrow>\u003cmn>1\u003c/mn>\u003cmo>−\u003c/mo>\u003cmi>n\u003c/mi>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A substitution trades the unknown for one that satisfies an equation already solved. If the right side depends only on \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>y\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>, then \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>v\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>y\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> makes the equation separable. A Bernoulli equation \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsup>\u003cmi>y\u003c/mi>\u003cmo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′\u003c/mo>\u003c/msup>\u003cmo>+\u003c/mo>\u003cmi>P\u003c/mi>\u003cmi>y\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>Q\u003c/mi>\u003cmsup>\u003cmi>y\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span> becomes linear in \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>w\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsup>\u003cmi>y\u003c/mi>\u003cmrow>\u003cmn>1\u003c/mn>\u003cmo>−\u003c/mo>\u003cmi>n\u003c/mi>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span>. Undo the substitution before applying the initial value, and keep any solution lost by dividing.","requires":["first-order-odes"],"labs":[{"course":"map2302","title":"Exact and substitution","href":"https://flux-study.pages.dev/map2302/#/map2302/u1/exact-substitution","notes":"https://flux-study.pages.dev/map2302/#/map2302/u1/exact-substitution?n=s13","note":"A homogeneous equation and a Bernoulli equation with a pole, each checked by RK4."}],"problems":["map2302:u1.exact-level","map2302:u1.factor-solve","map2302:u1.homogeneous","map2302:u1.bernoulli"],"candidate":null,"sources":[{"title":"Lebl, Notes on Diffy Qs, §1.5 Substitution","url":"https://www.jirka.org/diffyqs/","why":"Homogeneous and Bernoulli substitutions from the course’s book.","level":"Course level"},{"title":"MIT 18.03SC, First order linear ODEs","url":"https://ocw.mit.edu/courses/18-03sc-differential-equations-fall-2011/pages/unit-i-first-order-differential-equations/first-order-linear-odes/","why":"The linear equation a Bernoulli substitution leads to.","level":"Course level"}]},{"id":"op-amp","title":"The operational amplifier","subject":"circuits","courses":["eel3111"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmo>+\u003c/mo>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmo>−\u003c/mo>\u003c/msub>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"1em\"/>\u003cmsub>\u003cmi>i\u003c/mi>\u003cmo>±\u003c/mo>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>0\u003c/mn>\u003cmo separator=\"true\">;\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmfrac>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmi>o\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmo>−\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmi>f\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmtext>in\u003c/mtext>\u003c/msub>\u003c/mfrac>\u003cmtext> (inverting)\u003c/mtext>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"1em\"/>\u003cmn>1\u003c/mn>\u003cmo>+\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmi>f\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmi>g\u003c/mi>\u003c/msub>\u003c/mfrac>\u003cmtext> (non-inverting)\u003c/mtext>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmfrac>\u003cmi>A\u003c/mi>\u003cmrow>\u003cmn>1\u003c/mn>\u003cmo>+\u003c/mo>\u003cmi>A\u003c/mi>\u003cmi>β\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo>→\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmi>β\u003c/mi>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"An op amp is a dependent source with an enormous gain \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> on the difference between its two inputs. Feed part of the output back to the inverting input and the gain of the whole circuit becomes \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>A\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>+\u003c/mo>\u003cmi>A\u003c/mi>\u003cmi>β\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/math>\u003c/span>, which is very nearly \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmn>1\u003c/mn>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>β\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>: set by resistors, not by the chip. So the ideal model says the inputs sit at the same voltage and draw no current. Node analysis with those two rules gives inverting, non-inverting, summing and difference amplifiers, integrators and filters. The rules fail when the output reaches a supply rail.","requires":["dependent-sources"],"labs":[],"problems":[],"candidate":"An inverting amplifier with sliders for the resistors, the open-loop gain and the supply. It corrects the idea that the op amp’s own gain sets the circuit’s gain: change \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> a hundredfold and the output barely moves, until it hits a rail.","sources":[{"title":"MIT 6.002, calendar: Lectures 21 to 23, the op-amp abstraction and feedback","url":"https://ocw.mit.edu/courses/6-002-circuits-and-electronics-spring-2007/pages/calendar/","why":"Three lectures from the abstraction to integrators, filters and oscillators.","level":"Course level"},{"title":"Kuphaldt, Lessons in Electric Circuits, Vol. III: Semiconductors","url":"https://www.allaboutcircuits.com/textbook/semiconductors/","why":"Its operational amplifiers chapter covers feedback and the common circuits.","level":"Intro"}]},{"id":"optimization","title":"Optimization","subject":"calculus","courses":["mac2311"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsup>\u003cmi>f\u003c/mi>\u003cmo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′\u003c/mo>\u003c/msup>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsup>\u003cmi>x\u003c/mi>\u003cmo>∗\u003c/mo>\u003c/msup>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmn>0\u003c/mn>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsup>\u003cmi>f\u003c/mi>\u003cmrow>\u003cmo mathvariant=\"normal\">′\u003c/mo>\u003cmo mathvariant=\"normal\">′\u003c/mo>\u003c/mrow>\u003c/msup>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsup>\u003cmi>x\u003c/mi>\u003cmo>∗\u003c/mo>\u003c/msup>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>&lt;\u003c/mo>\u003cmn>0\u003c/mn>\u003cmo>⇒\u003c/mo>\u003cmtext>local max\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A smooth function's highest and lowest points on an interval sit where the derivative is zero, where it does not exist, or at the ends. The second derivative says which way the graph bends. In a real problem the work is the setup: write the quantity in one variable using the constraint, then differentiate. A zero slope is a candidate, not a proof: \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsup>\u003cmi>x\u003c/mi>\u003cmn>3\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span> is flat at 0 and has no peak or pit there.","requires":["derivative"],"labs":[{"course":"mac2311","title":"Open box","href":"https://flux-study.pages.dev/mac2311/#/mac2311/c2/box","notes":"https://flux-study.pages.dev/mac2311/#/mac2311/c2/box?n=s6","note":"An open box from a sheet: the biggest box is not the biggest cut."},{"course":"mac2311","title":"Drink can","href":"https://flux-study.pages.dev/mac2311/#/mac2311/c2/can","notes":null,"note":"A drink can holding a fixed volume with the least metal, with and without a lid."}],"problems":["mac2311:c2.can-optimum"],"candidate":null,"sources":[{"title":"OpenStax Calculus Vol. 1, §4.7 Applied optimization problems","url":"https://openstax.org/books/calculus-volume-1/pages/4-7-applied-optimization-problems","why":"Boxes, fences and cans, each set up from its constraint.","level":"Intro"},{"title":"MIT 18.01SC, Part B: Optimization, related rates and Newton’s method","url":"https://ocw.mit.edu/courses/18-01sc-single-variable-calculus-fall-2010/pages/unit-2-applications-of-differentiation/part-b-optimization-related-rates-and-newtons-method/","why":"Optimization problems with full solutions.","level":"Course level"}]},{"id":"orthogonality-projection","title":"Orthogonality and projection","subject":"linalg","courses":["egn3203"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsup>\u003cmi>A\u003c/mi>\u003cmi mathvariant=\"sans-serif\">T\u003c/mi>\u003c/msup>\u003cmi>A\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmover accent=\"true\">\u003cmi>𝐱\u003c/mi>\u003cmo>^\u003c/mo>\u003c/mover>\u003cmo>=\u003c/mo>\u003cmsup>\u003cmi>A\u003c/mi>\u003cmi mathvariant=\"sans-serif\">T\u003c/mi>\u003c/msup>\u003cmi>𝐛\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>𝐩\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>A\u003c/mi>\u003cmover accent=\"true\">\u003cmi>𝐱\u003c/mi>\u003cmo>^\u003c/mo>\u003c/mover>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsup>\u003cmi>A\u003c/mi>\u003cmi mathvariant=\"sans-serif\">T\u003c/mi>\u003c/msup>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>𝐛\u003c/mi>\u003cmo>−\u003c/mo>\u003cmi>𝐩\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmn>𝟎\u003c/mn>\u003c/mrow>\u003c/math>\u003c/span>","idea":"When \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>𝐛\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> is not in the column space, \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>A\u003c/mi>\u003cmi>𝐱\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>𝐛\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> has no solution, so ask for the closest one. The closest point \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>𝐩\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> in the column space is the one whose error \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>𝐛\u003c/mi>\u003cmo>−\u003c/mo>\u003cmi>𝐩\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> is perpendicular to every column. Writing that with dot products gives the normal equations \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsup>\u003cmi>A\u003c/mi>\u003cmi mathvariant=\"sans-serif\">T\u003c/mi>\u003c/msup>\u003cmi>A\u003c/mi>\u003cmover accent=\"true\">\u003cmi>𝐱\u003c/mi>\u003cmo>^\u003c/mo>\u003c/mover>\u003cmo>=\u003c/mo>\u003cmsup>\u003cmi>A\u003c/mi>\u003cmi mathvariant=\"sans-serif\">T\u003c/mi>\u003c/msup>\u003cmi>𝐛\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. With orthogonal columns the projection is just a sum of projections onto each one; with slanted columns it is not. This is least squares, the basis of every fitted line and curve.","requires":["rank-nullspace"],"labs":[],"problems":[],"candidate":"Drop a point onto a plane spanned by two arrows you drag, with the error drawn. It corrects the idea that you can project onto each arrow in turn and add: that works only when the arrows are perpendicular.","sources":[{"title":"Margalit and Rabinoff, Interactive Linear Algebra","url":"https://textbooks.math.gatech.edu/ila/","why":"Its orthogonality chapter goes from projections to least squares.","level":"Course level"},{"title":"MIT 18.06SC Linear Algebra, Fall 2011","url":"https://ocw.mit.edu/courses/18-06sc-linear-algebra-fall-2011/","why":"Unit II opens with projections and least squares, then Gram–Schmidt.","level":"Course level"}]},{"id":"otto-diesel","title":"Otto and Diesel cycles","subject":"thermo","courses":["eml3101"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>η\u003c/mi>\u003cmtext>Otto\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>−\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmsup>\u003cmi>r\u003c/mi>\u003cmrow>\u003cmtext> \u003c/mtext>\u003cmi>k\u003c/mi>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msup>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>η\u003c/mi>\u003cmtext>Diesel\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>−\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmsup>\u003cmi>r\u003c/mi>\u003cmrow>\u003cmtext> \u003c/mtext>\u003cmi>k\u003c/mi>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msup>\u003c/mfrac>\u003cmtext> \u003c/mtext>\u003cmfrac>\u003cmrow>\u003cmsubsup>\u003cmi>r\u003c/mi>\u003cmi>c\u003c/mi>\u003cmrow>\u003cmtext> \u003c/mtext>\u003cmi>k\u003c/mi>\u003c/mrow>\u003c/msubsup>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cmrow>\u003cmi>k\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsub>\u003cmi>r\u003c/mi>\u003cmi>c\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A piston engine is modelled as air in a closed cylinder run round a cycle: isentropic compression, heat added, isentropic expansion, heat rejected. In the Otto cycle the heat goes in at constant volume, as a spark ignites the charge at the top of the stroke. In the Diesel cycle it goes in at constant pressure while the fuel burns as the piston moves down. With cold-air assumptions Otto's efficiency depends only on the compression ratio \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. At the same \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> the Diesel does worse, but it runs at much higher \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> because it compresses air alone and cannot knock.","requires":["entropy","boundary-work"],"labs":[],"problems":[],"candidate":"Run Otto and Diesel cycles side by side on \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>p\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>–\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>v\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> and \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>T\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>–\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>s\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>, with a slider for compression ratio. It corrects the idea that the Diesel is the more efficient cycle: at the same compression ratio it is less efficient; it wins only because it can run at a higher one.","sources":[{"title":"MIT 16.050, calendar: Gas power and propulsion cycles","url":"https://ocw.mit.edu/courses/16-050-thermal-energy-fall-2002/pages/calendar/","why":"The six lectures on air-standard cycles that this concept starts.","level":"Course level"},{"title":"Cleynen, Engineering Thermodynamics","url":"https://thermodynamicsbook.com/","why":"Piston-engine cycles on \\(p\\)–\\(v\\) and \\(T\\)–\\(s\\) diagrams, worked through.","level":"Course level"},{"title":"Wikipedia, Otto cycle","url":"https://en.wikipedia.org/wiki/Otto_cycle","why":"The four strokes mapped onto the four processes.","level":"Intro"}]},{"id":"paired-comparisons","title":"Paired and independent samples","subject":"stats","courses":["sta3032"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmover accent=\"true\">\u003cmi>d\u003c/mi>\u003cmo>ˉ\u003c/mo>\u003c/mover>\u003cmrow>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>d\u003c/mi>\u003c/msub>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmsqrt>\u003cmi>n\u003c/mi>\u003c/msqrt>\u003c/mrow>\u003c/mfrac>\u003cmtext> (paired)\u003c/mtext>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>t\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmover accent=\"true\">\u003cmi>x\u003c/mi>\u003cmo>ˉ\u003c/mo>\u003c/mover>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmover accent=\"true\">\u003cmi>x\u003c/mi>\u003cmo>ˉ\u003c/mo>\u003c/mover>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mrow>\u003cmsqrt>\u003cmrow>\u003cmsubsup>\u003cmi>s\u003c/mi>\u003cmn>1\u003c/mn>\u003cmn>2\u003c/mn>\u003c/msubsup>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmsub>\u003cmi>n\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsubsup>\u003cmi>s\u003c/mi>\u003cmn>2\u003c/mn>\u003cmn>2\u003c/mn>\u003c/msubsup>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmsub>\u003cmi>n\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mrow>\u003c/msqrt>\u003c/mfrac>\u003cmtext> (independent)\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Measuring the same subjects twice lets each one serve as its own control. Taking differences removes the spread between subjects, so a small effect can stand out. Treating paired data as two independent groups leaves that spread in and can hide the effect. When subjects are all alike, pairing gains little.","requires":["hypothesis-tests"],"labs":[{"course":"sta3032","title":"Paired vs independent","href":"https://flux-study.pages.dev/sta3032/#/sta3032/final/explore/paired","notes":null,"note":"The same subjects before and after: the paired test against the independent one."}],"problems":[],"candidate":null,"sources":[{"title":"OpenStax Introductory Statistics 2e, §10.4 Matched or paired samples","url":"https://openstax.org/books/introductory-statistics-2e/pages/10-4-matched-or-paired-samples","why":"The paired t test worked from differences.","level":"Intro"},{"title":"MIT 18.05, Reading 19: NHST III, gallery of tests","url":"https://ocw.mit.edu/courses/18-05-introduction-to-probability-and-statistics-spring-2014/resources/mit18_05s14_reading19/","why":"Two-sample tests with and without pairing.","level":"Course level"}]},{"id":"parametric-curves","title":"Parametric curves","subject":"calculus","courses":["mac2311","mac2313"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi mathvariant=\"bold-italic\">γ\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>t\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmo fence=\"false\" stretchy=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>t\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo separator=\"true\">,\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmi>y\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>t\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo separator=\"true\">,\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmi>z\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>t\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo fence=\"false\" stretchy=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">)\u003c/mo>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>L\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsubsup>\u003cmo>∫\u003c/mo>\u003cmi>a\u003c/mi>\u003cmi>b\u003c/mi>\u003c/msubsup>\u003cmi mathvariant=\"normal\">∣\u003c/mi>\u003cmsup>\u003cmi mathvariant=\"bold-italic\">γ\u003c/mi>\u003cmo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′\u003c/mo>\u003c/msup>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>t\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmi mathvariant=\"normal\">∣\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A curve can be traced by a point moving in time: each coordinate is its own function of \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. The derivative \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsup>\u003cmi mathvariant=\"bold-italic\">γ\u003c/mi>\u003cmo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′\u003c/mo>\u003c/msup>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>t\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/math>\u003c/span> is the velocity, tangent to the curve, and its length is the speed. Adding speed over time gives arc length. Every path a particle or a line integral follows is written this way.","requires":["derivative"],"labs":[{"course":"mac2311","title":"Parametric","href":"https://flux-study.pages.dev/mac2311/#/mac2311/c5/parametric","notes":"https://flux-study.pages.dev/mac2311/#/mac2311/c5/parametric?n=s1","note":"Move a point along a curve: the slope and the speed are different numbers."},{"course":"mac2311","title":"Record player","href":"https://flux-study.pages.dev/mac2311/#/mac2311/c5/record","notes":null,"note":"A record player: inner and outer points share a period but not a speed."},{"course":"mac2313","title":"Parametric","href":"https://flux-study.pages.dev/mac2313/#/mac2313/ch2/parametric","notes":null,"note":"Slide t along a plane curve and watch its tangent."},{"course":"mac2313","title":"Space","href":"https://flux-study.pages.dev/mac2313/#/mac2313/ch4/space","notes":null,"note":"The same in three dimensions: helices and coils with their tangent lines."}],"problems":["mac2313:ch2.param.point","mac2313:ch2.param.tangent","mac2313:ch2.param.hv","mac2313:ch2.param.length","mac2313:ch4.space.point","mac2313:ch4.space.length","mac2313:ch4.space.speed","mac2313:ch4.space.tangent"],"candidate":null,"sources":[{"title":"OpenStax Calculus Vol. 3, §3.2 Calculus of vector-valued functions","url":"https://openstax.org/books/calculus-volume-3/pages/3-2-calculus-of-vector-valued-functions","why":"Tangent vectors and derivatives of space curves.","level":"Course level"},{"title":"MIT 18.02SC, Part C: Parametric equations for curves","url":"https://ocw.mit.edu/courses/18-02sc-multivariable-calculus-fall-2010/pages/1.-vectors-and-matrices/part-c-parametric-equations-for-curves/","why":"Velocity, speed and arc length with recitation videos.","level":"Course level"}]},{"id":"partial-derivatives","title":"Partial derivatives","subject":"calculus","courses":["mac2313"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmfrac>\u003cmrow>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmi>f\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmunder>\u003cmrow>\u003cmi>lim\u003c/mi>\u003cmo>⁡\u003c/mo>\u003c/mrow>\u003cmrow>\u003cmi>h\u003c/mi>\u003cmo>→\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003c/munder>\u003cmfrac>\u003cmrow>\u003cmi>f\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>h\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>−\u003c/mo>\u003cmi>f\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003cmi>h\u003c/mi>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Hold every variable but one fixed and differentiate as usual. On a surface \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>z\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>f\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/math>\u003c/span>, \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmi>f\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> is the slope of the slice where \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>y\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> is held, and \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmi>f\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmi>y\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> the slope of the other slice. For smooth functions the mixed partials agree whichever order you take them.","requires":["derivative"],"labs":[{"course":"mac2313","title":"Partials","href":"https://flux-study.pages.dev/mac2313/#/mac2313/ch2/partials","notes":null,"note":"Two slices through a surface: hold \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>y\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> for one slope, hold \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> for the other."},{"course":"mac2313","title":"Partials","href":"https://flux-study.pages.dev/mac2313/#/mac2313/ch4/partials3","notes":null,"note":"Three first partials of \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>f\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>z\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/math>\u003c/span> at a point you drag."}],"problems":["mac2313:ch2.partials.poly","mac2313:ch2.partials.product","mac2313:ch2.partials.second","mac2313:ch2.partials.mixed","mac2313:ch2.partials.schwarz","mac2313:ch2.partials.slice","mac2313:ch4.p3.first","mac2313:ch4.p3.mixed","mac2313:ch4.p3.schwarz","mac2313:ch4.p3.crit"],"candidate":null,"sources":[{"title":"OpenStax Calculus Vol. 3, §4.3 Partial derivatives","url":"https://openstax.org/books/calculus-volume-3/pages/4-3-partial-derivatives","why":"Slices of a surface, then higher and mixed partials.","level":"Intro"},{"title":"MIT 18.02SC, Part A: Functions of two variables, tangent approximation and optimization","url":"https://ocw.mit.edu/courses/18-02sc-multivariable-calculus-fall-2010/pages/2.-partial-derivatives/part-a-functions-of-two-variables-tangent-approximation-and-optimization/","why":"Partials, tangent planes and approximation with checked problems.","level":"Course level"}]},{"id":"particle-equilibrium","title":"Equilibrium of a particle","subject":"mechanics","courses":["statics"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmo>∑\u003c/mo>\u003cmi>𝐅\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>𝟎\u003c/mn>\u003cmtext>  \u003c/mtext>\u003cmo>⟺\u003c/mo>\u003cmtext>  \u003c/mtext>\u003cmo>∑\u003c/mo>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmi>x\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmo>∑\u003c/mo>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmi>y\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmo>∑\u003c/mo>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmi>z\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A point held by cables, springs and weights is in equilibrium when its forces add to zero: drawn tip to tail, they close into a polygon. Write one equation per direction and solve for the unknown tensions. Spreading a lifting bridle wider makes each leg pull harder, because only the vertical parts hold the load.","requires":["vectors"],"labs":[{"course":"statics","title":"Particle","href":"https://flux-study.pages.dev/statics/#/statics/u2/particle","notes":"https://flux-study.pages.dev/statics/#/statics/u2/particle?n=s1","note":"A ring on cables and a spring: the force polygon closes when ΣF = 0."},{"course":"statics","title":"Lifting bridle","href":"https://flux-study.pages.dev/statics/#/statics/u1/bridle","notes":"https://flux-study.pages.dev/statics/#/statics/u1/bridle?n=s3","note":"A pallet on a two-leg bridle: shallower legs carry more than half the load each."}],"problems":["statics:ch3.two-cables","statics:ch3.spring","statics:ch3.three-cables","statics:r4.cable-limit"],"candidate":null,"sources":[{"title":"Engineering Statics: Open and Interactive (Baker and Haynes)","url":"https://engineeringstatics.org/","why":"A free statics text with interactive diagrams; its particle-equilibrium chapter fits here.","level":"Course level"},{"title":"MIT 2.001, Lecture 2: Forces, moments, equilibrium","url":"https://ocw.mit.edu/courses/2-001-mechanics-materials-i-fall-2006/resources/lec2/","why":"Equilibrium set up from free-body diagrams, MIT’s way.","level":"Course level"}]},{"id":"particle-kinematics","title":"Motion along a line","subject":"mechanics","courses":["egn3321","phy2048"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>v\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>s\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>a\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>v\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmi>v\u003c/mi>\u003cmfrac>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>v\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>s\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Position, velocity and acceleration are each the derivative of the one before. Going back up takes integrals, so a graph of one gives the next by its slope or its area. When the acceleration depends on position, \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>a\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>v\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>v\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>d\u003c/mi>\u003cmi>s\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> separates the variables. Constant-acceleration formulas are only the special case.","requires":["derivative","definite-integral"],"labs":[{"course":"egn3321","title":"Rectilinear","href":"https://flux-study.pages.dev/egn3321/#/egn3321/u1/rectilinear","notes":"https://flux-study.pages.dev/egn3321/#/egn3321/u1/rectilinear?n=s2","note":"Position, velocity and acceleration graphs, including erratic piecewise motion."},{"course":"egn3321","title":"Train","href":"https://flux-study.pages.dev/egn3321/#/egn3321/u1/train","notes":"https://flux-study.pages.dev/egn3321/#/egn3321/u1/train?n=s8","note":"A train between two stations: accelerate, cruise, brake, within comfort limits."},{"course":"phy2048","title":"Motion graphs","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u1/kinematics-graphs","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u1/kinematics-graphs?n=s7","note":"Position, velocity and acceleration graphs, with the chord turning into the tangent."},{"course":"phy2048","title":"Stopping distance","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u1/stopping-distance","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u1/stopping-distance?n=s9","note":"A car braking on dry and wet roads: distance grows with the square of the speed."}],"problems":["egn3321:u1.12.polynomial","egn3321:u1.12.distance","egn3321:u1.12.erratic","egn3321:u1.12.vt-shape","egn3321:u1.12.train","phy2048:ch3.piecewise","phy2048:ch3.concept-top","phy2048:ch3.stop","phy2048:ch3.reaction"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 1, §3.6 Finding velocity and displacement from acceleration","url":"https://openstax.org/books/university-physics-volume-1/pages/3-6-finding-velocity-and-displacement-from-acceleration","why":"Integrating a varying acceleration, past the constant case.","level":"Intro"},{"title":"MIT 8.01SC, 2.3 Worked example: acceleration from position","url":"https://ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/pages/week-1-kinematics/2-3-worked-example-acceleration-from-position/","why":"A short video that differentiates a position twice and reads the motion.","level":"Course level"}]},{"id":"phase-diagrams","title":"Binary phase diagrams and the lever rule","subject":"matsci","courses":["ema3010"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi>L\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>C\u003c/mi>\u003cmi>α\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>C\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmi>C\u003c/mi>\u003cmi>α\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>C\u003c/mi>\u003cmi>L\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi>α\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>C\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>C\u003c/mi>\u003cmi>L\u003c/mi>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmi>C\u003c/mi>\u003cmi>α\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>C\u003c/mi>\u003cmi>L\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A binary phase diagram maps which phases are stable at each temperature and overall composition. In a two-phase region, a horizontal tie line through the alloy's point ends at the two phases' compositions. Balancing the mass of one element across both phases gives the lever rule: each phase's share is the length of the opposite arm. A eutectic is the point where a liquid freezes straight into two solids at one temperature.","requires":["phases","point-defects"],"labs":[],"problems":[],"candidate":"Drag a temperature line across a binary diagram and read the tie line. It corrects the common mix-up between the phases’ compositions and how much of each phase there is.","sources":[{"title":"DoITPoMS, Phase diagrams and solidification (University of Cambridge)","url":"https://www.doitpoms.ac.uk/tlplib/phase-diagrams/index.php","why":"Isomorphous and eutectic systems with the tie line and lever rule drawn.","level":"Course level"},{"title":"Lever rule (Wikipedia)","url":"https://en.wikipedia.org/wiki/Lever_rule","why":"The mass balance behind the rule in a few lines.","level":"Intro"}]},{"id":"phase-line","title":"Autonomous equations and stability","subject":"diffeq","courses":["map2302"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsup>\u003cmi>y\u003c/mi>\u003cmo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′\u003c/mo>\u003c/msup>\u003cmo>=\u003c/mo>\u003cmi>f\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>f\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsup>\u003cmi>y\u003c/mi>\u003cmo>∗\u003c/mo>\u003c/msup>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmn>0\u003c/mn>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsup>\u003cmi>f\u003c/mi>\u003cmo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′\u003c/mo>\u003c/msup>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsup>\u003cmi>y\u003c/mi>\u003cmo>∗\u003c/mo>\u003c/msup>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>&lt;\u003c/mo>\u003cmn>0\u003c/mn>\u003cmo>⇒\u003c/mo>\u003cmtext>stable\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/span>","idea":"When the slope depends only on \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>y\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>, the zeros of \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>f\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> are equilibria, and the sign of \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>f\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> between them says which way solutions move. A phase line shows it all without solving. Change a parameter and two equilibria can meet and vanish: harvest a population too hard and no steady state is left.","requires":["first-order-odes"],"labs":[{"course":"map2302","title":"Phase line","href":"https://flux-study.pages.dev/map2302/#/map2302/u1/phase-line","notes":"https://flux-study.pages.dev/map2302/#/map2302/u1/phase-line?n=s8","note":"Logistic growth with harvest: the two equilibria collide and vanish past a threshold."}],"problems":[],"candidate":null,"sources":[{"title":"Lebl, Notes on Diffy Qs, §1.6 Autonomous equations","url":"https://www.jirka.org/diffyqs/html/auteq_section.html","why":"Phase lines, stability and the logistic equation with harvesting.","level":"Course level"},{"title":"MIT 18.03SC, First order autonomous differential equations","url":"https://ocw.mit.edu/courses/18-03sc-differential-equations-fall-2011/pages/unit-i-first-order-differential-equations/first-order-autonomous-differential-equations/","why":"Phase lines and bifurcations on video, with problems.","level":"Course level"}]},{"id":"phases","title":"Phases and property tables","subject":"thermo","courses":["eml3100"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>v\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmi>f\u003c/mi>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmi>x\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmi>g\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmi>f\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>x\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmtext>vapour\u003c/mtext>\u003c/msub>\u003cmi>m\u003c/mi>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A pure substance can be liquid, vapour or a mix. Under the saturation dome the two coexist at a fixed temperature for each pressure, so pressure and temperature stop being independent. The quality \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> says how much has boiled, and any property is a weighted mix of the liquid and vapour values. Raise the pressure and water boils hotter, which is the whole point of a pressure canner.","requires":["pressure"],"labs":[{"course":"eml3100","title":"Phase diagram","href":"https://flux-study.pages.dev/eml3100/#/eml3100/u1/phase","notes":"https://flux-study.pages.dev/eml3100/#/eml3100/u1/phase?n=s2","note":"Water’s phase diagram and saturation dome, with states you place."},{"course":"eml3100","title":"Pressure canner","href":"https://flux-study.pages.dev/eml3100/#/eml3100/u1/canner","notes":null,"note":"A pressure canner: gauge plus atmosphere sets the boiling point, and altitude lowers it."}],"problems":["eml3100:u1.2.phase","eml3100:u1.2.tank-quality","eml3100:u1.2.mixture","eml3100:u1.2.superheat","eml3100:u1.2.find-T","eml3100:u1.2.where","eml3100:u1.3.steam-z","eml3100:u1.2.hold","eml3100:u2.4.tank-heat","eml3100:u1.2.boil-move"],"candidate":null,"sources":[{"title":"Yan, Introduction to Engineering Thermodynamics, §2.3 Phase diagrams and §2.4 Thermodynamic tables","url":"https://pressbooks.bccampus.ca/thermo1/","why":"The course’s own book: the dome, quality and reading the steam tables.","level":"Course level"},{"title":"OpenStax University Physics Vol. 2, §1.5 Phase changes","url":"https://openstax.org/books/university-physics-volume-2/pages/1-5-phase-changes","why":"Phase diagrams and latent heat from the physics side.","level":"Intro"}]},{"id":"pipe-flow","title":"Pipe flow and head loss","subject":"fluids","courses":["eml3015"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmi>L\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmi>f\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmfrac>\u003cmi>L\u003c/mi>\u003cmi>D\u003c/mi>\u003c/mfrac>\u003cmtext> \u003c/mtext>\u003cmfrac>\u003cmsup>\u003cmi>V\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>g\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo>+\u003c/mo>\u003cmo>∑\u003c/mo>\u003cmi>K\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmfrac>\u003cmsup>\u003cmi>V\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>g\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>f\u003c/mi>\u003cmtext>lam\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmn>64\u003c/mn>\u003cmtext>Re\u003c/mtext>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Friction in a pipe turns mechanical energy into heat, and the energy equation counts it as a head loss. Dimensional analysis says the friction factor depends only on the Reynolds number and the relative roughness. Below a Reynolds number of about 2300 the flow is laminar and Poiseuille gives \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>f\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>64\u003c/mn>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmtext>Re\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/span>. Above it the flow turns turbulent, mixing is far stronger, and \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>f\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> comes from the Moody chart or Colebrook's formula. Valves, bends and entrances add minor losses, each a multiple \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>K\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> of the velocity head.","requires":["couette-poiseuille","dimensional-analysis","energy-cv"],"labs":[],"problems":[],"candidate":"Plot head loss against flow rate through the laminar and turbulent ranges, with a roughness slider. It corrects the idea that loss grows in step with speed: it is linear while laminar, close to the square once turbulent, and roughness matters only in the turbulent range.","sources":[{"title":"MIT 2.06, calendar: Lecture 11, laminar flow, turbulent pipe flows and losses","url":"https://ocw.mit.edu/courses/2-06-fluid-dynamics-spring-2013/pages/calendar/","why":"The lecture that moves from the exact laminar solution to measured turbulent losses.","level":"Course level"},{"title":"Cleynen, Fluid Dynamics for Engineers","url":"https://fluidmech.ninja/","why":"Pipe flow with the Moody diagram, friction factors and minor losses, worked through.","level":"Course level"},{"title":"Wikipedia, Darcy friction factor formulae","url":"https://en.wikipedia.org/wiki/Darcy_friction_factor_formulae","why":"Colebrook, Haaland and the other fits, with their ranges and errors.","level":"Deeper"}]},{"id":"pipe-systems","title":"Pipe systems and pumps","subject":"fluids","courses":["eml3015"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmtext>pump\u003c/mtext>\u003c/msub>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>Q\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmi>z\u003c/mi>\u003cmo>+\u003c/mo>\u003cmo>∑\u003c/mo>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmi>L\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>Q\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmtext>parallel: \u003c/mtext>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmrow>\u003cmi>L\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmrow>\u003cmi>L\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmn>2\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo separator=\"true\">,\u003c/mo>\u003cmtext>  \u003c/mtext>\u003cmi>Q\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A system of pipes needs a head that rises with flow: the lift plus every loss along the way. A pump delivers a head that falls with flow. The system runs where the two curves cross. Pipes in series carry one flow and add their losses. Pipes in parallel share one head loss and add their flows, so the split settles where the losses match.","requires":["pipe-flow"],"labs":[],"problems":[],"candidate":"Two pipes in parallel feed an upstairs shower while a second tap opens. It corrects the idea that flow splits evenly or by pipe area: it splits so the head losses are equal, and opening the tap starves the shower.","sources":[{"title":"MIT 2.06, calendar: Lecture 12, pipe systems and viscous pumps","url":"https://ocw.mit.edu/courses/2-06-fluid-dynamics-spring-2013/pages/calendar/","why":"The course’s last topic before the second quiz.","level":"Course level"},{"title":"Cleynen, Fluid Dynamics for Engineers","url":"https://fluidmech.ninja/","why":"Series and parallel pipes, and pump and system curves.","level":"Course level"}]},{"id":"point-defects","title":"Point defects and vacancies","subject":"matsci","courses":["ema3010"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmfrac>\u003cmsub>\u003cmi>n\u003c/mi>\u003cmi>v\u003c/mi>\u003c/msub>\u003cmi>N\u003c/mi>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmi>exp\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmtext> ⁣\u003c/mtext>\u003cmrow>\u003cmo fence=\"true\">(\u003c/mo>\u003cmo>−\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmi>v\u003c/mi>\u003c/msub>\u003cmrow>\u003cmsub>\u003cmi>k\u003c/mi>\u003cmi>B\u003c/mi>\u003c/msub>\u003cmi>T\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo fence=\"true\">)\u003c/mo>\u003c/mrow>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A real crystal always has empty sites, vacancies, and foreign atoms sitting in sites or squeezed between them. Making a vacancy costs energy but gains disorder, so at any temperature some fraction of sites is empty, and that fraction rises steeply with temperature in the Arrhenius form. Substitutional and interstitial atoms are how alloys are made. Vacancies are what let atoms move, which is the start of diffusion.","requires":["crystal-structures"],"labs":[],"problems":[],"candidate":"Plot the vacancy fraction against temperature on linear and Arrhenius axes. It corrects the idea that vacancies are flaws a perfect process would remove: they are an equilibrium population.","sources":[{"title":"MIT 3.091, Recitation 17: Point defects and Arrhenius-like vacancy activation","url":"https://ocw.mit.edu/courses/3-091-introduction-to-solid-state-chemistry-fall-2018/resources/mit3_091f18_rec17/","why":"The vacancy fraction and its Arrhenius plot, worked.","level":"Course level"},{"title":"OpenStax Chemistry 2e, §12.5 Collision theory","url":"https://openstax.org/books/chemistry-2e/pages/12-5-collision-theory","why":"Where the Arrhenius form comes from, for readers meeting it here first.","level":"Intro"}]},{"id":"poisson","title":"Poisson’s ratio and three-dimensional Hooke’s law","subject":"materials","courses":["egn3331"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>ε\u003c/mi>\u003cmi>x\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmi>E\u003c/mi>\u003c/mfrac>\u003cmrow>\u003cmo fence=\"true\">[\u003c/mo>\u003cmsub>\u003cmi>σ\u003c/mi>\u003cmi>x\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmi>ν\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsub>\u003cmi>σ\u003c/mi>\u003cmi>y\u003c/mi>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>σ\u003c/mi>\u003cmi>z\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo fence=\"true\">]\u003c/mo>\u003c/mrow>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>ν\u003c/mi>\u003cmo>=\u003c/mo>\u003cmo>−\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>ε\u003c/mi>\u003cmtext>lat\u003c/mtext>\u003c/msub>\u003cmsub>\u003cmi>ε\u003c/mi>\u003cmtext>long\u003c/mtext>\u003c/msub>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A bar stretched one way thins the other two. Poisson's ratio is how much, and it makes a stress in one direction change the strain in the others. A strain gauge reads strain along one line, not stress, so turning a reading into stress needs the strains in the other directions too. Rosettes of three gauges recover the whole in-plane strain.","requires":["stress-strain"],"labs":[{"course":"egn3331","title":"Poisson","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u2/poisson","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u2/poisson?n=s3","note":"A stretched bar thinning sideways, and its volume change against ν."},{"course":"egn3331","title":"Three-dimensional Hooke","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u4/strain3","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u4/strain3?n=s4","note":"A second stress changes the strain in the first direction."},{"course":"egn3331","title":"Strain gauges","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u4/gauges","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u4/gauges?n=s6","note":"Strain gauges on a propane cylinder: what each reads, and the stress it does not name."}],"problems":["egn3331:u2.3.poisson","egn3331:u2.3.shear-modulus","egn3331:u2.3.incompressible","egn3331:u2.3.squeeze","egn3331:u4.10.hooke","egn3331:u4.10.hidden","egn3331:u4.10.transverse","egn3331:u4.10.gauge-angle","egn3331:u4.10.strain-circle","egn3331:u4.10.rosette","egn3331:u4.10.gauge45"],"candidate":null,"sources":[{"title":"MIT 2.001, Lecture 13: Multiaxial strain and multiaxial stress-strain relationships","url":"https://ocw.mit.edu/courses/2-001-mechanics-materials-i-fall-2006/resources/lec13/","why":"Generalized Hooke’s law built up direction by direction.","level":"Course level"},{"title":"MIT 3.11, calendar: Constitutive relations (18)","url":"https://ocw.mit.edu/courses/3-11-mechanics-of-materials-fall-1999/pages/calendar/","why":"Where the course’s reading (Roylance) treats isotropic constitutive laws.","level":"Deeper"}]},{"id":"polar-coordinates","title":"Polar coordinates","subject":"calculus","courses":["mac2311","mac2313"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>x\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>r\u003c/mi>\u003cmi>cos\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>θ\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"1em\"/>\u003cmi>y\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>r\u003c/mi>\u003cmi>sin\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>θ\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsup>\u003cmi>r\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>=\u003c/mo>\u003cmsup>\u003cmi>x\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>+\u003c/mo>\u003cmsup>\u003cmi>y\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A point can be named by its distance from the origin and its angle, instead of by \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> and \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>y\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. Circles and spirals become simple equations. The unit vectors \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmover accent=\"true\">\u003cmi>r\u003c/mi>\u003cmo>^\u003c/mo>\u003c/mover>\u003c/mrow>\u003c/math>\u003c/span> and \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmover accent=\"true\">\u003cmi>θ\u003c/mi>\u003cmo>^\u003c/mo>\u003c/mover>\u003c/mrow>\u003c/math>\u003c/span> change direction from point to point, which matters later when a field is written in them.","requires":[],"labs":[{"course":"mac2311","title":"Polar","href":"https://flux-study.pages.dev/mac2311/#/mac2311/c5/polar","notes":"https://flux-study.pages.dev/mac2311/#/mac2311/c5/polar?n=s4","note":"Sweep the angle: polar area grows with \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsup>\u003cmi>r\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span>, not with \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>."},{"course":"mac2313","title":"Polar","href":"https://flux-study.pages.dev/mac2313/#/mac2313/ch2/polar","notes":null,"note":"Drag a point and read \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>, \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>θ\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> and the local \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmover accent=\"true\">\u003cmi>r\u003c/mi>\u003cmo>^\u003c/mo>\u003c/mover>\u003c/mrow>\u003c/math>\u003c/span>, \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmover accent=\"true\">\u003cmi>θ\u003c/mi>\u003cmo>^\u003c/mo>\u003c/mover>\u003c/mrow>\u003c/math>\u003c/span>."}],"problems":["mac2313:ch2.polar.rth","mac2313:ch2.polar.cart","mac2313:ch2.polar.unique","mac2313:ch2.polar.rhat"],"candidate":null,"sources":[{"title":"OpenStax Calculus Vol. 3, §1.3 Polar coordinates","url":"https://openstax.org/books/calculus-volume-3/pages/1-3-polar-coordinates","why":"Converting both ways and sketching polar curves.","level":"Intro"},{"title":"MIT 18.01SC, Part C: Parametric equations and polar coordinates","url":"https://ocw.mit.edu/courses/18-01sc-single-variable-calculus-fall-2010/pages/unit-4-techniques-of-integration/part-c-parametric-equations-and-polar-coordinates/","why":"Polar curves and their areas, with checked problems.","level":"Course level"}]},{"id":"polar-integrals","title":"Double integrals in polar","subject":"calculus","courses":["mac2313"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>A\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>r\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>r\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>θ\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Over a disk or a ring, cut the region along circles and rays instead of a grid. Each piece is nearly a rectangle with sides \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> and \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>r\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmi>θ\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>, so its area carries a factor \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. Forget the \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> and the answer is wrong, because cells far from the centre are bigger.","requires":["double-integrals","polar-coordinates"],"labs":[{"course":"mac2313","title":"Polar","href":"https://flux-study.pages.dev/mac2313/#/mac2313/ch3/dpolar","notes":null,"note":"One sector at a time: \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmi>A\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>r\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmi>r\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmi>θ\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>."}],"problems":["mac2313:ch3.dpolar.area","mac2313:ch3.dpolar.r2","mac2313:ch3.dpolar.jac","mac2313:ch3.dpolar.odd","mac2313:ch3.dpolar.theta"],"candidate":null,"sources":[{"title":"OpenStax Calculus Vol. 3, §5.3 Double integrals in polar coordinates","url":"https://openstax.org/books/calculus-volume-3/pages/5-3-double-integrals-in-polar-coordinates","why":"Where the r comes from, then regions between curves.","level":"Intro"},{"title":"MIT 18.02SC, Part A: Double integrals","url":"https://ocw.mit.edu/courses/18-02sc-multivariable-calculus-fall-2010/pages/3.-double-integrals-and-line-integrals-in-the-plane/part-a-double-integrals/","why":"Includes the polar change of variables in the same unit.","level":"Course level"}]},{"id":"polarization","title":"Polarization","subject":"em","courses":["phy2049"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmsup>\u003cmrow>\u003cmi>cos\u003c/mi>\u003cmo>⁡\u003c/mo>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmi>θ\u003c/mi>\u003cmtext>  (Malus)\u003c/mtext>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmn>2\u003c/mn>\u003c/mfrac>\u003c/mstyle>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmtext> (unpolarized in)\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/span>","idea":"The direction of a wave's electric field is its polarization. A polarizer passes the component along its axis, so polarized light loses \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsup>\u003cmrow>\u003cmi>cos\u003c/mi>\u003cmo>⁡\u003c/mo>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmi>θ\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> of its intensity, and unpolarized light loses half. Two crossed polarizers pass nothing, yet a third one between them at 45 degrees lets light through again.","requires":["em-waves"],"labs":[{"course":"phy2049","title":"Polarization","href":"https://flux-study.pages.dev/phy2049/#/phy2049/e6/polar","notes":"https://flux-study.pages.dev/phy2049/#/phy2049/e6/polar?n=s15","note":"Chains of polarizers, including the third filter that brings the light back."}],"problems":["phy2049:e6.56.malus-two","phy2049:e6.56.malus-three","phy2049:e6.56.polarized-in"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 3, §1.7 Polarization","url":"https://openstax.org/books/university-physics-volume-3/pages/1-7-polarization","why":"Malus’s law, then polarization by reflection and scattering.","level":"Intro"},{"title":"Feynman Lectures Vol. I, Ch. 33: Polarization","url":"https://www.feynmanlectures.caltech.edu/I_33.html","why":"Why the sky and reflections come out polarized.","level":"Deeper"}]},{"id":"polymers","title":"Polymers","subject":"matsci","courses":["ema3010"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtext>DP\u003c/mtext>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmover accent=\"true\">\u003cmi>M\u003c/mi>\u003cmo>ˉ\u003c/mo>\u003c/mover>\u003cmi>n\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmtext>repeat\u003c/mtext>\u003c/msub>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmover accent=\"true\">\u003cmi>M\u003c/mi>\u003cmo>ˉ\u003c/mo>\u003c/mover>\u003cmi>n\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmo>∑\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>M\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A polymer is a long chain of repeat units, covalent along the chain and held to its neighbours only by weak secondary bonds. Those weak bonds decide its behaviour: below the glass transition the chains are frozen and the plastic is stiff, above it they slide and it turns rubbery. Thermoplastics soften and reflow when heated; thermosets have covalent crosslinks between chains and char instead. Longer chains and more crystalline packing raise strength.","requires":["atomic-bonding"],"labs":[],"problems":[],"candidate":"Heat a polymer through its glass transition and watch stiffness fall by orders of magnitude over a few degrees. It corrects the idea that plastics melt at one sharp temperature, like metals.","sources":[{"title":"MIT 3.091, Recitation 25: Polymers","url":"https://ocw.mit.edu/courses/3-091-introduction-to-solid-state-chemistry-fall-2018/resources/mit3_091f18_rec25/","why":"Chain structure, molecular weight and degree of polymerization, worked.","level":"Course level"},{"title":"Glass transition (Wikipedia)","url":"https://en.wikipedia.org/wiki/Glass_transition","why":"What changes at Tg and why it is a range, not a melting point.","level":"Course level"}]},{"id":"pressure-vessels","title":"Thin-walled pressure vessels","subject":"materials","courses":["egn3331"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>σ\u003c/mi>\u003cmtext>hoop\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>p\u003c/mi>\u003cmi>r\u003c/mi>\u003c/mrow>\u003cmi>t\u003c/mi>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>σ\u003c/mi>\u003cmtext>long\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>p\u003c/mi>\u003cmi>r\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>σ\u003c/mi>\u003cmtext>sphere\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>p\u003c/mi>\u003cmi>r\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Cut a thin closed cylinder along its length and the pressure on the cut half must be held by the two walls: that gives the hoop stress. Cut it across and the end cap's push gives the longitudinal stress, half as large. A sphere is the same in every direction, so it needs half the wall of a cylinder for the same pressure.","requires":["stress-on-a-section","pressure"],"labs":[{"course":"egn3331","title":"Thin-walled vessel","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u4/vessel","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u4/vessel?n=s1","note":"A closed cylinder against a sphere at the same pressure and wall."},{"course":"egn3331","title":"Propane cylinder","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u4/tank","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u4/tank?n=s3","note":"A 20 lb propane cylinder at its service pressure."}],"problems":["egn3331:u4.8.cylinder","egn3331:u4.8.sphere","egn3331:u4.8.allow","egn3331:u4.8.which","egn3331:u4.8.scale","egn3331:u4.10.tank-gauge","egn3331:u4.8.tank-english"],"candidate":null,"sources":[{"title":"MIT 2.001, Lecture 14: Thin-walled pressure vessels","url":"https://ocw.mit.edu/courses/2-001-mechanics-materials-i-fall-2006/resources/lec14/","why":"Hoop and axial stress from free-body cuts.","level":"Course level"},{"title":"MIT 3.11, calendar: Pressure vessel stresses and deformations (10)","url":"https://ocw.mit.edu/courses/3-11-mechanics-of-materials-fall-1999/pages/calendar/","why":"Where the course’s reading treats vessels, including deformation.","level":"Deeper"}]},{"id":"pressure","title":"Pressure and manometers","subject":"fluids","courses":["eml3100","phy2048","eml3015"],"eq":"\u003cspan class=\"katex\">\u003cmath xml
