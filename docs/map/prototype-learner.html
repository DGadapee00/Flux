ttps://flux-study.pages.dev/map2302/#/map2302/u1/exact-substitution?n=s12","note":"A level curve of the potential, with RK4 on the slope equation landing on the same level."}],"problems":["map2302:u1.exact-level","map2302:u1.factor-solve","map2302:u1.homogeneous","map2302:u1.bernoulli"],"candidate":null,"sources":[{"title":"Lebl, Notes on Diffy Qs, §1.8 Exact equations","url":"https://www.jirka.org/diffyqs/","why":"The course’s book: the test, the potential and integrating factors.","level":"Course level"},{"title":"MIT 18.02SC, Identifying gradient fields and exact differentials","url":"https://ocw.mit.edu/courses/18-02sc-multivariable-calculus-fall-2010/resources/mit18_02sc_pb_62_comb/","why":"The same mixed-partials test from the multivariable side.","level":"Intro"}]},{"id":"exergy","title":"Exergy","subject":"thermo","courses":["eml3101"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>ψ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>h\u003c/mi>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>s\u003c/mi>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>+\u003c/mo>\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmn>2\u003c/mn>\u003c/mfrac>\u003c/mstyle>\u003cmsup>\u003cmi>V\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>+\u003c/mo>\u003cmi>g\u003c/mi>\u003cmi>z\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>X\u003c/mi>\u003cmtext>destroyed\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmtext> \u003c/mtext>\u003cmsub>\u003cmi>S\u003c/mi>\u003cmtext>gen\u003c/mtext>\u003c/msub>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>η\u003c/mi>\u003cmrow>\u003cmi>I\u003c/mi>\u003cmi>I\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>η\u003c/mi>\u003cmsub>\u003cmi>η\u003c/mi>\u003cmtext>rev\u003c/mtext>\u003c/msub>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Energy is conserved, so it cannot measure what a process wastes. Exergy can: it is the most work a stream or a system could give while it comes to equilibrium with the surroundings at \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span> and \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span>. A kilojoule of heat at temperature \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>T\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> carries \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmn>1\u003c/mn>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>T\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> of a kilojoule of exergy, so heat near room temperature is worth little. Every bit of entropy a process generates destroys \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span> times as much exergy. The second-law efficiency compares a device with the best it could do, not with the energy it took in.","requires":["entropy-generation","energy-cv"],"labs":[],"problems":[],"candidate":"Deliver one kilojoule of heat at a slider temperature, from a furnace down to room temperature. It corrects the idea that a kilojoule is a kilojoule: the work it can give falls to zero as its temperature nears the surroundings.","sources":[{"title":"MIT 16.050, calendar: Applications of the second law","url":"https://ocw.mit.edu/courses/16-050-thermal-energy-fall-2002/pages/calendar/","why":"The lectures that turn entropy generation into lost work.","level":"Course level"},{"title":"Cleynen, Engineering Thermodynamics","url":"https://thermodynamicsbook.com/","why":"The free text paired with 16.050 in this repo: the second law applied to real devices.","level":"Course level"},{"title":"Wikipedia, Exergy","url":"https://en.wikipedia.org/wiki/Exergy","why":"Definitions for closed systems and flows, and the link to entropy generation.","level":"Deeper"}]},{"id":"extrema","title":"Critical points and extrema","subject":"calculus","courses":["mac2313"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi mathvariant=\"normal\">∇\u003c/mi>\u003cmi>f\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>𝟎\u003c/mn>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>D\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>f\u003c/mi>\u003cmrow>\u003cmi>x\u003c/mi>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmsub>\u003cmi>f\u003c/mi>\u003cmrow>\u003cmi>y\u003c/mi>\u003cmi>y\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsubsup>\u003cmi>f\u003c/mi>\u003cmrow>\u003cmi>x\u003c/mi>\u003cmi>y\u003c/mi>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/msubsup>\u003c/mrow>\u003c/math>\u003c/span>","idea":"At a peak, a pit or a saddle of a smooth surface, the tangent plane is flat, so the gradient is zero. The second-derivative test sorts them: \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>D\u003c/mi>\u003cmo>&gt;\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003c/math>\u003c/span> with \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsub>\u003cmi>f\u003c/mi>\u003cmrow>\u003cmi>x\u003c/mi>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&gt;\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003c/math>\u003c/span> is a minimum, with \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsub>\u003cmi>f\u003c/mi>\u003cmrow>\u003cmi>x\u003c/mi>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&lt;\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003c/math>\u003c/span> a maximum, and \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>D\u003c/mi>\u003cmo>&lt;\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003c/math>\u003c/span> is a saddle. When \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>D\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003c/math>\u003c/span> the test says nothing.","requires":["gradient"],"labs":[{"course":"mac2313","title":"Extrema","href":"https://flux-study.pages.dev/mac2313/#/mac2313/ch2/extrema","notes":null,"note":"Critical points marked on a surface, with \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi mathvariant=\"normal\">∇\u003c/mi>\u003cmi>f\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> and the Hessian test."}],"problems":["mac2313:ch2.ext.crit","mac2313:ch2.ext.class","mac2313:ch2.ext.D","mac2313:ch2.ext.necessary"],"candidate":null,"sources":[{"title":"OpenStax Calculus Vol. 3, §4.7 Maxima/minima problems","url":"https://openstax.org/books/calculus-volume-3/pages/4-7-maxima-minima-problems","why":"The second-derivative test with every case worked.","level":"Intro"},{"title":"MIT 18.02SC, Part A: Functions of two variables, tangent approximation and optimization","url":"https://ocw.mit.edu/courses/18-02sc-multivariable-calculus-fall-2010/pages/2.-partial-derivatives/part-a-functions-of-two-variables-tangent-approximation-and-optimization/","why":"Optimization problems with full solutions.","level":"Course level"}]},{"id":"failure-theories","title":"Yielding and fracture","subject":"materials","courses":["egn3331"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>σ\u003c/mi>\u003cmtext>vM\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsqrt>\u003cmrow>\u003cmsubsup>\u003cmi>σ\u003c/mi>\u003cmn>1\u003c/mn>\u003cmn>2\u003c/mn>\u003c/msubsup>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>σ\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmsub>\u003cmi>σ\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsubsup>\u003cmi>σ\u003c/mi>\u003cmn>2\u003c/mn>\u003cmn>2\u003c/mn>\u003c/msubsup>\u003c/mrow>\u003c/msqrt>\u003cmo>≤\u003c/mo>\u003cmsub>\u003cmi>σ\u003c/mi>\u003cmi>Y\u003c/mi>\u003c/msub>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>τ\u003c/mi>\u003cmtext>max\u003c/mtext>\u003c/msub>\u003cmo>≤\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>σ\u003c/mi>\u003cmi>Y\u003c/mi>\u003c/msub>\u003cmn>2\u003c/mn>\u003c/mfrac>\u003cmtext> (Tresca)\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A ductile metal yields when shear distortion is large enough, so Tresca and von Mises compare a combined stress with the tension-test yield. A brittle metal breaks when the largest tension is large enough, so it fails on a different plane. Twist a steel bar and it shears straight across; twist cast iron and it snaps on a 45 degree helix.","requires":["stress-transformation"],"labs":[{"course":"egn3331","title":"Cast iron or steel","href":"https://flux-study.pages.dev/egn3331/#/egn3331/u5/fracture","notes":"https://flux-study.pages.dev/egn3331/#/egn3331/u5/fracture?n=s8","note":"Gray iron against steel in torsion: different planes, different rules."}],"problems":[],"candidate":null,"sources":[{"title":"MIT 2.001, Lecture 17: Failure of materials and examples","url":"https://ocw.mit.edu/courses/2-001-mechanics-materials-i-fall-2006/resources/lec17/","why":"Tresca, von Mises and brittle criteria with examples.","level":"Course level"},{"title":"MIT 2.001, Lecture 16: Stress and strain transformations","url":"https://ocw.mit.edu/courses/2-001-mechanics-materials-i-fall-2006/resources/lec16/","why":"The principal stresses the criteria are written in.","level":"Course level"}]},{"id":"faraday","title":"Magnetic flux and Faraday’s law","subject":"em","courses":["phy2049"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi mathvariant=\"script\">E\u003c/mi>\u003cmo>=\u003c/mo>\u003cmo>−\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmsub>\u003cmi mathvariant=\"normal\">Φ\u003c/mi>\u003cmi>B\u003c/mi>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi mathvariant=\"normal\">Φ\u003c/mi>\u003cmi>B\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmo>∬\u003c/mo>\u003cmi>S\u003c/mi>\u003c/msub>\u003cmi>𝐁\u003c/mi>\u003cmo>⋅\u003c/mo>\u003cmi>d\u003c/mi>\u003cmi>𝐀\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Magnetic flux through a loop is the same surface integral, applied to \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>𝐁\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. A changing flux drives an emf around the loop. The minus sign says the induced current opposes the change. Through any closed surface, magnetic flux is zero.","requires":["surface-flux","magnetic-force"],"labs":[{"course":"phy2049","title":"Faraday","href":"https://flux-study.pages.dev/phy2049/#/phy2049/e5/faraday","notes":"https://flux-study.pages.dev/phy2049/#/phy2049/e5/faraday?n=s2","note":"Changing flux through a loop and the emf it drives, from a moving magnet to a generator."},{"course":"phy2049","title":"Flow meter","href":"https://flux-study.pages.dev/phy2049/#/phy2049/e5/flowmeter","notes":"https://flux-study.pages.dev/phy2049/#/phy2049/e5/flowmeter?n=s12","note":"An electromagnetic flow meter: the fluid's ions part across the pipe until \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>V\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>B\u003c/mi>\u003cmi>d\u003c/mi>\u003cmi>v\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>."}],"problems":["phy2049:e5.48.flux","phy2049:e5.48.changing-B","phy2049:e5.48.bar","phy2049:e5.48.lenz","phy2049:e5.48.expanding","phy2049:e5.48.rotate-avg","phy2049:e5.50.motor","phy2049:e5.50.generator","phy2049:e5.51.applications","phy2049:e5.51.flow-meter"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 2, §13.1 Faraday’s law","url":"https://openstax.org/books/university-physics-volume-2/pages/13-1-faradays-law","why":"Covers the three ways to change flux: field, area and angle.","level":"Intro"},{"title":"PhET: Faraday’s law","url":"https://phet.colorado.edu/en/simulations/faradays-law","why":"Move a magnet through a coil and watch the bulb. Good intuition before the math.","level":"Intro"}]},{"id":"fatigue","title":"Fatigue","subject":"matsci","courses":["ema3010"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>σ\u003c/mi>\u003cmi>a\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsubsup>\u003cmi>σ\u003c/mi>\u003cmi>f\u003c/mi>\u003cmo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′\u003c/mo>\u003c/msubsup>\u003cmtext> \u003c/mtext>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmn>2\u003c/mn>\u003cmsub>\u003cmi>N\u003c/mi>\u003cmi>f\u003c/mi>\u003c/msub>\u003cmsup>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmi>b\u003c/mi>\u003c/msup>\u003cmtext> (Basquin)\u003c/mtext>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmfrac>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>a\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>N\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmi>C\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmi>K\u003c/mi>\u003cmsup>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmi>m\u003c/mi>\u003c/msup>\u003cmtext> (Paris)\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A load far below yield, repeated enough times, still breaks parts. Cracks start at notches and surface flaws, where stress concentrates, and grow a little each cycle. The S–N curve gives life against stress amplitude; some steels show an endurance limit below which they last indefinitely. The Paris law integrates crack growth per cycle until the crack reaches the critical length set by the fracture toughness, which is how inspection intervals are set.","requires":["fracture-toughness","stress-concentration"],"labs":[],"problems":[],"candidate":"Cycle a cracked part and grow the crack by the Paris law until it reaches the critical length. It corrects the idea that a load below yield is safe forever.","sources":[{"title":"Fatigue (material) (Wikipedia)","url":"https://en.wikipedia.org/wiki/Fatigue_(material)","why":"S–N curves, endurance limits and the stages of fatigue cracking.","level":"Course level"},{"title":"Paris’ law (Wikipedia)","url":"https://en.wikipedia.org/wiki/Paris%27_law","why":"Crack growth per cycle and how it is integrated to a life.","level":"Deeper"}]},{"id":"filters","title":"Frequency response and filters","subject":"circuits","courses":["eel3111"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>H\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>j\u003c/mi>\u003cmi>ω\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>𝐕\u003c/mi>\u003cmtext>out\u003c/mtext>\u003c/msub>\u003cmsub>\u003cmi>𝐕\u003c/mi>\u003cmtext>in\u003c/mtext>\u003c/msub>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmrow>\u003cmn>1\u003c/mn>\u003cmo>+\u003c/mo>\u003cmi>j\u003c/mi>\u003cmi>ω\u003c/mi>\u003cmi>R\u003c/mi>\u003cmi>C\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>ω\u003c/mi>\u003cmi>c\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmrow>\u003cmi>R\u003c/mi>\u003cmi>C\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"1em\"/>\u003cmi mathvariant=\"normal\">∣\u003c/mi>\u003cmi>H\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>j\u003c/mi>\u003cmsub>\u003cmi>ω\u003c/mi>\u003cmi>c\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmi mathvariant=\"normal\">∣\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmsqrt>\u003cmn>2\u003c/mn>\u003c/msqrt>\u003c/mfrac>\u003cmtext> \u003c/mtext>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmo>−\u003c/mo>\u003cmn>3\u003c/mn>\u003cmtext> dB\u003c/mtext>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>Q\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>ω\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmrow>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmi>ω\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Divide the output phasor by the input phasor and you get the circuit's frequency response \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>H\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>j\u003c/mi>\u003cmi>ω\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/math>\u003c/span>: a gain and a phase at each frequency. An RC divider passes slow signals and cuts fast ones, a low-pass filter; swap the parts and it is high-pass. At the corner frequency the gain is \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmn>1\u003c/mn>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmsqrt>\u003cmn>2\u003c/mn>\u003c/msqrt>\u003c/mrow>\u003c/math>\u003c/span>; well past it, one RC stage's gain falls tenfold for each tenfold rise in frequency. An RLC can pass a narrow band around \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsub>\u003cmi>ω\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span>, with a sharpness set by \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>Q\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. Plotted on log axes as a Bode plot, these curves become nearly straight lines.","requires":["impedance-analysis"],"labs":[],"problems":[],"candidate":"Pass a square wave through an RC low-pass filter with a slider for the corner frequency. It corrects the idea that a filter only weakens a signal: it reshapes it, because each harmonic is cut and delayed by a different amount.","sources":[{"title":"MIT 6.002, calendar: Lecture 20, filters, Q factor, radio tuner","url":"https://ocw.mit.edu/courses/6-002-circuits-and-electronics-spring-2007/pages/calendar/","why":"Filters and \\(Q\\) through the example of a radio tuner.","level":"Course level"},{"title":"Kuphaldt, Lessons in Electric Circuits, Vol. II: AC","url":"https://www.allaboutcircuits.com/textbook/alternating-current/","why":"Its filters chapter covers low-pass, high-pass, band-pass and resonant filters.","level":"Intro"}]},{"id":"fins","title":"Fins","subject":"heat","courses":["eml4140"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmfrac>\u003cmrow>\u003cmsup>\u003cmi>d\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmi>θ\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmsup>\u003cmi>x\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/mfrac>\u003cmo>−\u003c/mo>\u003cmsup>\u003cmi>m\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmi>θ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>0\u003c/mn>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"1em\"/>\u003cmi>m\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsqrt>\u003cmfrac>\u003cmrow>\u003cmi>h\u003c/mi>\u003cmi>P\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>k\u003c/mi>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmi>c\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003c/msqrt>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>q\u003c/mi>\u003cmtext>fin\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsqrt>\u003cmrow>\u003cmi>h\u003c/mi>\u003cmi>P\u003c/mi>\u003cmi>k\u003c/mi>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmi>c\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msqrt>\u003cmtext>  \u003c/mtext>\u003cmsub>\u003cmi>θ\u003c/mi>\u003cmi>b\u003c/mi>\u003c/msub>\u003cmi>tanh\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>m\u003c/mi>\u003cmi>L\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A fin conducts heat along its length and loses it from its sides, so its temperature falls toward the tip. An energy balance on a thin slice gives a second-order equation with the characteristic roots \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmo>±\u003c/mo>\u003cmi>m\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>, real this time, so the solution is made of \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>cosh\u003c/mi>\u003cmo>⁡\u003c/mo>\u003c/mrow>\u003c/math>\u003c/span> and \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>sinh\u003c/mi>\u003cmo>⁡\u003c/mo>\u003c/mrow>\u003c/math>\u003c/span>. The parameter \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>m\u003c/mi>\u003cmi>L\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> compares side losses with conduction along the fin. Past \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>m\u003c/mi>\u003cmi>L\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> of about 2 the far end is near the fluid temperature and adds almost nothing. A fin helps only when its conduction resistance is small next to the surface film it replaces.","requires":["thermal-resistance","damped-oscillator"],"labs":[],"problems":[],"candidate":"A pin fin with sliders for length and material, the temperature along it drawn. It corrects the idea that a longer fin always sheds more heat: past \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>m\u003c/mi>\u003cmi>L\u003c/mi>\u003cmo>≈\u003c/mo>\u003cmn>2\u003c/mn>\u003c/mrow>\u003c/math>\u003c/span> it adds almost nothing, and a plastic fin can lose less than the bare wall.","sources":[{"title":"Lienhard, A Heat Transfer Textbook","url":"https://ahtt.mit.edu","why":"Chapter 4 derives the fin equation and gives efficiency for the common shapes.","level":"Course level"},{"title":"MIT 2.51, calendar: Fins (session 4)","url":"https://ocw.mit.edu/courses/2-51-intermediate-heat-and-mass-transfer-fall-2008/pages/calendar/","why":"Fins follow resistances directly in the course.","level":"Course level"},{"title":"Wikipedia, Fin (extended surface)","url":"https://en.wikipedia.org/wiki/Fin_(extended_surface)","why":"Fin efficiency and effectiveness, with real uses from radiators to CPUs.","level":"Intro"}]},{"id":"first-law-closed","title":"First law for a closed system","subject":"thermo","courses":["eml3100"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmi>U\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>Q\u003c/mi>\u003cmo>−\u003c/mo>\u003cmi>W\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmi>u\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>c\u003c/mi>\u003cmi>v\u003c/mi>\u003c/msub>\u003cmtext> \u003c/mtext>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmi>T\u003c/mi>\u003cmtext> (ideal gas)\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Heat and work are two ways energy crosses a boundary, and the energy inside changes by what comes in minus what goes out. With heat in and work out both counted positive, \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmi>U\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>Q\u003c/mi>\u003cmo>−\u003c/mo>\u003cmi>W\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. For an ideal gas the internal energy depends on temperature alone; for steam, read it from the tables.","requires":["boundary-work","phases"],"labs":[{"course":"eml3100","title":"Energy balance","href":"https://flux-study.pages.dev/eml3100/#/eml3100/u2/balance","notes":"https://flux-study.pages.dev/eml3100/#/eml3100/u2/balance?n=s1","note":"Paddle work and heat into air under one sign rule, and a motor driving a pump."},{"course":"eml3100","title":"Boundary work","href":"https://flux-study.pages.dev/eml3100/#/eml3100/u2/piston","notes":"https://flux-study.pages.dev/eml3100/#/eml3100/u2/piston?n=s5","note":"Steam in a piston: work from the path, heat from the first law and the tables."},{"course":"eml3100","title":"Boiling on a coil","href":"https://flux-study.pages.dev/eml3100/#/eml3100/u2/kettle","notes":null,"note":"A covered pot on a coil burner: the heat is m Δh and the time is that heat over the power in."}],"problems":["eml3100:u2.4.paddle-balance","eml3100:u2.4.chain","eml3100:u2.4.which-energy","eml3100:u2.4.series","eml3100:u2.4.work-isobaric","eml3100:u2.4.work-isothermal","eml3100:u2.4.work-polytropic","eml3100:u2.4.steam-piston","eml3100:u2.4.sign","eml3100:u2.4.exponent"],"candidate":null,"sources":[{"title":"Yan, Introduction to Engineering Thermodynamics, §4.4 The first law for closed systems","url":"https://pressbooks.bccampus.ca/thermo1/","why":"The course’s own book, with the same sign convention as the lab.","level":"Course level"},{"title":"OpenStax University Physics Vol. 2, §3.3 First law of thermodynamics","url":"https://openstax.org/books/university-physics-volume-2/pages/3-3-first-law-of-thermodynamics","why":"The law stated as energy bookkeeping, with worked cycles.","level":"Intro"}]},{"id":"first-order-circuits","title":"First-order circuits and switching","subject":"circuits","courses":["eel3111"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>t\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi mathvariant=\"normal\">∞\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>+\u003c/mo>\u003cmo fence=\"false\" stretchy=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">[\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsup>\u003cmn>0\u003c/mn>\u003cmo>+\u003c/mo>\u003c/msup>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>−\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi mathvariant=\"normal\">∞\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo fence=\"false\" stretchy=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">]\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmsup>\u003cmi>e\u003c/mi>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmi>t\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>τ\u003c/mi>\u003c/mrow>\u003c/msup>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>τ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmtext>th\u003c/mtext>\u003c/msub>\u003cmi>C\u003c/mi>\u003cmtext>  or  \u003c/mtext>\u003cmfrac>\u003cmi>L\u003c/mi>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmtext>th\u003c/mtext>\u003c/msub>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Any circuit with one capacitor or one inductor, after a switch moves, relaxes exponentially from its start to its final value. Replace the rest of the circuit with its Thévenin equivalent and the time constant is \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmtext>th\u003c/mtext>\u003c/msub>\u003cmi>C\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> or \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>L\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmtext>th\u003c/mtext>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span>. A capacitor's voltage and an inductor's current cannot jump, so they carry over the switching instant and fix \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsup>\u003cmn>0\u003c/mn>\u003cmo>+\u003c/mo>\u003c/msup>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/math>\u003c/span>. In steady DC a capacitor acts as a break and an inductor as a wire, which gives \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi mathvariant=\"normal\">∞\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/math>\u003c/span>. Opening an inductor's circuit fast forces a large voltage, which is why a relay coil needs a flyback diode.","requires":["rc-circuits","inductance","thevenin-norton"],"labs":[],"problems":[],"candidate":"Switch an RC and an RL circuit that each have several resistors, and mark the time constant. It corrects the idea that \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>τ\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> uses the source’s resistor alone: it uses the Thévenin resistance the capacitor or coil sees, which changes when the switch moves.","sources":[{"title":"MIT 6.002, calendar: Lectures 13 and 14, first-order circuits","url":"https://ocw.mit.edu/courses/6-002-circuits-and-electronics-spring-2007/pages/calendar/","why":"Capacitors and inductors, step responses and the intuitive method.","level":"Course level"},{"title":"OpenStax University Physics Vol. 2, §14.4 RL circuits","url":"https://openstax.org/books/university-physics-volume-2/pages/14-4-rl-circuits","why":"The RL rise and decay beside the RC case the map already has.","level":"Intro"}]},{"id":"first-order-models","title":"First-order balance models","subject":"diffeq","courses":["map2302"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsup>\u003cmi>T\u003c/mi>\u003cmo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′\u003c/mo>\u003c/msup>\u003cmo>=\u003c/mo>\u003cmi>K\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>M\u003c/mi>\u003cmo>−\u003c/mo>\u003cmi>T\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>+\u003c/mo>\u003cmi>H\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"1em\"/>\u003cmi>m\u003c/mi>\u003cmsup>\u003cmi>v\u003c/mi>\u003cmo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′\u003c/mo>\u003c/msup>\u003cmo>=\u003c/mo>\u003cmi>m\u003c/mi>\u003cmi>g\u003c/mi>\u003cmo>−\u003c/mo>\u003cmi>c\u003c/mi>\u003cmsup>\u003cmi>v\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A first-order model is a balance written with units: rate of change equals what comes in minus what goes out. Tanks in series pass solute downstream, so the second tank rises, peaks and drains. A building follows a daily outdoor cycle with a smaller swing and a lag, the sinusoidal response of a first-order equation. A falling body balances weight against drag and approaches a terminal speed.","requires":["first-order-odes","sinusoidal-response"],"labs":[{"course":"map2302","title":"Tanks, buildings and falls","href":"https://flux-study.pages.dev/map2302/#/map2302/u1/first-order-models","notes":"https://flux-study.pages.dev/map2302/#/map2302/u1/first-order-models?n=s14","note":"Two tanks, a heated building on a daily cycle, and falls with linear and quadratic drag."},{"course":"phy2048","title":"Drag","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u3/drag","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u3/drag?n=s11","note":"The same drag balance from the physics side, with terminal speeds."}],"problems":["map2302:u1.two-tanks","map2302:u1.building","map2302:u1.drag","phy2048:ch6.concept-terminal"],"candidate":null,"sources":[{"title":"Lebl, Notes on Diffy Qs, §1.4 Linear equations and the integrating factor","url":"https://www.jirka.org/diffyqs/","why":"Mixing problems solved with an integrating factor.","level":"Course level"},{"title":"MIT 18.03SC, First order constant coefficient linear ODEs","url":"https://ocw.mit.edu/courses/18-03sc-differential-equations-fall-2011/pages/unit-i-first-order-differential-equations/first-order-constant-coefficient-linear-odes/","why":"Models with constant rates and their response to inputs.","level":"Course level"}]},{"id":"first-order-odes","title":"First-order equations and slope fields","subject":"diffeq","courses":["map2302"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsup>\u003cmi>y\u003c/mi>\u003cmo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′\u003c/mo>\u003c/msup>\u003cmo>=\u003c/mo>\u003cmi>f\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>t\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsup>\u003cmi>y\u003c/mi>\u003cmo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′\u003c/mo>\u003c/msup>\u003cmo>+\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>t\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmi>y\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>q\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>t\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmtext>  \u003c/mtext>\u003cmo>⇒\u003c/mo>\u003cmtext>  \u003c/mtext>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>μ\u003c/mi>\u003cmi>y\u003c/mi>\u003cmsup>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′\u003c/mo>\u003c/msup>\u003cmo>=\u003c/mo>\u003cmi>μ\u003c/mi>\u003cmi>q\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmtext>  \u003c/mtext>\u003cmi>μ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsup>\u003cmi>e\u003c/mi>\u003cmrow>\u003cmo>∫\u003c/mo>\u003cmi>p\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A differential equation gives the slope of its solution at every point, so it can be drawn as a field of short tangents before anything is solved. A solution follows the field. Separable equations split into two integrals; linear ones yield to an integrating factor. Existence and uniqueness need conditions: \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsup>\u003cmi>y\u003c/mi>\u003cmo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′\u003c/mo>\u003c/msup>\u003cmo>=\u003c/mo>\u003cmn>2\u003c/mn>\u003cmsqrt>\u003cmrow>\u003cmi mathvariant=\"normal\">∣\u003c/mi>\u003cmi>y\u003c/mi>\u003cmi mathvariant=\"normal\">∣\u003c/mi>\u003c/mrow>\u003c/msqrt>\u003c/mrow>\u003c/math>\u003c/span> has more than one solution through zero.","requires":["fundamental-theorem"],"labs":[{"course":"map2302","title":"Slope field","href":"https://flux-study.pages.dev/map2302/#/map2302/u1/slope-field","notes":"https://flux-study.pages.dev/map2302/#/map2302/u1/slope-field?n=s1","note":"Slope fields with solutions drawn through them, including one that is not unique."}],"problems":["map2302:u1.accumulate","map2302:u1.integral","map2302:u1.blowup","map2302:u1.separate","map2302:u1.affine","map2302:u1.variable-factor","map2302:u1.mixing","map2302:u1.finite-growth"],"candidate":null,"sources":[{"title":"Lebl, Notes on Diffy Qs, §1.2 Slope fields","url":"https://www.jirka.org/diffyqs/html/slopefields_section.html","why":"The course’s own book: fields, existence and uniqueness.","level":"Course level"},{"title":"MIT 18.03SC, Solution by integrating factors","url":"https://ocw.mit.edu/courses/18-03sc-differential-equations-fall-2011/pages/unit-i-first-order-differential-equations/solution-by-integrating-factors/","why":"The integrating factor worked on video, with checked problems.","level":"Course level"}]},{"id":"floating-point","title":"Floating point and round-off","subject":"numerics","courses":["egn3203"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi mathvariant=\"normal\">fl\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmi>x\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>+\u003c/mo>\u003cmi>δ\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"1em\"/>\u003cmi mathvariant=\"normal\">∣\u003c/mi>\u003cmi>δ\u003c/mi>\u003cmi mathvariant=\"normal\">∣\u003c/mi>\u003cmo>≤\u003c/mo>\u003cmi>u\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsup>\u003cmn>2\u003c/mn>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmn>53\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmo>≈\u003c/mo>\u003cmn>1.1\u003c/mn>\u003cmo>×\u003c/mo>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmn>16\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmn>1\u003c/mn>\u003cmo>−\u003c/mo>\u003cmi>cos\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>2\u003c/mn>\u003cmsup>\u003cmrow>\u003cmi>sin\u003c/mi>\u003cmo>⁡\u003c/mo>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmfrac>\u003cmi>x\u003c/mi>\u003cmn>2\u003c/mn>\u003c/mfrac>\u003c/mstyle>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A computer stores a real number in binary with a fixed count of significant digits, about 16 decimal digits in double precision. Each stored number and each operation can be off by a relative amount up to the unit round-off \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>u\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. Most of the time that is far too small to matter. Subtracting two nearly equal numbers is the exception: the leading digits cancel and the round-off left behind becomes most of the answer. The fix is to rewrite the formula so it never subtracts close numbers, as \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmn>2\u003c/mn>\u003cmsup>\u003cmrow>\u003cmi>sin\u003c/mi>\u003cmo>⁡\u003c/mo>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmn>2\u003c/mn>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/math>\u003c/span> does for \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmn>1\u003c/mn>\u003cmo>−\u003c/mo>\u003cmi>cos\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>.","requires":[],"labs":[],"problems":[],"candidate":"Evaluate \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>−\u003c/mo>\u003cmi>cos\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmsup>\u003cmi>x\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span> as \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> shrinks, written directly and as \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmn>2\u003c/mn>\u003cmsup>\u003cmrow>\u003cmi>sin\u003c/mi>\u003cmo>⁡\u003c/mo>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmn>2\u003c/mn>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmsup>\u003cmi>x\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span>. It corrects the idea that a computer’s answer is good to 16 digits: the direct form loses every digit near \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>x\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmn>8\u003c/mn>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span>, while the true value is \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmn>1\u003c/mn>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmn>2\u003c/mn>\u003c/mrow>\u003c/math>\u003c/span>.","sources":[{"title":"Yano, Penn, Konidaris and Patera, Math, Numerics, and Programming (for Mechanical Engineers)","url":"https://ocw.mit.edu/courses/2-086-numerical-computation-for-mechanical-engineers-spring-2013/resources/mit2_086s13_textbook/","why":"The text written for MIT 2.086; it treats floating point where it first meets programs.","level":"Course level"},{"title":"Wikipedia, Floating-point arithmetic","url":"https://en.wikipedia.org/wiki/Floating-point_arithmetic","why":"The IEEE 754 formats, rounding and the classic cancellation cases.","level":"Deeper"}]},{"id":"floating-stability","title":"Stability of floating bodies","subject":"fluids","courses":["eml3015"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmover accent=\"true\">\u003cmrow>\u003cmi>G\u003c/mi>\u003cmi>M\u003c/mi>\u003c/mrow>\u003cmo stretchy=\"true\">‾\u003c/mo>\u003c/mover>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmtext>wp\u003c/mtext>\u003c/msub>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>sub\u003c/mtext>\u003c/msub>\u003c/mfrac>\u003cmo>−\u003c/mo>\u003cmover accent=\"true\">\u003cmrow>\u003cmi>B\u003c/mi>\u003cmi>G\u003c/mi>\u003c/mrow>\u003cmo stretchy=\"true\">‾\u003c/mo>\u003c/mover>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmover accent=\"true\">\u003cmrow>\u003cmi>G\u003c/mi>\u003cmi>M\u003c/mi>\u003c/mrow>\u003cmo stretchy=\"true\">‾\u003c/mo>\u003c/mover>\u003cmo>&gt;\u003c/mo>\u003cmn>0\u003c/mn>\u003cmtext> (stable)\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Buoyancy acts at B, the centroid of the displaced water, and weight acts at G. Tilt a floating body and the displaced shape changes, so B moves toward the side that went down. The new buoyancy line crosses the centre line at the metacentre M. If M is above G, the pair of forces turns the body back upright. The width of the waterline sets how far B moves, through its area moment of inertia.","requires":["buoyancy","centroids","moments"],"labs":[],"problems":[],"candidate":"Tilt a floating block and watch B swing toward the low side. It corrects the idea that a body floats upright only if G sits below B: a ship floats with G above B, as long as the metacentre is higher still.","sources":[{"title":"MIT 2.06, calendar: Lecture 2, buoyancy forces on surfaces","url":"https://ocw.mit.edu/courses/2-06-fluid-dynamics-spring-2013/pages/calendar/","why":"Buoyancy as the net pressure force on a closed surface, the step before stability.","level":"Course level"},{"title":"Wikipedia, Metacentric height","url":"https://en.wikipedia.org/wiki/Metacentric_height","why":"The metacentre and the righting arm, with the ship-design view of GM.","level":"Intro"}]},{"id":"flux-2d","title":"Flux across a curve","subject":"calculus","courses":["mac2313"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtext>Flux\u003c/mtext>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmo>∮\u003c/mo>\u003cmi>C\u003c/mi>\u003c/msub>\u003cmi>𝐅\u003c/mi>\u003cmo>⋅\u003c/mo>\u003cmover accent=\"true\">\u003cmi>n\u003c/mi>\u003cmo>^\u003c/mo>\u003c/mover>\u003cmtext>  \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>s\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Flux counts how much of a field crosses a curve, with outward taken as positive. Only the normal part of \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>𝐅\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> counts; the part along the curve slides past. Green's theorem in normal form turns flux out of a closed curve into an area integral of \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmi>P\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmi>x\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmi>Q\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmi>y\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. That integrand is the divergence in two dimensions.","requires":["vector-fields"],"labs":[],"problems":[],"candidate":"A 2D field with a loop you drag and reshape. The flux readout and the area integral of the divergence inside agree.","sources":[{"title":"MIT 18.02SC, Session 69: Flux across curves (problems with solutions)","url":"https://ocw.mit.edu/courses/18-02sc-multivariable-calculus-fall-2010/resources/mit18_02sc_pb_69_comb/","why":"Practice setting up n̂ ds, the step most people get wrong.","level":"Course level"},{"title":"MIT 18.02SC, Part C: Green’s theorem","url":"https://ocw.mit.edu/courses/18-02sc-multivariable-calculus-fall-2010/pages/3.-double-integrals-and-line-integrals-in-the-plane/part-c-greens-theorem/","why":"Covers both forms of Green’s theorem, including the flux (normal) form used here.","level":"Course level"}]},{"id":"forced-resonance","title":"Forced response and resonance","subject":"diffeq","courses":["map2302","phy2048"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>p\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmsqrt>\u003cmrow>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>k\u003c/mi>\u003cmo>−\u003c/mo>\u003cmi>m\u003c/mi>\u003cmsup>\u003cmi>ω\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmsup>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>+\u003c/mo>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>c\u003c/mi>\u003cmi>ω\u003c/mi>\u003cmsup>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/msqrt>\u003c/mfrac>\u003cmi>cos\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>ω\u003c/mi>\u003cmi>t\u003c/mi>\u003cmo>−\u003c/mo>\u003cmi>ϕ\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>ω\u003c/mi>\u003cmtext>peak\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsqrt>\u003cmrow>\u003cmfrac>\u003cmi>k\u003c/mi>\u003cmi>m\u003c/mi>\u003c/mfrac>\u003cmo>−\u003c/mo>\u003cmfrac>\u003cmsup>\u003cmi>c\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmsup>\u003cmi>m\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/msqrt>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A forced oscillator settles into the input's frequency with a gain that depends on how close it is to the natural one. With no damping, driving at the natural frequency grows without bound. With damping, the peak moves below the natural frequency, and with enough damping it vanishes. A sharp peak also means a slow build-up and a long ring-down.","requires":["damped-oscillator","sinusoidal-response"],"labs":[{"course":"map2302","title":"Forced response","href":"https://flux-study.pages.dev/map2302/#/map2302/u2/resonance","notes":"https://flux-study.pages.dev/map2302/#/map2302/u2/resonance?n=s3","note":"Sweep the drive frequency: natural frequency, gain peak and transient growth are three things."},{"course":"map2302","title":"Car suspension","href":"https://flux-study.pages.dev/map2302/#/map2302/u2/suspension","notes":"https://flux-study.pages.dev/map2302/#/map2302/u2/suspension?n=s8","note":"A car body over a bump and a rough road, driven through its spring and shock."},{"course":"map2302","title":"Radio clock tuner","href":"https://flux-study.pages.dev/map2302/#/map2302/u3/radio-tuner","notes":"https://flux-study.pages.dev/map2302/#/map2302/u3/radio-tuner?n=s11","note":"A radio clock tuned to 60 kHz: a narrower band takes longer to build and to fade."},{"course":"phy2048","title":"Resonance","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u11/resonance","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u11/resonance?n=s4","note":"A driven oscillator’s amplitude and phase across the natural frequency."}],"problems":["map2302:u2.exponential-input","map2302:u2.damped-gain","map2302:u2.beats","map2302:u2.real-spring","map2302:u3.radio-tuning","phy2048:ch15.damped","phy2048:ch15.driven","phy2048:ch15.concept-resonance"],"candidate":null,"sources":[{"title":"Lebl, Notes on Diffy Qs, §2.6 Forced oscillations and resonance","url":"https://www.jirka.org/diffyqs/html/forcedo_section.html","why":"Pure and practical resonance from the course’s book.","level":"Course level"},{"title":"MIT 18.03SC, Frequency response and practical resonance","url":"https://ocw.mit.edu/courses/18-03sc-differential-equations-fall-2011/pages/unit-ii-second-order-constant-coefficient-linear-equations/frequency-response-and-practical-resonance/","why":"The gain curve and where its peak sits.","level":"Course level"}]},{"id":"fourier-series","title":"Fourier series","subject":"diffeq","courses":["map2302"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>f\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>t\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>a\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmn>2\u003c/mn>\u003c/mfrac>\u003cmo>+\u003c/mo>\u003cmunder>\u003cmo>∑\u003c/mo>\u003cmrow>\u003cmi>n\u003c/mi>\u003cmo>≥\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/munder>\u003cmo fence=\"false\" stretchy=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">(\u003c/mo>\u003cmsub>\u003cmi>a\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003cmi>cos\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>n\u003c/mi>\u003cmi>t\u003c/mi>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>b\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003cmi>sin\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>n\u003c/mi>\u003cmi>t\u003c/mi>\u003cmo fence=\"false\" stretchy=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">)\u003c/mo>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>a\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmi>π\u003c/mi>\u003c/mfrac>\u003cmsubsup>\u003cmo>∫\u003c/mo>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmi>π\u003c/mi>\u003c/mrow>\u003cmi>π\u003c/mi>\u003c/msubsup>\u003cmi>f\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>t\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmi>cos\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>n\u003c/mi>\u003cmi>t\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A periodic function is a sum of sines and cosines at whole multiples of one frequency. Because those waves are orthogonal, each coefficient is one integral. At a jump the partial sums overshoot by a fixed fraction however many terms are kept. Drive an oscillator with a periodic force and each harmonic is answered separately, so the one nearest resonance can dominate.","requires":["definite-integral","forced-resonance"],"labs":[{"course":"map2302","title":"Fourier synthesis","href":"https://flux-study.pages.dev/map2302/#/map2302/u3/fourier","notes":"https://flux-study.pages.dev/map2302/#/map2302/u3/fourier?n=s1","note":"Add harmonics to a square, ramp and triangle wave; the jump ringing narrows but keeps its height."}],"problems":["map2302:u3.coefficient"],"candidate":null,"sources":[{"title":"Lebl, Notes on Diffy Qs, §4.2 Trigonometric series","url":"https://www.jirka.org/diffyqs/html/ts_section.html","why":"Coefficients from orthogonality, with the square wave worked.","level":"Course level"},{"title":"MIT 18.03SC, Fourier series: basics","url":"https://ocw.mit.edu/courses/18-03sc-differential-equations-fall-2011/pages/unit-iii-fourier-series-and-laplace-transform/fourier-series-basics/","why":"Lectures and problems on computing coefficients.","level":"Course level"}]},{"id":"fourier","title":"Fourier’s law","subject":"heat","courses":["eml4140","eml3100"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsup>\u003cmi>𝐪\u003c/mi>\u003cmrow>\u003cmo mathvariant=\"normal\">′\u003c/mo>\u003cmo mathvariant=\"normal\">′\u003c/mo>\u003c/mrow>\u003c/msup>\u003cmo>=\u003c/mo>\u003cmo>−\u003c/mo>\u003cmi>k\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi mathvariant=\"normal\">∇\u003c/mi>\u003cmi>T\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Heat flux in a solid points down the temperature gradient, at a rate set by the conductivity \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>k\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. Through a flat wall it becomes \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsup>\u003cmi>q\u003c/mi>\u003cmrow>\u003cmo mathvariant=\"normal\">′\u003c/mo>\u003cmo mathvariant=\"normal\">′\u003c/mo>\u003c/mrow>\u003c/msup>\u003cmo>=\u003c/mo>\u003cmi>k\u003c/mi>\u003cmtext> \u003c/mtext>\u003cmi mathvariant=\"normal\">Δ\u003c/mi>\u003cmi>T\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>L\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. This is the vector field of heat transfer: its flux through a surface is the heat rate.","requires":["gradient"],"labs":[{"course":"eml3100","title":"Heat through a wall","href":"https://flux-study.pages.dev/eml3100/#/eml3100/u5/wall","notes":null,"note":"Shows the entropy generated as heat crosses a wall. It does not draw the temperature profile."}],"problems":["eml3100:u5.6.wall","eml3100:u5.6.english","eml3100:u5.6.generation"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 2, §1.6 Mechanisms of heat transfer","url":"https://openstax.org/books/university-physics-volume-2/pages/1-6-mechanisms-of-heat-transfer","why":"Conduction through a slab, with the numbers worked.","level":"Intro"},{"title":"Lienhard, A Heat Transfer Textbook","url":"https://ahtt.mit.edu","why":"The text MIT 2.51 uses. Chapter 1 introduces conduction; chapter 2 builds the equation.","level":"Course level"}]},{"id":"fracture-toughness","title":"Fracture and fracture toughness","subject":"matsci","courses":["ema3010"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>K\u003c/mi>\u003cmi>I\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmi>Y\u003c/mi>\u003cmi>σ\u003c/mi>\u003cmsqrt>\u003cmrow>\u003cmi>π\u003c/mi>\u003cmi>a\u003c/mi>\u003c/mrow>\u003c/msqrt>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmtext>fracture when \u003c/mtext>\u003cmsub>\u003cmi>K\u003c/mi>\u003cmi>I\u003c/mi>\u003c/msub>\u003cmo>≥\u003c/mo>\u003cmsub>\u003cmi>K\u003c/mi>\u003cmrow>\u003cmi>I\u003c/mi>\u003cmi>c\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>a\u003c/mi>\u003cmi>c\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmi>π\u003c/mi>\u003c/mfrac>\u003cmsup>\u003cmrow>\u003cmo fence=\"true\">(\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>K\u003c/mi>\u003cmrow>\u003cmi>I\u003c/mi>\u003cmi>c\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmrow>\u003cmi>Y\u003c/mi>\u003cmi>σ\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo fence=\"true\">)\u003c/mo>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A crack grows when the elastic energy it releases pays for the new surface it makes, so a part with a crack fails below the stress its strength alone would allow. The stress intensity \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsub>\u003cmi>K\u003c/mi>\u003cmi>I\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/span> measures the field at the crack tip, and fracture comes when it reaches the material's toughness. The critical crack length falls with the square of the stress. Ductile metals blunt their crack tips by dislocation motion and are tough; ceramics cannot, and many steels turn brittle in the cold.","requires":["stress-concentration","failure-theories","dislocations"],"labs":[],"problems":[],"candidate":"Load a plate with a crack and slide the crack length and stress against the toughness. It corrects the idea that a safety factor on strength alone protects a cracked part.","sources":[{"title":"Fracture toughness (Wikipedia)","url":"https://en.wikipedia.org/wiki/Fracture_toughness","why":"K, the critical crack length and typical values across material classes.","level":"Course level"},{"title":"MIT 2.001, Lecture 17: Failure of materials and examples","url":"https://ocw.mit.edu/courses/2-001-mechanics-materials-i-fall-2006/resources/lec17/","why":"Fracture placed beside the yield criteria it extends.","level":"Course level"}]},{"id":"fundamental-theorem","title":"The fundamental theorem of calculus","subject":"calculus","courses":["mac2311"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmfrac>\u003cmi>d\u003c/mi>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmsubsup>\u003cmo>∫\u003c/mo>\u003cmi>a\u003c/mi>\u003cmi>x\u003c/mi>\u003c/msubsup>\u003cmi>f\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>t\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>t\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>f\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsubsup>\u003cmo>∫\u003c/mo>\u003cmi>a\u003c/mi>\u003cmi>b\u003c/mi>\u003c/msubsup>\u003cmi>f\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>x\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>F\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>b\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo>−\u003c/mo>\u003cmi>F\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>a\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/math>\u003c/span>","idea":"The area under a curve up to \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> grows at the height of the curve there. So integration undoes differentiation, and a definite integral is an antiderivative's change between the ends. A rate integrated over time gives the net change, which is not the same thing as the rate now: a full barrel can stop filling while it still rains.","requires":["definite-integral","derivative"],"labs":[{"course":"mac2311","title":"FTC","href":"https://flux-study.pages.dev/mac2311/#/mac2311/c3/accum","notes":"https://flux-study.pages.dev/mac2311/#/mac2311/c3/accum?n=s3","note":"Slide x and watch the area grow at the height of the curve."},{"course":"mac2311","title":"Rain barrel","href":"https://flux-study.pages.dev/mac2311/#/mac2311/c3/barrel","notes":"https://flux-study.pages.dev/mac2311/#/mac2311/c3/barrel?n=s4","note":"A rain barrel: the rate of rain against the water already collected."}],"problems":[],"candidate":null,"sources":[{"title":"OpenStax Calculus Vol. 1, §5.3 The fundamental theorem of calculus","url":"https://openstax.org/books/calculus-volume-1/pages/5-3-the-fundamental-theorem-of-calculus","why":"Both parts, with the accumulation function drawn.","level":"Intro"},{"title":"MIT 18.01SC, Part B: Second fundamental theorem, areas, volumes","url":"https://ocw.mit.edu/courses/18-01sc-single-variable-calculus-fall-2010/pages/unit-3-the-definite-integral-and-its-applications/part-b-second-fundamental-theorem-areas-volumes/","why":"The theorem used, then turned on areas and volumes.","level":"Course level"}]},{"id":"gas-mixtures","title":"Ideal-gas mixtures","subject":"thermo","courses":["eml3101"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmtext> \u003c/mtext>\u003cmi>p\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>N\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmi>N\u003c/mi>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>M\u003c/mi>\u003cmo>=\u003c/mo>\u003cmo>∑\u003c/mo>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>M\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmi>h\u003c/mi>\u003cmo>=\u003c/mo>\u003cmo>∑\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmi>m\u003c/mi>\u003c/mfrac>\u003cmtext> \u003c/mtext>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>T\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003c/math>\u003c/span>","idea":"In a mixture of ideal gases each molecule behaves as if the others were not there. So each gas fills the whole volume at the mixture temperature and pushes with its own partial pressure, and the partial pressures add up to the total: Dalton's law. A gas's partial pressure is its mole fraction times the total. Mixture properties are weighted sums: by mole fraction for molar mass, by mass fraction for specific enthalpy. Mass and mole fractions differ, so keep track of which one a formula needs.","requires":["ideal-gas"],"labs":[],"problems":[],"candidate":"Mix nitrogen and carbon dioxide with sliders for the amounts, reading mass and mole fractions together. It corrects the idea that mass and mole fractions are the same thing: a heavy gas has a large mass fraction from a small mole fraction.","sources":[{"title":"Cleynen, Engineering Thermodynamics","url":"https://thermodynamicsbook.com/","why":"Free text that covers the ideal-gas properties mixtures are built from.","level":"Course level"},{"title":"Yan, Introduction to Engineering Thermodynamics","url":"https://pressbooks.bccampus.ca/thermo1/","why":"The ideal-gas model and its limits, the ground mixtures stand on.","level":"Intro"}]},{"id":"gauss-law","title":"Gauss’s law","subject":"em","courses":["phy2049"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmo>∮\u003c/mo>\u003cmi>𝐄\u003c/mi>\u003cmo>⋅\u003c/mo>\u003cmi>d\u003c/mi>\u003cmi>𝐀\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>q\u003c/mi>\u003cmtext>enc\u003c/mtext>\u003c/msub>\u003cmsub>\u003cmi>ε\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"The electric flux out of any closed surface depends only on the charge inside. Charge outside sends in as much flux as it sends out. With enough symmetry you choose a surface where \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>E\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> is constant and normal, and the integral becomes \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>E\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> times an area.","requires":["surface-flux","electric-field"],"labs":[{"course":"phy2049","title":"Gauss","href":"https://flux-study.pages.dev/phy2049/#/phy2049/e2/gauss","notes":"https://flux-study.pages.dev/phy2049/#/phy2049/e2/gauss?n=s11","note":"Spherical, cylindrical and planar symmetry, with the notes on each."}],"problems":["phy2049:e2.36c.zero-flux","phy2049:e2.36c.surfaces","phy2049:e2.36c.hoop-flux","phy2049:e2.36c.rect-flux","phy2049:e2.36c.hoop-nonuniform","phy2049:e2.36c.insulating-sphere","phy2049:e2.36c.long-wire","phy2049:e2.36c.sheet"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 2, §6.1 Electric flux","url":"https://openstax.org/books/university-physics-volume-2/pages/6-1-electric-flux","why":"Builds flux from a flat surface up, before the law itself.","level":"Intro"},{"title":"MIT 8.02, Problem-solving guide: Gauss’s law","url":"https://ocw.mit.edu/courses/8-02-physics-ii-electricity-and-magnetism-spring-2007/resources/solving03/","why":"A step-by-step method for choosing the Gaussian surface, then solved cases.","level":"Course level"}]},{"id":"gaussian-elimination","title":"Linear equations and elimination","subject":"linalg","courses":["egn3203"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>A\u003c/mi>\u003cmi>𝐱\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>𝐛\u003c/mi>\u003cmtext>  \u003c/mtext>\u003cmo>⟶\u003c/mo>\u003cmtext>  \u003c/mtext>\u003cmi>U\u003c/mi>\u003cmi>𝐱\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>𝐜\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmsub>\u003cmi>u\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmi>i\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mfrac>\u003cmo fence=\"false\" stretchy=\"true\" minsize=\"1.8em\" maxsize=\"1.8em\">(\u003c/mo>\u003cmsub>\u003cmi>c\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmunder>\u003cmo>∑\u003c/mo>\u003cmrow>\u003cmi>j\u003c/mi>\u003cmo>&gt;\u003c/mo>\u003cmi>i\u003c/mi>\u003c/mrow>\u003c/munder>\u003cmsub>\u003cmi>u\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmo fence=\"false\" stretchy=\"true\" minsize=\"1.8em\" maxsize=\"1.8em\">)\u003c/mo>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmtext>cost\u003c/mtext>\u003cmo>≈\u003c/mo>\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmfrac>\u003cmn>2\u003c/mn>\u003cmn>3\u003c/mn>\u003c/mfrac>\u003c/mstyle>\u003cmsup>\u003cmi>n\u003c/mi>\u003cmn>3\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span>","idea":"A set of linear equations asks which mix of the columns of \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> makes \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>𝐛\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>. Elimination subtracts multiples of one equation from the ones below it until the system is triangular, then back substitution reads off the unknowns from the bottom up. These row operations change the equations but not their solution. A zero where a pivot should be means a row swap, or that the system has no single answer. The work grows as \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsup>\u003cmi>n\u003c/mi>\u003cmn>3\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span>, so doubling the unknowns costs eight times as much.","requires":["matrix-maps"],"labs":[],"problems":[],"candidate":"Eliminate a 3×3 system one row operation at a time, with its three planes drawn. It corrects the idea that row operations change the answer: the planes tilt at every step, but they keep meeting at the same point.","sources":[{"title":"Margalit and Rabinoff, Interactive Linear Algebra","url":"https://textbooks.math.gatech.edu/ila/","why":"Row reduction with the geometry of the planes shown alongside the algebra.","level":"Course level"},{"title":"Hefferon, Linear Algebra","url":"https://hefferon.net/linearalgebra/","why":"Its first chapter is Gauss’s method, with proofs that it never changes the solution set.","level":"Deeper"}]},{"id":"gradient","title":"Gradient","subject":"calculus","courses":["mac2313"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi mathvariant=\"normal\">∇\u003c/mi>\u003cmi>f\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmo fence=\"true\">(\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmi>f\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmfrac>\u003cmrow>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmi>f\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmi>y\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmfrac>\u003cmrow>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmi>f\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi mathvariant=\"normal\">∂\u003c/mi>\u003cmi>z\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo fence=\"true\">)\u003c/mo>\u003c/mrow>\u003c/mrow>\u003c/math>\u003c/span>","idea":"The gradient of a scalar field points the way the field rises fastest, and its length is that rate. It is perpendicular to the level curves. Every \"flows downhill\" law in this thread starts here: heat flows down the temperature gradient, and \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi>𝐄\u003c/mi>\u003cmo>=\u003c/mo>\u003cmo>−\u003c/mo>\u003cmi mathvariant=\"normal\">∇\u003c/mi>\u003cmi>V\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span>.","requires":["partial-derivatives"],"labs":[{"course":"mac2313","title":"Gradient","href":"https://flux-study.pages.dev/mac2313/#/mac2313/ch2/gradient","notes":null,"note":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmi mathvariant=\"normal\">∇\u003c/mi>\u003cmi>f\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> and the directional derivative \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsub>\u003cmi>D\u003c/mi>\u003cmover accent=\"true\">\u003cmi>u\u003c/mi>\u003cmo>^\u003c/mo>\u003c/mover>\u003c/msub>\u003cmi>f\u003c/mi>\u003c/mrow>\u003c/math>\u003c/span> on a surface."}],"problems":["mac2313:ch2.grad.point","mac2313:ch2.grad.sym","mac2313:ch2.du.unit","mac2313:ch2.du.nonunit","mac2313:ch2.steepest.mc","mac2313:ch2.level.tf","mac2313:ch2.linearize","mac2313:ch2.mixed.du"],"candidate":null,"sources":[{"title":"OpenStax Calculus Vol. 3, §4.6 Directional derivatives and the gradient","url":"https://openstax.org/books/calculus-volume-3/pages/4-6-directional-derivatives-and-the-gradient","why":"Shows why the gradient is perpendicular to level curves, with worked examples.","level":"Course level"},{"title":"MIT 18.02SC, Part B: Chain rule, gradient and directional derivatives","url":"https://ocw.mit.edu/courses/18-02sc-multivariable-calculus-fall-2010/pages/2.-partial-derivatives/part-b-chain-rule-gradient-and-directional-derivatives/","why":"MIT’s own sequence: short lectures, recitation videos and checked problems.","level":"Course level"}]},{"id":"gravitation","title":"Gravitation and orbits","subject":"mechanics","courses":["phy2048"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>F\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>G\u003c/mi>\u003cmi>M\u003c/mi>\u003cmi>m\u003c/mi>\u003c/mrow>\u003cmsup>\u003cmi>r\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmtext>circ\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsqrt>\u003cmfrac>\u003cmrow>\u003cmi>G\u003c/mi>\u003cmi>M\u003c/mi>\u003c/mrow>\u003cmi>r\u003c/mi>\u003c/mfrac>\u003c/msqrt>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsup>\u003cmi>T\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>4\u003c/mn>\u003cmsup>\u003cmi>π\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003cmrow>\u003cmi>G\u003c/mi>\u003cmi>M\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmsup>\u003cmi>a\u003c/mi>\u003cmn>3\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span>","idea":"Every mass pulls every other with a force that falls as \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmn>1\u003c/mn>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmsup>\u003cmi>r\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/span>. An orbit is a fall that keeps missing: launched sideways at exactly \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsqrt>\u003cmrow>\u003cmi>G\u003c/mi>\u003cmi>M\u003c/mi>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/msqrt>\u003c/mrow>\u003c/math>\u003c/span>, a body circles; slower or faster gives an ellipse; \u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmrow>\u003cmsqrt>\u003cmn>2\u003c/mn>\u003c/msqrt>\u003c/mrow>\u003c/math>\u003c/span> times that escapes. Kepler's laws follow: equal areas in equal times, and the period set by the size of the orbit alone, not the mass of what orbits.","requires":["curved-path-forces","energy-conservation"],"labs":[{"course":"phy2048","title":"Orbit","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u9/orbit","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u9/orbit?n=s1","note":"Launch speed against circle, ellipse and escape."},{"course":"phy2048","title":"Kepler's laws","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u9/kepler","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u9/kepler?n=s5","note":"Equal areas in equal times, and the period against the semi-major axis."},{"course":"phy2048","title":"ISS orbit","href":"https://flux-study.pages.dev/phy2048/#/phy2048/u9/iss-orbit","notes":"https://flux-study.pages.dev/phy2048/#/phy2048/u9/iss-orbit?n=s2","note":"The space station’s speed and period from its altitude alone."}],"problems":["phy2048:ch13.collision","phy2048:ch13.galaxies","phy2048:ch13.escape","phy2048:ch13.soyuz","phy2048:ch13.concept-escape","phy2048:ch13.concept-mass","phy2048:ch13.moon","phy2048:ch13.halley","phy2048:ch13.speeds","phy2048:ch13.transfer","phy2048:ch13.concept-area","phy2048:ch13.earth-mass","phy2048:ch13.height","phy2048:ch13.weightless","phy2048:ch13.iss","phy2048:ch13.concept-weight","phy2048:ch13.concept-radius"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 1, §13.4 Satellite orbits and energy","url":"https://openstax.org/books/university-physics-volume-1/pages/13-4-satellite-orbits-and-energy","why":"Circular orbits, their energy and escape speed.","level":"Intro"},{"title":"MIT 8.01SC, 5.1 Universal law of gravitation","url":"https://ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/pages/week-2-newtons-laws/5-1-universal-law-of-gravitation/","why":"The inverse-square law set up as a vector force.","level":"Course level"}]},{"id":"heat-engines","title":"Heat engines and heat pumps","subject":"thermo","courses":["eml3100"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>η\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmtext>net\u003c/mtext>\u003c/msub>\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmi>H\u003c/mi>\u003c/msub>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>−\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmi>L\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmi>H\u003c/mi>\u003c/msub>\u003c/mfrac>\u003cmo separator=\"true\">,\u003c/mo>\u003cmspace width=\"2em\"/>\u003cmsub>\u003cmtext>COP\u003c/mtext>\u003cmi>R\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmi>L\u003c/mi>\u003c/msub>\u003cmi>W\u003c/mi>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/span>","idea":"An engine takes heat from something hot, turns part of it into work, and must reject the rest to something cold. A refrigerator or heat pump runs the other way: work moves heat from cold to hot. Efficiency and coefficient of performance are what you get over what you pay.","requires":["first-law-closed"],"labs":[{"course":"eml3100","title":"Possible or not","href":"https://flux-study.pages.dev/eml3100/#/eml3100/u4/claims","notes":"https://flux-study.pages.dev/eml3100/#/eml3100/u4/claims?n=s1","note":"A claimed engine, refrigerator or heat pump, judged by the first and second laws."},{"course":"eml3100","title":"Carnot and Brayton","href":"https://flux-study.pages.dev/eml3100/#/eml3100/u4/carnot","notes":"https://flux-study.pages.dev/eml3100/#/eml3100/u4/carnot?n=s2","note":"Engine and refrigerator limits between two temperatures."}],"problems":["eml3100:u4.6.engine","eml3100:u4.6.fridge","eml3100:u4.6.verdict","eml3100:u4.6.carnot","eml3100:u4.6.heat-pump","eml3100:u4.6.brayton","eml3100:u4.6.cycle","eml3100:u4.6.english","eml3100:u4.6.device","eml3100:u4.6.which-cop"],"candidate":null,"sources":[{"title":"OpenStax University Physics Vol. 2, §4.2 Heat engines","url":"https://openstax.org/books/university-physics-volume-2/pages/4-2-heat-engines","why":"Engines as energy-flow diagrams, the picture the lab uses.","level":"Intro"},{"title":"OpenStax University Physics Vol. 2, §4.3 Refrigerators and heat pumps","url":"https://openstax.org/books/university-physics-volume-2/pages/4-3-refrigerators-and-heat-pumps","why":"The same diagram reversed, with COP for each use.","level":"Intro"}]},{"id":"heat-equation","title":"Heat equation","subject":"heat","courses":["eml4140"],"eq":"\u003cspan class=\"katex\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" di
