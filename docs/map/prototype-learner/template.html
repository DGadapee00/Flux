<style>
/*
 * Layout: one home that knows the learner. A sticky bar with three places (Today, Map, Satellite),
 * then one view at a time. The hub's approved look: paper or near-black ground, condensed display
 * type, a serif for reading, mono for meta. Lane colours come from map/subjects.js at runtime.
 */
:root {
  --bg: #f6f5f2;
  --panel: #ffffff;
  --sunk: #eeece7;
  --line: #dcd8d2;
  --fg: #1d1c1a;
  --muted: #5d5853;
  --dim: #6f6963;
  --accent: #1a7590;
  --due: #a85400;
  --ok: #2e7d4f;
  --display: 'IBM Plex Sans Condensed', 'Arial Narrow', system-ui, sans-serif;
  --body: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #0b0c0e; --panel: #131418; --sunk: #0f1013; --line: #2a2c31; --fg: #ece6e2; --muted: #aaa39e;
    --dim: #8f8983; --accent: #58c4dd; --due: #f0a63a; --ok: #7cc98f; color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --bg: #0b0c0e; --panel: #131418; --sunk: #0f1013; --line: #2a2c31; --fg: #ece6e2; --muted: #aaa39e;
  --dim: #8f8983; --accent: #58c4dd; --due: #f0a63a; --ok: #7cc98f; color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.55; overflow-x: hidden; }
body::before { content: ''; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: inherit; text-decoration-color: var(--dim); text-underline-offset: 3px; }
a:hover { text-decoration-color: currentColor; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
button, input, select { font: inherit; color: inherit; }
math { font-size: 1.05em; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; line-height: 1.15; text-wrap: balance; margin: 0; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page { max-width: 1180px; margin: 0 auto; }
.meta { font-family: var(--mono); font-size: 12px; letter-spacing: 0.04em; color: var(--dim); }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
.muted { color: var(--muted); }

/* Bar */
.proto { background: var(--sunk); border-bottom: 1px solid var(--line); }
.proto .page { display: flex; flex-wrap: wrap; gap: 4px 16px; padding-block: 6px; }
header.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
header.bar .page { display: flex; align-items: center; gap: 8px 20px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: 0.06em; text-decoration: none; }
nav.places { display: flex; gap: 4px; }
nav.places a { font-family: var(--display); font-weight: 600; font-size: 16px; text-decoration: none; padding: 6px 12px; border-radius: 999px; color: var(--muted); }
nav.places a[aria-current='page'] { background: var(--fg); color: var(--bg); }
.who { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.who select, .who label.toggle { font-family: var(--mono); font-size: 12px; }
.who select { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; max-width: 220px; }
label.toggle { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; }
.notice { font-family: var(--mono); font-size: 12px; color: var(--due); }

main { padding-block: 28px 64px; }

/* Shared pieces */
.btn { display: inline-flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 600; font-size: 15px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--fg); background: var(--fg); color: var(--bg); text-decoration: none; cursor: pointer; }
.btn.quiet { background: transparent; color: var(--fg); border-color: var(--line); }
.btn:hover { filter: brightness(1.1); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.03em; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
.pill.mastered { border-color: var(--ok); color: var(--ok); }
.pill.learning { border-color: var(--accent); color: var(--accent); }
.pill.ready { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.pill.locked { color: var(--dim); border-style: dashed; }
.pill.due { border-color: var(--due); color: var(--due); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.bar-track { height: 6px; border-radius: 3px; background: var(--sunk); border: 1px solid var(--line); overflow: hidden; }
.bar-fill { height: 100%; background: var(--ok); }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.section-head h2 { font-size: 22px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; min-width: 0; }

/* Today */
.today-hero { display: grid; gap: 10px; margin-bottom: 28px; max-width: 820px; }
.today-hero h1 { font-size: clamp(30px, 5vw, 46px); font-weight: 600; }
.today-hero p { margin: 0; font-size: 18px; color: var(--muted); max-width: 65ch; }
.today-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.today-main, .today-side { display: grid; gap: 24px; min-width: 0; }
.step { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 0 14px; }
.step-n { font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1; color: var(--dim); padding-top: 2px; }
.queue { display: grid; gap: 2px; margin: 14px 0; }
.queue-row { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.queue-row a { text-decoration: none; }
.queue-row .why { font-size: 14px; color: var(--muted); }
.next-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 14px; }
.next-card { display: grid; gap: 8px; align-content: start; text-decoration: none; padding: 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); border-top: 4px solid var(--lane); min-width: 0; }
.next-card:hover { border-color: var(--lane); }
.next-card h3 { font-size: 19px; }
.next-card ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; font-size: 14px; color: var(--muted); }
.exam-list { display: grid; gap: 6px; margin: 12px 0 0; padding: 0; list-style: none; }
.exam-list li { display: flex; align-items: center; gap: 8px; justify-content: space-between; font-size: 15px; }
.exam-list a { text-decoration: none; min-width: 0; }
.course-rows { display: grid; gap: 14px; margin: 0; padding: 0; list-style: none; }
.course-rows li { display: grid; gap: 4px; }
.course-rows .row { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; }
.sat-mini { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin: 12px 0; }
.sat-mini span { height: 8px; border-radius: 2px; background: var(--sunk); border: 1px solid var(--line); }
.sat-mini span.done { background: var(--ok); border-color: var(--ok); }
.sat-mini span.check { background: var(--fg); border-color: var(--fg); }

/* Tiles: one per concept. The fill is the state, the colour is the lane. */
.tile { --lane: var(--fg); position: relative; display: inline-flex; align-items: center; min-height: 30px; padding: 4px 10px; border-radius: 6px; font-family: var(--display); font-weight: 500; font-size: 14px; line-height: 1.2; text-decoration: none; border: 1px solid var(--lane); background: var(--panel); color: var(--fg); }
.tile.mastered { background: var(--lane); color: var(--bg); }
.tile.assumed { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--lane) 30%, var(--panel)) 0 5px, var(--panel) 5px 9px); }
.tile.learning { background: linear-gradient(90deg, color-mix(in srgb, var(--lane) 45%, var(--panel)) var(--m, 30%), var(--panel) var(--m, 30%)); }
.tile.ready { border-width: 2px; padding: 3px 9px; box-shadow: 0 0 0 3px color-mix(in srgb, var(--lane) 22%, transparent); font-weight: 600; }
.tile.locked { border: 1px dashed var(--line); color: var(--dim); background: transparent; }
.tile .due-dot { position: absolute; top: -4px; right: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--due); border: 2px solid var(--bg); }
.author .tile.gap { outline: 2px dashed var(--due); outline-offset: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin: 12px 0 20px; }
.legend span.item { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.legend .tile { min-height: 20px; padding: 0 10px; font-size: 11px; pointer-events: none; }

/* Map */
.map-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.lenses { display: flex; flex-wrap: wrap; gap: 6px; }
.lenses button { font-family: var(--display); font-weight: 600; font-size: 14px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
.lenses button[aria-pressed='true'] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.lane { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); }
.lane-name { font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--lane); padding-top: 6px; }
.lane-name small { display: block; color: var(--dim); letter-spacing: 0; text-transform: none; }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; }
.units { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.unit { display: grid; gap: 10px; align-content: start; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
.unit h3 { font-size: 16px; }
.unit .tiles { flex-direction: column; align-items: stretch; }

/* Concept */
.crumbs { display: flex; gap: 8px; align-items: center; font-family: var(--mono); font-size: 12px; color: var(--dim); margin-bottom: 18px; }
.concept { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.concept h1 { font-size: clamp(32px, 5vw, 48px); }
.concept .head { display: grid; gap: 10px; margin-bottom: 18px; }
.concept .tags { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.eq { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; overflow-x: auto; font-size: 20px; margin-bottom: 16px; }
.idea { font-size: 18px; max-width: 62ch; margin: 0 0 22px; }
.rel { display: grid; gap: 8px; margin-bottom: 18px; }
.rel .tiles { gap: 8px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.steps li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 4px 12px; padding: 14px 0; border-top: 1px solid var(--line); }
.steps li:first-child { border-top: 0; padding-top: 4px; }
.steps .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 14px; border: 1.5px solid var(--line); color: var(--dim); }
.steps .done .n { background: var(--ok); border-color: var(--ok); color: var(--bg); }
.steps .now .n { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.steps h3 { font-size: 17px; }
.steps p { margin: 2px 0 8px; font-size: 15px; color: var(--muted); }
.steps .actions { display: flex; flex-wrap: wrap; gap: 8px; }
.sources { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.sources li { font-size: 15px; }
.sources .why { color: var(--muted); font-size: 14px; }
.gapnote { border: 1px dashed var(--due); border-radius: 12px; padding: 14px; font-size: 15px; }

/* Satellite */
.sat-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: end; margin-bottom: 20px; }
.sat-head h1 { font-size: clamp(32px, 5vw, 48px); }
.rail { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; margin-bottom: 24px; }
.rail a { display: grid; gap: 6px; text-decoration: none; font-family: var(--mono); font-size: 11px; color: var(--muted); min-width: 0; }
.rail a span.seg { height: 6px; border-radius: 3px; background: var(--sunk); border: 1px solid var(--line); }
.rail a.done span.seg { background: var(--ok); border-color: var(--ok); }
.rail a.check span.seg { background: var(--fg); border-color: var(--fg); }
.rail a.learn span.seg { background: color-mix(in srgb, var(--accent) 40%, var(--sunk)); border-color: var(--accent); }
.rail a .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.subsys { display: grid; gap: 14px; }
.sub { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 0 16px; padding: 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
.sub.waits { background: transparent; }
.sub .num { font-family: var(--display); font-weight: 700; font-size: 30px; color: var(--dim); line-height: 1; }
.sub.done .num { color: var(--ok); }
.sub .top { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; margin-bottom: 6px; }
.sub h2 { font-size: 22px; }
.sub p { margin: 4px 0; }
.sub .tiles { margin: 10px 0; }
.task { display: grid; gap: 12px; margin-top: 12px; padding: 14px; border-radius: 10px; background: var(--sunk); border: 1px solid var(--line); }
.task .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.task label { display: grid; gap: 4px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.task input { font-family: var(--mono); font-size: 15px; padding: 7px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); width: 100%; font-variant-numeric: tabular-nums; }
.result { font-family: var(--mono); font-size: 13px; line-height: 1.6; font-variant-numeric: tabular-nums; }
.result .pass { color: var(--ok); }
.result .fail { color: var(--due); }
.result table { border-collapse: collapse; width: 100%; }
.result td, .result th { text-align: left; padding: 3px 8px 3px 0; border-bottom: 1px solid var(--line); }
.table-wrap { overflow-x: auto; }

@media (max-width: 860px) {
  .today-grid, .concept { grid-template-columns: minmax(0, 1fr); }
  .lane { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .lane-name { padding-top: 0; }
  .sat-head { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 520px) {
  .who { margin-left: 0; width: 100%; }
  .who select { flex: 1; max-width: none; }
  .rail a .lbl { display: none; }
  .sub { grid-template-columns: minmax(0, 1fr); }
  .sub .num { font-size: 20px; margin-bottom: 6px; }
  .step { grid-template-columns: minmax(0, 1fr); }
  .step-n { font-size: 20px; margin-bottom: 4px; }
}
@media (prefers-reduced-motion: no-preference) {
  .tile, .next-card, .btn { transition: border-color 120ms, box-shadow 120ms, filter 120ms; }
}
</style>

<script>
const D = /*DATA*/null;
const DAY = 864e5;
const MASTERED_BOX = 3;
const INTERVAL_DAYS = [10 / 1440, 1, 3, 7, 16, 35];
const DAILY_CAP = 15;

const C = Object.fromEntries(D.concepts.map((c) => [c.id, c]));
const COURSE = Object.fromEntries(D.courses.map((c) => [c.id, c]));
const SUBJECT = Object.fromEntries(D.subjects.map((s) => [s.id, s]));
const SAT = Object.fromEntries(D.satellite.map((s) => [s.id, s]));
const LEADS = {};
for (const c of D.concepts) for (const r of c.requires) (LEADS[r] ||= []).push(c.id);

const memo = {};
function closureSize(id) {
  const seen = new Set();
  const walk = (x) => { for (const y of LEADS[x] || []) if (!seen.has(y)) { seen.add(y); walk(y); } };
  walk(id);
  return seen.size;
}
const depthMemo = {};
function depth(id) {
  if (depthMemo[id] != null) return depthMemo[id];
  const reqs = C[id].requires;
  return (depthMemo[id] = reqs.length ? 1 + Math.max(...reqs.map(depth)) : 0);
}
const pathIndex = {};
for (const [course, units] of Object.entries(D.paths)) {
  let i = 0;
  units.forEach((u, ui) => u.concepts.forEach((id) => { (pathIndex[id] ||= []).push({ course, unit: ui, unitTitle: u.title, i: i++ }); }));
}
const satUses = {};
for (const s of D.satellite) for (const id of s.concepts) (satUses[id] ||= []).push(s);

/* Lane colours, both themes, as tokens. */
(function laneTokens() {
  const light = D.subjects.map((s) => `--lane-${s.id}: ${s.light};`).join(' ');
  const dark = D.subjects.map((s) => `--lane-${s.id}: ${s.dark};`).join(' ');
  const css = `:root { ${light} }
@media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { ${dark} } }
:root[data-theme='dark'] { ${dark} }`;
  const el = document.createElement('style');
  el.textContent = css;
  document.head.append(el);
})();

/* ---------- Storage, wrapped: it can be missing or blocked. ---------- */
const store = {
  get(key, fallback) { try { const v = localStorage.getItem(key); return v == null ? fallback : JSON.parse(v); } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* blocked */ } },
};

/* ---------- The learner ---------- */
let now = Date.now();
let items = {};
let sourceNote = '';

function rng(seed) {
  return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

/** A made-up learner who matches the owner's course standing: taken, taking now, next term. */
function sampleItems() {
  const rand = rng(2049);
  const out = {};
  const phyExam = {};
  (D.paths.phy2049 || []).forEach((u, i) => u.concepts.forEach((id) => { phyExam[id] = i + 1; }));
  const staOrder = (D.paths.sta3032 || []).flatMap((u) => u.concepts);
  // Tried with probability `share`; once tried, solid (box 3 to 5) with probability `pSolid`.
  const put = (key, pSolid, share) => {
    if (out[key] || rand() > share) return;
    const box = rand() < pSolid ? 3 + Math.floor(rand() * 3) : 1 + Math.floor(rand() * 2);
    const interval = INTERVAL_DAYS[box] * DAY;
    const last = now - rand() * interval * 1.03;
    out[key] = { box, due: last + interval, lastOk: rand() > 0.04, last };
  };
  for (const c of D.concepts) {
    for (const key of c.problems) {
      const course = key.split(':')[0];
      const status = COURSE[course]?.status;
      if (status === 'taken') put(key, 0.92, 0.97);
      else if (course === 'phy2049') {
        const n = phyExam[c.id] || 9;
        if (n <= 4) put(key, 0.9, 0.97);
        else if (n === 5) put(key, 0.7, 0.9);
        else if (n === 6 && ['em-waves', 'light-intensity', 'polarization'].includes(c.id)) put(key, 0.45, 0.8);
      } else if (course === 'sta3032') {
        const at = staOrder.indexOf(c.id);
        if (at >= 0 && at < 5) put(key, 0.6, 0.8);
      } else if (course === 'bench') put(key, 0.4, 0.5);
    }
  }
  return out;
}

function readCourseProblems(course, raw) {
  try {
    const data = typeof raw === 'string' ? JSON.parse(raw) : raw;
    if (!data || data.v !== 1 || typeof data.items !== 'object') return 0;
    let n = 0;
    for (const [id, it] of Object.entries(data.items)) { items[`${course}:${id}`] = it; n++; }
    return n;
  } catch { return 0; }
}

function useSample() { items = sampleItems(); sourceNote = 'Sample learner. A made-up record that matches your course standing.'; }

function useBrowser() {
  items = {};
  let n = 0;
  for (const c of D.courses) {
    try { const raw = localStorage.getItem(`flux.${c.id}.problems.v1`); if (raw) n += readCourseProblems(c.id, raw); } catch { /* blocked */ }
  }
  sourceNote = n ? `This browser: ${n} practised problems.` : 'This browser has no Flux practice saved. Open the prototype on the Flux site, or load a backup file.';
}

function useBackup(bundle) {
  items = {};
  let n = 0;
  if (bundle && bundle.v === 1 && bundle.courses) {
    for (const [course, section] of Object.entries(bundle.courses)) n += readCourseProblems(course, section?.keys?.problems);
  }
  sourceNote = n ? `Your backup: ${n} practised problems.` : 'That file holds no practice. Use the hub’s Back up progress button to make one.';
  return n;
}

/* ---------- What the record says about each concept ---------- */
let S = {};
let started = new Set();
/**
 * A concept taught in several courses has problems in each. Only the courses the learner has
 * started count toward it, so Dynamics problems do not pull down a Physics I concept.
 */
function stats(c) {
  let tried = 0, solid = 0, due = 0, next = Infinity, n = 0;
  const dueKeys = [];
  for (const key of c.problems) {
    if (!started.has(key.split(':')[0])) continue;
    n++;
    const it = items[key];
    if (!it) continue;
    tried++;
    if (it.box >= MASTERED_BOX && it.lastOk !== false) solid++;
    if (it.due <= now) { due++; dueKeys.push(key); } else next = Math.min(next, it.due);
  }
  return { n, all: c.problems.length, tried, solid, due, dueKeys, next };
}
function takenCourse(c) { return c.courses.some((id) => COURSE[id]?.status === 'taken'); }
function met(id) { const s = statusOf(id); return s === 'mastered' || s === 'assumed'; }
function statusOf(id) {
  if (S[id]) return S[id].status;
  const c = C[id];
  const st = stats(c);
  let status;
  if (st.n && st.tried && st.solid / st.n >= 0.7) status = 'mastered';
  else if (st.tried) status = 'learning';
  else if (!st.n && takenCourse(c)) status = 'assumed';
  // Not measured yet: problems exist, but only in courses the learner has not started.
  else status = c.requires.every(met) ? 'ready' : 'locked';
  S[id] = { ...st, status };
  return status;
}
function recompute() {
  now = Date.now();
  S = {};
  started = new Set(Object.keys(items).map((k) => k.split(':')[0]));
  for (const c of D.concepts) statusOf(c.id);
}

const LABEL = { mastered: 'Solid', assumed: 'From a course you took', learning: 'Learning', ready: 'Ready', locked: 'Not yet' };

/* ---------- Helpers ---------- */
const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const lane = (c) => `var(--lane-${c.subject})`;
const courseCode = (id) => COURSE[id]?.code || id.toUpperCase();
function when(t) {
  const d = Math.round((t - now) / DAY);
  if (d <= 0) return 'today';
  if (d === 1) return 'tomorrow';
  return `in ${d} days`;
}
function tile(id, extra = '') {
  const c = C[id];
  const s = S[id];
  const m = s.status === 'learning' && s.n ? `--m:${Math.round((100 * s.solid) / s.n)}%;` : '';
  const gap = c.labs.length ? '' : ' gap';
  const due = s.due ? '<span class="due-dot" title="Review due"></span>' : '';
  return `<a class="tile ${s.status}${gap}" style="--lane:${lane(c)};${m}" href="#${c.id}" title="${esc(c.title)}: ${LABEL[s.status]}${s.due ? `, ${s.due} due` : ''}"${extra}>${esc(c.title)}${due}</a>`;
}
function pill(status) { return `<span class="pill ${status === 'assumed' ? 'mastered' : status}">${LABEL[status]}</span>`; }
function legend() {
  return `<div class="legend" aria-label="Legend">
    <span class="item"><span class="tile mastered" style="--lane:var(--fg)">Aa</span>Solid</span>
    <span class="item"><span class="tile learning" style="--lane:var(--fg);--m:40%">Aa</span>Learning</span>
    <span class="item"><span class="tile ready" style="--lane:var(--fg)">Aa</span>Ready to learn</span>
    <span class="item"><span class="tile locked">Aa</span>Needs something first</span>
    <span class="item"><span class="tile assumed" style="--lane:var(--fg)">Aa</span>From a course you took, no Flux practice</span>
    <span class="item"><span class="dot" style="background:var(--due)"></span>Review due</span>
    ${author ? '<span class="item"><span class="tile" style="outline:2px dashed var(--due);outline-offset:2px">Aa</span>No Flux lab yet</span>' : ''}
  </div>`;
}

/* ---------- Planning ---------- */
function reviewQueue() {
  const seen = new Set();
  const rows = [];
  for (const c of D.concepts) {
    for (const key of S[c.id].dueKeys) {
      if (seen.has(key)) continue;
      seen.add(key);
      rows.push({ key, concept: c, due: items[key].due, missed: items[key].lastOk === false });
    }
  }
  rows.sort((a, b) => (b.missed - a.missed) || (a.due - b.due));
  return rows;
}
function courseRank(c) {
  const ranks = c.courses.map((id) => ({ 'taking now': 0, 'next term': 1, later: 2, taken: 3, project: 2 }[COURSE[id]?.status] ?? 4));
  return Math.min(...ranks);
}
function nextUp(limit = 3) {
  const ready = D.concepts.filter((c) => S[c.id].status === 'ready');
  const order = (c) => (pathIndex[c.id] || []).reduce((m, p) => Math.min(m, p.i), 999);
  // An upcoming exam pulls its concepts forward: the nearest exam first.
  const upcoming = D.exams.filter((e) => examDays(e) >= 0);
  const examRank = (c) => { const i = upcoming.findIndex((e) => e.concepts.includes(c.id)); return i < 0 ? 99 : i; };
  ready.sort((a, b) => courseRank(a) - courseRank(b) || examRank(a) - examRank(b) || order(a) - order(b) || closureSize(b.id) - closureSize(a.id));
  return ready.slice(0, limit);
}
function nextExam() {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return D.exams.find((e) => new Date(`${e.date}T00:00:00`) >= today) || null;
}
function examDays(e) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return Math.round((new Date(`${e.date}T00:00:00`) - today) / DAY);
}
function whyReady(c) {
  const bits = [];
  const p = (pathIndex[c.id] || []).find((x) => COURSE[x.course]?.status === 'taking now') || (pathIndex[c.id] || [])[0];
  if (p) bits.push(`${courseCode(p.course)}${p.unitTitle ? `, ${esc(p.unitTitle.replace(/^Exam (\d+):.*/, 'Exam $1'))}` : ''}`);
  bits.push(c.requires.length ? `All ${c.requires.length} prerequisite${c.requires.length > 1 ? 's' : ''} solid` : 'Needs nothing first');
  const opens = closureSize(c.id);
  if (opens) bits.push(`Opens the way to ${opens} concept${opens > 1 ? 's' : ''}`);
  bits.push(c.labs.length ? `${c.labs.length > 1 ? `${c.labs.length} labs` : 'A lab'} and ${c.problems.length} problems` : 'No Flux lab yet. Start from the sources');
  return bits;
}

/* ---------- Satellite ---------- */
let satDone = store.get('flux.proto.satellite', {});
function satState(id) {
  const s = SAT[id];
  if (satDone[id]) return 'done';
  if (!s.requires.every((r) => satDone[r])) return 'waits';
  if (!s.concepts.every(met)) return 'learn';
  return 'check';
}

        ${sat.length ? `<div class="rel"><span class="eyebrow">Used to build</span><div class="tiles">${sat.map((x) => `<a class="tile" href="#satellite" style="--lane:var(--accent)">Satellite · ${esc(x.title)}</a>`).join('')}</div></div>` : ''}
      </div>
      <div style="min-width:0;display:grid;gap:20px">
        <section class="panel" aria-labelledby="steps-h"><h2 id="steps-h" style="font-size:20px;margin-bottom:10px">Your steps</h2><ol class="steps">${steps.join('')}</ol></section>
        ${author && !c.labs.length && c.candidate ? `<div class="gapnote"><span class="eyebrow" style="color:var(--due)">Author view · lab to build</span><p style="margin:6px 0 0">${c.candidate}</p></div>` : ''}
        <section aria-labelledby="src-h"><h2 id="src-h" style="font-size:18px;margin-bottom:10px">${c.labs.length ? 'To read further' : 'Where to learn it'}</h2>
          <ul class="sources">${c.sources.map((x) => `<li><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)} ↗</a> <span class="meta">${esc(x.level)}</span><div class="why">${esc(x.why)}</div></li>`).join('')}</ul></section>
      </div>
    </div>`;
}

function renderSatellite() {
  const states = D.satellite.map((s) => satState(s.id));
  const doneN = states.filter((x) => x === 'done').length;
  view.innerHTML = `
    <div class="sat-head"><div><span class="eyebrow">Application</span><h1>Build a satellite</h1>
      <p class="muted" style="margin:8px 0 0;max-width:65ch">Seven subsystems and one mission. Each opens when its concepts are solid and the subsystems it takes numbers from are checked. You check a subsystem by entering your own numbers. Flux recomputes them two ways.</p></div>
      <span class="meta">${doneN} of ${D.satellite.length} checked</span></div>
    <div class="rail" aria-label="Build order">${D.satellite.map((s, i) => `<a href="#sat-${s.id}" class="${states[i]}" title="${esc(s.title)}: ${SAT_LABEL[states[i]]}"><span class="seg"></span><span class="lbl">${String(i + 1).padStart(2, '0')} ${esc(s.title)}</span></a>`).join('')}</div>
    <div class="subsys">${D.satellite.map((s, i) => {
      const st = states[i];
      const waits = s.requires.filter((r) => !satDone[r]);
      const learn = s.concepts.filter((c) => !met(c));
      let action = '';
      if (st === 'waits') action = `<p class="muted">Takes numbers from ${waits.map((r) => esc(SAT[r].title)).join(', ')}. Check ${waits.length > 1 ? 'those' : 'that'} first.</p>`;
      else if (st === 'learn') action = `<p class="muted">${learn.length} concept${learn.length > 1 ? 's' : ''} to make solid first: ${learn.map((c) => `<a href="#${c}">${esc(C[c].title)}</a>`).join(', ')}.</p>`;
      if ((st === 'check' || st === 'done') && s.id === 'orbit') action += orbitCheck(st === 'done');
      else if (st === 'check') action += `<div class="task"><p style="margin:0"><strong>Your task.</strong> ${esc(s.demonstrate)}</p><p class="muted" style="margin:0">The number check for this subsystem is not built yet. Orbit shows how it will work.</p><div><button class="btn quiet" type="button" data-skip="${s.id}">Mark as checked (prototype only)</button></div></div>`;
      else if (st === 'done' && s.id !== 'orbit') action += `<p class="muted">Marked as checked in this prototype. <button class="btn quiet" type="button" data-undo="${s.id}" style="padding:2px 8px;font-size:13px">Undo</button></p>`;
      return `<section class="sub ${st}" id="sat-${s.id}"><span class="num">${String(i + 1).padStart(2, '0')}</span><div style="min-width:0">
        <div class="top"><h2>${esc(s.title)}</h2><span class="meta">${esc(s.part)}</span><span class="pill ${st === 'done' ? 'mastered' : st === 'check' ? 'ready' : st === 'learn' ? 'learning' : 'locked'}">${SAT_LABEL[st]}</span></div>
        <p>${esc(s.outcome)}</p>
        ${s.concepts.length ? `<div class="tiles">${s.concepts.map((c) => tile(c)).join('')}</div>` : ''}
        ${action}
        ${author && s.gap ? `<div class="gapnote" style="margin-top:10px"><span class="eyebrow" style="color:var(--due)">Author view · still to build</span><p style="margin:6px 0 0">${esc(s.gap)}</p></div>` : ''}
      </div></section>`;
    }).join('')}</div>`;
}

/* The orbit check: the learner's speed and period against a closed form and an integrated orbit. */
const MU = 398600.4418; // km^3/s^2, Earth
const RE = 6371.0; // km, mean radius
function integratePeriod(r) {
  const v = Math.sqrt(MU / r);
  let x = r, y = 0, vx = 0, vy = v;
  const T0 = (2 * Math.PI * r) / v;
  const dt = T0 / 20000;
  let t = 0, prevY = 0, path = 0;
  let ax = -MU * x / r ** 3, ay = -MU * y / r ** 3;
  // Velocity Verlet, stepped until the craft crosses its starting line again.
  for (let i = 0; i < 40000; i++) {
    const x0 = x, y0 = y;
    vx += 0.5 * dt * ax; vy += 0.5 * dt * ay;
    x += dt * vx; y += dt * vy;
    const rr = Math.hypot(x, y);
    ax = -MU * x / rr ** 3; ay = -MU * y / rr ** 3;
    vx += 0.5 * dt * ax; vy += 0.5 * dt * ay;
    const step = Math.hypot(x - x0, y - y0);
    t += dt;
    if (prevY < 0 && y >= 0 && t > T0 / 2) {
      const frac = -prevY / (y - prevY);
      const T = t - dt + frac * dt;
      path += frac * step;
      return { T, speed: path / T };
    }
    path += step;
    prevY = y;
  }
  return { T: NaN, speed: NaN };
}
let orbitInput = store.get('flux.proto.orbit', { h: '550', v: '', T: '' });
function orbitCheck(done) {
  return `<form class="task" id="orbit-form" novalidate>
    <p style="margin:0"><strong>Your task.</strong> Choose an altitude for a circular orbit. Work out the speed and the period by hand or in your own code, then enter them. Flux checks them against √(μ/r) and against an orbit it integrates step by step.</p>
    <div class="fields">
      <label for="o-h">Altitude, km<input id="o-h" inputmode="decimal" value="${esc(orbitInput.h)}" /></label>
      <label for="o-v">Your speed, km/s<input id="o-v" inputmode="decimal" value="${esc(orbitInput.v)}" placeholder="e.g. 7.6" /></label>
      <label for="o-T">Your period, minutes<input id="o-T" inputmode="decimal" value="${esc(orbitInput.T)}" placeholder="e.g. 95" /></label>
    </div>
    <div><button class="btn" type="submit">Check my numbers</button></div>
    <div class="result" id="orbit-result" aria-live="polite">${done ? '<span class="pass">Checked. Power and Structure can use your period.</span>' : ''}</div>
    <p class="meta" style="margin:0">Uses μ = 398 600.4418 km³/s² and a mean Earth radius of 6 371 km. Within 1% passes.</p>
  </form>`;
}
function runOrbitCheck(form) {
  const h = parseFloat(form.querySelector('#o-h').value);
  const vIn = parseFloat(form.querySelector('#o-v').value);
  const TIn = parseFloat(form.querySelector('#o-T').value);
  orbitInput = { h: form.querySelector('#o-h').value, v: form.querySelector('#o-v').value, T: form.querySelector('#o-T').value };
  store.set('flux.proto.orbit', orbitInput);
  const out = form.querySelector('#orbit-result');
  if (!(h > 100 && h < 40000)) { out.innerHTML = '<span class="fail">Enter an altitude between 100 and 40 000 km.</span>'; return; }
  if (!(vIn > 0) || !(TIn > 0)) { out.innerHTML = '<span class="fail">Enter your speed and your period. The check compares your numbers, so it needs both.</span>'; return; }
  const r = RE + h;
  const v = Math.sqrt(MU / r);
  const T = (2 * Math.PI * r) / v / 60;
  const orbit = integratePeriod(r);
  const Tnum = orbit.T / 60;
  const ev = Math.abs(vIn - v) / v, eT = Math.abs(TIn - T) / T;
  const pass = ev < 0.01 && eT < 0.01;
  const hint = pass ? '' : ev >= 0.01 && Math.abs(Math.sqrt(MU / h) - vIn) / vIn < 0.01 ? ' Your speed matches r = altitude alone. The radius is measured from Earth’s centre.' : eT >= 0.01 && Math.abs(TIn * 60 - T) / (T) < 0.01 ? ' Your period looks like seconds. The box asks for minutes.' : '';
  out.innerHTML = `<div class="table-wrap"><table>
    <tr><th></th><th>Yours</th><th>√(μ/r)</th><th>Integrated orbit</th></tr>
    <tr><td>Speed, km/s</td><td>${vIn.toFixed(3)}</td><td>${v.toFixed(3)}</td><td>${orbit.speed.toFixed(3)}</td></tr>
    <tr><td>Period, min</td><td>${TIn.toFixed(2)}</td><td>${T.toFixed(2)}</td><td>${Tnum.toFixed(2)}</td></tr>
  </table></div>
  <p style="margin:8px 0 0" class="${pass ? 'pass' : 'fail'}">${pass ? 'Your numbers agree with both methods. Orbit is checked, and Power and Structure can use your period.' : `Not yet: speed is off by ${(ev * 100).toFixed(1)}%, period by ${(eT * 100).toFixed(1)}%.${hint}`}</p>`;
  if (pass && !satDone.orbit) {
    satDone.orbit = true;
    store.set('flux.proto.satellite', satDone);
    setTimeout(() => render(), 1600);
  }
}

/* ---------- Router and events ---------- */
const PLACES = ['today', 'map', 'satellite'];
function render() {
  const hash = decodeURIComponent(location.hash.slice(1)) || 'today';
  const place = PLACES.includes(hash) ? hash : C[hash] ? 'concept' : hash.startsWith('sat-') ? 'satellite' : 'today';
  document.body.classList.toggle('author', author);
  for (const a of document.querySelectorAll('nav.places a')) { if (a.dataset.place === place) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); }
  if (place === 'today') renderToday();
  else if (place === 'map') renderMap();
  else if (place === 'satellite') renderSatellite();
  else renderConcept(hash);
  if (place !== 'concept') cameFrom = place;
  const note = document.createElement('p');
  note.className = 'notice';
  note.textContent = sourceNote;
  note.style.margin = '32px 0 0';
  view.append(note);
  if (hash.startsWith('sat-')) document.getElementById(hash)?.scrollIntoView();
  else window.scrollTo(0, 0);
}

view.addEventListener('click', (e) => {
  const t = e.target.closest('[data-set-lens],[data-lens],[data-skip],[data-undo],[data-proto]');
  if (!t) return;
  if (t.dataset.setLens || t.dataset.lens) {
    lens = t.dataset.setLens || t.dataset.lens;
    store.set('flux.proto.lens', lens);
    if (t.dataset.setLens) { e.preventDefault(); renderMap(); }
  } else if (t.dataset.skip) { satDone[t.dataset.skip] = true; store.set('flux.proto.satellite', satDone); renderSatellite(); }
  else if (t.dataset.undo) { delete satDone[t.dataset.undo]; store.set('flux.proto.satellite', satDone); renderSatellite(); }
  else if (t.dataset.proto) {
    let msg = t.parentElement.querySelector('.proto-msg');
    if (!msg) { msg = document.createElement('p'); msg.className = 'meta proto-msg'; msg.style.margin = '10px 0 0'; t.after(msg); }
    msg.textContent = t.dataset.proto;
  }
});
view.addEventListener('submit', (e) => {
  if (e.target.id === 'orbit-form') { e.preventDefault(); runOrbitCheck(e.target); }
});

const authorBox = document.getElementById('author');
authorBox.checked = author;
authorBox.addEventListener('change', () => { author = authorBox.checked; store.set('flux.proto.author', author); render(); });

const sourceSel = document.getElementById('source');
const fileIn = document.getElementById('backup-file');
let source = store.get('flux.proto.source', 'sample');
function applySource() {
  if (source === 'browser') useBrowser();
  else if (source === 'backup') {
    const saved = store.get('flux.proto.backup', null);
    if (saved) useBackup(saved); else { source = 'sample'; useSample(); }
  } else useSample();
  sourceSel.value = source;
  recompute();
}
sourceSel.addEventListener('change', () => {
  if (sourceSel.value === 'backup') { fileIn.click(); sourceSel.value = source; return; }
  source = sourceSel.value;
  store.set('flux.proto.source', source);
  applySource();
  render();
});
fileIn.addEventListener('change', async () => {
  const f = fileIn.files[0];
  if (!f) return;
  try {
    const bundle = JSON.parse(await f.text());
    if (useBackup(bundle)) { source = 'backup'; store.set('flux.proto.backup', bundle); store.set('flux.proto.source', 'backup'); }
    else { source = 'sample'; const note = sourceNote; useSample(); sourceNote = note; }
  } catch {
    source = 'sample'; useSample(); sourceNote = 'That file is not a Flux backup. Make one with the hub’s Back up progress button.';
  }
  fileIn.value = '';
  sourceSel.value = source;
  recompute();
  render();
});

document.getElementById('built').textContent = `Built from the map on ${D.built}: ${D.concepts.length} concepts, ${Object.keys(D.problems).length} problems`;
window.addEventListener('hashchange', render);
applySource();
render();
</script>
