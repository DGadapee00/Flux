# Weekly: copy PHY 2049's new or changed Canvas files into courses/phy2049/incoming/, where the
# Sunday Claude Code run (courses/phy2049/CLAUDE.md, "Content drop protocol") turns them into notes
# and commits them to main. Moved here from flux-phy2049 on 13 Oct 2026; its state file came along,
# so files already fetched are not fetched again.
#
# Needs, in this repo's Settings > Secrets and variables > Actions:
#   secret   CANVAS_TOKEN      a Canvas access token (90 days at most: renew it before it lapses)
#   variable CANVAS_BASE_URL   the school's Canvas address, as in flux-phy2049's variables
#   variable CANVAS_COURSE_ID  130036 (PHY 2049, Fall 2026)
# Until the variables are set the job is skipped, not failed. Run it by hand from the Actions tab.
name: Canvas ingest

on:
  schedule:
    - cron: '17 5 * * 0' # Sundays 05:17 UTC, early: GitHub often starts scheduled runs late, and the notes run comes after this.
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: canvas-ingest
  cancel-in-progress: false

jobs:
  ingest:
    if: ${{ vars.CANVAS_COURSE_ID != '' && vars.CANVAS_BASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The branch tip, not the run's commit: a re-run of an old run would otherwise start
      # behind main and fail to push.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Fetch new course files
        id: fetch
        env:
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
          CANVAS_BASE_URL: ${{ vars.CANVAS_BASE_URL }}
          CANVAS_COURSE_ID: ${{ vars.CANVAS_COURSE_ID }}
        run: python3 courses/phy2049/scripts/canvas_ingest.py

      - name: Commit them
        run: |
          git add courses/phy2049/incoming
          if git diff --cached --quiet; then
            echo "Nothing new on Canvas."
            exit 0
          fi
          git config user.name "flux-ingest[bot]"
          git config user.email "flux-ingest@users.noreply.github.com"
          git commit -m "Ingest: ${{ steps.fetch.outputs.taken }} new PHY 2049 course file(s) from Canvas"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

      # A failure nobody sees is how a pipeline quietly stops. Say so where it will be noticed.
      - name: Open an issue if this failed
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Canvas ingest failed ($(date -u +%Y-%m-%d))" \
            --body "The weekly Canvas ingest failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. If the log says the token was refused, it has expired: make a new one in Canvas (Account > Settings > New Access Token) and replace the CANVAS_TOKEN secret."
