# Publishes main to Cloudflare Pages (project flux-study) on every push to main, so a content drop
# the Sunday run commits goes live without anyone running `npm run deploy` by hand.
#
# Needs, in this repo's Settings > Secrets and variables > Actions:
#   secret   CLOUDFLARE_API_TOKEN   a Cloudflare API token with "Cloudflare Pages: Edit"
#   secret   CLOUDFLARE_ACCOUNT_ID  the account id shown on the Cloudflare dashboard
# Until both are set the job is skipped, not failed, and `npm run deploy` by hand still works.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Skip until Cloudflare secrets are set
        if: ${{ env.HAS_TOKEN != 'true' }}
        run: echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; nothing deployed."

      - uses: actions/checkout@v4
        if: ${{ env.HAS_TOKEN == 'true' }}

      - uses: actions/setup-node@v4
        if: ${{ env.HAS_TOKEN == 'true' }}
        with:
          node-version: '22'
          cache: npm

      - if: ${{ env.HAS_TOKEN == 'true' }}
        run: npm ci

      # Same gate as a hand deploy: every check, then the build (which ends with the built-site raw scan).
      - if: ${{ env.HAS_TOKEN == 'true' }}
        run: npm test

      - if: ${{ env.HAS_TOKEN == 'true' }}
        run: npm run build

      - name: Upload to Cloudflare Pages
        if: ${{ env.HAS_TOKEN == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages deploy site/dist --project-name flux-study --branch main
