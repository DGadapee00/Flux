<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>FLUX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="brand">
        <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="20" r="11" fill="none" stroke="#58C4DD" stroke-width="2" />
          <circle cx="20" cy="20" r="3.2" fill="#FC6255" />
          <g stroke="#F4D345" stroke-width="1.8" stroke-linecap="round" fill="#F4D345">
            <line x1="20" y1="12.5" x2="20" y2="4.5" /><path d="M20 2 L17.6 6 L22.4 6 Z" stroke="none" />
            <line x1="27.5" y1="20" x2="35.5" y2="20" /><path d="M38 20 L34 17.6 L34 22.4 Z" stroke="none" />
            <line x1="20" y1="27.5" x2="20" y2="35.5" /><path d="M20 38 L17.6 34 L22.4 34 Z" stroke="none" />
            <line x1="12.5" y1="20" x2="4.5" y2="20" /><path d="M2 20 L6 17.6 L6 22.4 Z" stroke="none" />
          </g>
        </svg>
        <div>
          <h1>FLUX</h1>
          <p class="lede">Four tracks through the degree. A card opens its latest course. Anything not built yet stays on the list.</p>
        </div>
      </header>
      <div id="tracks"></div>
      <section class="backup" aria-labelledby="backup-title">
        <h2 id="backup-title">Progress</h2>
        <p>One file holds all your courses. Restoring replaces what this browser has saved.</p>
        <div id="backup"></div>
      </section>
      <footer>
        <p><a href="https://github.com/DGadapee00/Flux">Source</a></p>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
