<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fixture · math shell</title>
  </head>
  <body>
    <div id="app">
      <canvas id="c"></canvas>
      <div id="label-layer" aria-hidden="true"></div>
      <header class="hud panel brand" id="brand">
        <div class="brand-text"><h1>FLUX</h1><p class="subtitle">Fixture · math shell</p></div>
        <div class="practice-row">
          <button type="button" class="practice-btn" id="btn-practice" aria-expanded="false" aria-controls="problems"><span>Practice</span><kbd>P</kbd></button>
          <span class="practice-stat" id="practice-stat"></span>
        </div>
      </header>
      <aside class="hud panel problems" id="problems" aria-label="Practice problems" hidden></aside>
      <aside class="hud panel controls" id="controls"><div class="panel-header"><h2>Setup</h2></div><p>Lab controls</p></aside>
      <div id="sr-announce" aria-live="polite" hidden></div>
    </div>
    <script type="module" src="./math.js"></script>
  </body>
</html>
